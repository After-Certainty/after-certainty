    Old-time Southern hot jazz and swing revival with a mischievous vaudeville feel. Bouncy banjo, upright bass, snappy brushed drums, clarinet, trumpet, trombone, muted brass, and occasional piano fills. Playful stop-start arrangements, horn stabs, brief instrumental breaks, and loose live-band energy.

    A theatrical male/female duet: the female vocalist is sly, smoky, bright, and flapper-like with teasing cabaret phrasing; the male vocalist is a warm, charming, slightly pompous vintage crooner. Lots of call-and-response, spoken interjections, overlapping lines, comic timing, and flirtatious argument.

    Fast, swinging, witty, slightly dangerous, and a little absurd, like a 1920s speakeasy floor show going charmingly off the rails. Minor-key touches underneath the humor, with a big brass-heavy final chorus and a sharp vaudeville ending sting.
