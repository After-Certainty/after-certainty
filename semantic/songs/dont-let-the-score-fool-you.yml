slug: dont-let-the-score-fool-you
title: Don’t Let the Score Fool You
shortDescription: 'Warm nineteen-seventies soul: big bright numbers on a darkened wall tell a true ending
  while erasing the thousand hands that actually carried the game.'
longDescription: 'Intimate pocket, electric piano, and layered backups deliver The Game We Think We Saw
  almost by name. The chorus separates truthful metrics from moral closure—scoreboard-remainder, winning-as-excuse,
  star-as-explanation—while the whistle’s operational finality ends play without settling meaning. Pattern
  results-conceal-the-game is a near-direct match: run it back slow and you still have to name the game
  the board cannot show. Prefer this tight, high-confidence book link over weaker secondary titles; the
  lyric already carries the portfolio’s sports epistemology without stretching into business metaphors
  the song never invites.'
