slug: not-yet
title: NOT YET!
shortDescription: 'Neon techno J-pop at club tempo: three voices chant NOT YET while Japanese verses catch
  the mind writing a finished story from one glance, and English hooks keep every answer playfully provisional.'
longDescription: 'Bright arpeggios, chopped vocals, and call-and-response turn epistemic caution into
  dance fuel rather than a lecture. Japanese verses show how a face, a night, or a half-heard phrase becomes
  “きっとこう” in a second; the chorus and Maybe tags block that premature seal. After Certainty hears revisability
  under uncertainty—look again, leave blanks unfilled, update without shame. Strong verified ties run
  to The Discipline of Uncertainty and Curiosity Before Certainty, with patterns revisability-preserves-judgment
  and finality-compensates-for-uncertainty grounding the refusal to close the future after one incomplete
  signal. The song’s joy is the method: not-knowing stays danceable.'
