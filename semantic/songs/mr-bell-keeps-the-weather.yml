title: Mr. Bell Keeps the Weather
shortDescription: 'Noir theatrical piano blues: an ex-weatherman hoards broken barometers and storms that
  never came, warning not to confuse odds with what happens after all.'
longDescription: Gravel baritone, dissonant low-register piano, and room noise make forecasting feel like
  a crooked moral craft. Channel Nine wanted when, not the shape of wind; Bell keeps Weather That Did
  Not Occur because somebody ought to remember almosts. Reality Pushes Back and The Discipline of Uncertainty
  verify the wall note and could-go-either-way stance. Counterfactual-success and uncertainty name the
  notebook’s honesty; reality-answers-back fits disagreeing barometers before dawn. The sky does not owe
  certainty, and confusing probability with aftermath is the institutional error the song refuses to bless.
