slug: what-i-thought-you-meant
title: What I Thought You Meant
shortDescription: 'Late-night alternative R&B: desire tangled with projection, begging to hear what you
  meant instead of the finished story invented from a shiver or a silence.'
longDescription: 'Warm electric piano, negative space, and breathy vocal make misreading sensual rather
  than merely cognitive. Eyes, breath, and body soft-talk get completed into promises; old goodbyes hide
  inside a spoken name; certainty understands so fast it forgets to let the other in. How Meaning Moves
  verifies intent-gets-assigned, meaning-outruns-the-words, and gaps-invite-completion in a romantic key.
  Contact-keeps-the-read-open is the ethic: come closer, say it again, learn the difference between the
  person and the fiction. Everyone Knows Love remains a softer secondary book for care under ambiguity.'
