  styleTags: Dark, hypnotic trip-hop fused with traditional Indian instrumentation. Slow heavy breakbeat, deep sub-bass, dusty drums, vinyl texture, sparse atmospheric electronics, and lots of negative space. Prominent tanpura drone, sitar, sarod, tabla, bansuri, and subtle harmonium. Keep the Indian instruments organic and central, not cinematic or Bollywood-pop. Intimate male English vocal with restrained conversational phrasing; expressive female Hindi vocal for short mantra-like refrains and melodic responses. Voices gradually overlap. Keep instrumental sections brief and focused, with concise sitar or sarod phrases rather than extended solos. No huge pop chorus. Cyclical, nocturnal, meditative, slightly uneasy, and groove-driven. Maintain the trip-hop beat throughout. Concise arrangement, target 4–5 minutes.
