  styleTags: |-
    Early-1970s British psychedelic art-pop pushed further into kaleidoscopic experimentation, still in three distinct connected sections with contrasting tunes, rhythms and chord progressions, joined by trippy instrumental bridges. Warm, roomy live drums with splashing cymbals, highly melodic, wandering bass lines, chiming acoustic guitar, fuzz-drenched electric guitar, and dry, close-mic’d piano that drops in as a surreal accent. Expanded psychedelic textures: tape-saturated delays, reverse swells, varispeed moments, gentle phasing and flanging on guitars and backing vocals, and occasional warped room ambience. Strings, oboe, English horn and French horn appear as unexpected, echo-like colors and drifting countermelodies, treated with mild tape wow and pitch bends so they feel otherworldly rather than orchestral. Part I stays intimate, pastoral and slightly uncanny; Part II dissolves into a dreamier, more lysergic soundscape with swirling vocal harmonies and hazy, reverb-washed bridges;
  remixInstruction: Let’s increase the psychedelic sounds
