    on “halo,” “monster,” “hero,” and “fraud.” Strip down for the spoken cabaret break, then make the
    bridge more vulnerable. End with nearly bare piano and the dry spoken line: “You may now distrust
    the lighting.” Elegant, darkly funny, morally ambiguous, and slightly menacing. Avoid Broadway bombast,
    novelty-cabaret cheese, and glossy pop production.'
