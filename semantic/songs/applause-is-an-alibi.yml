slug: applause-is-an-alibi
title: Applause Is an Alibi
shortDescription: 'Dark cabaret art rock: halo and monster enter on cue while applause and booing pretend
  to be evidence, until the lighting itself is finally distrusted.'
longDescription: 'Piano, muted brass, and sly theatrical vocal satirize moral stagecraft. Crowd love becomes
  an alibi; booing becomes a verdict before evidence; once a monster is cast, kindness gets explained
  away and the person fades. The Game We Think We Saw and When Authority Outlives Accountability carry
  the book load via winning-as-excuse, star-as-explanation, and admiration-becomes-insulation. Blame-compresses-complexity
  fits the costume shortcut. The bridge’s love-without-exemption and judge-without-erasure is After Certainty
  judgment: condemn what needs condemning, leave the cardboard horns on the floor, and distrust the lighting.'
