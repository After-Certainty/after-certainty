  styleTags: Bright, joyful African choral anthem with a large mixed choir, powerful call-and-response
    vocals, layered harmonies, handclaps, stomps, ululation, and energetic traditional percussion. Sung
    primarily in Swahili, with expressive solo voices answered by the full ensemble. Fast, buoyant rhythm
    with warm hand drums, shakers, bells, marimba-like melodic percussion, subtle bass, and occasional
    brass or flute accents. Cinematic and theatrical but organic, communal, playful, and deeply uplifting.
    Build from a simple solo opening into increasingly huge choir sections, with a lively percussion dance
    break and an explosive final chorus around “BADO TUNAENDA!” and “INATOSHA!” Keep the melodies simple,
    memorable, and easy for a crowd to sing. Avoid electronic dance production, pop-rock guitars, or solemn
    gospel; this should feel sunlit, rhythmic, celebratory, and alive.
