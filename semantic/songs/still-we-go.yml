  styleTags: Organic folktronica and microhouse, African hand percussion woven with a soft shuffled electronic groove; intimate sparse opening with exposed choir, handclaps, shakers, and wooden clicks, then gradually layer rounded bass, warm kick, bell accents, plucked melodic samples, luminous restrained pads, granular and reversed vocal textures, and tiny glitch percussion. Keep the original mixed choir prominent and communal, with rhythmic chopped repetitions of the phrase “BADO TUNAENDA,” echoing fragments, and overlapping call-and-response. Midway drop to choir, claps, and airy field-recording ambience, then rebuild into a joyful, understated final pulse. Human, intricate, playful, warm, hypnotic; organic close-miked percussion against a spacious, detailed electronic mix.
  remixInstruction: 'Organic folktronica and microhouse remix built around the original African choir. Keep the Swahili vocals prominent but chop selected phrases like “BADO TUNAENDA” into rhythmic loops, echoes, and fragmented vocal textures. Layer warm hand percussion, shakers, bells, wooden clicks, soft kick drums, shuffled electronic beats, deep rounded bass, and tiny glitchy percussion details.


    Use luminous synth pads, plucked melodic samples, granular vocal fragments, reversed textures, field-recording ambience, and subtle polyrhythms. Begin sparse and intimate, gradually building into a hypnotic dance groove without becoming aggressive EDM. Let acoustic percussion and electronic rhythm constantly weave around each other.


    Midway through, strip back to choir, handclaps, and ambient texture before rebuilding into a joyful final section with overlapping vocal loops, warm bass, sparkling electronics, and a euphoric but understated pulse.


    Organic, intricate, playful, warm, human, hypnotic, and quietly ecstatic. Avoid big EDM drops, supersaws, trap drums, glossy pop production, or cinematic orchestral bombast.'
