generation:
  authoredPrompt: Dark early-2000s emo/post-hardcore with a claustrophobic, minor-key atmosphere. Male
    lead vocal should move between exhausted near-spoken intimacy, cracked melodic singing, and desperate
    shouted release. Use distorted guitars, tense bass, live drums, abrupt dynamic drops, and explosive
    crescendos. Keep the phrasing jagged and emotionally raw rather than neat or sing-song; absolutely
    avoid country, folk, or polished pop-punk cadence. Let the verses feel like someone thinking out loud
    while unraveling, then make “EXCEPTIONS ARE FOREVER” hit as a huge anguished hook and “ABSURDITY IS
    DIVINE” feel almost like a bitter prayer. Bleak, human, unresolved, and darkly absurd.
