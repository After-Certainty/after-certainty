  styleTags: 'Dark emo/post-hardcore fused with industrial techno and electronic noise. Female lead vocalist: intimate, exhausted and haunted in the verses, cracked melodic singing building into raw screamo and desperate screams on “EXCEPTIONS ARE FOREVER” and “ABSURDITY IS DIVINE.” Jagged distorted guitars, massive bass, live drums layered with pounding electronic kicks, metallic percussion, machine-like rhythms, distorted synths, glitch bursts, feedback, static, chopped vocals and digital interference. Abrupt dropouts, sudden silence, stuttering edits and violent transitions. Verses feel claustrophobic and unstable; choruses explode into dense walls of guitar and electronics. Breakdown becomes almost mechanical and ritualistic. Dark, furious, alienated, emotionally wounded and slightly absurd. Avoid polished pop-punk, clean EDM drops or theatrical vocals.'
