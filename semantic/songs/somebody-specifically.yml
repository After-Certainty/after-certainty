slug: somebody-specifically
title: Somebody, Specifically
shortDescription: 'Minimal chamber pop with piano and strings: a glowing city from the hill resolves into
  one late window—somebody specifically, not a symbol or a shade.'
longDescription: 'Repeating piano figures suggest orderly scale while pauses and soft imperfections keep
  the arrangement human. Distance makes crowds simple; closeness restores the person awake behind one
  light, missing or holding someone through the night. When Moral Seriousness Scales verifies the hill-to-window
  move; compression-loses-the-person and care-preserves-particulars match the refusal of example and symbol
  language. Everyone Knows Love is a medium companion for particular lives against abstraction. The ethic
  is proximity: come closer, because from far away we blur, and that blur is already a moral mistake.'
