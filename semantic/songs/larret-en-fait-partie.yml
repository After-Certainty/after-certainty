  styleTags: 'Experimental microtonal math rock with hypnotic repetition, angular guitar and bass loops,
    muscular live drums, polyrhythms, metric modulation, and shifting meters like 7/8, 5/4, and displaced
    4/4. Funky, physical, slightly jazzy beneath the complexity. French vocals: sparse, clipped, dry,
    rhythmic, half-spoken and occasionally shouted, functioning almost like another percussion instrument.
    Repeat phrases such as “L’arrêt en fait partie,” numbers, and single words as mantras. Build through
    looping, layering, and subtle mutation rather than conventional verse/chorus dynamics. Sudden complete
    stops should feel essential, with riffs returning displaced or altered. Gradually accelerate and destabilize,
    then stop dead. Weird, playful, cerebral, absurdist, danceable, and slightly alien. Avoid metalcore,
    emo, pop-punk, or flashy prog noodling.'
