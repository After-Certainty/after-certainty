slug: dead-reasons
title: Dead Reasons
shortDescription: 'Thick nineties grunge: inherited rooms, yearly paint over spreading cracks, and a raw
  shout that dead reasons still hold the walls long after anyone recalls why they were built.'
longDescription: 'Quiet-loud guitars embody institutional exhaustion—habit-fed machines, inward-opening
  doors nobody remembers justifying, and the chant that it worked before. Lyrics track sediment mistaken
  for necessity: roots gone, feeding continues; locks that were once answers now refuse to move. Living
  in Sediment and Before Certainty Arrives verify the inheritance-and-drift reading, while structures-outlive-reasons
  is a near-direct pattern match. Dead Reasons is the emotional twin of Exceptions Are Forever: less “just
  this once,” more the corpse of justification still propping the building while everyone calls the poison
  order.'
