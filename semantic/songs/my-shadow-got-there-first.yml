  styleTags: Mississippi Delta blues fused with more prominent lo-fi 8-bit chiptune textures. Raw, weathered
    male vocal over a slow, swampy groove with resonator slide guitar, acoustic guitar, foot-stomp percussion,
    upright bass, and heavy tape hiss, vinyl crackle, and room ambience. Thread multiple detuned square-wave
    and triangle-wave melodies through the arrangement as an insistent digital shadow, with bit-crushed
    arpeggios, simple counter-lines, and glitchy call-and-response figures that gradually grow more present
    and intrusive. The electronic phrases anticipate, double, and interrupt the slide guitar and vocal,
    adding eerie, mechanized tension while keeping the overall palette dusty, minimal, hypnotic, and darkly
    surreal. Structured as a tightened short edit with one fewer verse and more concentrated interplay
    between human blues phrasing and rigid 8-bit motifs.
