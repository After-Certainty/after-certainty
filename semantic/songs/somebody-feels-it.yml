    Roots dub reggae with a deep, spacious, hypnotic groove. Slow-to-mid tempo, huge warm sub-bass, one-drop drums, skanking guitar, sparse organ bubbles, hand percussion, and lots of tape delay, spring reverb, echo, dropouts, and negative space. Intimate male lead vocal with calm, restrained, slightly weary phrasing rather than a bright reggae-pop delivery. Let key phrases like “Somebody feels it,” “Nothing personal,” and “The cost goes somewhere” repeat and dissolve into long dub echoes.

    Keep the arrangement minimal and physical. Verses should feel close and conversational; choruses should widen through layered echoes rather than getting louder or more anthemic. During the dub break, fragment the vocals into drifting call-and-response phrases while bass and percussion carry the track. Dark, thoughtful, nocturnal, human, and slightly ominous. Avoid glossy pop-reggae, ska energy, cheerful island clichés, or overly busy production.
