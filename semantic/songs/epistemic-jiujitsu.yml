  styleTags: |-
    Relentless motorik Krautrock fused with massive modern cinematic electronic and industrial synth production. Steady hypnotic 4/4 pulse, deep sequenced bass, huge distorted analog synths, arpeggiators, metallic percussion, sub-bass impacts, ominous drones, glitch textures and towering electronic crescendos. Dark neon sci-fi atmosphere: sleek, futuristic, threatening and expensive-sounding, like a high-budget cybernetic film score rather than vintage retro rock. Strong dynamic contrasts—long tension builds, sudden silence, enormous synth drops, widening stereo layers and mechanical rhythmic repetition. Deadpan male spoken English with a pronounced German accent, delivering clipped phrases like commands from a malfunctioning machine. Cold, cerebral, absurdist and darkly funny. Sparse vocals; let long instrumental sections and evolving synth motifs carry the track.

    Do not make it sparse lo-fi or conventional rock; make the electronic production huge, immersive and cinematic.
