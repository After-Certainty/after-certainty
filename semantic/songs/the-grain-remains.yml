slug: the-grain-remains
title: The Grain Remains
shortDescription: 'Hypnotic seventies space rock: white paint, sleeping levels, and a sparse refrain that
  the grain remains under every closed line, filled hole, and measured wall.'
longDescription: Analog sequences stay geometric while guitar grows organic—form mirroring lyric. Cases
  are closed, numbers agree, and paint dries in unused rooms, yet wood still moves with heat and winter
  finds what summer trusted. Living in Sediment and structures-outlive-reasons are the strongest verified
  links; residue and inheritance name what persists after the matter is declared finished. Reality-answers-back
  fits the crack that ignores the painted edge. The unresolved outro—for now—keeps sediment temporal rather
  than eternal, matching the book’s habit of seeing fossils without mistaking them for destiny.
