    1970s progressive space rock fused with modern cinematic electronic production. Dark, spacious and hypnotic, with warm analog synth sequences, vintage organ and electric piano, deep melodic bass, roomy live drums, tape ambience and expressive sustained electric guitar. Add contemporary cinematic textures: huge low sub-bass swells, distant processed strings and brass, granular synth atmospheres, deep drones, reversed textures, massive reverberant impacts and slowly evolving sound-design transitions.

    Begin restrained, geometric and almost mechanical. Let repeating analog keyboard patterns establish order while the guitar gradually becomes more emotional, fluid and unpredictable. Build toward a large widescreen instrumental section where vintage space rock collides with modern film-score scale, then strip back suddenly for the final verse. Restrained male vocal, cryptic and detached. Dark, elegant, ominous and immersive rather than bombastic. Haunting unresolved ending.
