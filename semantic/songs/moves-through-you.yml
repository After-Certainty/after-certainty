  authoredPrompt: 'High-energy nocturnal synth-pop and electronic dance-pop with a huge euphoric club pulse, glossy analog synths, deep pulsing bass, bright arpeggios, crisp four-on-the-floor drums, dramatic electronic builds, and explosive melodic choruses. Three distinct vocalists trading lines, finishing each other’s phrases, overlapping, harmonizing, and gradually merging into a collective voice. Vocals should feel charismatic, sensual, theatrical, playful, and emotionally charged rather than generic EDM.



    Begin bright, infectious, and almost celebratory, with an irresistible dance groove and a chorus that feels communal and uplifting. As the song progresses, subtly darken the same musical language: detune or distort recurring synth motifs, add colder bass textures, chopped vocal echoes, ominous harmonies, and increasingly hypnotic repetition. The repeating chorus should return several times with nearly identical melody and structure while the lyrics and production shift from connection and renewal toward erosion, contagion, and inherited behavior, then finally toward conscious transformation.



    Make “It moves through me / It moves through you” the central massive pop hook. The rapid alternating “A kindness becomes permission / Permission becomes a door…” section should build rhythmically like a chain reaction, with each singer passing the next line to another voice. Strip the production down sharply for the intimate bridge, then rebuild into an enormous final chorus with layered vocals and counter-melodies: love, fear, mercy, anger, courage, and power all circulating simultaneously.



    Energetic, sophisticated, seductive, slightly dangerous, cinematic, and intensely danceable. The darkness should emerge from underneath the euphoria rather than replacing it. End with the music falling away until the final line, “What leaves me / passes through me first,” lands quietly and intimately.'
