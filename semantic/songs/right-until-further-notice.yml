slug: right-until-further-notice
title: Right Until Further Notice
shortDescription: 'UK garage–zydeco story-song: everyone saw something different, and the tale stays right—until
  further notice.'
longDescription: 'Shuffled 2-step and chopped accordion carry a crowded back-door dispute that never settles
  into one clean account. Witness piles on witness; provisional commitment and revisability keep the story
  usable without pretending it is finished. The Game We Think We Saw and What We Cannot See fit partial
  sight; Curiosity Before Certainty fits raising a glass while the next fact arrives. Patterns revisability-preserves-judgment
  and contact-keeps-the-read-open match the hook''s open clause: right until further notice.'
