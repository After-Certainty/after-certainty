slug: chart-says-receipt-says-otherwise
title: Chart says improve, receipt says otherwise
summary: >
  Aggregate indicators report improvement while particular lived costs remain unchanged or worse—
  two distances of evidence that cannot be collapsed into a single verdict.
activePatterns:
  - speech-escalates-faster-than-meaning
  - meaning-outruns-the-words
relatedConcepts:
  - compression
  - experiential-cross-checking
  - relational-credibility
relatedBooks:
  - the-economy-we-dont-experience
recognitionSignals:
  - public charts improve while household receipts do not
  - leaders are asked to choose between aggregate and lived truth
  - distrust rises when one scale is treated as the only real one
questions:
  - What distance of evidence is being asked to stand for the whole?
  - How can both the chart and the receipt remain speakable?
counterbalances:
  - hold aggregate and lived scales together without declaring either false by default
  - refuse “just tell the truth” as if selection and sequence did not matter
