slug: result-final-meaning-unsettled
title: Result final, meaning unsettled
summary: >
  A decisive result or fixed image settles the score while cause, legitimacy, cost, and public meaning
  continue to move—leaving an argument that the finality cannot close.
activePatterns:
  - finality-compensates-for-uncertainty
  - meaning-drifts-over-time
relatedConcepts:
  - scoreboard-remainder
  - operational-finality
  - gesture-afterlife
  - legitimacy
relatedBooks:
  - the-game-we-think-we-saw
relatedChapterIds:
  - chapter-the-game-we-think-we-saw-parts-part-4-what-the-result-becomes-chapter-7-when-a-gesture-becomes-another-message
recognitionSignals:
  - the score is accepted while the story keeps changing
  - a still photograph generates incompatible public messages
  - winning is treated as settling questions it cannot answer
questions:
  - What did the result actually settle?
  - What remainder is still being argued?
counterbalances:
  - keep finality and meaning on separate clocks
  - refuse to let the scoreboard substitute for judgment about cost and legitimacy
