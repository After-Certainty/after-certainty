id: the-result-and-the-experience
slug: the-result-and-the-experience
title: The Result and the Experience
summary: >
  From final sporting results that leave meaning unsettled, through economic charts that diverge
  from lived receipts, into the limits of any single perspective.
orientation: >
  A decisive indicator can settle one question while leaving cause, legitimacy, and experience open.
  This trail holds result and experience on separate clocks — and marks what no one perspective can finish.
status: published
featured: false
themes:
  - Measurement and lived experience
  - Perspective
depth: intermediate
primaryBookId: book-the-game-we-think-we-saw
