slug: public-face-private-route
title: The official channel nobody uses
mode: recognition
status: published
difficulty: intermediate
context: government
scenario: >
  Citizens are told to submit requests through a public portal. Staff advise
  friends to email a particular inbox instead, “or it will sit for months.” The
  portal metrics look quiet. The side channel is where anything urgent actually
  moves.
dominantPattern: structures-outlive-reasons
secondaryPatterns:
