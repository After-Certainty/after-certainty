  - participation-creates-legitimacy
explanation: >
  Official structure and lived structure diverge. The strongest pattern is
  Structures Outlive Reasons: the portal remains the public face long after the
  real work relocated to an informal route.
choiceFeedback:
  learning-collapses: >
    You noticed Learning Collapses — newcomers only learn the side channel by
    word of mouth — and that is present, but Structures Outlive Reasons names
    the durable mismatch between the official path and the working path.
