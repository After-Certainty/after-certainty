  - revisability-preserves-judgment
explanation: >
  Informal leverage becomes the real architecture. The strongest pattern is
  Responsibility Follows Leverage: accountability and throughput concentrated in
  the person others learned to route through.
choiceFeedback:
  learning-collapses: >
    You noticed Learning Collapses — newcomers never learn the written path —
    but Responsibility Follows Leverage is stronger: Maya became the system.
