slug: trusted-person-is-the-system
title: The person who became the process
mode: recognition
status: published
difficulty: intermediate
context: institutions
scenario: >
  Approvals are supposed to go through a documented workflow. In practice,
  everyone asks Maya, who “just knows how things really get done.” When she
  takes leave, work stalls — not because the policy is unclear on paper, but
  because the real route lived in one person.
dominantPattern: responsibility-follows-leverage
