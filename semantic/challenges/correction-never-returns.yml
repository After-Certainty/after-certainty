explanation: >
  Ritual without return is not learning. The strongest pattern is Learning
  Collapses: feedback is collected, but it no longer changes the next cycle of
  work.
choiceFeedback:
  feedback-drives-change: >
    Feedback Drives Change would look like the action items altering the next
    sprint. Here the strongest pattern is Learning Collapses: the loop is
    ceremonial.
