slug: correction-never-returns
title: The loop that stopped looping
mode: recognition
status: published
difficulty: intermediate
context: software
scenario: >
  The team still holds retrospectives. Action items are written down, then
  quietly drop off the board when the next sprint starts. After a year, people
  can recite the same three problems — and the same three postponed fixes.
dominantPattern: learning-collapses
