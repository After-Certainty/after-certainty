id: room-for-the-unfitting-case
slug: room-for-the-unfitting-case
question: How can a system make room for the case its rules cannot understand without turning judgment into arbitrary power?
summary: Rules protect people from arbitrary judgment by compressing reality—until the ignored detail becomes
  decisive and institutions need architecture for reconsideration.
orientation: Every rule leaves something out. When the leftover case matters, appeals, accommodation, and
  dissent channels must keep judgment corrigible without dissolving into pure discretion.
whatThisIsNot:
- Not a rejection of rules or standards.
- Not a license for arbitrary managerial power.
- Not an argument that every exception should override the rule.
status: published
featured: false
families:
- Judgment and uncertainty
- Systems and organizations
