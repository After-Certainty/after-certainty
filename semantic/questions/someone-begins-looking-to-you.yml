id: someone-begins-looking-to-you
slug: someone-begins-looking-to-you
question: What happens when someone else begins looking to you?
summary: Influence arrives before you feel ready—and it changes what your actions mean to others.
orientation: People inherit influence they did not seek. Once others look to you, your choices carry weight
  beyond your intent. Renewal, erosion, and responsibility all begin in that shift.
whatThisIsNot:
- Not a leadership hype narrative.
- Not the same as formal authority alone.
- Not a promise that influence can be returned unchanged.
status: published
featured: false
families:
