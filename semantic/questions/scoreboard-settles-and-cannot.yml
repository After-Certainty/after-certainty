id: scoreboard-settles-and-cannot
slug: scoreboard-settles-and-cannot
question: What can a scoreboard settle—and what can it not?
summary: Metrics coordinate action, but they cannot carry the full moral weight of what happened.
orientation: Scoreboards make some things visible and other things disappear. When metrics become the
  moral language of an institution, judgment thins—even while dashboards look precise.
whatThisIsNot:
- Not an argument against all measurement.
- Not the same as The Economy We Don't Experience (aggregate vs lived narrative).
- Not a claim that numbers never help.
status: published
featured: false
families:
- Measurement and lived experience
