id: reliable-person-becomes-architecture
slug: reliable-person-becomes-architecture
question: What happens when the reliable person becomes part of the system’s architecture?
summary: Informal routing turns one reliable person into infrastructure; absorbing the gap is praised
  while the system learns not to carry the work.
orientation: Fiction can dramatize how helping becomes absorbing. The question is about responsibility
  routing—not a management tip list.
whatThisIsNot:
- Not empirical proof from a single novel.
- Not a boundary checklist or productivity hack.
- Not a claim that reliability is a vice.
