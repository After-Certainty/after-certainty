    entityType: concept
    entityId: concept-trust
    description: Begin with trust that once tracked reality — participation grounded in learning.
  - position: 2
    entityType: concept
    entityId: concept-drift
    description: See drift as gradual detachment — not a single betrayal.
    whyThisFollows: Detachment is usually a trajectory; drift names the motion.
  - position: 3
    entityType: book
    entityId: book-when-trust-stops-tracking-reality
    description: The primary book on how trust stops learning — through Calder and institutional patterns.
    whyThisFollows: This is the deepest treatment of preservation outrunning correction.
  - position: 4
    entityType: pattern
    entityId: pattern-scrutiny-preserves-trust
    description: Notice what proportionate inquiry would still make possible.
    whyThisFollows: Detachment is not inevitable; scrutiny is one name for keeping contact.
closingReflection: >
  Trust that cannot revise becomes identity. The question remains where feedback still reaches the
  people whose willingness the system depends on.
carryForwardQuestion: Where do success stories make weak signals feel disloyal to notice?
