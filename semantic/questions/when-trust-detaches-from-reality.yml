id: when-trust-detaches-from-reality
slug: when-trust-detaches-from-reality
question: How does trust become detached from reality?
summary: >
  Trust that once tracked outcomes can stop learning from feedback — until preservation, loyalty,
  and success stories outrun mission.
orientation: >
  Good intentions are not enough when weak signals become easy to ignore. This question asks when
  the trust cycle stops updating — and what revision would still require.
whatThisIsNot:
  - Not a villain story about fraud as the main case.
  - Not an argument for abandoning trust.
  - Not the same as how trust forms under uncertainty.
status: published
featured: false
families:
