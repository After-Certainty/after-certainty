id: love-hard-to-explain
slug: love-hard-to-explain
question: Why is love something everyone recognizes yet struggles to explain?
summary: >
  Recognition arrives before language. Love is treated as a living mystery of care and obligation —
  not a formula that finishes the question.
orientation: >
  Everyone knows love until asked to define it. This question holds the gap between recognition and
  explanation without forcing a clinical or theological answer.
whatThisIsNot:
  - Not a clinical or theological definition of love.
  - Not a substitute for civic and systems volumes in the project.
  - Not a claim that unexplained recognition is enough for institutions.
