id: institutions-preserve-obsolete-rules
slug: institutions-preserve-obsolete-rules
question: Why do institutions preserve rules that no longer fit?
summary: Rules persist because they once solved real problems—even when the problems have changed.
orientation: Institutions do not only fail by breaking down. They can also fail by keeping structures
  that made sense under old conditions but now produce drift, friction, or harm. Understanding why rules
  persist is different from simply calling for change.
whatThisIsNot:
- Not a blanket critique of all bureaucracy.
- Not the same as temporary exceptions becoming permanent—though the patterns can overlap.
- Not a promise that better rules are easy to write.
