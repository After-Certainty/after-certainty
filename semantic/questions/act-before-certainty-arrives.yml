id: act-before-certainty-arrives
slug: act-before-certainty-arrives
question: How can we act responsibly before certainty arrives?
summary: Judgment under uncertainty requires discipline—not waiting until explanation finishes.
orientation: Many of the hardest decisions arrive before the picture is complete. Acting responsibly does
  not mean pretending to know; it means learning in motion, staying corrigible, and refusing false certainty.
whatThisIsNot:
- Not a license for reckless action.
- Not the same as abandoning evidence.
- Not a single technique—responsibility under uncertainty is a practice.
