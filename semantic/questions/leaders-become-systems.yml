id: leaders-become-systems
slug: leaders-become-systems
question: How do leaders become systems without noticing?
summary: Leadership patterns reproduce themselves—and eventually outlive the people who started them.
orientation: Leaders shape routines, incentives, and examples that persist. Over time, the system may
  reflect a leader's habits more than their intentions—and the leader may no longer see what they built.
whatThisIsNot:
- Not a claim that all systems are bad.
- Not the same as bureaucracy in general.
- Not reducible to one bad decision.
status: published
featured: false
