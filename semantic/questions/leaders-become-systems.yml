  description: 'Leadership context: renewal, erosion, and how influence becomes structure.'
  whyThisFollows: The book shows how personal leadership becomes organizational habit.
- position: 4
  entityType: concept
  entityId: concept-normalization
  description: Understand how deviance becomes normal when exceptions go unchallenged.
  whyThisFollows: Leaders become systems when their exceptions normalize.
closingReflection: You may start seeing which routines still carry a leader's fingerprint long after the
  context changed. That noticing is not blame—it is the beginning of redesign.
carryForwardQuestion: Which habit in your organization began as one person's workaround?
