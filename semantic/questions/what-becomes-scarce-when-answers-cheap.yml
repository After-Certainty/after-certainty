id: what-becomes-scarce-when-answers-cheap
slug: what-becomes-scarce-when-answers-cheap
question: What becomes scarce when intelligence becomes cheap?
summary: When answers proliferate, attention, humility, and formation of knowers become the scarce goods.
orientation: Learning to See asks how traditions form better knowers through practices of attention—especially
  when answers and intelligence are abundant.
whatThisIsNot:
- Not an argument against knowledge or tools.
- Not a claim that every tradition secretly says the same thing.
- Not spiritual autobiography or apologetics.
