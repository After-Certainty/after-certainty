id: trust-survives-disagreement
slug: trust-survives-disagreement
question: How can trust survive disagreement?
summary: When good people see the world differently, trust has to rest on something other than shared
  conclusions.
orientation: Disagreement is not always a failure of character. Often it reflects different vantage points,
  different evidence, and different stakes. The harder question is how people keep working together when
  they no longer share the same story.
whatThisIsNot:
- Not a guide to winning arguments or converting opponents.
- Not a claim that all perspectives are equally accurate.
- Not the same question as whether similarity produces trust.
status: published
featured: true
featuredRank: 1
