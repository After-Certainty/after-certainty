id: ordinary-people-make-history
slug: ordinary-people-make-history
question: How do ordinary people make history when power is unequal?
summary: History is collective without being evenly shared; agency and unequal leverage must stay in the
  same frame.
orientation: Great-person stories and pure structural determinism both fail. Ordinary people make history
  through shared action while responsibility and leverage remain uneven.
whatThisIsNot:
- Not a claim that everyone has equal power or equal accountability.
- Not a hero biography of lone world-makers.
- Not a denial that structure and institutions shape what people can do.
