id: attention-changes-what-it-observes
slug: attention-changes-what-it-observes
question: Can attention change what it observes?
summary: Looking, deciding, and following reshape what becomes possible; observation is not only passive
  recording.
orientation: Observer Patterns approaches the question as poetry of attention becoming decisive—pattern
  recognition without instructions or argument.
whatThisIsNot:
- Not a scientific claim that poems prove measurement theory.
- Not a handbook of observation techniques.
- Not an argument that noticing alone remakes institutions.
