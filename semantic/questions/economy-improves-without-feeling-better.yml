id: economy-improves-without-feeling-better
slug: economy-improves-without-feeling-better
question: Why can the economy improve without feeling better?
summary: Aggregate charts and lived receipts are evidence from different distances; one can improve while
  the other does not.
orientation: Public economic speech often collapses two clocks into one verdict. Credibility requires
  holding chart and receipt together without denying either.
whatThisIsNot:
- Not an argument against economic statistics.
- Not a claim that distrust is always justified.
- Not the same as what a sports scoreboard can settle (related but distinct).
