id: moral-seriousness-at-scale
slug: moral-seriousness-at-scale
question: How does moral seriousness function when distance and pressure thin its conditions?
summary: >
  Scale does not erase moral seriousness, but proximity, reciprocity, and visible consequence change.
  Judgment becomes more costly when moral density thins.
orientation: >
  Small-scale restraint is often visible and reciprocated. This question asks what seriousness
  requires when consequence travels as data, asymmetry grows, and acceleration outruns attention.
whatThisIsNot:
  - Not a claim that scale corrupts or that smallness guarantees virtue.
  - Not a formula for restoring moral density at any size.
  - Not the same as incentives becoming the moral language (metrics displacing judgment).
