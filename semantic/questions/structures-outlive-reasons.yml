id: structures-outlive-reasons
slug: structures-outlive-reasons
question: Why do structures outlive the reasons that created them?
summary: Inherited infrastructures persist as sediment after original constraints thin—mistaken for nature
  until remembered as fossils.
orientation: Institutions fail not only by breaking. They also fail by keeping structures that once solved
  real problems. Living in sediment is a habit of seeing, not automatic suspicion.
whatThisIsNot:
- Not the same question as temporary exceptions becoming permanent (though related).
- Not a blanket attack on all inheritance or bureaucracy.
- Not a policy checklist for remaking every fossil.
