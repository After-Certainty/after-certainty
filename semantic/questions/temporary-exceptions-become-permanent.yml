id: temporary-exceptions-become-permanent
slug: temporary-exceptions-become-permanent
question: What happens when temporary exceptions become permanent?
summary: Emergency workarounds often outlive the crisis they were meant to serve.
orientation: Exceptions are sometimes necessary. The danger is when they stop reading as exceptions—when
  new people are trained on workarounds, rollback plans gather dust, and the temporary becomes normal
  without anyone deciding it should.
whatThisIsNot:
- Not an argument against ever making exceptions.
- Not the same as institutional decay in general.
- Not limited to software or leadership—this pattern appears across domains.
