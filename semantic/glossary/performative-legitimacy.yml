slug: performative-legitimacy
title: Performative legitimacy
shortDefinition: Authority maintained through visible compliance and ritualized participation
  rather than belief or justification.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- when-interpretation-no-longer-matters
recognitionSignals:
- visible compliance matters more than belief or coherence
- ritual affirmation substitutes for justification
- private skepticism coexists with public performance
- silence signals uncertainty while compliance signals safety
- understanding retreats to spaces where it cannot be spoken
questions:
- Where is legitimacy enacted rather than negotiated?
- What performance is required for safety in public space?
- Does private understanding alter standing at all?
counterbalances:
- protect domains where performance is not required for standing
- distinguish visible unanimity from genuine agreement
- preserve private networks without forcing public expression
trajectory:
  earlySignals:
  - public affirmation still partly voluntary
  - interpretation can still challenge standing in some settings
  intensificationSignals:
  - collective practices substitute for shared evaluation
  - each performance increases cost of visible dissent
  - official narratives frame repression as defense of the revolution
  failureModes:
  - legitimacy maintained through performance under threat alone
  - interpretation survives only where it cannot influence consequence
  restorationPaths:
  - restore evaluative agreement as condition of standing where possible
  - reduce cost of non-performance before preference falsification locks in
manifestations:
  politics:
  - orchestrated demonstrations and unanimous votes mark Stalin-era legitimacy
  - revolutionary suicide rehearsals frame loyalty as public display
  organizations:
  - show trials turn confession into visible compliance
