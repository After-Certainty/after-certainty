slug: permission
title: Permission
shortDefinition: What the room teaches after someone leads without being the usual
  name—whether stepping in, being credited, and stepping back are safe in practice.
  Permission is settled through repeated example before anyone tests it formally;
  it accumulates in the same vibrant or decaying habits circulation describes.
termKind: extended
relatedConcepts:
- circulation
relatedPatterns:
- leadership-reproduces-itself
relatedBooks:
- when-others-look-to-you-v1
recognitionSignals:
- people watch what happened after the last step-in before answering the next urgent call
- stepping in feels normal when the room has taught that stepping back stays safe
- formal deputizing exists on paper but the callback still goes to hold for the chef
- newsletters and huddles show whether credit followed the person who held the gap
- permission is settled through repeated example before anyone tests it formally
questions:
- What did the room teach about the cost of leading without being asked?
- Is permission open on paper and closed in practice?
- Who learns before their name is on the door whether stepping into the gap is safe?
counterbalances:
- answer after-action credit before the next crisis call
- let the closest person commit when timing beats circular approval
- separate useful step-in from overreach without erasing who held the floor
trajectory:
  earlySignals:
  - people offer to cover gaps without long negotiations about authority
  - aftermath stories sound like useful work, not damage control
  intensificationSignals:
  - thumbs hesitate over callbacks because the last public thank carried a private cost
  - coordination outside the official chain gets treated as bypass or leakage
  failureModes:
  - 'circulation captures: only certain names may steer, and the bench never forms'
  - permission copies forward as defensiveness of the same boundary
  restorationPaths:
  - make stepping back as safe as stepping up was welcome in the last visible case
  - read permission from treatment and aftermath, not from the org chart alone
manifestations:
  leadership:
  - buyout kitchens differ only in whether allergy swaps wait on hold for one name
  organizations:
  - veteran stage managers run tech week but stop getting invited into scheduling fights
  family:
  - a teen learns whether interrupting with a safety concern keeps them in the conversation
