slug: permission
title: Permission
shortDefinition: >-
  Permission is socially recognized authorization to act—whether stepping in, being credited, 
  and stepping back are safe in practice. It can come from formal role, relationship, precedent, 
  silence, imitation, or the room's response.
longDefinition: >-
  Permission names the social authorization that makes action feel legitimate before anyone has 
  formally granted it—the pattern the room teaches about whether stepping in, being credited, and 
  stepping back are safe in practice. It becomes important in leadership formation because permission 
  is often settled through repeated example rather than explicit delegation; people watch what happened 
  after the last step-in before answering the next urgent call. Permission can come from formal role 
  and explicit authorization, but it also accumulates through relationship, precedent, silence, 
  imitation, and the room's visible response to those who act. It helps leadership capacity grow when 
  stepping in is safe and stepping back does not carry hidden cost, when credit follows contribution 
  and risk is shared rather than punished. But permission can fail when it remains open on paper but 
  closed in practice, when only certain names may lead and the bench never forms, when stepping outside 
  the official chain is treated as bypass or leakage. The question permission raises is: what did the 
  room teach about the cost of leading without being asked? Permission differs from authority in that 
  permission is granted socially through pattern and response, while authority is granted formally 
  through role or structure.
termKind: extended
relatedConcepts:
