slug: governance-coupling
title: Governance Coupling
shortDefinition: The degree to which formal oversight structures preserve real consequence
  return to decision-capable authority. Governance coupling weakens when signal is
  filtered, delayed, or politically insulated, even if nominal accountability mechanisms
  still exist.
longDefinition: 'The degree to which formal oversight structures preserve real consequence
