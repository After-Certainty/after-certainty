slug: fairness
title: Fairness
shortDefinition: Fairness is the claim that what is owed has been settled justly. At
  scale, documented procedure—ratings, matrices, scripted compliance—often replaces
  contested judgment about particular cases, translating fairness from authored reasoning
  into method that survives challenge.
longDefinition: >-
  Fairness names a moral demand that becomes institutional language. It becomes important
  whenever decisions about what people are owed must be defended under scrutiny. It helps
  preserve consistency and challengeability, but can fail when process adherence substitutes
  for an account of contribution, dignity, or context. In When Incentives Become the Moral
  Language, fairness marks the domain where workforce decisions once required visible
  judgment about layoffs and promotions—yet discretionary case-by-case reasoning became a
  weak defense while documented process offered a stronger one. It differs from judgment
  because fairness can survive as method without anyone authoring the particular call.
