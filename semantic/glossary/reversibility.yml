slug: reversibility
title: Reversibility
shortDefinition: Reversibility is the ability to undo a decision, commitment, institutional movement,
  or moral settlement without rupture. It differs from revisability (openness to correction) and
  corrigibility (capacity to be corrected). What small groups could renegotiate becomes harder once
  law is carved, canon fixes meaning, and admitting error threatens authority's foundation.
longDefinition: >-
  Reversibility names the ability to undo a decision, commitment, institutional movement, or 
  moral settlement without rupture—the capacity to walk back what has been done without threatening 
  the foundation of shared life. It becomes important when coordination depends on stability but 
  conditions continue to change, when what was settled must be reopened but reopening feels 
  dangerous. Reversibility helps preserve adaptability across time; it allows correction without 
  collapse. But reversibility thins as stabilization hardens into permanence—as what small groups 
  could renegotiate through direct conversation becomes fixed in law, canon, or inherited procedure. 
  Writing and formalization externalize judgment into enforceable categories; sacred framing makes 
  revision feel morally dangerous rather than practically difficult; precedent and procedure narrow 
  the range of acceptable variance across time. Revision begins to feel indistinguishable from 
  collapse; admitting error threatens the foundation of authority itself. The question reversibility 
  raises is: what would have to break for this to be undone? Where is permanence providing stability, 
  and where has it become lock-in? Reversibility differs from revisability (openness to correction) 
  and corrigibility (capacity to be corrected)—reversibility is the ability to undo, not merely to 
  adjust or improve. The counterbalance is to recognize why stabilization once required permanence, 
  to notice when permanence first solved real coordination problems, and to separate necessary 
  storage from inherited weight.
