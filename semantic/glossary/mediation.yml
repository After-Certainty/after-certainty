slug: mediation
title: Mediation
shortDefinition: Mediation is what happens when meaning, authority, or consequence travels through
  intermediaries instead of direct encounter. It preserves coordination at scale—strangers can
  exchange under shared rules—but can thin responsibility as files move while bodies wait. Scale
  does not eliminate moral life; it routes it through intermediaries.
longDefinition: Mediation is interpretation through layered systems when direct encounter fails—
  interpreters at the harbor, clerks duplicating tribute lists, law and bureaucracy standing between
  decision and the bodies that receive the consequence. Scale does not eliminate moral life; it
  routes it through intermediaries. What is written persists across time and distance speech cannot
  carry, authority travels by law, taxation, and force rather than personal relationship, meaning
  drifts as it travels unless storage compresses it. Mediation makes strangers coordinateable—
  standardized measures let strangers exchange under shared rules, writing and canon hold meaning
  steady across distance, tribute lists copied for sender and receiver because neither trusts memory
  alone. But mediation can also hide harm—institutions record outcomes people experience differently,
  mediation outruns the feedback that once corrected interpretation. Who stands between decision and
  those who live the outcome? What is lost when encounter is replaced by file, seal, or category?
  Where does mediation make strangers coordinateable—and where does it hide harm?
