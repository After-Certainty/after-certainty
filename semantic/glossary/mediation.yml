slug: mediation
title: Mediation
shortDefinition: Mediation is what happens when meaning, authority, or consequence travels through
  intermediaries instead of direct encounter. It preserves coordination at scale—strangers can
  exchange under shared rules—but can thin responsibility as files move while bodies wait. Scale
  does not eliminate moral life; it routes it through intermediaries.
longDefinition: >-
  Mediation names what happens when meaning, authority, action, or consequence travels through 
  intermediaries rather than direct encounter. It becomes important as coordination extends beyond 
  face-to-face interaction—when scale requires representation, interpretation, or bureaucratic 
  processing between decision and effect. Mediation helps coordination work across distance, time, 
  and difference; it makes strangers coordinateable by routing their interactions through shared 
  systems, standardized measures, or authoritative interpreters. What is written can persist across 
  time and distance that speech cannot carry; law and procedure can hold meaning steady when personal 
  presence is impossible; records and files can coordinate action between people who will never meet. 
  But mediation can also thin responsibility and distort feedback—institutions can record outcomes in 
  ways that differ from how people experience them, and the layers of intermediation can outrun the 
  correction that direct encounter once provided. The question mediation raises is: who stands between 
  decision and those who live the outcome? What is lost when encounter is replaced by file, category, 
  or procedure? Mediation differs from distance in that mediation is the system of intermediaries, 
  while distance is the separation they attempt to bridge.
