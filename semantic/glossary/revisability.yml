slug: revisability
title: Revisability
shortDefinition: Revisability is disciplined openness to correction after action has
  begun. It is not indecision—it is designing decisions, models, and commitments so
  reality can still update them.
longDefinition: Revisability names the capacity to change course without pretending
  the first pass was final. It becomes important whenever uncertainty remains after
  action starts and harm can accumulate while people wait for closure. It helps preserve
  contact with changing conditions and proportionate response, but can fail when updating
  is labeled flip-flopping or when institutions punish revisions that unsettle prior
  verdicts. It differs from correction because revisability is the designed openness;
  correction is the specific act of noticing mismatch and updating. It differs from judgment
  because revisability keeps decisions attached to reality over time, not only at the
  moment of decision.
