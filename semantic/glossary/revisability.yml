slug: revisability
title: Revisability
shortDefinition: Keeping decisions, models, and recommendations open to correction
  after the first pass.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- what-we-cannot-see
recognitionSignals:
- forecasts, hires, or evacuations that made sense at noon need refinement by evening
- updating is labeled flip-flopping rather than keeping the decision attached to reality
- models, protocols, and relationships damaged by partial judgment never get revisited
- leaders punish revisions that unsettle prior verdicts or public narratives
- triggers for escalation and de-escalation were never named before acting
questions:
- What would change your mind—and is there a path for that information to count?
- Where is revision built into structure versus treated as embarrassment?
- Who benefits when the first pass must feel finished?
counterbalances:
- name revision triggers before outcomes are known
- treat post-decision learning as part of responsible judgment, not weakness
- build appeal, audit, and sunset loops that normalize unlearning
trajectory:
  earlySignals:
  - assumptions and disconfirming checks are stated alongside initial recommendations
  - institutions publish failures and null results, not only successes
  intensificationSignals:
  - coherence maintenance punishes updates that unsettle defended stories
  - peer-reviewed or approved labels freeze partial views as permanent
  failureModes:
  - revisability collapses into performance—feedback sought after the decision is made
  - institutions cannot forget on purpose when the world changes
  restorationPaths:
  - pre-registration, replication, and adversarial collaboration keep revision public
  - repair relationships and structures when partial sight missed cost-bearing angles
  - climate ensembles and safety loops make partiality visible across repeated passes
manifestations:
  organizations:
  - aviation and science cultures treat failed replication as information, not insult
  family:
  - families revisit school or care choices when new information arrives without shame scripts
  politics:
  - sunset clauses and appeals exist because first judgments were always partial

