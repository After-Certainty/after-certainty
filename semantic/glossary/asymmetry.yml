slug: asymmetry
title: Asymmetry
shortDefinition: Asymmetry is uneven distribution of power, visibility, risk, labor, or consequence.
  It matters because coordination at scale creates gaps between who decides and who bears
  the cost, making harm harder to trace and accountability harder to enforce. Asymmetry can
  arise from institutional design, distance, or role separation.
longDefinition: Asymmetry names the structural unevenness that scale introduces—decision
  travels on paper while consequence arrives in bodies, authority operates where presence
  cannot follow, and responsibility distributes across offices rather than remaining in
  persons. It can appear across institutions, teams, politics, families, and systems wherever
  coordination separates action from consequence. Governors sign orders for villages they
  will never visit, clerks stamp files executed in provinces they cannot see, and accountability
  thins for those farthest from the seal. At scale, asymmetry becomes ordinary architecture
  rather than exceptional abuse—no one in the room feels fully responsible, yet harm continues.
