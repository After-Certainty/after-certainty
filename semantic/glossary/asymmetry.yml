recognitionSignals:
- decision travels on paper while consequence arrives in bodies
- authority operates where presence cannot follow
- responsibility distributes across offices rather than remaining in persons
- accountability is visible though uneven—and more uneven at distance
questions:
- Who signs what others must endure?
- Where can harm be traced upstream and where does it disappear into role?
- What asymmetry is scale creating rather than malice?
counterbalances:
- follow the file to the body before calling compliance correct
- notice uneven exposure without reducing every gap to corruption
- ask who waits downstairs while charts are updated upstairs
trajectory:
  earlySignals:
  - authority stretches beyond personal relationship
  - moral life begins to abstract into citizen, subject, debtor
  intensificationSignals:
  - intermediaries enforce power law and taxation cannot carry face to face
  - legitimacy becomes procedural while consequence stays local
  failureModes:
  - asymmetry becomes ordinary architecture of moral life
  - no one in the room feels fully responsible
  restorationPaths:
  - name who stands where the consequence lands
  - recognize uneven exposure before asking for shared conviction alone
manifestations:
  politics:
  - Roman governors levy taxes on territories never visited
  - census numbers precede a person at border, factory, or judge
  organizations:
  - imperial clerks stamp orders for provinces they will never enter
  family:
  - tribute flows upward while hunger remains close enough to feel grace and fear
