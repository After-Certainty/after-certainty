slug: adaptation
title: Adaptation
shortDefinition: In this history, adaptation names how moral, religious, and legal
  systems emerge as workable responses to pressure—not as final truth discovered
  once and for all. What begins as adaptation can outlive the conditions that first
  made it necessary.
