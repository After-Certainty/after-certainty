slug: adaptation
title: Adaptation
shortDefinition: Adaptation names how moral, religious, and legal systems emerge as workable
  responses to pressure—not final truth discovered once. It differs from inheritance, which
  names stabilized certainty persisting after originating conditions fade.
longDefinition: Adaptation marks moral life responding to conditions that will not wait—scarcity,
  violence, scale, displacement. In Before Certainty Arrives, what begins as adaptation can
  outlive the pressures that first made it necessary. It helps preserve workable coordination
  under constraint, but can fail when adaptive tools are mistaken for permanent moral truth.
  It differs from inheritance because adaptation names responsive change; inheritance names
  what gets carried forward after conditions shift. It differs from drift because adaptation
  is active response; drift is gradual decoupling while machinery still runs.
