slug: coherence-maintenance
title: Coherence Maintenance
shortDefinition: 'The ongoing work required to keep a system governable: enough agreement
  about who decides, what happened, and what must change next for learning to remain
  possible. Coherence maintenance becomes expensive as independently evolving boundaries
  multiply. Systems sometimes pay for it through clear ownership and timely feedback;
  they sometimes pay through coordination substitutes that preserve throughput while
  thinning corrective capacity.'
