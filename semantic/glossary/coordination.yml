slug: coordination
title: Coordination
shortDefinition: >-
  Coordination is the arrangement of multiple actors, signals, roles, or actions into shared 
  movement under partial information. It can preserve collective action but can also become 
  brittle when it suppresses feedback or difference.
longDefinition: >-
  Coordination names the problem of acting together when lives are fragmented—when people must 
  move collectively across distance, time, strangers, and difference without complete information 
  or full agreement. It becomes important when individual judgment alone cannot sustain the group, 
  when behavior must hold across contexts that no one person can see completely. Coordination helps 
  preserve collective capacity by making expectations predictable, by enabling strangers to act 
  together under shared rules, by allowing large-scale projects that no single person could accomplish. 
  Roles, rituals, law, canon, procedure, and bureaucracy are all coordination technologies—tools 
  for making tomorrow recognizable from yesterday so action can continue. But coordination can become 
  brittle when it suppresses the feedback and variation it needs to stay responsive, when inherited 
  patterns keep moving after fit has thinned, when dissent is treated as disruption rather than signal. 
  Coordination purchased at the cost of revision can continue functioning long after it has stopped 
  serving the purposes that gave it authority. The question coordination raises is: what coordination 
  problem is this tool solving? What breaks if behavior stops being predictable? Coordination differs 
  from alignment in that coordination is about collective movement, while alignment is about shared 
  direction or values.
