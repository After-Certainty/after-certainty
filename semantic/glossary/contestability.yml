slug: contestability
title: Contestability
shortDefinition: Contestability is the capacity for a decision, authority, claim, or arrangement
  to be challenged without destroying the shared frame. It matters for legitimacy, correction,
  and revisability—when contestability thins, dissent reads as betrayal and alternatives feel
  dangerous rather than merely unpopular.
longDefinition: Contestability names the condition where dispute can reopen and the group still
  hold—challenge does not mean collapse. It depends on whether revision feels survivable or
  indistinguishable from rupture. Before Certainty Arrives traces its thinning as sacred
  authority, canon, and procedure relocate legitimacy beyond ordinary revision. When small
  groups still notice deviation quickly, authority can be argued for after it is obeyed. Under
  pressure—siege walls, confessional fracture, breakdown—dissent becomes moral failure, heresy,
  or impurity, and canon declares which interpretations will count. Contestability thins while
  inherited certainty still coordinates, systems run on compliance long after persuasion fades.
  The moment just before certainty becomes difficult to question at all.
