slug: responsibility
title: Responsibility
shortDefinition: Responsibility is the durable relation between action and answerability—causal
  involvement plus the obligation to account for consequences. It differs from accountability,
  which emphasizes exposure to consequence; and from answerability, which names obligation to
  those affected by partial-perspective decisions.
longDefinition: Responsibility names what continues after action—the obligation to remain
  responsive to what one's choices set in motion. It becomes important when systems scale
  beyond any one person's control but moral weight still accumulates. It helps preserve
  sustained answerability, but can fail when responsibility collapses into futility or when
  symbolic gestures replace contact with effects. It differs from accountability because
  responsibility names the enduring relation; accountability names whether consequence still
  reaches those who can respond.
