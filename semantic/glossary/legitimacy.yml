slug: legitimacy
title: Legitimacy
shortDefinition: Legitimacy is justified recognition of authority—whether power reads as earned
  and contestable enough that coordination holds under stress instead of collapsing into cynicism,
  performative compliance, or hidden veto by drift.
termKind: core
