slug: hexagonal-architecture
title: Hexagonal Architecture
shortDefinition: In this book, hexagonal architecture is used in a software engineering
  sense. Hexagonal architecture (also called ports and adapters) is a boundary pattern
  that keeps domain logic insulated from external technologies by routing integration
  concerns through explicit interface ports and adapter implementations.
longDefinition: 'In this book, hexagonal architecture is used in a software engineering
