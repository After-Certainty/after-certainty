slug: scoreboard-remainder
title: Scoreboard Remainder
shortDefinition: Scoreboard remainder is what a decisive competitive result leaves unsettled—production,
  credit, cost, and meaning that the final mark does not record even when the contest is over.
longDefinition: Scoreboard remainder names the gap between a settled outcome and the game that produced
  it. A score can be final while causation, contribution, desert, and later public meaning stay open.
  The term matters when clarity of result is mistaken for completeness of understanding. It differs
  from mere incompleteness because the remainder persists after a legitimate settlement; it differs
  from measurement error because the scoreboard may be correct within its rules and still leave the
  larger game unread.
