slug: dora
title: DORA
shortDefinition: In this book, DORA is used in a software engineering sense. DORA
  refers to research-backed software delivery metrics and practices (for example,
  lead time for changes and change failure rate) used to evaluate learning-loop quality
  between development and operations.
longDefinition: 'In this book, DORA is used in a software engineering sense.


