title: Certainty
shortDefinition: 'In this history, certainty is an adaptive response to instability—not
  truth discovered once and for all, but coordination hardened under pressure: roles,
  law, and moral systems that compress choice and make behavior predictable enough
  to survive another season of uncertainty.'
