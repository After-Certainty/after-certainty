slug: provisional-commitment
title: Provisional commitment
shortDefinition: Acting on the best partial case while remaining structurally willing
  to revise when new information arrives.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- what-we-cannot-see
recognitionSignals:
- paralysis is treated as safer than movement while the world keeps moving
- orders are issued with language for known, unknown, and reassessment triggers
- confidence is mistaken for clarity because one model or memory concentrates sight
- actors remain structurally willing to revise when upstream gauges cross a line
- waiting one more hour is recognized as its own decision with downstream cost
questions:
- What is the best partial case you can make while the picture is still forming?
- Where would revision be embarrassment versus responsible attachment to reality?
- Is uncertainty explaining difficulty—or dissolving the obligation to act?
counterbalances:
- commit with proportion and revision visible to those who must live with the choice
- name what would change your mind before outcomes are known
- refuse both false certainty and permanent deferral as ways to avoid accountability
trajectory:
  earlySignals:
  - pilots land on instruments that simplify enough to act; managers issue bounded orders
  - stakeholders hear assumptions alongside recommendations under time pressure
  intensificationSignals:
  - urgency or charisma collapses partial reads into prophecy or performance
  - revision threatens identity tied to a defended first pass
  failureModes:
  - provisional language becomes cover for negligence, appetite, or ignored dissent
  - structural unwillingness to revise treats first pass as final proof
  restorationPaths:
  - habit of stating assumptions, triggers, and disconfirming checks before acting
  - keep decisions attached as reality continues to arrive after the vote or signature
  - separate committing inside fog from pretending the fog has lifted
manifestations:
  organizations:
  - emergency managers document warnings and reassess when gauges cross agreed lines
  family:
  - parents act on incomplete school knowledge while remaining open to later revision
  politics:
  - leaders move before models converge when floods and bodies will not wait for proof

