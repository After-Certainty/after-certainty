slug: humility
title: Humility
shortDefinition: Humility—naming tradeoffs, uncertainty, distributional conflict—is
  epistemically virtuous and politically costly at scale. Certainty orients anxious publics
  and protects institutions from looking paralyzed. The outperforming of humility is not
  proof audiences are childish; it is proof that orientation is scarce and fear is abundant.
  Under interpretive stress, humility also means acknowledging what summaries omit and who
  pays for resilience.
termKind: extended
relatedConcepts: []
relatedPatterns: []
