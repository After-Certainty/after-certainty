slug: targets
title: Targets
shortDefinition: Targets names the domain where harm reduction survives while climate
  targets and ESG reporting replace responsibility language. Institutions learned to lead
  with dated numerical goals and auditable standards that make behavior comparable across
  jurisdictions. Those tools solve genuine coordination problems, but also make it possible
  to perform seriousness without settling who is responsible for what harm, to whom, and
  when.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- when-incentives-become-the-moral-language
recognitionSignals:
- institutions announce net-zero and science-based targets without settling downstream tradeoffs
- we met the target shifts the argument from judgment to compliance
- offset purchases are compliant while durability remains contested among specialists
- sustainability teams speak target met, on track, disclosure complete—not what places experience
- seriousness is demonstrated through pledges and frameworks without full causal ownership
questions:
- Who bears harm the reporting structure is not designed to surface or assign?
- When does target compliance substitute for owning specific tradeoffs publicly?
- Where does accounting diverge from impact that practitioners see daily?
counterbalances:
- publish what is unknown alongside what is disclosed in reporting
- tie targets to named beneficiaries and harmed communities, not only balance-sheet progress
- surface specialists' conference debates in institutional accountability where possible
trajectory:
  earlySignals:
  - climate harm is concrete but causal chains are long and statistically distributed
  - judgment about a responsible path creates exposure assumptions can always challenge
  - emissions targets, carbon markets, and ESG frameworks solve genuine coordination problems
  intensificationSignals:
  - institutions perform seriousness without settling who is responsible for what harm, to whom, when
  - the gap between metrics and community experience stays largely internal
  - net-zero timelines look plausible under optimistic technology assumptions
  failureModes:
  - action continues, targets accumulate, accountability for outcomes remains thin
  - harm is cumulative and irreversible while accounting language captures a marginal remainder
  - responsibility speech is replaced by seriousness speech in good faith
  restorationPaths:
  - reporting includes contested assumptions and locally concentrated harm
  - practitioners are authorized to name the accounting-impact gap without career penalty
  - targets are paired with ownership claims communities can challenge
manifestations:
  leadership:
  - boards rank firms on disclosure quality rather than always on harm reduction quality
  - executives announce alignment with global benchmarks while hard tradeoffs stay open
  organizations:
  - reported facility-level reduction coexists with larger downstream product emissions elsewhere
  - sustainability functions speak the only language that survives public accountability structures
  politics:
  - governments announce caps without resolving uneven cost distribution across populations
  - carbon markets let organizations report balance-sheet progress on simpler questions
  family:
  - a community near a still-polluting facility carries a gap insiders debate at conferences
