slug: reciprocity
title: Reciprocity
shortDefinition: Reciprocity is shared exposure and mutual constraint made visible—homage
  sworn with hands on relic, lord and vassal obligations explicit in the hall, band members
  who must still choose to stay after a failed hunt. Scale and abstraction thin reciprocity
  as categories replace relationships and consequence travels beyond mutual sight.
termKind: core
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- before-certainty-arrives
recognitionSignals:
- obligations are reciprocal, personal, and explicit where institutions are thin
- sharing meat and guarding the granary precede debate about fairness
- loyalty replaces abstraction when long-distance coordination collapses
- deviation threatens the group, not merely the claim
questions:
- Who still shares exposure if this arrangement fails?
- Where has reciprocity thinned into one-way compliance?
- What mutual constraint remains visible—and what has become category alone?
counterbalances:
- notice reciprocity as coordination technology under breakdown
- ask what scale abstracted away from mutual sight
- separate visible obligation from inherited hierarchy
trajectory:
  earlySignals:
  - moral life depends on knowing how others will act tomorrow
  - roles and repetition hold groups together under constraint
  intensificationSignals:
  - trade and empire require portable rules strangers can share without kinship
  - responsibility shifts from intent to role at industrial scale
  failureModes:
  - reciprocity thins while systems still demand participation
  - asymmetry grows as power travels beyond presence
  restorationPaths:
  - name mutual constraint before judging feudal or kin arrangements alone
  - recognize what shared exposure once regulated at human scale
manifestations:
  politics:
  - medieval feudal hierarchy localizes responsibility after imperial collapse
  - merchants complete exchange before arguing whose custom stands higher
  organizations:
  - temple queues move by ledger marks that bind harvest to household need
  family:
  - survivors after plague argue over who inherits obligation, not philosophy
