slug: reciprocity
title: Reciprocity
shortDefinition: Reciprocity is mutual exposure, obligation, and constraint. It matters when trust
  depends on both sides being reachable by consequence—visible obligations, shared exposure, and
  mutual accountability. Scale and abstraction thin reciprocity as categories replace relationships
  and consequence travels beyond mutual sight.
longDefinition: >-
  Reciprocity names mutual exposure, obligation, and constraint made visible—the condition where 
  both sides remain reachable by consequence and answerable to shared expectations. It becomes 
  important when trust depends not only on rules but on mutual vulnerability, when accountability 
  works through shared exposure rather than only through enforcement. Reciprocity helps preserve 
  relationality and answerability in coordination; it makes obligation concrete and visible rather 
  than abstract. When obligations are reciprocal, personal, and explicit, deviation threatens the 
  relationship itself, not merely a principle. Trust is stronger when both parties can see and feel 
  what happens if expectations break. But reciprocity thins as scale grows and abstraction replaces 
  relationships—as categories replace persons, as responsibility shifts from mutual constraint to 
  role compliance, as power travels beyond the reach of mutual consequence. Asymmetry grows when 
  obligation flows only one way, when those who decide are insulated from the effects of their 
  decisions. The question reciprocity raises is: who still shares exposure if this arrangement 
  fails? Where has reciprocity thinned into one-way compliance? Reciprocity differs from 
  accountability in that reciprocity is mutual, while accountability can be unidirectional.
