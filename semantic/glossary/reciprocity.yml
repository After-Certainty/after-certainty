slug: reciprocity
title: Reciprocity
shortDefinition: Reciprocity is mutual exposure, obligation, and constraint. It matters when trust
  depends on both sides being reachable by consequence—visible obligations, shared exposure, and
  mutual accountability. Scale and abstraction thin reciprocity as categories replace relationships
  and consequence travels beyond mutual sight.
longDefinition: Reciprocity is shared exposure and mutual constraint made visible. It names the
  condition where obligations are reciprocal, personal, and explicit where institutions are thin—
  homage sworn with hands on relic, lord and vassal obligations explicit in the hall, band members
  who must still choose to stay after a failed hunt. Sharing meat and guarding the granary precede
  debate about fairness, loyalty replaces abstraction when long-distance coordination collapses,
  deviation threatens the group not merely the claim. Who still shares exposure if this arrangement
  fails? Where has reciprocity thinned into one-way compliance? Moral life depends on knowing how
  others will act tomorrow, roles and repetition hold groups together under constraint. Trade and
  empire require portable rules strangers can share without kinship, responsibility shifts from
  intent to role at industrial scale. Reciprocity thins while systems still demand participation,
  asymmetry grows as power travels beyond presence. The counterbalance—notice reciprocity as
  coordination technology under breakdown, recognize what shared exposure once regulated at human
  scale, separate visible obligation from inherited hierarchy.
