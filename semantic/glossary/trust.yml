slug: trust
title: Trust
shortDefinition: Trust is not blind belief. It is the extension of action beyond what
  one person can personally verify—through signals, history, institutions, relationships,
  and feedback. In this project, trust matters when partial perspectives must still
  coordinate.
longDefinition: Trust names the bridge that lets people act together when no one holds
  the whole scene. It becomes important when verification must extend beyond firsthand
  sight—through specialists, records, institutions, or repeated experience. It helps
  preserve participation across partial perspectives, but can fail when trust stops
  tracking reality and closure feels safer than checking. It differs from certainty
  because trust accepts incomplete verification; it differs from blind belief because
  it still depends on signals that can be tested, strained, or withdrawn.
