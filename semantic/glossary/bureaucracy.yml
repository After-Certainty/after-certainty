slug: bureaucracy
title: Bureaucracy
shortDefinition: Bureaucracy extends permanence into practice—rules replacing discretion,
  procedures replacing judgment, roles replacing relationships. At industrial scale
  it functions as moral infrastructure, coordinating strangers through files, stamps,
  and queues that must still recognize a name long enough for life to continue.
