slug: distance
title: Distance
shortDefinition: Distance is separation between decision and consequence, action and feedback,
  authority and answerability, or explanation and lived effect. It matters because distance
  makes harm harder to trace, feedback slower to arrive, and role compliance feel sufficient
  even when fit has thinned.
longDefinition: >-
  Distance names separation between decision and consequence, between action and its effects, 
  between authority and those it governs. It becomes important as coordination extends beyond 
  direct relational encounter—as scale grows and abstraction layers multiply. Distance makes 
  harm harder to trace, feedback slower to arrive, and responsibility harder to locate. It helps 
  coordination reach across space and time, enabling larger and more complex forms of collective 
  action, but it thins the connection between choosers and those who live with the outcomes. As 
  distance opens, action and reflection no longer meet in the same place; decisions travel while 
  bodies receive the consequences; institutions record outcomes in ways that differ from how people 
  experience them. Distance becomes built into the architecture of moral life at scale—not as 
  failure but as structure. The question it raises is: how far does decision travel before 
  consequence is felt? Who can see the full chain between policy and harm? Distance differs from 
  mediation (routing through intermediaries) in that distance is the gap itself, while mediation 
  is what fills or crosses the gap.
