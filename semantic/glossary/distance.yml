slug: distance
title: Distance
shortDefinition: Distance is separation between decision and consequence, action and feedback,
  authority and answerability, or explanation and lived effect. It matters because distance
  makes harm harder to trace, feedback slower to arrive, and role compliance feel sufficient
  even when fit has thinned.
longDefinition: Distance marks separation between decision and consequence, action and reflection.
  As scale grows, distance widens—governors sign orders months before villages learn the cost;
  files move while bodies receive the consequence; investigators trace causation in rooms far
  from the wait downstairs. Action and reflection no longer meet in the same place. Distance
  opens as populations and authority stretch, feedback slows while harm becomes harder to trace,
  institutions record outcomes people experience differently, and explanation remains credible
  far from those who wait. Distance becomes built into the architecture of moral life, systems
  run while fit thins unnoticed. How far does decision travel before consequence is felt? Who
  can see the full chain between policy and harm? Distance is structural, not exceptional—naming
  the gap between what institutions record and what people experience.
