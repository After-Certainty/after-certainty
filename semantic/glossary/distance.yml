slug: distance
title: Distance
shortDefinition: Distance marks separation between decision and consequence, action
  and reflection. As scale grows, distance widens—governors sign orders months before
  villages learn the cost; files move while bodies receive the consequence; investigators
  trace causation in rooms far from the wait downstairs.
