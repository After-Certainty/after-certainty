slug: context-collapse
title: Context Collapse
shortDefinition: 'In this book, context collapse names a structural failure in assisted
  systems: boundaries that should separate concerns dissolve into a shared surface
  that looks coherent because output is syntactically valid or rhetorically fluent.
  The failure is low cohesion at speed—modules, prompts, corpora, or tools entangled
  until ownership and redesign authority become unclear.'
