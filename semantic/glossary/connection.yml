slug: connection
title: Connection
shortDefinition: Connection is the relationship people still have to live inside after the
  conversation ends—not a fourth force but the context signal, compression, and restraint
  move through. When people are linked by trust, dependence, history, care, or authority,
  stakes rise quietly. What continues afterward—reachability with consequence—carries
  revised trust, reluctance to speak, or renewed patience into the next conversation.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
