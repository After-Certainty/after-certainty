recognitionSignals:
- signal carries more weight because history or dependence stacks across encounters
- return after a harsh read feels unimaginable or too costly
- coordination continues while reachability with stakes thins
- unfinished meaning loses somewhere sturdy to return to
questions:
- What continues after the sentences end—not warmth, but reachability with stakes?
- How much room remains to revisit what happened?
counterbalances:
- treat connection as ongoing answerability, not proof of agreement
- protect return paths before optimizing for transactional closure
trajectory:
  earlySignals:
  - trust or dependence raises quiet stakes in ordinary talk
  - restraint costs more because the relationship is doing more work
  intensificationSignals:
  - vigilance replaces curiosity after a misread
  - belonging starts feeling conditional on the last interpretation
  failureModes:
  - exchange turns purely mechanical while backing away from risking more
  - relationships fray without drama when meaning hardens too fast
  restorationPaths:
  - keep two lives coupled enough that a frozen story carries felt cost
  - allow a harsh read to still move when connection remains deep
manifestations:
  family:
  - payroll and hallway recur together so prior encounters press on the next read
  organizations:
  - teams coordinate tasks while connection thins across reorgs
  leadership:
  - authority raises stakes so compression hardens meaning faster