slug: operational-coupling
title: Operational Coupling
shortDefinition: The degree to which the people who design or decide also remain close
  to execution and runtime consequence. Operational coupling is stronger when builders,
  operators, and reviewers share consequence exposure. It is weaker when handoffs
  separate decision authority from incident impact.
longDefinition: 'The degree to which the people who design or decide also remain close
