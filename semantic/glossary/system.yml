slug: system
title: System
shortDefinition: 'A system is an organized set of people, processes, rules, and structures
  that produces repeatable outcomes over time. The term applies across domains: software
  architectures, teams, firms, agencies, governance structures, and media institutions.
  The shared criterion is not technology; it is patterned behavior under constraints,
  incentives, and feedback.'
