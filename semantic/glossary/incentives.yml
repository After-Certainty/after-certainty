slug: incentives
title: Incentives
shortDefinition: Incentives are the reward and penalty patterns that influence behavior
  over time. In this book, incentives include formal metrics, promotion logic, political
  pressures, funding structures, and social recognition patterns. Incentives do not
  determine behavior by themselves, but they strongly bias what actors optimize for.
longDefinition: 'Incentives are the reward and penalty patterns that influence behavior
