slug: exit
title: Exit
shortDefinition: Exit is the real ability to leave a system, relationship, job, group, or
  authority structure without prohibitive material, social, moral, or identity cost. Exit cost
  shapes dissent, consent, and trust—when exit is blocked, voice fails and loyalty becomes
  performance rather than choice.
longDefinition: Exit names the ability to leave an authority system without prohibitive moral,
  social, or material cost. It matters because exit cost determines whether participation is
  genuinely voluntary or functionally coerced. Each act of participation increases the cost of
  leaving—family estrangement and financial demands raise exit barriers, communal immersion
  makes departure feel like moral betrayal, alternatives appear prohibitively costly. When exit
  is affordable, voice can function—disagreement carries survivable cost. When exit is blocked,
  participation deepens faster than evaluation, loyalty performance substitutes for ongoing
  evaluative choice, and authority reproduces through sunk cost rather than persuasion. Departure
  feels indistinguishable from moral collapse. Who can exit without being cast as traitor or
  failure? What would leaving cost morally, socially, and materially? Where has participation
  deepened faster than evaluation? The restoration path—preserve low-cost exit before commitment
  deepens, maintain relationships outside the authority system, reduce material and social
  penalties for departure.
