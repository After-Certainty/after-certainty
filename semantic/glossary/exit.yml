slug: exit
title: Exit
shortDefinition: The ability to leave an authority system without prohibitive moral,
  social, or material cost.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- when-interpretation-no-longer-matters
recognitionSignals:
- each act of participation increases the cost of leaving
- family estrangement and financial demands raise exit barriers
- communal immersion makes departure feel like moral betrayal
- alternatives appear prohibitively costly socially or materially
- voice fails because exit is blocked or unaffordable
questions:
- What would leaving cost morally, socially, and materially?
- Where has participation deepened faster than evaluation?
- Who can exit without being cast as traitor or failure?
counterbalances:
- preserve low-cost exit before commitment deepens
- maintain relationships outside the authority system
- reduce material and social penalties for departure
trajectory:
  earlySignals:
  - entry remains reversible with limited sunk cost
  - external ties and alternatives stay accessible
  intensificationSignals:
  - communal labor and matchmaking embed members more deeply
  - ritual participation raises visible and hidden exit costs
  - loyalty performance substitutes for ongoing evaluative choice
  failureModes:
  - departure feels indistinguishable from moral collapse
  - authority reproduces through sunk cost rather than persuasion
  restorationPaths:
  - restore viable alternatives before immersion seals belonging
  - support exit pathways before communal cost becomes prohibitive
manifestations:
  politics:
  - political identity blocs make defection socially costly
  organizations:
  - workshop sequencing and communal living defer evaluation until exit is costly
