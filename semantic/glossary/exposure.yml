slug: exposure
title: Exposure
shortDefinition: Exposure names what happens when novelty arrives faster than inherited
  frameworks can absorb—new lands, texts, peoples, and claims competing at the center
  of life. Certainty is most stable when the world it governs remains familiar; exposure
  widens before coordination can follow, often tightening belief locally even as diversity
  expands globally.
