slug: exposure
title: Exposure
shortDefinition: Exposure is contact with novelty, difference, evidence, or consequence that
  inherited frames cannot yet absorb. It can widen understanding when coordination loosens
  enough to integrate new knowledge, or cause defensive tightening when certainty feels
  threatened. Exposure often tightens belief locally even as diversity expands globally.
longDefinition: Exposure names what happens when novelty arrives faster than inherited frameworks
  can absorb—new lands, texts, peoples, and claims competing at the center of life. Certainty is
  most stable when the world it governs remains familiar; exposure widens before coordination can
  follow. Ships return with goods and charts inherited categories cannot contain, competing texts
  arrive weekly while neighbors watch allegiances, the ledger balances while the moral map cannot.
  Certainty is no longer alone even when it is not yet wrong. Exposure can expand moral possibility
  or provoke defensive compression—anatomical theaters widen observation before allegiance absorbs
  it, print shops multiply voices faster than canon can settle, confessional boundaries sharpen as
  printing spreads disagreement. What novelty is arriving faster than inherited frameworks can
  absorb? Where does exposure tighten belief locally while diversity expands globally? The question
  is not whether exposure is automatic moral progress, but which certainty will govern shared life.
