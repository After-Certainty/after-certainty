slug: exposure
title: Exposure
shortDefinition: Exposure is contact with novelty, difference, evidence, or consequence that
  inherited frames cannot yet absorb. It can widen understanding when coordination loosens
  enough to integrate new knowledge, or cause defensive tightening when certainty feels
  threatened. Exposure often tightens belief locally even as diversity expands globally.
longDefinition: >-
  Exposure names contact with novelty, difference, evidence, or consequence that inherited 
  frameworks cannot yet absorb—when what arrives outpaces the capacity to integrate it. It 
  becomes important when the world coordinated by existing certainty begins to include elements 
  those certainties did not anticipate. Exposure can widen understanding and moral possibility 
  when coordination is loose enough to integrate new knowledge, or it can provoke defensive 
  compression when certainty feels threatened by what it cannot contain. Certainty is most stable 
  when the world it governs remains familiar; exposure widens before coordination can follow. New 
  peoples, texts, practices, claims, or evidence arrive faster than inherited categories can 
  process—the ledger may balance while the moral map cannot. Certainty is no longer alone even 
  when it is not yet wrong. The question exposure raises is not whether novelty equals automatic 
  progress, but which certainty will govern shared life when multiple frameworks compete. Exposure 
  often tightens belief locally even as diversity expands globally; contact can provoke boundary-
  sharpening as easily as it produces synthesis. What matters is whether the conditions allow 
  absorption or demand compression.
