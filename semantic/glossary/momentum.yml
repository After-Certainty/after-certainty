slug: momentum
title: Momentum
shortDefinition: Momentum is continuation after renewed judgment has stopped. It can preserve
  coordination when alternatives are missing—systems still run, queues still move, payroll still
  renews—but it can also keep obsolete structures moving after fit has thinned. Momentum is
  inertia doing coordination work persuasion no longer does.
longDefinition: Momentum is continuation detached from renewed judgment—inherited certainty that
  still coordinates because nothing else yet does, queues that keep moving while fit thins,
  machinery that recognizes names long enough for life to continue without requiring full belief.
  Systems still run while meaning quietly thins, compliance feels like relief and dependency at
  once, nothing in the routine requires conviction—only that appointments hold. Certainty persists
  because it once worked and because nothing else yet does. What keeps moving because stopping would
  cost wages, medicine, or standing? Where is inertia doing coordination work persuasion no longer
  does? What would break first if the line stopped—not belief, but schedule? Momentum masks thinning
  fit until saturation feels ordinary, institutions demand allegiance after they stop holding meaning
  steady. Permanence succeeds and begins to accumulate weight, tools survive their purpose while
  retaining inherited authority, explanation remains credible far from those who wait downstream.
  The counterbalance—distinguish persistence from fitness, notice strain before open failure arrives,
  recognize why certainty lasted before asking it to leave.
