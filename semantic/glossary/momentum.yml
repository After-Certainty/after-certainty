slug: momentum
title: Momentum
shortDefinition: Momentum is continuation after renewed judgment has stopped. It can preserve
  coordination when alternatives are missing—systems still run, queues still move, payroll still
  renews—but it can also keep obsolete structures moving after fit has thinned. Momentum is
  inertia doing coordination work persuasion no longer does.
longDefinition: >-
  Momentum names continuation after renewed judgment has stopped—when systems, practices, or 
  certainties persist because they once worked and because nothing else yet does. It becomes 
  important when inherited structures keep coordinating even as their fit with current conditions 
  thins, when compliance feels like relief and dependency at once, when nothing in the routine 
  requires conviction—only that the pattern holds. Momentum can preserve stability and continuity 
  when alternatives are genuinely missing, when stopping would break dependencies people cannot 
  afford to lose. But it can also mask thinning fit until saturation feels ordinary, keeping 
  obsolete structures moving long after they have stopped serving the purposes that gave them 
  authority. Momentum is inertia doing coordination work that persuasion no longer does. The 
  question momentum raises is: what keeps moving because stopping would cost too much—not in 
  belief, but in wages, medicine, standing, or schedule? Momentum differs from acceleration in 
  that momentum is passive continuation, while acceleration is active pressure forward. The 
  counterbalance is to distinguish persistence from fitness, to notice strain before open failure 
  arrives, and to recognize why certainty lasted before asking it to leave.
