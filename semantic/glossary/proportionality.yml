slug: proportionality
title: Proportionality
shortDefinition: >-
  Proportionality is matching response to evidence, stakes, uncertainty, harm, and consequence—not 
  acting as if partial sight were complete certainty. It resists both overreaction and minimization.
longDefinition: >-
  Proportionality names the practice of matching the force and scope of a decision to the strength 
  of available evidence and the scale of actual stakes—acting appropriately under incomplete 
  information rather than pretending certainty where it does not exist. It becomes important when 
  action must proceed despite uncertainty, when consequences are significant, and when both 
  overreaction and under-reaction carry costs. Proportionality helps preserve responsible judgment 
  by resisting the extremes: neither treating partial evidence as complete certainty nor using 
  uncertainty as permission to defer action indefinitely. It requires naming what is known and what 
  is not, stating assumptions and triggers explicitly, matching confidence to evidence, and building 
  escalation and de-escalation paths before outcomes arrive. Proportionality can fail in two 
  directions—false certainty that exports harm onto people who needed bounded action, or permanent 
  deferral that uses every gap as excuse to never own a choice. The question proportionality raises 
  is: does the strength of the action match the strength of the evidence? What would need to be true 
  before a stronger move were justified?
