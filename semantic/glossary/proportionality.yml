slug: proportionality
title: Proportionality
shortDefinition: Matching the force of a decision to the evidence and stakes available—not
  acting as if partial sight were complete certainty.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- what-we-cannot-see
recognitionSignals:
- leaders speak in absolutes the evidence cannot carry
- evacuation, treatment, or policy moves claim whole-county certainty from tract-level models
- confidence costumes hide partial reads during urgent clocks
- political capital is spent as if partial sight were complete certainty
- stronger moves are justified without naming what would need to be true
questions:
- Does the strength of the action match the strength of the evidence?
- What would need to be true before a stronger move were justified?
- Where is uncertainty being used as cover for appetite rather than honest fog?
counterbalances:
- recommend without promising outcomes the trial cannot guarantee
- issue bounded orders with known, unknown, and trigger lines stated plainly
- separate what you know from what you hope before acting
trajectory:
  earlySignals:
  - clinicians and managers name ranges, assumptions, and stakes before committing
  - emergency language distinguishes what is known from what is not
  intensificationSignals:
  - loudest models or charisma concentrate the attention budget into false certainty
  - committees wait for unanimity that omniscience would not require
  failureModes:
  - false certainty exports harm onto people who needed movement with limits
  - permanent deferral uses every gap as permission to never own a choice
  restorationPaths:
  - build triggers for escalation and de-escalation before outcomes are known
  - seek disconfirming evidence without canceling the obligation to act
  - document who was warned, how, and on what partial case the force matched
manifestations:
  organizations:
  - county emergency managers evacuate likely tracts without claiming the whole county doomed
  family:
  - parents choose schools with incomplete knowledge while naming what would change their minds
  politics:
  - officials spend capital on moves that fit known gauges rather than perform omniscience

