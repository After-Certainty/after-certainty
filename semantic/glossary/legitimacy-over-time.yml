slug: legitimacy-over-time
title: Legitimacy Over Time
shortDefinition: Legitimacy over time asks what authority was created, transferred, or
  normalized—and who was empowered to act afterward, with what constraints. Leadership acts
  in time; legitimacy travels beyond it, often without the same constraints. The lens
  resists collapsing this dimension with effectiveness, asking whether permission remains
  contestable when successors inherit authority without inheriting restraint.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- when-authority-outlives-accountability
recognitionSignals:
- '"What this leader did" becomes "what this role allows"'
- Example hardens into rule; moral authority converts into operational power
- Founder language retained in mission statements authorizes decisions successors never witnessed
- Present harm explained as continuity—this is how we have always done things
- Influence persists but contestability fades—challenging authority feels like betrayal
questions:
- Who was empowered to act afterward, and with what constraints?
- Does permission remain contestable when successors inherit authority?
- Was authority explicit about scope, limits, and grounds—or implicit through charisma or urgency?
- Is the institution governed by borrowed legitimacy or renewed responsibility?
counterbalances:
- Watch what becomes permission when leadership stops acting and starts authorizing
- Apply the lens at human scale before institutions where legitimacy must be renewed
- Separate effectiveness from moral posture when evaluating inherited authority
trajectory:
  earlySignals:
  - Founder steps away but policies and language persist as authorization
  - Authority constrained by familiarity gives way to distance and scale
  intensificationSignals:
  - Institution draws on accumulated legitimacy from early years for present actions
  - Challenge framed as misunderstanding founder vision rather than present scrutiny
  - Office-based or sacralized legitimacy severs authority from moral restraint
  failureModes:
  - Authority outlives accountability without inheriting restraint
  - Institutions act in founder's name long after context changed
  - Accountability decays as legitimacy accumulates unboundedly
  restorationPaths:
  - Make authority contestable, bounded, and revisable in practice
  - Design for interpretation, dissent, and decay rather than sacralization
  - Emphasize example-based or procedural legitimacy over office entitlement
manifestations:
  leadership:
  - New leaders invoke founder intent to justify constraints they do not share
  - Leader refuses succession or decentralizes to limit authority passed forward
  organizations:
  - Institution after founder still governed by borrowed legitimacy not renewed responsibility
  - Procedural roles persist with contestation and reversibility preserving accountability
  family:
  - Parental authority that travels as unquestionable rule rather than renewed relationship
  politics:
  - Charismatic authority routinized into office where successors inherit permission without restraint
