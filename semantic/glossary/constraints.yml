slug: constraints
title: Constraints
shortDefinition: Constraints are the limits and boundary conditions that shape what
  actions are possible in a system. They include technical limits, legal rules, time
  pressure, budget limits, and institutional procedures. Good constraints channel
  behavior toward learning and accountability; poor constraints hide tradeoffs or
  displace consequence.
