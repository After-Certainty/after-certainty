slug: attention
title: Attention
shortDefinition: Attention names the domain where visibility metrics replace editorial
  claims about public importance. Newsrooms still know some stories matter even if they
  will not perform, but operational language shifted toward clicks, shares, and time on
  page. The convenient inference is that importance can be read from audience behavior
  after publication—though audience reflects habit, outrage, and placement, not the same
  thing as what the public needs for democratic judgment.
