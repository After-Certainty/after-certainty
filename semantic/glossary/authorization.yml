slug: authorization
title: Authorization
shortDefinition: Normalized permission for action that outlasts the local pressures
  that first produced it; contrasts with one-off adaptation.
termKind: extended
relatedConcepts:
- adaptation
- legitimacy
relatedPatterns: []
relatedBooks:
- after-certainty
questions:
- Which permissions still make sense if the original pressure that created them has
  passed?
- Who inherits this authorization today without remembering why it was granted?
- Where has normalized permission become a reason to postpone a judgment we already
  know is required?
- What would we revoke first if we treated authorization as provisional rather than
  settled?
recognitionSignals:
- a workaround or exception is described as "how we do things now," not as temporary
- new people are onboarded into permissions without the original constraint being
  retold
- meetings add context but defer a decision everyone already knows is required
- harm is attributed to "the system" while the authorizing choices remain unnamed
counterbalances:
- pair talk of authorization with named review dates
- require examples before accepting authorization as sufficient
- keep authorization tied to particular harms and people
manifestations:
  leadership:
  - executives use authorization to close debate in the room
  organizations:
  - policy language leans on authorization instead of repair
  software:
  - metrics or process labels stand in for authorization in practice
trajectory:
  earlySignals:
  - authorization appears early as a stabilizer under pressure
  - small mismatches are explained away using the term
  intensificationSignals:
  - authorization carries more weight than the situation can sustain
  - revision of authorization feels threatening to coordination
  failureModes:
  - authorization substitutes for contact with what is happening
  - drift around authorization becomes normal before it is named
  restorationPaths:
  - re-anchor authorization to particular cases and tradeoffs
  - practice revisability where the term closed debate
