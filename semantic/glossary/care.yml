slug: care
title: Care
shortDefinition: Care names the domain where healing aims survive while clinical judgment
  loses public standing. Healthcare exists to help this person leave safer than they
  arrived, but under capacity pressure and multiplied oversight individualized judgment
  creates exposure unless translated into auditable categories. Protocol becomes the safer
  public language while practitioners remain left holding moral weight the system can no
  longer articulate.
