slug: formation
title: Formation
shortDefinition: Formation names the domain where measurable outcomes replace developmental
  judgment in schools. Education exists to form human beings—not only transmit information
  but build judgment, character, attention, and restraint. Saying "scores improved" closes
  the meeting while "this student is growing in ways the test cannot capture" invites
  skepticism. Educators carry moral residue when metric pressure conflicts with
  developmental judgment standards cannot name.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- when-incentives-become-the-moral-language
