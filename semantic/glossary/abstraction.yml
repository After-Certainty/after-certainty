slug: abstraction
title: Abstraction
shortDefinition: 'Abstraction is mediation away from direct encounter: compression of complexity
  as systems scale, valued when it preserves accountability signal at the boundaries where
  behavior can still be redesigned—and costly when it hides consequence until feedback arrives
  too late.'
termKind: supporting
relatedConcepts: []
relatedPatterns: []
