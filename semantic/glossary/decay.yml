slug: decay
title: Decay
shortDefinition: 'The state of a group when capacities shrink: influence no longer
  changes course readily under pressure, coordinated action no longer sustains reach,
  or both. Contrasts with vitality; sustained erosion tends toward decay.'
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- when-others-look-to-you-v1
recognitionSignals:
- inconvenient information stops reaching decision-makers before it compounds
- charts stay green while the parking-lot mismatch never leaves the lot
- challenge is still imaginable but starts to feel costly before anyone speaks
- confidence inside the group rises while avoidable errors repeat
- protecting the image matters more than correction in daily choices
questions:
- What truth are we no longer paying the social cost to say?
- Does the room still look stable while reality goes unvoiced?
- Who absorbs cost when we defer correction?
counterbalances:
- name what speaking up cost the last time someone tried
- keep consequences tied to the person who could still say no
- shorten the gap between warning and response before identity fights harden
trajectory:
  earlySignals:
  - people do the math on pushback before raising a hand
  - errors get reframed as one-off exceptions
  intensificationSignals:
  - dissent softens into performances that protect the center
  - ground knowledge stops steering plans in time
  failureModes:
  - harm accumulates behind strong dashboards and smooth language
  - the group learns that image protection beats correction
  restorationPaths:
  - let bad news move in public without making the speaker the problem
  - restore who may reopen a plan after it is already moving
manifestations:
  leadership:
  - superintendents ask for problems and nobody raises a hand while mismatch stays in the lot
  organizations:
  - coordinators keep shadow spreadsheets because the portal queue nobody checks
  family:
  - children learn that naming a problem costs more than absorbing it quietly
