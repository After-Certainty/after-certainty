slug: erosion
title: Erosion
shortDefinition: The direction in which a group moves when scalability or adaptability
  shrinks—toward insulation, narrowed correction, and broken reach. Contrasts with
  renewal; it names structure, not moral worth.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- when-others-look-to-you-v1
recognitionSignals:
- correction channels narrow while meetings still run on time
- one decision route becomes the default gate everyone waits on
- temporary workarounds outlast the emergency they were made for
- harm gets buried in vague wording and pushed away from decision-makers
- scalability or adaptability shrinks without anyone announcing a policy change
questions:
- Which capacity is shrinking first—reach, revision, or both?
- What ordinary choices are teaching people that correction is costly?
- Where is insulation building while the surface still looks coordinated?
counterbalances:
- watch who gets interrupted, promoted, and forgiven after failure
- retire exceptions in batches with named owners and review dates
- keep ground signals on the agenda before the chart moves on
trajectory:
  earlySignals:
  - warnings travel farther but change less on arrival
  - exceptions introduced for speed start appearing in training materials
  intensificationSignals:
  - leadership coalesces around one escalation point at growing scale
  - disagreement is recoded as disloyalty before it reaches the table
  failureModes:
  - learning collapses while public updates highlight growth and consistency
  - erosion looks like stability from inside the room
  restorationPaths:
  - reopen feedback paths before the next round of scale
  - pair each exception with a sunset date and success criterion
manifestations:
  leadership:
  - regional networks copy narrowed correction while local adaptation slows
  organizations:
  - reporting cycles filter dosage warnings until monthly review
  family:
  - a household habit of smoothing conflict replaces revisiting what went wrong
