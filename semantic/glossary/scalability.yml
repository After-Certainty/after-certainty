slug: scalability
title: Scalability
shortDefinition: The capacity of coordinated action to grow in reach. Together with
  adaptability, it sorts groups into adaptive, entrenched, regenerative, and stalled,
  and underpins how renewal and erosion are read.
termKind: extended
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- when-others-look-to-you-v1
recognitionSignals:
- new sites open and still run the same protocol with the same standards
- coordinated action grows in reach without the center holding every thread by hand
- satellite centers adopt the same thresholds and documentation as the main site
- public updates show growth and consistency while local adaptation still moves
- scale widens reach before insulation shows, making drift easier to miss from a distance
questions:
- As reach grows, does coordinated action still hold without constant center intervention?
- What looks impressive from a distance while correction is lagging locally?
- Which campuses or sites are improvising around unresolved gaps?
counterbalances:
- keep local adjustment paths as fast as the rollout path
- measure same-protocol adoption, not only expansion counts
- check whether permission to fix travels back down with reporting cycles
trajectory:
  earlySignals:
  - all sites hit the same response-time target midweek after a shared rollout
  - training and branding spread faster than exception lists
  intensificationSignals:
  - feedback moves through paperwork and fixed reporting cycles
  - one escalation point becomes the only place problems read as real
  failureModes:
  - reach expands while correction weakens and entrenched patterns look solid longer
  - coordination frays at the edges while the center story stays coherent
  restorationPaths:
  - pair every expansion milestone with a local correction window
  - push protocol updates to every site before the same error repeats
manifestations:
  leadership:
  - a regional network shares training while local mentoring burnout surfaces in digests only
  organizations:
  - three clinics coordinate thresholds; a fourth improvises around unresolved gaps
  family:
  - extended-family plans scale to more households but one cousin still holds every final call
