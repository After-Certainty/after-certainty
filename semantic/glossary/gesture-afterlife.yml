slug: gesture-afterlife
title: Gesture Afterlife
shortDefinition: Gesture afterlife is what a public athletic act becomes once it leaves the field—the
  after-market of interpretation in which a moment turns into message, brand, grievance, or legend.
longDefinition: Gesture afterlife names the transformation of an on-field act into circulating meaning
  beyond evidence from the play itself. Kneeling, a rant, a podium stance, or a refusal can acquire
  audiences and agendas the athlete cannot fully control. The concept matters when later messaging
  overwrites the situation that produced the gesture. It differs from the original act because the
  afterlife is social reproduction; it differs from mere media coverage because coverage can still
  track events while afterlife reassigns what the event is for.
