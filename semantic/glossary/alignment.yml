slug: alignment
title: Alignment
shortDefinition: Authority sustained through signals of belonging rather than through
  evaluative agreement or persuasion.
termKind: supporting
relatedConcepts: []
relatedPatterns: []
relatedBooks:
- when-interpretation-no-longer-matters
recognitionSignals:
- disagreement clarifies who belongs rather than testing claims
- claims function as badges of membership instead of propositions to evaluate
- fact-checking and exposure fail to alter core support
- internal debate continues while cross-group persuasion ceases
- controversy demands response that reinforces alignment
questions:
- Where does disagreement sort allies from adversaries instead of testing claims?
- What would change if cross-group persuasion were still operative?
- Which statements signal belonging more than they invite evaluation?
counterbalances:
- preserve evaluative forums that span group boundaries
- reward persuasion across difference, not only in-group coherence
- track whether evidence travels outside aligned audiences
trajectory:
  earlySignals:
  - interpretation still visible in public debate
  - disagreement occasionally shifts positions across groups
  intensificationSignals:
  - each controversy reinforces in-group boundaries
  - meaning becomes expressive allegiance inside the frame
  - media cycles reward repetition and polarization
  failureModes:
  - cross-group persuasion ceases entirely
  - exposure and debunking strengthen rather than weaken standing
  restorationPaths:
  - rebuild shared evaluative space before sorting hardens
  - test whether reasons can travel across group boundaries
manifestations:
  politics:
  - campaign rhetoric sorts supporters from elites and adversaries
  - partisan media ecosystems sustain cohesion despite factual dispute
  organizations:
  - workshops sequence participation before doctrinal evaluation
  - communal labor and ritual deepen commitment after entry
