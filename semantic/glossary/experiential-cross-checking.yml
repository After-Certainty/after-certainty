slug: experiential-cross-checking
title: Experiential Cross-Checking
shortDefinition: Experiential cross-checking—testing official claims against grocery bills,
  rent, hours, and neighborhood signals—is coarse and can miss lagged effects. It is also
  hard to dismiss from the inside. When it becomes the default referee, institutions that
  treat cross-checking as stupidity deepen credibility toward locals and away from agencies.
  Institutions that treat it as data about where the average fails can sometimes earn a
  hearing for the second sentence of policy.
