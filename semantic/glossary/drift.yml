slug: drift
title: Drift
shortDefinition: Drift is gradual decoupling from original conditions—meaning drifting
  as it travels, moral reasoning drifting toward role compliance, fit thinning while
  machinery still runs. Systems continue without admitting that the conditions they
  were built for have shifted.
