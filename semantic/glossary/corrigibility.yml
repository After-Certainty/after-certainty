slug: corrigibility
title: Corrigibility
shortDefinition: Corrigibility is the capacity for revision and recovery when conditions
  change—what once compressed instability gradually resists adaptation. The book treats
  thinning corrigibility not as surprise but as the price paid when stabilization hardens
  into inheritance and admitting error threatens the foundation of authority itself.
termKind: core
