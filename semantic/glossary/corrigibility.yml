slug: corrigibility
title: Corrigibility
shortDefinition: Corrigibility is the capacity of a person, model, institution, or moral system
  to be corrected when reality pushes back. It differs from revisability (openness to correction),
  repair (mending what broke), and reversibility (ability to undo). Corrigibility thins when
  admitting error threatens authority's foundation.
longDefinition: >-
  Corrigibility names the capacity for revision and recovery when conditions change—the ability 
  of a person, institution, model, or moral system to adapt when reality pushes back. It becomes 
  important when stabilization succeeds but conditions continue to shift, when what once compressed 
  instability begins to resist the adaptation it was built to enable. Corrigibility helps preserve 
  responsiveness and learning over time, but it thins when admitting error threatens authority's 
  foundation or when the tools built to preserve certainty begin to constrain revision. Sacred 
  authority can resist correction without appearing illegitimate; canon can slow revision while 
  binding force remains; writing and law can externalize judgment in ways that replace reinterpretation 
  with precedent. Systems can record outcomes that people experience differently, and re-justification 
  can fade while inherited form still coordinates. Corrigibility differs from revisability (openness 
  to correction), repair (mending what broke), and reversibility (ability to undo). The question it 
  raises is: what would have to break for this arrangement to be revised? Recognizing why revision 
  once felt like collapse helps distinguish rigidity from adaptation's residue.
