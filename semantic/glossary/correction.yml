slug: correction
title: Correction
shortDefinition: 'Correction is reality-contact and revisability: the lived work of
  noticing mismatch, updating beliefs or behavior, and narrowing the gap between what
  was assumed and what is actually happening before drift hardens into normal.'
termKind: core
