recognitionSignals:
- transparency and accountability language remain while traction disappears
- clarification or exposure intensifies rather than constrains authority
- self-criticism and denunciation reproduce legitimacy instead of limiting it
- each corrective act deepens instability rather than restoring standing
- repair presumes shared interpretive space that no longer governs legitimacy
questions:
- Where would repair still connect to consequence?
- Does more interpretation accelerate or slow the regime?
- Are we treating displaced interpretation as merely incomplete?
counterbalances:
- test whether repair still mediates legitimacy before prescribing more
- preserve exit and witness where repair paths are gone
- avoid moral escalation that masquerades as intervention
trajectory:
  earlySignals:
  - accountability mechanisms still occasionally alter standing
  - clarification can still coordinate corrective action
  intensificationSignals:
  - struggle sessions and self-criticism become instruments of authority
  - each wave of correction generates new targets
  - repair language persists while braking power vanishes
  failureModes:
  - repair backfires and radicalizes authority
  - interpretation becomes anti-repair while remaining hyperactive
  restorationPaths:
  - recognize non-repairable conditions before prescribing dialogue
  - rebuild mediating institutions where repair still partially functions
manifestations:
  politics:
  - Cultural Revolution campaigns of critique destabilize rather than stabilize
  - Mao-era self-criticism demonstrates vigilance without constraining power
  organizations:
  - governance critiques at WeWork accumulate without converging into constraint
