slug: thinking
title: Thinking
shortDefinition: Thinking is reflective interpretation, explanation, and deliberation made possible
  by enough stability, time, and distance from constraint. Under severe pressure, coordinated action
  may precede explanation—societies act together before they renegotiate why. Meaning accumulates
  later, if at all.
longDefinition: Thinking names the capacity for explanation and deliberation when coordination already
  holds—distance, time, and cognitive surplus that let interpretation follow practice rather than
  precede survival. It is conditioned by what must be settled before there is leisure to reflect.
  Explanation requires distance, time, language, and surplus coordination lacks; rituals work before
  they are explained, taboos enforce before they are justified, certainty appears where explanation
  is too slow for the coordination problem. Roles precede reasons under visible constraint, meaning
  embeds in practice before doctrine forms. Axial traditions shift part of moral authority inward,
  law and writing fix judgment for strangers across distance, Greek inquiry opens wonder as well as
  argument once coordination loosens slightly. What must hold before there is time to think? Where is
  thinking a privilege scale has not yet removed? The failure mode—thinking thins into compliance when
  no one can trace harm, managed doubt persists far from those who wait downstairs. The counterbalance—
  notice coordination before explanation without calling early societies irrational, recognize thinking
  as conditioned by scale not absent by nature, ask what held long enough to live before asking what
  is true.
