recognitionSignals:
- people answer before the speaker finishes the uncertain part
- clear enough substitutes for understanding while the moment still holds
- second questions or returns to the jammed phrase stop happening
- private conclusions replace live interaction after speed wins
questions:
- What was actually said, including what still feels uncertain?
- Where did being right replace staying close to unfinished meaning?
counterbalances:
- hold one second question before closing the read
- refuse to let clear-enough closure substitute for contact while stakes remain
trajectory:
  earlySignals:
  - restraint slows compression long enough to revisit phrasing
  - people return to the phrase that jammed instead of moving on
  intensificationSignals:
  - calendars and slots end threads before uncertainty is named
  - contact thins while coordination of words continues
  failureModes:
  - harm arrives from deciding you understood before you did
  - transcripts look innocent while the room did not feel innocent
  restorationPaths:
  - stay close to what was said before assigning intent
  - keep the read open without pretending uncertainty vanished
manifestations:
