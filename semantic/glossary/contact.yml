slug: contact
title: Contact
shortDefinition: Contact is staying close to what was actually said, including what still
  feels uncertain—not a finished verdict but the unfinished part meaning can still be
  revisited. Restraint slows compression so contact keeps the read open without pretending
  uncertainty has disappeared. When speed or being right replaces contact, private
  conclusions replace live interaction—and harm often comes from deciding you understood
  before you did.
