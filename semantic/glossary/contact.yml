slug: contact
title: Contact
shortDefinition: Contact is staying close to what was actually said, including what still
  feels uncertain—not a finished verdict but the unfinished part meaning can still be revisited.
  It differs from connection, which names what persists after conversation ends.
longDefinition: Contact names restraint against premature compression in dialogue. In How
  Meaning Moves, it slows closure so meaning can still be revisited before harm arrives from
  deciding you understood too soon. It becomes important when speed, being right, or schedule
  pressure replace live interaction. It helps preserve accurate reading under stakes, but can
  fail when private conclusions replace the uncertain moment still open in the room. It differs
  from connection because contact is moment-to-moment closeness to what was said; connection
  is the ongoing relationship that carries revised trust or reluctance into the next exchange.
termKind: extended
relatedConcepts:
