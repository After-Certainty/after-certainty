slug: star-as-explanation
title: Star as Explanation
shortDefinition: Star as explanation is the habit of treating a visible standout performance or famous
  figure as sufficient cause for a collective result, collapsing distributed production into one face.
longDefinition: Star as explanation names how credit seeks a portable person when a result needs a
  story. It becomes important whenever attention, narrative, and leadership mythology outrun the work
  that made winning possible. It preserves a simple causal picture at the cost of teammates, systems,
  and timing that do not attach cleanly to one name. It differs from recognizing excellence because
  excellence can be real while still failing as total explanation; it differs from scapegoating only
  in valence—both compress a complex production into a single figure.
