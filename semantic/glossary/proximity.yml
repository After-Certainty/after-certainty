slug: proximity
title: Proximity
shortDefinition: Proximity is the relational nearness—shared memory, kinship, repetition,
  and immediate feedback—that lets small groups regulate behavior before scale breaks it.
  When proximity weakens, moral coordination must be simplified, standardized, or stored in
  stone, scroll, and archive.
termKind: supporting
relatedConcepts: []
relatedPatterns: []
