slug: harm
title: Harm
shortDefinition: Harm is where cost lands when action, authority, design, or influence is exercised.
  It includes visibility—who absorbs the cost, who can name it, who can respond, and whether the
  system treats it as acceptable loss. Harm can continue while interpretation expands, briefings
  make it legible without making it smaller.
longDefinition: Harm names where cost lands when influence is exercised—who absorbs it, who is kept
  in view, and what displacement is treated as acceptable. It marks the lived consequence of action,
  authority, design, or coordination. The visibility dimension matters—who is harmed in particular,
  not on average? Can they name it? Can they respond? Does the system register it or treat it as
  acceptable loss? Harm continues while interpretation expands, briefings make harm legible without
  smaller, people can still tell when something is doing harm. The question harm raises—is harm
  unchanged outside while we analyze inside? When does naming harm substitute for reducing it? The
  failure mode—harm persists while moral work feels complete, delays continue after excellent
  postmortems, harm becomes statistical at scale. The restoration path—return to particular harms
  and people, check effects outside the room after briefings, stop when outcomes for people are
  unchanged, pair analysis with named remedy attempts, accept harm as inevitable without abandoning
  response.
