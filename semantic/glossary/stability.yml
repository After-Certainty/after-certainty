slug: stability
title: Stability
shortDefinition: Continuity of coordination and expectation that resists disruption;
  can trade off against contestability when revision paths thin.
termKind: extended
relatedConcepts:
- contestability
- certainty
relatedPatterns: []
relatedBooks:
- after-certainty
questions:
- What are we protecting when we call a choice "stability"—coordination, reputation,
  or the right to revise?
- Where has continuity begun disguising harm that smooth operation makes easy to ignore?
- Who pays the cost when stability is purchased by thinning contestability?
- What small revision would we allow if stability were a practice rather than a freeze?
recognitionSignals:
- disagreement is framed as disruptive to "keeping things steady"
- leaders treat revision as threatening coherence, authority, or morale at once
- smooth operation is treated as equivalent to legitimacy
- more analysis is requested when the real tension is whether to update a settled
  story
counterbalances:
- pair talk of stability with named review dates
- require examples before accepting stability as sufficient
- keep stability tied to particular harms and people
manifestations:
  leadership:
  - executives use stability to close debate in the room
  organizations:
  - policy language leans on stability instead of repair
  software:
  - metrics or process labels stand in for stability in practice
trajectory:
  earlySignals:
  - stability appears early as a stabilizer under pressure
  - small mismatches are explained away using the term
  intensificationSignals:
  - stability carries more weight than the situation can sustain
  - revision of stability feels threatening to coordination
  failureModes:
  - stability substitutes for contact with what is happening
  - drift around stability becomes normal before it is named
  restorationPaths:
  - re-anchor stability to particular cases and tradeoffs
  - practice revisability where the term closed debate
