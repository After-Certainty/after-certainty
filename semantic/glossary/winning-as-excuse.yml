slug: winning-as-excuse
title: Winning as Excuse
shortDefinition: Winning as excuse is the move that treats competitive success as moral clearance—as
  if the result settles whether the method that produced it should count as justified.
longDefinition: Winning as excuse names how a decisive outcome can be asked to launder cost, cruelty,
  or illegitimacy in method. It becomes urgent when records, trophies, or titles are used to end arguments
  about how people were treated along the way. It preserves the prestige of the result while postponing
  judgment about desert and harm. It differs from celebrating excellence because celebration need
  not claim ethical indemnity; it differs from accountability because winning is offered as the answer
  rather than as one fact among others.
