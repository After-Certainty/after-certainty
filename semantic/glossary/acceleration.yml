recognitionSignals:
- dissent is read as risk and delay as weakness at the wall
- obedience becomes immediate because the season or siege will not wait
- authority must mobilize large populations quickly and decisively
- moral systems that tolerate prolonged disagreement struggle under pressure
questions:
- What must be settled before the season turns?
- Where is speed doing coordination work explanation cannot yet afford?
- Who pays when hesitation is treated as moral failure?
counterbalances:
- notice when urgency is structural rather than personal panic
- ask what quarrel can wait without calling delay weakness
- separate siege conditions from ordinary disagreement
trajectory:
  earlySignals:
  - coordination still feels too fragile for prolonged debate
  - certainty tightens because hesitation could be read as weakness
  intensificationSignals:
  - warfare or breakdown narrows what societies will tolerate
  - roles and obedience elevate over reinterpretation
  failureModes:
  - acceleration outruns the feedback that once corrected course
  - throughput substitutes for discernment at scale
  restorationPaths:
  - name the original pressure that made speed necessary
  - notice when urgency has outlived the threat that first required it
manifestations:
  politics:
  - Iron Age cities tighten certainty when gates must hold
  - staff officers optimize logistics while consequences arrive far from the map
  organizations:
  - factory bells mark uniform intervals so thousands coordinate without knowing names
  family:
  - smiths forge nails for the gate today though they argued with the magistrate yesterday
