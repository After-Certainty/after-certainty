slug: acceleration
title: Acceleration
shortDefinition: Acceleration is pressure that favors speed, decisiveness, and reduced
  deliberation when coordination feels fragile. It can help groups respond under real
  urgency, but becomes dangerous when urgency outlives the threat and dissent is treated
  as delay.
longDefinition: Acceleration arises when coordination is fragile and time is scarce—when
  the siege will not wait, the season will not hold, or the breakdown threatens to outpace
  response. Under these conditions, speed becomes a moral requirement—hesitation reads as
  weakness, dissent as delay the group cannot afford. At its best, acceleration protects
  survival when deliberation is genuinely too costly. At its worst, it persists after the
  threat has passed, treating every quarrel as risk and every pause as failure. Iron Age
  siege walls, wartime mobilization, and factory coordination all compress moral life under
  urgency, but when urgency becomes structural, acceleration replaces discernment entirely.
