slug: playing-hurt-moral-language
title: Playing-Hurt Moral Language
shortDefinition: Playing-hurt moral language is the vocabulary that turns bodily risk and availability
  into virtue—treating continued play through harm as loyalty, toughness, or duty rather than as a
  contested choice.
longDefinition: Playing-hurt moral language names how sports (and analogous institutions) moralize
  embodied cost. Protocols, pitch counts, and load rules exist alongside praise for those who refuse
  to come out. The phrase matters when incentives and identity make reporting injury feel like betrayal.
  It differs from ordinary courage because the virtue frame can silence disclosure; it differs from
  safety policy because the moral story often outruns the written protocol.
