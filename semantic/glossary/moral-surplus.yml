slug: moral-surplus
title: Moral Surplus
shortDefinition: Moral surplus is authority generated not by enforcement or outcome but by
  restraint—choosing not to convert personal suffering or absorbed harm into moral leverage.
  It is not infinite; it is expended carefully. Moral surplus does not resolve harm; it
  suspends escalation long enough for accountability to become thinkable again, reopening
  interpretation where compression would have ended it.
