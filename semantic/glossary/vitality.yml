recognitionSignals:
- questions, clarifications, and dissent take time but keep small trouble from becoming a break
- people know who must decide, how to escalate, and how to repair
- authority feels clearer because pushback when a decision looks wrong still works
- mistakes surface before they harden into identity fights
- coordinated action sustains reach while revision stays open in the moment
questions:
- Does friction in the room still buy us smaller failures later?
- Can people still push back without losing their place at the table?
- What feels slow at first but keeps harm from compounding?
counterbalances:
- protect the first interrupt that holds the room at bad news
- keep escalation paths visible when pace pressures mount
- treat early surfacing of error as part of coordinated action, not disloyalty
trajectory:
  earlySignals:
  - hard news stays speakable and examples accumulate toward openness
  - leaders ask edge cases to be walked through before the agenda moves on
  intensificationSignals:
  - meetings speed up by skipping the inconvenient slide
  - vitality language persists while social cost of speaking rises
  failureModes:
  - vitality drains into smooth operation that hides unvoiced mismatch
  - reach holds but adaptability falls—entrenched, not regenerative
  restorationPaths:
  - restore dissent-is-welcomed before feedback chains break
  - keep consequence contact so leaders still feel what their choices do
manifestations:
  leadership:
  - weekly reviews treat an analyst's interrupt as part of the work, not betrayal
  organizations:
  - principals adjust attendance protocols across campuses before dropout risk climbs
  family:
  - a parent slows the pace when a child's glance signals unread risk
