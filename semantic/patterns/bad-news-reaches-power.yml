slug: bad-news-reaches-power
title: Bad News Reaches Power
patternRole: supporting
organizingForce: contact
realityDynamic: corrective
observation: Systems learn and correct only when uncomfortable evidence can reach people with
  the authority and capacity to act.
problem: Hierarchy, success, identity, fear, and incentives filter bad news as it moves upward.
forces:
- Correction requires uncomfortable evidence
- Hierarchy filters what reaches authority
counterbalances:
- Create short, safe, protected routes through which failures, exceptions, dissent, and unintended
  effects reach decision-makers
