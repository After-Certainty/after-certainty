slug: intent-gets-assigned
title: Intent Gets Assigned
summary: A statement lands with emotional or relational significance. **Problem:**
  Listeners need to decide whether they are safe, respected, or at risk. **Forces:**
  - People turn behavior into motive quickly - Threat makes defensive readings more
  likely - Relationship history primes expectation **Observation:** People infer motive
  before certainty is possible. > Intent gets assigned in the same instant impact
  is noticed.
