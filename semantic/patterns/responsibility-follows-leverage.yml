slug: responsibility-follows-leverage
title: Responsibility Follows Leverage
patternRole: supporting
organizingForce: power
realityDynamic: corrective
observation: The greater a person's or institution's capacity to shape outcomes, prevent harm,
  benefit from a system, or repair consequences, the greater its responsibility.
problem: Collective explanations can dissolve responsibility, while individual blame can conceal
  unequal power and structural production.
forces:
- Leverage is uneven
- Blame and collectivity can both obscure capacity
counterbalances:
- Assign responsibility according to leverage, knowledge, freedom of action, benefit, and capacity
  to prevent or repair harm
