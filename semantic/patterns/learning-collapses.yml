slug: learning-collapses
title: Learning Collapses
setup: Those who decide sit far from where effects show up.
problem: News from the ground does not reliably reach them in time.
forces:
- Size adds distance from impact
- Formal reporting filters or delays signals
- Bad news is costly to raise
- Good news travels easier than bad news
observation: They do not get a clear read in time on what their choices are doing.
example: We're steering off summaries again. Learning collapses when the ground story
  never reaches this room.
relatedConcepts:
- decay
- distance
relatedPatterns:
- leaders-feel-the-consequences
- dissent-is-welcomed
relatedBooks:
- when-others-look-to-you-v1
- coupling
recognitionSignals:
- decision-makers steer off summaries while the ground story never reaches the room
- flags live in weekly digests but never become decisions that change the rule
- negative feedback weakens even when positive adoption metrics look strong
- the same avoidable errors repeat behind coherent public updates
- knowledge exists locally but has no reliable path up in time
questions:
- Is the ground story reaching this room before we steer again?
- Who keeps a shadow spreadsheet because the official channel failed?
- What error already happened twice because the message never converted to action?
counterbalances:
- elevate one digest flag to a steering decision with a named owner
- shorten the path from site coordinator to template change
- require ground read in the same meeting as summary metrics
trajectory:
  earlySignals:
  - local workarounds keep employers or clients from walking away while central metrics stay green
  - coordinators assume someone closer to the vendor opened a ticket
  intensificationSignals:
  - formal reporting filters timing problems into training follow-ups
  - boards see compliance rates, not shadow processes holding placements together
  failureModes:
  - errors repeat; correction arrives late and costs more
  - exceptions are forever because bypass became the learning path
  restorationPaths:
  - convert one recurring digest flag into a rule change with a deadline
  - sit decision-makers with site coordinators until the queue failure is visible
manifestations:
  leadership:
  - a president's briefing shows strong adoption while portal queues stall placements
  organizations:
  - IT marks routing flaws as training issues though every center logged them week one
  family:
  - parents repeat the same conflict because children's warnings never alter the household plan
media:
