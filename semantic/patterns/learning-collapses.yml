slug: learning-collapses
title: Learning Collapses
summary: Those who decide sit far from where effects show up. **Problem:** News from
  the ground does not reliably reach them in time. **Forces:** - Size adds distance
  from impact - Formal reporting filters or delays signals - Bad news is costly to
  raise - Good news travels easier than bad news **Observation:** They do not get
  a clear read in time on what their choices are doing. > "We're steering off summaries
  again. Learning collapses when the ground story never reaches this room."
