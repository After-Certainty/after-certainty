slug: admiration-becomes-insulation
title: Admiration Becomes Insulation
setup: Admiration enables trust, imitation, and moral aspiration toward people who
  seem to carry more than their share of complexity.
problem: Heroic narratives stabilize; contradiction becomes hard to absorb without
  collapsing the story.
forces:
- Harm is reframed as tradeoff
- Context expands selectively around the admired figure
- Accountability weakens to preserve narrative coherence
- Scrutiny feels like betrayal of belonging
observation: The admired person is protected less by trust than by narrative attachment.
example: A leader's harmful call is debated as "what the role required" while proportionate
  inquiry is treated as disloyalty.
relatedConcepts:
- legitimacy
- authority
- accountability
relatedPatterns:
- scrutiny-preserves-trust
- blame-compresses-complexity
relatedBooks:
- after-certainty
