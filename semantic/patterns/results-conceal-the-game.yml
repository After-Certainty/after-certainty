slug: results-conceal-the-game
title: Results Conceal the Game
patternRole: supporting
organizingForce: perception
realityDynamic: obscuring
observation: Visible outcomes and metrics reveal that something happened, but often conceal the
  broader field of causes, constraints, costs, and meanings that produced it.
problem: Scores, profits, elections, rulings, promotions, failures, and dashboards are easy to
  communicate and therefore become explanations rather than evidence.
forces:
- Results travel easily
- The field that produced them does not
counterbalances:
- Look beyond the result to the field of interactions that produced it
