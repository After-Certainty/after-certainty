slug: understanding-circulates
title: Understanding Circulates
patternRole: supporting
organizingForce: perception
realityDynamic: corrective
observation: Understanding emerges and corrects itself when partial perspectives move among people
  rather than remaining isolated.
problem: No one sees the whole situation, yet organizations often treat understanding as something
  possessed by individuals or authorities.
forces:
- No single vantage sees the whole
- Authority may hoard interpretation
counterbalances:
- Create pathways through which observations, interpretations, disagreement, and local knowledge
  can circulate and revise the shared picture
