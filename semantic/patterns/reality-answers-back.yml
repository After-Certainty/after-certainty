slug: reality-answers-back
title: Reality Answers Back
patternRole: master
setup: Human systems must simplify reality in order to perceive, decide, coordinate, and act.
problem: Those simplifications necessarily leave out people, consequences, perspectives, history,
  and changed conditions.
observation: Every abstraction, institution, decision, and model eventually encounters the reality
  it only partially captured. Reality answers through failures, exceptions, dissent, unintended
  behavior, lived experience, or consequences the model did not contain.
forces:
- Simplification is required for coordinated action
- What is left out eventually returns
- Systems need paths for revision before collapse
counterbalances:
- Preserve paths through which answers can be noticed early enough to revise understanding and
  action
