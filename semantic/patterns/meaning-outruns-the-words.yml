slug: meaning-outruns-the-words
title: Meaning Outruns the Words
setup: People rely on short utterances to carry complex relational meaning.
problem: Language cannot carry full context, history, and emotional state by itself.
forces:
- Context lives in the setting and in shared history
- Emotion often shows up outside explicit wording
- Social roles load words with extra consequence
observation: Language never carries all of the context, emotion, or intent around
  it.
example: 'Meaning outruns the words: a line can be precise in grammar and still short
  on life.'
relatedConcepts:
- meaning
- consequence
