slug: meaning-outruns-the-words
title: Meaning Outruns the Words
summary: 'People rely on short utterances to carry complex relational meaning. **Problem:**
  Language cannot carry full context, history, and emotional state by itself. **Forces:**
  - Context lives in the setting and in shared history - Emotion often shows up outside
  explicit wording - Social roles load words with extra consequence **Observation:**
  Language never carries all of the context, emotion, or intent around it. > Meaning
  outruns the words: a line can be precise in grammar and still > short on life.'
