slug: explanation-replaces-response
title: Explanation Replaces Response
setup: Explanation helps people understand events, reduce confusion, and name causes
  when situations outrun intuition.
problem: Analysis expands while action stalls; understanding becomes satisfying enough
  to substitute for responsibility.
forces:
- More context feels like moral progress
- Meetings reward comprehension over commitment
- Harm is reorganized faster than it is reduced
- Urgency is discharged into interpretation
observation: At its limit, explanation reorganizes harm rather than reducing it.
example: A fifth working session adds history and incentives while the decision everyone
  already senses stays unmade.
