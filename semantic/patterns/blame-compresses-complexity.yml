slug: blame-compresses-complexity
title: Blame Compresses Complexity
setup: Blame can clarify responsibility and acknowledge harm when systems have produced
  injury someone must answer for.
problem: Villain narratives simplify systems into individuals; structural incentives
  and shared participation disappear.
forces:
- Emotional resolution arrives faster than understanding
- Learning narrows once a face is assigned
- Complexity is traded for moral closure
- Scale is experienced as someone else's failure
observation: Blame offers relief faster than contact with how the field actually produced
  the outcome.
example: After a failure, the organization fires one manager while the incentives that
  shaped everyone's choices stay unnamed.
relatedConcepts:
- accountability
- harm
- scale
relatedPatterns:
