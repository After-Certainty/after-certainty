slug: leadership-reproduces-itself
title: Leadership Reproduces Itself
summary: A group has settled on visible leadership habits—what gets rewarded, what
  gets punished, what gets ignored. **Problem:** People read those habits as personal
  style and as the local picture of “how things work here.” That picture travels.
  **Forces:** - Copying is faster than being taught step by step - People credit what
  they can see, not hidden setup - New members learn from example before they learn
  from rules - What gets rewarded and repeated is what gets copied **Observation:**
  People copy leadership habits and norms. That shapes how the next round of leaders
  forms. > "Watch what gets praised in public—that's what people will imitate. Leadership
  reproduces itself through what last looked…
