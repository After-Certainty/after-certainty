slug: leadership-reproduces-itself
title: Leadership Reproduces Itself
setup: A group has settled on visible leadership habits—what gets rewarded, what gets
  punished, what gets ignored.
problem: People read those habits as personal style and as the local picture of “how
  things work here.” That picture travels.
forces:
- Copying is faster than being taught step by step
- People credit what they can see, not hidden setup
- New members learn from example before they learn from rules
- What gets rewarded and repeated is what gets copied
observation: People copy leadership habits and norms. That shapes how the next round
  of leaders forms.
example: '"Watch what gets praised in public—that''s what people will imitate. Leadership
  reproduces itself through what last looked…'
relatedConcepts:
- correction
- circulation
- coordination
- decay
relatedPatterns:
