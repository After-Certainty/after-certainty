recognitionSignals:
- what gets praised in public becomes what the next cohort imitates
- new members learn from example before they learn from rules
- the next promoted leader defends the same boundary the last one modeled
- local habits travel as templates for how things work here
- permission lessons copy forward—not only mannerisms—when leadership turns over
questions:
- Watch what gets praised in public—what will people imitate next?
- What did this room teach about stepping in before anyone got promoted?
- Are forming and eroding habits spreading without a written playbook?
counterbalances:
- credit temporary lead in the report everyone reads
- punish bypass behavior without erasing who held the gap well
- make one rewarded behavior explicit before it copies as unspoken policy
trajectory:
  earlySignals:
  - newcomers copy reactions they saw in the first week, not policies they read later
  - turnover inherits how dissent, credit, and stepping-in were handled before
  intensificationSignals:
  - other sites start to look like this one in who may speak and steer
  - rewarded insulation copies faster than rewarded correction
  failureModes:
  - erosion templates spread at scale while growth metrics look strong
  - the bench reproduces narrow permission because no one practiced wider circulation
  restorationPaths:
  - change what gets publicly credited before the next promotion cycle
  - pair new leaders with one visible case where guest leadership was welcomed
manifestations:
  leadership:
  - a regional network copies narrowed correction from the flagship site's habits
  organizations:
  - the next director inherits whether stepping into the gap was safe here
  family:
  - children reproduce how a parent handled apology, blame, or silence under stress
