slug: contact-keeps-the-read-open
title: Contact Keeps the Read Open
setup: People return to a difficult exchange with more context and lower reactivity.
problem: Early interpretation may be useful but still too rough.
forces:
- Additional context widens what people can see
- Lower emotional charge improves tolerance for ambiguity
- Restraint keeps meaning revisable
observation: Additional context can sharpen understanding without fully resolving
  it.
example: Contact keeps the read open when understanding tightens without the story
  having to close.
