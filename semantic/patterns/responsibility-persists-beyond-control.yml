slug: responsibility-persists-beyond-control
title: Responsibility Persists Beyond Control
setup: Outcomes often exceed personal influence, yet participation, attention, and response
  still matter where contact exists.
problem: Innocence becomes an escape from participation when systems feel too large
  to steer.
forces:
- Scale makes withdrawal feel rational
- Formal authority ends while influence continues
- Care is mistaken for omnipotence
- Answerability is confused with blame
observation: Care survives after control disappears; responsibility is not the same
  as mastery.
example: An executive who has left a role still shapes what others do through permissions
  and precedents they normalized.
relatedConcepts:
- responsibility
- agency
- accountability
relatedPatterns:
