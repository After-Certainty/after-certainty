slug: leadership-coalesces
title: Leadership Coalesces
summary: A group repeatedly turns to the same person when decisions are unclear. **Problem:**
  On paper, who decides is unclear. Or the role is assigned, but the work still slides
  to the same person. **Forces:** - Repetition builds familiarity and trust - Speed
  favors the usual decision path - Dodging unclear ground reinforces habit - Informal
  authority can feel easier than formal handoff **Observation:** The group defaults
  to the same person. That can happen even when no formal authority exists. > "It's
  not on the chart, but leadership coalesces around you—every time it's fuzzy, the
  call still comes back to you."
