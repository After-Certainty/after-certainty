slug: leadership-coalesces
title: Leadership Coalesces
setup: A group repeatedly turns to the same person when decisions are unclear.
problem: On paper, who decides is unclear. Or the role is assigned, but the work still
  slides to the same person.
forces:
- Repetition builds familiarity and trust
- Speed favors the usual decision path
- Dodging unclear ground reinforces habit
- Informal authority can feel easier than formal handoff
observation: The group defaults to the same person. That can happen even when no formal
  authority exists.
example: It's not on the chart, but leadership coalesces around you—every time it's
  fuzzy, the call still comes back to you.
relatedConcepts:
- erosion
relatedPatterns:
- attention-finds-a-focus
- disagreement-is-suppressed
relatedBooks:
