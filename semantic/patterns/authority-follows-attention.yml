slug: authority-follows-attention
title: Authority Follows Attention
patternRole: supporting
organizingForce: power
realityDynamic: obscuring
observation: When collective attention settles on a person, signal, role, or voice, authority
  begins to form even before legitimacy or competence has been established.
problem: Visibility, confidence, early action, and symbolic prominence can become influence that
  later appears natural or deserved.
forces:
- Attention concentrates before legitimacy is tested
- Early visibility hardens into presumed fitness
counterbalances:
- Recognize concentrated attention as an early form of authority and attach feedback, responsibility,
  and limits before it hardens
