slug: scrutiny-preserves-trust
title: Scrutiny Preserves Trust
setup: Trust depends on proportionate inquiry, not on insulating admired figures from
  the questions their power requires.
problem: Admiration otherwise protects narratives from revision; legitimacy closes
  when contradiction arrives.
forces:
- Inquiry is cast as cynicism
- Coherence is prized over contact
- Heroes absorb moral weight the system still distributes
- Revision threatens belonging
observation: Scrutiny keeps legitimacy open without demanding that every admired figure
  be recast as a villain.
example: A board asks for evidence and tradeoffs in public, not only reassurance about
  character.
relatedConcepts:
- legitimacy
- judgment
- accountability
relatedPatterns:
- admiration-becomes-insulation
- revisability-preserves-judgment
relatedBooks:
- after-certainty
