slug: gaps-invite-completion
title: Gaps Invite Completion
summary: An exchange contains ambiguity, omitted detail, or unresolved tension. **Problem:**
  Open meaning is hard to sustain under practical or emotional pressure. **Forces:**
  - Uncertainty creates interpretive discomfort - Fast social coordination rewards
  quick closure - Memory and expectation supply plausible filler **Observation:**
  Missing meaning rarely stays open for long. > Because gaps invite completion, the
  mind usually supplies missing > meaning before the speaker does.
