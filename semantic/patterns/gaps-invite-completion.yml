slug: gaps-invite-completion
title: Gaps Invite Completion
setup: An exchange contains ambiguity, omitted detail, or unresolved tension.
problem: Open meaning is hard to sustain under practical or emotional pressure.
forces:
- Uncertainty creates interpretive discomfort
- Fast social coordination rewards quick closure
- Memory and expectation supply plausible filler
observation: Missing meaning rarely stays open for long.
example: Because gaps invite completion, the mind usually supplies missing meaning
  before the speaker does.
