slug: meaning-reinforces-itself
title: Meaning Reinforces Itself
summary: A group repeats interactions through an existing interpretive frame. **Problem:**
  The frame no longer feels provisional. **Forces:** - Selective attention confirms
  prior meaning - Repetition normalizes prior conclusions - Social alignment penalizes
  interpretive differences **Observation:** Once established, interpretation begins
  shaping future interpretation. > Meaning reinforces itself when what we conclude
  once becomes what we > are prepared to see again.
