slug: care-preserves-particulars
title: Care Preserves Particulars
patternRole: supporting
organizingForce: contact
realityDynamic: corrective
observation: Care keeps the specific person, case, circumstance, and context visible when rules
  and averages would otherwise erase them.
problem: Pure discretion can become arbitrary, but pure rule-following can misread the person
  or case.
forces:
- Rules protect floors
- Particulars require attentive judgment
counterbalances:
- Let rules establish a floor of protection while preserving bounded spaces for attentive judgment
  about particulars
