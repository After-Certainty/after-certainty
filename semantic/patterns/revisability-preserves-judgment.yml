slug: revisability-preserves-judgment
title: Revisability Preserves Judgment
setup: Judgment remains necessary when certainty weakens; people still must weigh tradeoffs
  and consequences without a final frame to hide inside.
problem: Finality no longer stabilizes judgment, yet paralysis and dogma are both available
  failures.
forces:
- New information threatens prior commitments
- Groups confuse openness with weakness
- Revision must be practiced without infinite deferral
- Coherence pressures compete with contact with reality
observation: Revisability is what prevents judgment from hardening into dogma.
example: A leader publishes what would change their mind—and acts on the answer when
  it arrives.
relatedConcepts:
