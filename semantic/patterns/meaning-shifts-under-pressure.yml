slug: meaning-shifts-under-pressure
title: Meaning Shifts Under Pressure
summary: Communication occurs under conflict, urgency, authority, or high stakes.
  **Problem:** The need for rapid action competes with staying close to what was actually
  meant. **Forces:** - Time pressure rewards certainty - Power asymmetry increases
  defensive reading - Consequence anticipation narrows options **Observation:** Urgency,
  conflict, and consequence accelerate interpretation. > Pressure shrinks the distance
  between what people notice and what they treat as settled.
