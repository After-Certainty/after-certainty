slug: leaders-feel-the-consequences
title: Leaders Feel the Consequences
summary: A decision creates cost, risk, or gain for people in a group. **Problem:**
  Where people decide and where costs land can separate. **Forces:** - Incentives
  favor visible wins over visible cost - In large settings, effects land unevenly
  - Distance makes harm easier to miss - Pushing pain downhill is easier **Observation:**
  Those who decide stay tied to what their choices do to others. > "If we called it,
  we sit with the fallout. Leaders feel the consequences on this; we're not sliding
  the pain down a layer."
