slug: leaders-feel-the-consequences
title: Leaders Feel the Consequences
setup: A decision creates cost, risk, or gain for people in a group.
problem: Where people decide and where costs land can separate.
forces:
- Incentives favor visible wins over visible cost
- In large settings, effects land unevenly
- Distance makes harm easier to miss
- Pushing pain downhill is easier
observation: Those who decide stay tied to what their choices do to others.
example: If we called it, we sit with the fallout. Leaders feel the consequences on
  this; we're not sliding the pain down a layer.
relatedConcepts:
- harm
- distance
- vitality
relatedPatterns:
- dissent-is-welcomed
- learning-collapses
relatedBooks:
- when-others-look-to-you-v1
- when-others-become-leaders
relatedSources:
- scott-james-c-domination-and-the-arts-of-resistance-hidden-transcripts
recognitionSignals:
- whoever called the stop sits with fallout when trucks stay parked or loads go short
- costs do not quietly slide onto route teams, docks, or hourly staff
- decision-makers stay tied to what their choices do to others, not only to metrics
- harm is named in the room where release was judged, not reframed as field noise
- accountability stays visible when pressure favors pushing pain downhill
questions:
- If we called it, who sits with the fallout?
- Where do costs land when the center keeps the commitment story intact?
- Are visible wins separating from visible cost at growing distance?
counterbalances:
- name who authorized the call and the cost in the same huddle
- refuse to ship rework downstream without recording the decision
- keep consequence contact when scale adds layers between decide and absorb
trajectory:
  earlySignals:
  - leaders absorb part of the cost of their own visible decisions
  - stops and delays get credited to the person who could still say no
  intensificationSignals:
  - rework and risk travel downward while the dashboard stays green
  - distance makes harm easier to miss from the conference room
  failureModes:
  - harm displacement repeats until correction feels disruptive
  - trust that feedback will matter erodes with each unpunished offload
  restorationPaths:
  - pull one decision's cost back into the room where it was authorized
  - pair every visible win with who paid for it
manifestations:
  leadership:
  - a director parks trucks and takes the blunt partner note instead of blaming the
    supervisor
  organizations:
  - rework from a rushed release lands on field teams while the center keeps on-time
    numbers
  family:
  - a parent owns the awkward conversation when a child's plan creates cost for siblings
