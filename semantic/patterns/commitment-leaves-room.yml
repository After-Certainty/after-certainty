slug: commitment-leaves-room
title: Commitment Leaves Room
patternRole: supporting
organizingForce: time
realityDynamic: corrective
editorialStatus: provisional
observation: Commitment enables coordinated action while preserving room for revision when evidence,
  conditions, or consequences change.
problem: Systems must act before certainty arrives, but commitments become dangerous when correction
  threatens identity, legitimacy, sunk cost, or authority.
forces:
- Action cannot wait for certainty
- Closed commitment resists correction
counterbalances:
- Design commitments with review points, reversibility where possible, explicit assumptions, and
  safe paths for changing direction
