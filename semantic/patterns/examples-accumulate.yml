slug: examples-accumulate
title: Examples Accumulate
summary: A leader reacts to a mistake, competing pressures, or unclear ground in a
  shared setting. **Problem:** People need to know what counts as OK. Clear rules
  are missing or thin. **Forces:** - People watch others when things are unclear -
  What people see moves faster than written rules - Early reactions set what feels
  allowed - Silence and emphasis both send a signal **Observation:** What the leader
  does—especially under pressure—quickly sets what others treat as acceptable. > "Careful
  what we model in the room; examples accumulate faster than anything we post on the
  wiki."
