slug: examples-accumulate
title: Examples Accumulate
setup: A leader reacts to a mistake, competing pressures, or unclear ground in a shared
  setting.
problem: People need to know what counts as OK. Clear rules are missing or thin.
forces:
- People watch others when things are unclear
- What people see moves faster than written rules
- Early reactions set what feels allowed
- Silence and emphasis both send a signal
observation: What the leader does—especially under pressure—quickly sets what others
  treat as acceptable.
example: Careful what we model in the room; examples accumulate faster than anything
  we post on the wiki.
