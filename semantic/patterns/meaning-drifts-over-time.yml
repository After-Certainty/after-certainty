slug: meaning-drifts-over-time
title: Meaning Drifts Over Time
summary: People revisit events after additional conversations, outcomes, and memory
  updates. **Problem:** Interpretation is treated as fixed even though context keeps
  changing. **Forces:** - Memory gets rebuilt over time, not replayed exactly - Repetition
  favors convenient summaries - New context changes what earlier events seem to mean
  **Observation:** Interpretation slowly changes as memory, context, and repetition
  accumulate. > Meaning drifts over time and rarely stays where it first landed.
