slug: disagreement-is-suppressed
title: Disagreement is Suppressed
setup: A leader or leadership setup gains stability, success, or repeated proof that
  they are right.
problem: Guarding the leader can matter as much as getting the facts right.
forces:
- Success builds confidence. Challenge feels less needed.
- Speaking against the line costs more socially
- Loyalty is rewarded over pushback
- Stories about who we are harden around the leader
observation: Dissent fades or softens until it no longer challenges decisions.
example: I keep asking where the challenge is, and I'm not hearing it. Disagreement
  is suppressed—even when the risk is staring at us.
relatedConcepts:
- legitimacy
- stability
- decay
- distance
relatedPatterns:
- leadership-coalesces
- learning-collapses
relatedBooks:
