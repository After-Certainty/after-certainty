slug: meaning-gets-distorted
title: Meaning Gets Distorted
setup: A provisional interpretation is repeated without re-exposure to source context.
problem: Coherence is preserved at the expense of accuracy.
forces:
- Confirmation bias filters incoming data
- Social reinforcement rewards consistency
- Identity defense resists revision
observation: Interpretation can harden in ways that no longer track reality.
example: Meaning gets distorted when certainty outlives contact with what was actually
  said.
