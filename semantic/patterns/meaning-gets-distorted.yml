slug: meaning-gets-distorted
title: Meaning Gets Distorted
summary: A provisional interpretation is repeated without re-exposure to source context.
  **Problem:** Coherence is preserved at the expense of accuracy. **Forces:** - Confirmation
  bias filters incoming data - Social reinforcement rewards consistency - Identity
  defense resists revision **Observation:** Interpretation can harden in ways that
  no longer track reality. > Meaning gets distorted when certainty outlives contact
  with what was > actually said.
