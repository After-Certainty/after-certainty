slug: compression-loses-the-person
title: Compression Loses the Person
patternRole: supporting
organizingForce: perception
realityDynamic: obscuring
observation: When complexity is compressed into categories, metrics, roles, averages, summaries,
  or stories, the person or particular case can disappear from view.
problem: Human systems require simplification to coordinate at scale, but the details removed
  by compression may contain the morally or practically decisive fact.
forces:
- Scale requires compression
- Decisive particulars may be what compression removes
counterbalances:
- Preserve a path from the abstraction back to the particular people, cases, and consequences
  it represents
