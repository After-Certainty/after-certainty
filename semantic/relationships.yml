version: 1
relationships:
  - source: scale
    target: correction
    relationship: thins
    description: As scale increases, feedback loops weaken and correction becomes more expensive.
  - source: circulation
    target: authority
    relationship: reproduces
    description: Circulation allows authority structures to persist beyond individuals.
  - source: correction
    target: legitimacy
    relationship: renews
    description: Legitimacy remains durable when systems preserve visible correction.
  - source: acceleration
    target: judgment
    relationship: pressures
    description: Acceleration favors rapid coordination over reflective deliberation.
  - source: friction
    target: corrigibility
    relationship: preserves
    description: Corrective resistance helps systems remain revisable.
  - source: certainty
    target: coordination
    relationship: stabilizes
    description: Certainty reduces the cost of ongoing renegotiation.
  - source: uncertainty
    target: correction
    relationship: preserves
    description: Uncertainty keeps systems open to revision and learning.
  - source: alignment
    target: alignment-at-scale
    relationship: reproduces
    description: Belonging-signal alignment can harden into institutional reproduction at scale.
  - source: repair
    target: witness
    relationship: contrasts
    description: Repair aims to restore standing; witness preserves record when repair cannot yet change the scene.
  - source: correction
    target: repair
    relationship: contrasts
    description: Correction updates belief and behavior; repair addresses damaged trust and legitimacy.
  - source: correction
    target: revisability
    relationship: requires
    description: Correction depends on decisions remaining open to update after action begins.
  - source: constraint
    target: constraints
    relationship: contrasts
    description: Constraint names originating historical pressure; constraints names operational limits inside a system.
  - source: public-interpretation
    target: interpretive-collapse
    relationship: precedes
    description: Interpretive collapse is the loss of public interpretation as shared evaluative activity.
  - source: post-interpretive-authority
    target: total-authority
    relationship: intensifies
    description: Post-interpretive authority can intensify toward total elimination of public evaluative space.
  - source: cohesion
    target: coupling
    relationship: complements
    description: Cohesion clarifies ownership within boundaries; coupling tracks attachment between action and consequence.
  - source: proximity
    target: contact
    relationship: contrasts
    description: Proximity is ongoing relational nearness; contact is staying close to unfinished meaning in the moment.
  - source: drift
    target: normalization
    relationship: precedes
    description: Drift can settle into normalization when decoupling becomes expected baseline.
  # Scale dynamics
  - source: scale
    target: feedback
    relationship: thins
    description: Scale weakens feedback loops as distance and delay separate action from consequence.
  - source: scale
    target: accountability
    relationship: thins
    description: Scale diffuses answerability across roles and distance, making it harder to trace consequences to decision-makers.
  - source: scale
    target: coupling
    relationship: thins
    description: Scale lengthens the chain between decision and lived harm, weakening the attachment between action and consequence.
  - source: scale
    target: moral-density
    relationship: thins
    description: Scale abstracts coordination away from visible consequence and relational accountability.
  - source: abstraction
    target: accountability
    relationship: thins
    description: Abstraction obscures consequence, thinning contact between decision-makers and effects.
  # Structural dependencies
  - source: judgment
    target: revisability
    relationship: requires
    description: Judgment depends on decisions remaining open to update as conditions and understanding change.
  - source: accountability
    target: coupling
    relationship: requires
    description: Accountability cannot exist without coupling—without attachment between action and consequence, there is no exposure to answer for.
  - source: trust
    target: feedback
    relationship: requires
    description: Trust without feedback becomes closure—trust depends on signals that can be tested, strained, or withdrawn.
  - source: legitimacy
    target: contestability
    relationship: requires
    description: Legitimacy depends on being contestable enough to hold under stress—authority that cannot be questioned becomes coercion.
  # Disambiguation relationships
  - source: responsibility
    target: accountability
    relationship: contrasts
    description: Responsibility names the enduring obligation to account; accountability names whether consequence still reaches those who can respond.
  - source: responsibility
    target: answerability
    relationship: contrasts
    description: Responsibility is the broader obligation to account for consequences; answerability is the specific debt owed to those affected by partial-perspective decisions.
  - source: certainty
    target: judgment
    relationship: contrasts
    description: Certainty stabilizes coordination by compressing choice; judgment weighs tradeoffs under uncertainty without pretending to see from nowhere.
  # Preservation relationships
  - source: friction
    target: judgment
    relationship: preserves
    description: Friction preserves space for deliberation and discernment by slowing automatic action.
  # Enablement relationships
  - source: coupling
    target: correction
    relationship: enables
    description: Tight coupling between action and consequence enables correction by making feedback fast and traceable.
  - source: feedback
    target: correction
    relationship: enables
    description: Feedback enables correction by returning consequence as signal that can update future decisions.
  - source: coupling
    target: legitimacy
    relationship: renews
    description: Coupling renews legitimacy by keeping decision-makers exposed to consequences, preserving trust.
  # Stabilization relationships
  - source: circulation
    target: meaning
    relationship: stabilizes
    description: Circulation stabilizes meaning by allowing it to persist and reproduce through systems beyond individual presence.
  # Force dynamics from structural pressures
  - source: mediation
    target: interpretation
    relationship: distorts
    description: Mediation can distort interpretation as meaning travels through intermediaries rather than direct encounter.
  - source: asymmetry
    target: reciprocity
    relationship: weakens
    description: Asymmetry weakens reciprocity by creating uneven exposure to risk and consequence.
  - source: normalization
    target: adaptation
    relationship: hardens
    description: Normalization hardens adaptation into fixed expectation, making what was once temporary response into permanent baseline.
  # Capacity relationships
  - source: corrigibility
    target: correction
    relationship: enables
    description: Corrigibility provides the capacity for revision and recovery that makes correction possible over time.
  - source: certainty
    target: corrigibility
    relationship: constrains
    description: Tools built to preserve certainty can constrain corrigibility—when admitting error threatens authority's foundation, the capacity for correction thins.
