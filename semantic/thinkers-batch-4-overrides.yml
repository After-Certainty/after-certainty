# Editorial overrides for batch 4 (large) promotion into semantic/thinkers/.
# Used by tools/promote_thinker_drafts.py --overrides semantic/thinkers-batch-4-overrides.yml

thinkers:
  acemoglu-daron-and-james-a-robinson:
    summary: Economists of institutions, extractive versus inclusive political economy,
      and why nations fail or flourish.
    whyThisMatters: Acemoglu and Robinson tie legitimacy and trust to institutional
      design—when incentives become the moral language of power.
  alasdair-macintyre:
    summary: Moral philosopher of virtue ethics, tradition-constituted practice, and
      critique of emotivist modern morality.
    whyThisMatters: MacIntyre asks what moral seriousness means when shared standards
      fragment—virtue as craft within communities.
  albert-bandura:
    summary: Psychologist of social learning, self-efficacy, and how observation and
      modeling shape behavior.
    whyThisMatters: Bandura shows how norms spread through imitation—interpretation
      learned before it feels chosen.
  alex-rosenblat:
    summary: Researcher of platform labor, algorithmic management, and how gig work
      reshapes employer-employee trust.
    whyThisMatters: Rosenblat documents when interpretation is outsourced to opaque
      systems—workers judged by metrics they cannot see.
  allspaw-john-and-paul-hammond:
    summary: Engineering leaders who documented high-frequency deployment and DevOps
      cooperation at Flickr.
    whyThisMatters: Their deploy cadence essay is sediment for coupling—how technical
      practice enables continuous correction.
  andrew-abbott:
    summary: Sociologist of professions, jurisdictional boundaries, and how expert
      communities claim authority.
    whyThisMatters: Abbott explains turf wars over who gets to interpret problems—boundary
      work as institutional politics.
  andrew-haldane:
    summary: Economist and former central banker writing on financial stability, complexity,
      and systemic risk.
    whyThisMatters: Haldane bridges macro coupling and moral language in markets—when
      scale hides fragility until crisis.
  andrew-s-grove:
    summary: Intel executive and management writer on high-output management, metrics,
      and operational discipline.
    whyThisMatters: Grove models how seriousness scales through measurement—accountability
      with eyes on the work.
  andrews-matthew-lant-pritchett-and-michael-woolcock:
    summary: Development scholars of capability traps, problem-driven iteration, and
      institutional reform in weak states.
    whyThisMatters: Their work warns that imported solutions sediment failure—correction
      requires local problem framing.
  annette-c-baier:
    summary: Philosopher of trust, moral sentiment, and relational ethics beyond contract
      and suspicion.
    whyThisMatters: Baier grounds trust as judgment about reliability—not naive faith
      but warranted dependence.
  anthony-giddens:
    summary: Sociologist of structuration, modernity, and how agency and structure
      co-produce social life.
    whyThisMatters: Giddens helps read how institutions and individuals co-make the
      worlds they later call inevitable.
  argyris-chris-and-donald-a-schon:
    summary: Organizational theorists of double-loop learning and reflective practice
      in professional work.
    whyThisMatters: Argyris and Schön extend correction beneath single-loop fixes—when
      teams protect the assumptions that hurt them.
  arlie-russell-hochschild:
    summary: Sociologist of emotion labor, feeling rules, and how service work commercializes
      human expression.
    whyThisMatters: Hochschild shows moral performance as job requirement—when authenticity
      becomes managed interpretation.
  atul-gawande:
    summary: Surgeon-writer on checklists, systems improvement, and reducing harm
      through disciplined routine.
    whyThisMatters: Gawande makes correction mundane and lifesaving—serious systems
      learn through humble infrastructure.
  barbara-w-tuchman:
    summary: Historian of folly, misgovernment, and how capable leaders persist in
      policies against evidence.
    whyThisMatters: Tuchman narrates normalization before catastrophe—when moral seriousness
      loses to momentum.
  barke-helena-and-lutz-prechelt:
    summary: Software researchers studying developer experience, flow interruption,
      and productivity measurement limits.
    whyThisMatters: Their work questions metric theater in engineering—when measurement
      distorts the craft it claims to improve.
  baron-jonathan-and-john-c-hershey:
    summary: Behavioral decision researchers on heuristics, framing, and departures
      from expected utility.
    whyThisMatters: Baron and Hershey extend judgment-under-uncertainty themes—how
      frames steer moral and practical choice.
  barry-w-boehm:
    summary: Software economist of cost-of-change curves and risk-driven process tradeoffs
      in engineering.
    whyThisMatters: Boehm's spiral and cost models sediment why late correction is
      expensive—coupling in project time.
  bebchuk-lucian-a-and-scott-hirst:
    summary: Legal scholars of corporate governance, index funds, and concentrated
      shareholder power.
    whyThisMatters: Their work links scale and accountability—when ownership structures
      outrun fiduciary imagination.
  ben-kiernan:
    summary: Historian of genocide and mass violence, documenting how regimes mobilize
      ideology and bureaucracy.
    whyThisMatters: Kiernan supplies moral gravity for when authority sheds accountability
      at civilization scale.
  ben-s-bernanke:
    summary: Economist and former Federal Reserve chair; scholar of the Great Depression
      and financial crisis response.
    whyThisMatters: Bernanke anchors macro sediment—how institutions learn (or fail)
      when trust in money breaks.
  bender-emily-m-timnit-gebru-angelina-mcmillan-major-and-shmargaret-shmitchell:
    summary: AI ethics researchers documenting bias in large language models and harms
      of opaque training data.
    whyThisMatters: Their Stochastic Parrots paper names when interpretation at scale
      reproduces inequality and erases accountability.
  benedict-anderson:
    summary: Political scientist of imagined communities—how nations cohere through
      shared narrative and print culture.
    whyThisMatters: Anderson explains belonging at scale—trust among strangers held
      by stories more than contact.
  berle-adolf-a-jr-and-gardiner-c-means:
    summary: Economists who analyzed the separation of corporate ownership and control
      in modern capitalism.
    whyThisMatters: Berle and Means foreshadow accountability gaps—when authority
      runs firms owners cannot really steer.
  board-of-governors-of-the-federal-reserve-system:
    summary: U.S. central bank publishing monetary policy, financial stability research,
      and systemic risk assessments.
    whyThisMatters: Fed sources anchor how macro institutions frame inflation, labor,
      and moral language about the economy.
    type: organization
  bob-woodward:
    summary: Investigative journalist chronicling presidential decision-making, secrecy,
      and bureaucratic power.
    whyThisMatters: Woodward's narratives show interpretation shaped by access and
      fear—how truth moves inside institutions.
  bowker-geoffrey-c-and-susan-leigh-star:
    summary: Science studies scholars of classification, infrastructure, and how categories
      hide work and marginalize cases.
    whyThisMatters: Sorting Things Out is essential for boundary objects—when infrastructure
      decides what counts.
  brene-brown:
    summary: Researcher and writer on vulnerability, shame resilience, and courage
      in leadership and belonging.
    whyThisMatters: Brown popularizes emotional seriousness in organizations—when
      trust requires naming shame and uncertainty.
  brian-christian:
    summary: Writer on algorithms, human-computer interaction, and the alignment problem
      in machine decision systems.
    whyThisMatters: Christian connects AI coupling to human values—when automated
      interpretation needs explicit moral constraints.
  brooks-frederick-p-jr:
    summary: Software engineer of the mythical man-month, Brooks's Law, and essential
      complexity in large projects.
    whyThisMatters: Brooks names why adding people can slow correction—coordination
      sediment in serious systems delivery.
  brown-eliot-and-maureen-farrell:
    summary: Journalists documenting corporate scandal, incentive distortion, and
      executive accountability failures.
    whyThisMatters: Their reporting shows moral language weaponized—when incentives
      replace responsibility in public story.
  bruno-latour:
    summary: Sociologist of science, actor-networks, and how facts are assembled through
      alliances and instruments.
    whyThisMatters: Latour unsettles naive certainty—knowledge as something institutions
      build, not merely discover.
  c-w-anderson:
    summary: Media scholar of news production, epistemic authority, and how journalism
      constructs public reality.
    whyThisMatters: Anderson tracks who gets to stabilize meaning for strangers—public
      interpretation as organized labor.
  carl-schmitt:
    summary: Political theorist of sovereignty, the friend-enemy distinction, and
      states of exception.
    whyThisMatters: Schmitt is a sharp lens on emergency authority—when interpretation
      collapses to decision without law.
  carlo-rovelli:
    summary: Physicist and essayist on relational quantum theory, time, and the limits
      of naive objectivity.
    whyThisMatters: Rovelli reminds readers that even physics trades in perspective—humility
      before totalizing certainty.
  carlos-escude:
    summary: Historian of economic thought and Latin American political economy.
    whyThisMatters: Escudé offers comparative institutional sediment—how different
      polities learn (or avoid) correction.
  cathy-o-neil:
    summary: Data scientist and critic of Weapons of Math Destruction—opaque models
      that encode harm at scale.
    whyThisMatters: O'Neil warns when algorithms become moral arbiters without accountability
      or appeal.
  chantal-mouffe:
    summary: Political theorist of agonistic democracy and constitutive conflict in
      plural societies.
    whyThisMatters: Mouffe resists false consensus—legitimacy that admits adversary
      without dissolving into violence.
  charles-a-e-goodhart:
    summary: Economist known for Goodhart's Law—when a measure becomes a target, it
      ceases to be a good measure.
    whyThisMatters: Goodhart disciplines metric regimes—central to incentives-as-moral-language
      arguments.
  charles-taylor:
    summary: Philosopher of recognition, secular age, and how modern selves seek sources
      of moral orientation.
    whyThisMatters: Taylor maps meaning in motion—why identity and legitimacy need
      shared horizons strangers can inhabit.
  charles-tilly:
    summary: Historical sociologist of state formation, coercion, capital, and contentious
      politics.
    whyThisMatters: Tilly shows how trust and violence co-evolve—institutions built
      from war and extraction sediment.
  christian-albrekt-larsen:
    summary: Political scientist of trust in welfare states and Nordic institutional
      legitimacy.
    whyThisMatters: Larsen compares how societies sustain trust at scale—not similarity
      alone but credible institutions.
  christopher-alexander:
    summary: Architect and theorist of pattern languages, living structure, and humane
      scale in built environment.
    whyThisMatters: Alexander links craft pattern to organic order—sediment of good
      form that communities can recognize.
  christopher-boehm:
    summary: Anthropologist of egalitarian politics, moral communities, and evolution
      of social control.
    whyThisMatters: Boehm roots accountability in group sanction—how moral seriousness
      predates formal institutions.
  cialdini-robert-b-raymond-r-reno-and-carl-a-kallgren:
    summary: Social psychologists studying focus theory of normative conduct and situational
      influence on behavior.
    whyThisMatters: Cialdini's influence research explains compliance without conviction—when
      norms steer without reflection.
  claude-m-steele:
    summary: Psychologist of stereotype threat and how identity contingencies distort
      performance under scrutiny.
    whyThisMatters: Steele shows interpretation shaping ability—when belonging conditions
      who can correct and be heard.
  clifford-geertz:
    summary: Anthropologist of thick description, culture as webs of meaning, and
      interpretive social science.
    whyThisMatters: Geertz is foundational for meaning that moves—reading practices,
      not just extracting data.
  columbia-accident-investigation-board:
    summary: NASA investigative board that examined the Space Shuttle Columbia disaster
      and organizational causes of failure.
    whyThisMatters: The CAIB report extends Challenger lessons—foam strikes, silence,
      and normalization in serious systems.
    type: organization
  corrales-javier-and-michael-penfold:
    summary: Political scientists of Venezuelan authoritarianism, oil states, and
      democratic backsliding.
    whyThisMatters: Their work narrates when legitimacy becomes performance—institutions
      that cannot correct course.
  dani-rodrik:
    summary: Economist of globalization trilemma, industrial policy, and pragmatic
      institutional diversity.
    whyThisMatters: Rodrik resists one-size development certainty—local legitimacy
      matters for sustainable reform.
  david-edgerton:
    summary: Historian of technology-in-use, shock of the old, and how innovation
      narratives misread sedimented tools.
    whyThisMatters: Edgerton corrects novelty bias—serious systems often run on old
      infrastructure longer than stories admit.
  david-j-flook:
    summary: Scholar contributing to Latter-day Saint historical and community studies.
    whyThisMatters: Flook supports portfolio grounding in lived religious community—not
      abstract theology alone.
  david-p-chandler:
    summary: Historian of Cambodia, Cold War intervention, and bureaucratic radicalism
      under the Khmer Rouge.
    whyThisMatters: Chandler documents when moral language turns lethal—authority
      without accountability at state scale.
  david-s-landes:
    summary: Economic historian of culture, clocks, and the wealth and poverty of
      nations.
    whyThisMatters: Landes provokes debate on cultural sediment in development—without
      replacing institutional analysis.
  u-s-department-of-defense:
    summary: U.S. DoD standard defining software development lifecycle requirements
      for defense systems.
    whyThisMatters: DOD-STD-2167A is sediment of waterfall accountability—formal process
      as moral substitute in coupling.
    type: organization
  demarco-tom-and-timothy-lister:
    summary: Consultants and authors on software risk, estimation, and people problems
      in technology projects.
    whyThisMatters: DeMarco and Lister name fear-driven management—when uncertainty
      produces control theater not learning.
  demarco-tom-and-timothy-r-lister:
    summary: Authors on software team dynamics, flow, and the human sources of project
      risk.
    whyThisMatters: Their peopleware frame links collaboration difficulty to environment—not
      defective individuals.
  dennis-f-thompson:
    summary: Political theorist of democratic accountability, institutional ethics,
      and responsibility in public life.
    whyThisMatters: Thompson asks who owes what to whom when decisions scale beyond
      face-to-face judgment.
  dietrich-dorner:
    summary: Psychologist of complex simulation, Systems Thinking, and how people
      mismanage coupled systems.
    whyThisMatters: Dörner's Moro study shows catastrophic learning failures—when
      operators trust the wrong feedback.
  dikert-karina-maria-paasivaara-and-casper-lassenius:
    summary: Software engineering researchers on large-scale agile adoption and coordination
      across sites.
    whyThisMatters: Their work maps scaling collaboration—when agile sediment meets
      organizational coupling.
  donald-a-schon:
    summary: Organizational theorist of reflective practice, learning systems, and
      professional knowing-in-action.
    whyThisMatters: Schön pairs with Argyris in the portfolio—correction through surfacing
      tacit theory-in-use.
  donald-t-campbell:
    summary: Social scientist of evolutionary epistemology and Campbell's Law—corrupting
      influence of measured targets.
    whyThisMatters: Campbell warns institutions that reward metrics will get distortion—a
      core accountability theme.
  douglass-c-north:
    summary: Nobel economist of institutions, transaction costs, and path-dependent
      economic change.
    whyThisMatters: North explains why rules sediment—legitimacy and enforcement shape
      what correction is possible.
  e-h-carr:
    summary: Historian of Soviet Russia, international relations, and what counts
      as fact versus interpretation in history.
    whyThisMatters: Carr insists history is dialogue between past and present—no interpretation-free
      certainty.
  eagly-alice-h-and-linda-l-carli:
    summary: Psychologists of gender and leadership, labyrinth metaphors, and bias
      in authority evaluation.
    whyThisMatters: Their work shows how legitimacy is gendered—who gets heard when
      moral seriousness is required.
  eileen-barker:
    summary: Sociologist of new religious movements and how scholars study high-demand
      communities ethically.
    whyThisMatters: Barker offers method for taking belief seriously without naivety
      or caricature.
  eli-pariser:
    summary: Writer on filter bubbles, algorithmic curation, and fragmented public
      reality online.
    whyThisMatters: Pariser names echo infrastructure—when platforms shrink the contact
      that keeps reads open.
  eric-evans:
    summary: Software strategist who articulated domain-driven design and ubiquitous
      language for complex systems.
    whyThisMatters: Evans makes shared meaning a design responsibility—boundary and
      language before implementation sediment.
  eric-ries:
    summary: Entrepreneur and author of The Lean Startup—build-measure-learn loops
      under uncertainty.
    whyThisMatters: Ries popularizes iterative correction—though portfolio readers
      should watch for metric shortcuts.
  erik-hollnagel:
    summary: Safety scientist of resilience engineering, ETTO principle, and performance
      variability in complex systems.
    whyThisMatters: Hollnagel reframes failure as tradeoffs in coupled work—essential
      for serious systems learning.
  ernesto-laclau:
    summary: Political theorist of hegemony, empty signifiers, and populist articulation
      of collective identity.
    whyThisMatters: Laclau analyzes how meaning mobilizes masses—interpretation as
      political glue and fracture.
  eviatar-zerubavel:
    summary: Sociologist of cognitive sociology, time maps, and hidden calendars that
      organize collective attention.
    whyThisMatters: Zerubavel shows tacit patterns—what communities notice and what
      sediment into silence.
  ezra-klein:
    summary: Journalist and analyst of political polarization, media incentives, and
      institutional dysfunction.
    whyThisMatters: Klein connects polarization to structure—not bad faith alone but
      systems that reward closure.
  faden-ruth-r-and-tom-l-beauchamp:
    summary: Bioethicists of informed consent, trust, and moral foundations of research
      with human subjects.
    whyThisMatters: Their framework grounds when accountability to participants must
      precede institutional convenience.
  fahey-liam-and-robert-m-randall-eds:
    summary: Editors of ethnographic and historical studies relevant to Mormon and
      American religious experience.
    whyThisMatters: Edited volumes aggregate community voices—interpretation from
      inside rather than only outside gaze.
  federal-aviation-administration-and-nasa:
    summary: U.S. aviation regulators and NASA publishing safety reporting, human
      factors, and accident learning materials.
    whyThisMatters: FAA/NASA sources anchor just culture and reporting systems—correction
      without scapegoating in transport.
    type: organization
  felix-martin:
    summary: Economist and historian of money, sovereign debt, and the social technology
      of currency.
    whyThisMatters: Martin demystifies money as institution—trust sediment that can
      fail when legitimacy thins.
  festinger-leon-henry-w-riecken-and-stanley-schachter:
    summary: Social psychologists who studied cognitive dissonance in a doomsday cult
      when prophecy failed.
    whyThisMatters: When Prophecy Fails is a classic on doubling down—correction resisted
      through reinterpretation.
  fisher-roger-william-ury-and-bruce-patton:
    summary: Negotiation theorists of principled bargaining, interests versus positions,
      and Getting to Yes.
    whyThisMatters: Their method separates people from problem—trust repair as structured
      interpretation work.
  frank-dikotter:
    summary: Historian of Mao's China, mass campaigns, and bureaucratic terror in
      the People's Republic.
    whyThisMatters: Dikötter documents when moral language masks coercion—authority
      without accountable feedback.
  friedrich-a-hayek:
    summary: Economist and philosopher of dispersed knowledge, spontaneous order,
      and limits of central planning.
    whyThisMatters: Hayek argues markets aggregate local knowledge—skepticism toward
      certainty from the center.
  garud-raghu-and-peter-karn-e:
    summary: Management scholars of innovation journeys, path creation, and entrepreneurship
      in evolving markets.
    whyThisMatters: Their work tracks how meaning and resources co-evolve—sediment
      and pivot in institutional time.
  gary-klein:
    summary: Psychologist of naturalistic decision making, recognition-primed judgment,
      and expertise under pressure.
    whyThisMatters: Klein complements bias research—how experts read situations holistically
      when time forbids analysis.
  gene-kranz:
    summary: NASA flight director famed for Apollo 13 crisis leadership and failure-is-not-an-option
      operations culture.
    whyThisMatters: Kranz embodies guest leadership under coupling—accountability
      with room for improvisation.
  geoffrey-ingham:
    summary: Sociologist of money, credit, and the social relations underlying monetary
      systems.
    whyThisMatters: Ingham ties finance to trust institutions—not neutral technology
      but moral and political arrangement.
  georg-simmel:
    summary: Sociologist of social forms, trust, money, and the stranger in modern
      urban life.
    whyThisMatters: Simmel is classical sediment for trust among strangers and how
      scale changes obligation.
  george-d-chryssides:
    summary: Scholar of new religious movements and minority faith communities in
      modern societies.
    whyThisMatters: Chryssides supports fair description of religious groups—boundary
      between study and polemic.
  gert-tinggaard-svendsen:
    summary: Political economist of social capital, trust, and civic participation
      in democracies.
    whyThisMatters: Svendsen quantifies trust formation—bridging portfolio themes
      of association and institutional credibility.
  giorgio-agamben:
    summary: Philosopher of bare life, states of exception, and sovereign power over
      excluded populations.
    whyThisMatters: Agamben sharpens emergency politics—when law suspends and accountability
      thins.
  goldratt-eliyahu-m-and-jeff-cox:
    summary: Authors of The Goal—theory of constraints narrated through manufacturing
      operations management.
    whyThisMatters: Goldratt dramatizes bottlenecks and flow—systems learning through
      identifying what actually limits work.
  h-p-grice:
    summary: Philosopher of language whose cooperative maxims underpin pragmatic inference
      and conversational implicature.
    whyThisMatters: Grice formalizes how people mean more than they say—interpretation
      as shared cooperative project.
  hartmut-rosa:
    summary: Sociologist of social acceleration, resonance, and alienation in late-modern
      temporal experience.
    whyThisMatters: Rosa names speed as structural force—when institutions outrun
      the relationships trust requires.
  haspeslagh-philippe-c-and-david-b-jemison:
    summary: Strategy scholars of acquisitions, cultural integration, and post-merger
      organizational learning.
    whyThisMatters: Their work warns that coupling without cultural correction produces
      silent failure.
  henry-petroski:
    summary: Engineer-historian of design failure, success through error, and how
      artifacts teach by breaking.
    whyThisMatters: Petroski makes failure archival—serious systems learn from what
      broke, not from boastful success stories.
  hilary-putnam:
    summary: Philosopher of meaning, realism, and the collapse of fact-value dichotomies
      in pragmatic inquiry.
    whyThisMatters: Putnam resists sharp certainty divides—interpretation and world
      co-constrained, not sealed off.
  hood-christopher-and-ruth-dixon:
    summary: Public administration scholars of blame avoidance, reputation management,
      and government accountability theater.
    whyThisMatters: Hood explains defensive institutions—when accountability processes
      protect officials from correction.
  humble-jez-and-david-farley:
    summary: Engineering writers on continuous delivery, deployment pipelines, and
      reducing release risk.
    whyThisMatters: Humble extends DevOps sediment—technical habits that make correction
      routine rather than heroic.
  ian-hacking:
    summary: Philosopher of historical ontology, looping effects, and how classifications
      make up people.
    whyThisMatters: Hacking shows categories that react back—interpretation that changes
      the interpreted.
  ian-kershaw:
    summary: Historian of Nazi Germany, Hitler, and how ordinary institutions enabled
      radical evil.
    whyThisMatters: Kershaw documents sediment of compliance—when authority displaces
      moral judgment incrementally.
  institute-of-medicine:
    summary: U.S. National Academies body publishing landmark reports on patient safety
      and quality of care.
    whyThisMatters: IOM To Err Is Human galvanized healthcare safety—institutional
      admission that harm is systemic.
    type: organization
  international-organization-for-standardization:
    summary: Global standards body (ISO) publishing international norms for quality,
      safety, and interoperability.
    whyThisMatters: ISO standards sediment global coupling—when shared rules substitute
      for local trust negotiation.
    type: organization
  iris-murdoch:
    summary: Novelist-philosopher of moral attention, unselfing, and critique of fantasy
      in ethical life.
    whyThisMatters: Murdoch ties virtue to perception—seeing others clearly as moral
      work, not rule following alone.
  isaiah-berlin:
    summary: Political philosopher of value pluralism, liberty, and dangers of monist
      certainty in politics.
    whyThisMatters: Berlin warns against forcing one moral scheme—legitimacy in a
      world of incompatible goods.
  ivan-illich:
    summary: Social critic of professional monopoly, medicalization, and institutions
      that disable communal competence.
    whyThisMatters: Illich questions when help becomes dependency—scale that strips
      local capacity for judgment.
  jurgen-habermas:
    summary: Philosopher of communicative action, public sphere, and legitimacy through
      discursive justification.
    whyThisMatters: Habermas asks what counts as reasons strangers can accept—interpretation
      seeking warrant, not force.
  jacques-ellul:
    summary: Theologian and critic of technique—autonomous efficiency logic colonizing
      moral and political life.
    whyThisMatters: Ellul warns when means become ends—moral seriousness swallowed
      by procedural optimization.
  james-g-march:
    summary: Organizational theorist of bounded rationality, garbage cans, and ambiguity
      in institutional choice.
    whyThisMatters: March (solo) complements promoted co-authored work—uncertainty
      as normal operating condition.
  jan-shipps:
    summary: Historian of Mormonism as new religious tradition emerging in American
      society.
    whyThisMatters: Shipps frames LDS experience as genuine religious history—not
      mere sectarian curiosity.
  jane-gleeson-white:
    summary: Writer on accounting history, double-entry bookkeeping, and how numbers
      organize economic trust.
    whyThisMatters: Gleeson-White links sediment of ledgers to modern accountability
      imagination.
  jane-jacobs:
    summary: Urbanist of sidewalk life, informal order, and why healthy cities depend
      on eyes on the street.
    whyThisMatters: Jacobs champions local knowledge over planner certainty—trust
      from contact and mixed use.
  jensen-michael-c-and-william-h-meckling:
    summary: Economists of agency theory, shareholder primacy, and corporate governance
      as contracting problem.
    whyThisMatters: Jensen and Meckling sediment incentives discourse—when moral language
      becomes alignment math.
  jerry-b-harvey:
    summary: Management scholar who named the Abilene paradox—groups undertaking unwanted
      actions to avoid conflict.
    whyThisMatters: Harvey explains false consensus—everyone agrees publicly while
      dissent dies in silence.
  jerry-l-mashaw:
    summary: Legal scholar of bureaucratic justice, administrative law, and accountability
      in the regulatory state.
    whyThisMatters: Mashaw grounds how agencies can be fair—procedure as moral substance,
      not obstacle.
  jim-collins:
    summary: Management author studying enduring companies, Level 5 leadership, and
      disciplined culture.
    whyThisMatters: Collins popularizes institutional humility and focus—though readers
      should watch survivor bias.
  joan-c-tronto:
    summary: Political ethicist of care, democratic caregiving, and moral boundaries
      of responsibility.
    whyThisMatters: Tronto widens accountability beyond contract—care as political
      and interpretive practice.
  john-bowlby:
    summary: Psychiatrist of attachment theory—how early bonds shape trust, exploration,
      and emotional security.
    whyThisMatters: Bowlby roots trust formation in relational history—not abstract
      optimism about strangers.
  john-c-bogle:
    summary: Founder of Vanguard and advocate of index investing, fiduciary duty,
      and low-cost financial institutions.
    whyThisMatters: Bogle challenged finance industry incentives—when fees sediment
      against investor trust.
  john-m-gottman:
    summary: Psychologist of marital stability, interaction patterns, and predicting
      relationship repair or collapse.
    whyThisMatters: Gottman quantifies micro-correction—how small bids for connection
      sediment into trust or contempt.
  john-p-a-ioannidis:
    summary: Physician-scientist famous for Why Most Published Research Findings Are
      False—meta-research and replication crisis.
