whyThisMatters: >-
  Walzer’s Just and Unjust Wars develops proportionality and related just-war
  constraints as moral limits on harm in conflict, illustrated historically.
  After Certainty adapts the proportionality idea to speech under incomplete
  control: say what can honestly be said, leave room for revision, and treat
  silence sometimes as restraint measured by effects rather than as withdrawal
  from responsibility.
