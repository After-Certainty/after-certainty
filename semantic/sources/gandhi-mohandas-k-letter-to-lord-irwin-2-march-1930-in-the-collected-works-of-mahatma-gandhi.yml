whyThisMatters: >-
  Gandhi’s 2 March 1930 letter to Lord Irwin lists injuries of British rule and
  announces civil disobedience beginning with the salt law, calling the tax
  especially unjust for the poor. When Others Become Leaders treats that choice
  as strategic compression: an act ordinary enough to be understood and
  consequential enough to reveal the structure around it. The letter is the
  primary declaration; the book asks how leadership circulates when a struggle
  claiming to serve the poorest chooses where to begin.
