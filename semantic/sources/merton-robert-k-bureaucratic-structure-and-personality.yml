whyThisMatters: >-
  Robert Merton’s 1940 essay on bureaucratic structure and personality describes
  goal displacement and ritualism: officials trained for rule-following can come
  to treat procedure as the end rather than the means. Coupling cites that
  ritualism when process metrics improve while outcomes worsen—documentation,
  audits, and training substituting for learning. Merton analyzes bureaucratic
  personality and displacement; the book asks how institutions under drift
  measure compliance as if it were repair.
