whyThisMatters: >-
  MacFarquhar and Schoenhals’s Mao’s Last Revolution recounts the Cultural
  Revolution’s later demobilization, institutional rebuilding, and the political
  aftermath around Mao’s final years, including the turn that renamed the
  decade’s extremes as chaos to be escaped. When Interpretation No Longer
  Matters cites that ending to mark that fevered criticism was not permanent
  settlement—aftermath itself still requires ethical scrutiny. The source is a
  political history of the Revolution’s close; the book asks what “criticism”
  was doing when it could not correct.
