whyThisMatters: >-
  Hersh’s Politics Is for Power criticizes “political hobbyism” and argues that
  real power requires organized, local, relational work rather than consuming
  news and metrics as a spectator sport. When Incentives Become the Moral
  Language cites campaign and civic metrics—fundraising, turnout models, contact
  rates, ad performance—as numbers that can stand in for argued representation.
  Hersh diagnoses how people engage politics; the book asks when measurable
  momentum displaces the question of what representation requires.
