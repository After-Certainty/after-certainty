whyThisMatters: >-
  Desai and Vahed argue that Gandhi’s South African years were a partial
  awakening: loyalty to empire, efforts to elevate Indians by distinguishing
  them from Black Africans, and political language shaped by racial hierarchies
  he later opposed more broadly—while earlier narratives often centered him and
  minimized indentured and working-class Indian agency. When Others Become
  Leaders treats that record as a general leadership pattern: someone can
  recognize injustice when it reaches them and still fail to see its larger
  architecture. The book’s claim is operational, not biographical: partial
  recognition of harm is common, not uniquely Gandhian.
