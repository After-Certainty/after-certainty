whyThisMatters: >-
  SAMHSA’s 2014 Concept of Trauma and Guidance for a Trauma-Informed Approach
  defines trauma and outlines principles for trauma-informed practice in
  behavioral health and related systems. When Authority Outlives Accountability
  cites that framework for human-scale leadership: harm still occurs, but the
  moral work is how damage is held so it does not spread unchecked or become
  identity-forming. SAMHSA establishes a clinical and organizational guidance
  document; the book asks how leadership at intimate scale makes harm clearer
  even when it cannot eliminate it.
