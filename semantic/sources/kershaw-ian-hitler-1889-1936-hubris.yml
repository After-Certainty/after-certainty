whyThisMatters: >-
  Kershaw’s Hitler: 1889–1936 Hubris traces Hitler’s rise through the early Nazi
  regime—appointment as chancellor in 1933, rapid dismantling of opposition
  parties and independent media, and spectacle that filled streets and radio
  with belonging under threat. When Interpretation No Longer Matters cites that
  intensification of communication alongside destruction of the evaluative
  public sphere as a contrast case for how belonging can drown correction.
  Kershaw writes political biography and regime history; the book asks what
  happens when applause and ritual greetings replace contested interpretation.
