whyThisMatters: >-
  Eric S. Raymond's The Cathedral and the Bazaar describes open-source
  collaboration as a bazaar of distributed review, release norms, and many eyes
  on shared code. Trust Beyond Similarity presses what open participation alone
  does not supply: without trust structures that distinguish a rejected change
  from a rejected person, disagreement becomes noise rather than usable
  information.
