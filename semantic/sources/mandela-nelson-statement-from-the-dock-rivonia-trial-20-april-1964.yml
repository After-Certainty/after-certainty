whyThisMatters: >-
  Mandela’s April 1964 Rivonia Trial dock statement defends the ANC’s turn,
  after banned peaceful avenues and state violence, toward Umkhonto we Sizwe
  sabotage framed as resistance short of terrorism and racial war. When Others
  Become Leaders insists that reconciliation later was a political and moral
  choice by someone who had already authorized armed struggle—not the natural
  temperament of a saint. The source is Mandela’s own courtroom account; the
  book asks what leadership stories erase when only the smile remains.
