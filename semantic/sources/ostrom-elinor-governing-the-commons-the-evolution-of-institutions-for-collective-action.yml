whyThisMatters: >-
  Ostrom's Governing the Commons documents communities that sustain shared
  resources through local rules, monitoring, and graduated sanctions—showing
  collective action is possible without assuming only state control or private
  ownership. How Trust Forms takes that pattern for ordinary coordination: trust
  lowers the cost of constant verification while enough structure keeps
  participation connected to shared limits.
