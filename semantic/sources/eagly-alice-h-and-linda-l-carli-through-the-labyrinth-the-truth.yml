whyThisMatters: >-
  Eagly and Carli document how women become leaders under gendered
  constraints—different expectations for warmth, agency, and emotional display
  that raise the cost of looking decisive or restrained. When Authority Is
  Misread applies that research to Merkel-era reception: certainty from male
  leaders can read as seriousness, while similar caution or emotional neutrality
  from a woman more readily reads as absence or indecision. The book’s claim is
  about misread authority under gendered framing, not that gender alone caused
  Eurozone policy outcomes.
