whyThisMatters: >-
  The Nobel Peace Prize 2004 citation for Wangari Maathai recognizes the Green
  Belt Movement's tree-planting and environmental work linking ecological repair
  to community livelihood and participation. When Others Become Leaders takes
  that disarmingly small practice—plant trees—as leadership that alters the
  position from which people face poverty without claiming to repair every cause
  at once.
