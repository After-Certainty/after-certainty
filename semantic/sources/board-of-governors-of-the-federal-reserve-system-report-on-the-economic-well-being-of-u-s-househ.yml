whyThisMatters: >-
  The Federal Reserve's SHED reports survey how U.S. households experience
  employment, prices, borrowing, and material pressure beneath aggregate
  indicators. The Economy We Don't Experience uses that household-level evidence
  for the chart-and-receipt problem: national measures can improve while rent,
  overtime, and credit costs still close off choices—without anyone lying.
