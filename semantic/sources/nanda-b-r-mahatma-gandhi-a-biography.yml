whyThisMatters: >-
  B. R. Nanda’s Mahatma Gandhi: A Biography supplies chronology for the 1930
  Salt March—Gandhi’s departure from Sabarmati with selected companions, the
  long walk to Dandi, and the campaign’s public discipline around salt and
  nonviolence. When Others Become Leaders uses that march to show politics made
  visible through bodies occupying distance together. Nanda’s biography anchors
  the sequence; the book asks how influence begins when resistance refuses to
  organize on the same logic as the power it opposes.
