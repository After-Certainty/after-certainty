whyThisMatters: >-
  Harvey’s Abilene Paradox describes groups that collectively choose a course
  few or none prefer because each member misreads others’ willingness as
  commitment and no one wants to break the apparent consensus. Trust Beyond
  Similarity uses that pattern where groups are rewarded for staying aligned:
  agreement comfort travels until disagreement finally appears on the
  whiteboard. Harvey names mismanaged agreement; the book asks what trust must
  do before difference can correct rather than merely unsettle.
