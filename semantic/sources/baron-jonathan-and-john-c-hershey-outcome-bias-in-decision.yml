whyThisMatters: >-
  Baron and Hershey show that people judge decisions by outcomes even when those
  outcomes were not foreseeable. When Authority Outlives Accountability asks
  what that bias does to leadership evaluation: visible harm looks like failure,
  while delayed or diluted harm looks like inevitability.
