whyThisMatters: >-
  Brown's biography situates Gandhi's late-1920s and early-1930s
  civil-disobedience period, including the strategic opening of the salt
  campaign. When Others Become Leaders reads that opening as distributed
  leadership: empire's monopoly made a bodily contradiction legible enough for
  many hands to bend after Gandhi's.
