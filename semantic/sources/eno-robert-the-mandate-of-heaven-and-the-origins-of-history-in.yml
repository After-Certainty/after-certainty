whyThisMatters: >-
  Eno’s study of the Mandate of Heaven examines how early Chinese political
  thought grounded dynastic legitimacy in cosmic moral order—and thereby also
  supplied a language for replacing rulers who failed through cruelty or
  neglect. Before Certainty Arrives reads that double function as coordination
  technology: sacred legitimacy could condemn as well as bless, protecting
  authority while making moral failure a public reason for overthrow. The book’s
  extension is about how certainty acquires emotional armor when revision starts
  to feel like collapse, not a claim that Zhou ideology is modern
  constitutionalism.
