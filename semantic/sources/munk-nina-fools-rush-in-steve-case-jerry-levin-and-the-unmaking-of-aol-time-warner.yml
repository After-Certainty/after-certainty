whyThisMatters: >-
  Nina Munk’s Fools Rush In narrates the AOL–Time Warner merger as a celebrated
  union of “new” and “old” media that unraveled amid clashing cultures,
  incentives, time horizons, and definitions of value. Trust Beyond Similarity
  cites that failure when difference is marketed as synergy but never becomes a
  mutually trusted source of correction. Munk’s reporting establishes the
  merger’s unmaking; the book asks what diversity without trust actually
  produces under one roof.
