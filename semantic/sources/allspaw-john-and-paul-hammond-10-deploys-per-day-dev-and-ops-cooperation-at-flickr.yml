whyThisMatters: >-
  Allspaw and Hammond’s Velocity 2009 talk documents Flickr’s high-frequency
  deploy practice and Dev–Ops cooperation as a concrete response to handoff
  distance between build and run. Coupling treats that practice as evidence that
  DevOps emerged to shorten the path from change to operational consequence.
  The source supplies the emergence case; the book asks what structural coupling
  that proximity restores.
