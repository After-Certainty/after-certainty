whyThisMatters: >-
  Sidereus Nuncius announces telescopic findings—uneven lunar surface, resolved
  Milky Way, Jupiter’s companions—as public observational fact before institutions
  were prepared to treat them as such. When Authority Is Misread uses those moons
  as evidence that changed what “seeing” could force into the open. Galileo
  reports instruments rewriting the sky; the book asks what happens when new
  visibility arrives before legitimacy frameworks can absorb it.
