whyThisMatters: >-
  Wiedeman’s The Cult of We reports how investor and employee confidence in
  WeWork expanded rapidly in the growth phase, making later scrutiny hard to
  separate from trust in mission and leadership. When Trust Stops Tracking
  Reality uses that case for legitimacy that accumulates faster than it
  dissolves: past success becomes the answer to present questions until
  evaluation of current performance is displaced.
