whyThisMatters: >-
  Robert E. Cole analyzes how Toyota’s decades-built reputation for reliability
  later collided with quality crises that tested whether that reputation still
  tracked present performance. When Trust Stops Tracking Reality uses the case
  to show trust traveling through reputation rather than continuous direct
  evidence—customers began with confidence because prior vehicles had taught
  expectation. Cole’s account of accumulated credibility is the source claim;
  the book asks what happens when that inherited confidence outruns current
  reality.
