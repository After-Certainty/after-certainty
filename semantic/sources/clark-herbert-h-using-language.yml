whyThisMatters: >-
  Herbert H. Clark argues that language use is joint action: speakers and
  listeners coordinate on common ground rather than treating utterances as
  self-contained packets of meaning. How Meaning Moves extends that account into
  an operational problem—ordinary talk requires compression and inference, so
  incomplete messages quickly become competing stories about what was meant. The
  book separates Clark’s pragmatics of grounding from its claim that those
  shortcuts are what make action possible and misunderstanding routine.
