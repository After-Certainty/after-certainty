whyThisMatters: >-
  Pollitt and Bouckaert's comparative analysis of public management reform
  examines performance regimes, KPI oversight, and the limits of implementation
  across jurisdictions. Coupling extends that pattern beyond software:
  measurement can improve visibility while frontline agencies remain unable to
  redesign the structures producing poor outcomes—reporting as governance
  theater when learning stays weak.
