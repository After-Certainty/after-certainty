whyThisMatters: >-
  In his 2015 Heart of Agile essay, Alistair Cockburn reframes elaborate agile procedures around the collaboration, delivery, reflection, and improvement activities needed to make learning visible. Coupling cites that account where it introduces Heart of Agile as a deliberate simplification after proliferating frameworks and ceremonies. The essay motivates the four-word method; the manuscript's argument about structural feedback and responsibility is its own.
