whyThisMatters: >-
  Jones’s The March on Washington recovers the coalition and labor roots of the
  1963 March for Jobs and Freedom—Randolph’s earlier threatened march,
  negotiations among civil rights organizations, unions, and religious groups,
  and Bayard Rustin’s coordinating work behind the memorable speech. When Others
  Become Leaders uses that archive against memory that collapses a crowd into a
  single voice on the Lincoln Memorial steps. Jones restores forgotten
  organizers; the book asks how leadership circulates through kitchens,
  basements, and logistics that history rarely replays.
