whyThisMatters: >-
  Forsgren, Humble, and Kim’s Accelerate (and the DORA research behind it)
  measures whether delivery-practice changes actually improve reliability,
  recovery, deployment quality, and feedback speed. Coupling uses that evidence
  as a bridge from lighter process to harder proof: systems can feel cleaner
  without learning faster from reality. The source supplies outcome metrics; the
  book asks whether simplification kept responsibility clear and consequence
  visible.
