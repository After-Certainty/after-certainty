whyThisMatters: >-
  Greenberg’s organizational-justice research distinguishes fair process from
  fair outcomes in how people evaluate authority. When Incentives Become the
  Moral Language asks when process language helps people understand a
  decision—and when it replaces the account of who actually decided, where, and
  why.
