  Zuckerberg’s April 10–11, 2018 Senate Judiciary and Commerce testimony
  answered congressional questions about Facebook after Cambridge Analytica and
  related controversies. When Incentives Become the Moral Language reads early
  platform “connection” promises as moral claims as much as product
  descriptions—assumptions that wider encounter is generally good—without
  treating the hearing as proof those assumptions held.
