whyThisMatters: >-
  James C. Scott’s Seeing Like a State argues that high-modernist schemes fail
  when state simplification for legibility overrides local practical knowledge,
  producing rigid institutions. Coupling uses that over-standardization risk for
  “frozen redesign”: many actors hold partial veto while few hold enough
  authority to redesign coherently, so discussion of change outruns the capacity
  to perform it. Scott diagnoses legibility and simplification failures; the
  book asks when too much coupling at the wrong layer blocks learning as badly
  as too little.
