whyThisMatters: >-
  James Reason's Managing the Risks of Organizational Accidents analyzes how
  aviation and other high-hazard systems treat incidents and near misses as
  sources of learning rather than threats to institutional trust. When Trust
  Stops Tracking Reality cites that investigative stance as the opposite of
  denial: trust that remains revisable when anomalies appear, not trust that
  must be protected from them.
