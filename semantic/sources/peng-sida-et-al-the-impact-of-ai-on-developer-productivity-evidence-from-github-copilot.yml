whyThisMatters: >-
  Peng and coauthors report task-level productivity gains from GitHub Copilot in
  controlled settings, measuring authoring speed under AI assistance. Coupling
  accepts those empirical gains, then asks where they land in the wider
  system—review load, incidents, and ownership design—when authoring accelerates
  faster than the feedback loops that keep throughput from becoming deferred
  cost.
