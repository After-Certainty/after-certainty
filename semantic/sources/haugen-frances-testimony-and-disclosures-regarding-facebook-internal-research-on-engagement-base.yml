whyThisMatters: >-
  Haugen’s October 5, 2021 Senate testimony and disclosures concerned Facebook
  internal research on engagement-based ranking and the tradeoffs between
  behavioral metrics and contested judgments about harm. When Incentives Become
  the Moral Language cites that record for how institutions gravitate toward
  graphs that look descriptive when editorial judgment about desirable public
  life is harder to defend. Haugen reports internal research and ranking
  pressures; the book asks when countable engagement becomes the moral
  vocabulary of the feed.
