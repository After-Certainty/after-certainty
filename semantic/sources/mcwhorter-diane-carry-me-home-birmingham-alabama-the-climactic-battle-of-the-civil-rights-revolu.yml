whyThisMatters: >-
  Diane McWhorter’s Carry Me Home documents Birmingham’s civil-rights
  confrontation and the Children’s Crusade, including how young marchers faced
  dogs and fire hoses and how those images traveled nationally. When Others
  Become Leaders cites that record while asking a sharper leadership question:
  what it means to invite others—especially children—into risk whose political
  force depends partly on what happens to their bodies. McWhorter establishes
  the campaign’s chronology and visibility; the book’s inference concerns the
  moral posture of asking others to carry that exposure.
