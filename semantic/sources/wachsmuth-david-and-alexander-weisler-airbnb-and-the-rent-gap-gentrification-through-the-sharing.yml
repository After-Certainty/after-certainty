whyThisMatters: >-
  Wachsmuth and Weisler analyze how short-term rentals can open rent gaps and
  reallocate housing stock, producing competing neighborhood interpretations of
  the same dwelling. Trust Beyond Similarity extends that conflict of
  objects—home, asset, guest experience, disruption, regulatory category—without
  claiming the paper settles which reading is morally primary.
