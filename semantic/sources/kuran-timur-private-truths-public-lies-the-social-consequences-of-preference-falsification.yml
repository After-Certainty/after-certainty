whyThisMatters: >-
  Kuran’s Private Truths, Public Lies theorizes preference falsification: the
  gap between what people privately hold and what they publicly display, and how
  falsified displays become social facts that keep others falsifying. When
  Interpretation No Longer Matters reads Soviet meeting pressure through that
  mechanism without needing the term on the floor—extreme costs for disagreement
  sustain a public surface that no longer reports private judgment. The source
  models cascading falsification; the book asks what applause means when honesty
  has been priced out of speech.
