whyThisMatters: >-
  Zuboff’s The Age of Surveillance Capitalism argues that platform firms extract
  behavioral surplus for prediction products and reshape power beyond ordinary
  market exchange. Living in Sediment places continuous platform relationships
  beside subscription as the default rhythm of possession—asking how successful
  structures change more than the problem they first solved, including what
  “owning” software and media comes to mean.
