whyThisMatters: >-
  In The Fearless Organization, Edmondson argues that organizations learn when
  people can raise problems, uncertainty, and bad news without prohibitive
  interpersonal cost. How Serious Systems Learn uses that account for correction
  lag under asymmetric power: those closest to operational risk often see
  fragility first but pay the highest price for saying stop. The book’s
  inference is that systems often misread silence as agreement when what they
  are observing is cost-avoidance.
