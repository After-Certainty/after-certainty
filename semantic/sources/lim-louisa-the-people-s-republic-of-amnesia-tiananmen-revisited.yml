whyThisMatters: >-
  Lim's account traces how official censorship and subsequent public memory
  reshaped the understanding of June 1989. When Authority Is Misread uses that
  later-memory history to question how political success stories can make
  suppressed events harder to discuss. The book's moral judgment about that
  compression remains its own, not Lim's alone.
