whyThisMatters: >-
  Peter M. Senge’s The Fifth Discipline popularizes systems thinking and
  disciplines of the learning organization—shared vision, mental models, team
  learning, personal mastery, and seeing wholes. How Serious Systems Learn
  recalls the smaller, slower world where mistakes were visible, feedback
  arrived quickly, and undoing remained possible, then asks what happens when
  consequential decisions leave that world. Senge argues for organizational
  learning practices; the book asks why competence that once included knowing
  when to stop fails under longer latency and larger commitment.
