whyThisMatters: >-
  Douglas and colleagues show that conspiracy communities gradually learn to
  prioritize different evidence, authorities, and patterns of attention over
  time. When Trust Stops Tracking Reality treats that finding as a trust
  dynamic: people reviewing similar events can diverge long before they reach
  stable conclusions because trust selects which signals feel available. The
  book separates the researchers’ account of conspiracy sensemaking from its
  claim that misplaced trust can reorganize what counts as notice-worthy.
