whyThisMatters: >-
  Escudé analyzes enduring frames in Argentine political culture—national
  dignity, legitimacy narratives, and conflict patterns that persist across
  institutional changes. When Interpretation No Longer Matters cites that work
  for the durability of belonging-forms around Perón-era labor recognition and
  movement memory, not as a claim that culture alone produced Perón. The book
  asks how a name and a felt arrival inside the state can survive platform
  changes when people can narrate concrete calendar gains to their children.
