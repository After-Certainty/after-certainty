whyThisMatters: >-
  The National Park Service’s March on Washington article (with related King
  Institute identification) names A. Philip Randolph as march director and
  Bayard Rustin as principal organizer, stressing decades of planning,
  transportation, marshals, sound, schedules, and rivalries behind the day. The
  World We Make Together uses that organizational depth against the camera’s
  preference for King at the microphone. The source establishes directing and
  organizing roles; the book asks how photographs hold tension between visible
  speech and invisible infrastructure.
