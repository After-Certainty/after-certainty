whyThisMatters: >-
  Janis’s Groupthink studies policy fiascoes in which cohesive groups suppress
  dissent, producing consensus that feels unanimous while critical information
  stays unvoiced. Learning to See cites that dynamic for meetings where silence
  becomes a misleading signal of agreement and later dissent grows more
  expensive. Janis analyzes group decision pathology; the book asks how
  collective certainty accumulates through reasonable individual choices not to
  reopen the room.
