whyThisMatters: >-
  The National Academy of Medicine’s Taking Action Against Clinician Burnout
  frames burnout as a systems problem—workload, documentation, and
  organizational design—not only individual resilience failure. When Incentives
  Become the Moral Language cites that systems view when clinicians carry the
  gap between what a chart can defend and what readiness seems to require. The
  report establishes burnout’s institutional drivers; the book asks what stays
  with the nurse after the dashboard has already closed the case.
