whyThisMatters: >-
  ACEP’s boarding policy statement defines emergency-department boarding and
  frames capacity pressure as a clinical and operational problem. When Incentives
  Become the Moral Language cites that capacity fact where hospitals must make
  decisions travel across rooms and shifts. The source establishes boarding
  pressure; the book’s translation/moral-language thesis is an After Certainty
  inference, not ACEP’s claim.
