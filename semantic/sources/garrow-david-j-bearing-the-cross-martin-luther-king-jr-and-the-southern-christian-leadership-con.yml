whyThisMatters: >-
  Garrow’s Bearing the Cross details early King leadership in Montgomery,
  including how the Montgomery Improvement Association chose a young pastor not
  already entangled in local rivalries to hold together work others had begun.
  When Others Become Leaders uses that account to separate founding from
  holding: importance can mean sustaining a plan already in motion rather than
  originating it. Garrow supplies the movement history; the book asks what kind
  of leadership we should look for when a gifted speaker makes a movement sound
  newly discovered.
