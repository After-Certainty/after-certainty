whyThisMatters: >-
  Jervis’s Perception and Misperception in International Politics analyzes how
  decision-makers misread intentions, signals, and structural pressures in
  international politics. When Moral Seriousness Scales cites that work for the
  danger of treating pressure as destiny—once acceleration feels unavoidable,
  advantage masquerades as inevitability. Jervis studies perceptual error under
  strategic uncertainty; the book argues moral seriousness must operate
  deliberately when reciprocity and norms no longer stabilize restraint
  automatically.
