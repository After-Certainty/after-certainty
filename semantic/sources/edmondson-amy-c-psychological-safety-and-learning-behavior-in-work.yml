whyThisMatters: >-
  Edmondson’s research links psychological safety to learning behavior in work
  teams: people speak up about errors and concerns when the interpersonal
  climate makes that risk tenable. When Others Look to You extends the finding
  from team climate to leadership signal—what leaders dismiss, absorb, or leave
  unaddressed teaches others what is tolerated. The book’s operational claim is
  that silence and non-intervention travel as instruction, especially as
  settings scale beyond immediate face-to-face correction.
