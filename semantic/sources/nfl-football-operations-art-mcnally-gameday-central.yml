whyThisMatters: >-
  NFL Football Operations' Art McNally GameDay Central materials state that
  overturning a ruling on the field requires clear and obvious video evidence,
  with review also settling placement, possession, down, distance, and clocks.
  The Game We Think We Saw reads that deference standard as institutional
  design: review corrects a defined class of error so the contest can continue,
  rather than reconstructing every play indefinitely.
