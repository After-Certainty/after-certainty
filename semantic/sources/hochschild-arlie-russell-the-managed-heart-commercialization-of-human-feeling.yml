whyThisMatters: >-
  Hochschild’s The Managed Heart analyzes emotional labor—how service work
  commercializes feeling and makes managed affect part of the job. Why
  Collaboration Is So Hard extends that insight to the person who keeps the
  spreadsheet: remembering and care mix until reliability becomes a resource
  others consume without seeing. Hochschild studies commercialized feeling; the
  book asks what withdrawal means after someone’s unnoticed care work has held
  the group together.
