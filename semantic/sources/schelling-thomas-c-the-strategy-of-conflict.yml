whyThisMatters: >-
  Thomas C. Schelling’s The Strategy of Conflict analyzes bargaining,
  commitments, and understanding an adversary’s constraints and interests
  without accepting their claims. Trust Beyond Similarity extends that
  discipline to mediation and everyday conflict: fears, red lines, and domestic
  pressures beneath positions can be understood without surrendering one’s
  conclusion. Schelling theorizes strategic conflict; the book asks how trust
  across difference requires understanding without agreement.
