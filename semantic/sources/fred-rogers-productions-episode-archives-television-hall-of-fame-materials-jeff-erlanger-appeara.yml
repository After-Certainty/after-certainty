whyThisMatters: >-
  Fred Rogers Productions’ episode archives and Hall of Fame materials document
  Jeff Erlanger’s appearances on Mister Rogers’ Neighborhood, including the 1981
  visit of a child in an electric wheelchair. When Others Become Leaders uses
  that record to refuse a sanitized Rogers: belonging he taught was real, and so
  were the cultural boundaries around whose lives were safe to name. The
  archives establish the encounters; the book asks every leader who creates
  belonging who is still welcomed only in part.
