whyThisMatters: >-
  Weick, Sutcliffe, and Obstfeld’s “Organizing and the Process of Sensemaking”
  theorizes how organizations reduce ambiguity by enacting plausible accounts
  that enable coordinated action. When Others Look to You extends that under
  stress: confidence lowers uncertainty for observers and travels farther than
  narrow claims, rewarding leaders who shrink complexity too quickly and
  penalizing those who keep uncertainty visible long enough to decide better.
