whyThisMatters: >-
  James C. Scott’s Domination and the Arts of Resistance theorizes “hidden
  transcripts”—offstage discourse and practice that diverge from public
  compliance under domination. When Others Look to You extends that pattern to
  selective followership at scale: people reinterpret rules locally, hide
  workarounds, and keep paperwork looking coordinated while practice drifts.
  Scott analyzes power and resistance; the book asks how correction fails when
  what people on the ground see cannot change the plan.
