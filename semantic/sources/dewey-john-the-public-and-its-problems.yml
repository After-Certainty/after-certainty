whyThisMatters: >-
  Dewey’s The Public and Its Problems argues that publics form around shared
  consequences of associated action, and that democratic life depends on
  communication that lets those affected cooperate under uncertainty. How Trust
  Forms follows that outward: trust is what makes families, teams, and
  communities able to rely on one another for problems no individual can solve
  alone. The book’s extension is about capability—what groups become able to do
  together—not a restatement of Dewey’s theory of the public as such.
