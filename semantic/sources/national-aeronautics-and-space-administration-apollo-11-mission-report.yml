whyThisMatters: >-
  NASA’s Apollo 11 Mission Report and related flight-operations accounts record
  the lunar descent, including program alarms 1201/1202 and the guidance team’s
  judgment—associated with Steve Bales—that descent could continue. The World We
  Make Together uses that moment to show collective judgment the later
  photograph of an astronaut on the surface cannot display. The report documents
  mission operations; the book asks who makes history when the image erases the
  room that kept the landing possible.
