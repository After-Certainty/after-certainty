whyThisMatters: >-
  CDC return-to-sports guidance stages recovery through graded exertion under
  healthcare supervision, with symptoms sending the athlete back a step. The
  Game We Think We Saw treats that protocol as a moral boundary as much as a
  clinical one: courage is not a diagnostic instrument for concussion readiness.
