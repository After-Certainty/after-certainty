whyThisMatters: >-
  Thomke’s Experimentation Works argues that business experiments teach when
  they discriminate among hypotheses—with explicit assumptions, observables, and
  decision thresholds—not when they merely generate activity. How Serious
  Systems Learn extends that to probe design: inferential power under bounded
  risk, not symbolic delay or political cover dressed as learning.
