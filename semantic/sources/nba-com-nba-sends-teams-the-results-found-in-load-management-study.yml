whyThisMatters: >-
  NBA.com’s report on the league’s load-management study states that the
  particular data examined did not show a lower injury rate associated with
  resting players, while medical contributors still stressed balancing rest and
  recovery and cautioned that the findings did not prove load management never
  works. The Game We Think We Saw uses that inconclusive evidence inside
  competing clocks—fan night, season product, postseason judgment, career body.
  The article reports the study’s circulation and caveats; the book asks which
  future the body is being asked to serve when science does not settle the
  dispute.
