whyThisMatters: >-
  Connolly’s Guardian report covers Angela Merkel’s public COVID
  explanations—including her March 2020 address and later briefings that asked
  Germans to grasp exponential growth rather than receive a slogan. When
  Authority Is Misread treats that speech cycle as evidence of a standing wager:
  that publics can carry interpretive labor usually absorbed by leaders. The
  reporting establishes how Merkel taught rate-of-change; the book asks what
  authority is doing when it shares the work of understanding instead of
  packaging certainty.
