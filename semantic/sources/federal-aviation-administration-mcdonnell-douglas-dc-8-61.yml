whyThisMatters: >-
  The FAA’s lessons-learned account of United Airlines Flight 173 (DC-8-61 /
  N8082U) identifies hierarchical cockpit culture as a factor and links the
  accident to later Crew Resource Management expectations that subordinates
  speak up and captains use distributed cockpit knowledge. The World We Make
  Together uses that shift to show how authority can remain decisive while
  changing what good authority is expected to do with others’ information. The
  FAA records an accident catalyst for CRM; the book’s claim is about chairs
  that narrow rooms versus roles that keep distributed sight usable.
