whyThisMatters: >-
  Charter 77's 1977 declaration demanded that the Czechoslovak state honor
  human-rights commitments it had formally accepted, without offering a full
  governing program. When Others Become Leaders treats that narrow demand as
  leadership architecture: speaking as if official language were binding can
  destabilize a system that lived by the gap between words and experience.
