whyThisMatters: >-
  Lewis, Perry, and Murata’s Educational Researcher article presents lesson
  study as instructional improvement through repeated small loops—plan, observe,
  reflect, revise—rather than only through large centralized reform. Coupling
  uses that education case beside other domains where pilot-and-adjust cycles
  keep redesign nearer to operational feedback. The source argues how research
  can contribute via lesson-study practice; the book asks when simplification
  protects learning loops and when it strips the structure that made learning
  possible.
