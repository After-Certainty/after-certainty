whyThisMatters: >-
  Susan Leigh Star and Anselm Strauss’s “Layers of Silence, Arenas of Voice”
  theorizes the ecology of visible and invisible work—how some labor is
  recognized while articulation work that keeps collaboration possible remains
  silenced. Why Collaboration Is So Hard uses that frame for the surrounding
  work that keeps projects from repeatedly forgetting themselves: reminders,
  translations, and repairs that never look like “the project.” The article
  establishes visible/invisible work analytically; the book asks how recognition
  systems systematically miss what makes collaboration possible.
