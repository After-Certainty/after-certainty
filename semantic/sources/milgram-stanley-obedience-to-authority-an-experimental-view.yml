whyThisMatters: >-
  Stanley Milgram’s Obedience to Authority reports laboratory experiments in
  which ordinary participants administered what they believed were severe shocks
  under an experimenter’s authority, showing situational obedience rather than
  rare sadism. When Authority Outlives Accountability pairs that finding with
  moral injury research to relocate leadership morality from character labels to
  how systems authorize, excuse, or conceal harm. Milgram establishes the
  obedience evidence; the book’s question is how leaders stand toward harm when
  they can continue or interrupt it.
