whyThisMatters: >-
  The National Center for Education Statistics defines and publishes the
  Adjusted Cohort Graduation Rate (ACGR)—a standardized on-time graduation
  metric used for accountability and comparison across schools and states. When
  Incentives Become the Moral Language treats ACGR as a portable proxy for
  institutional quality that can pressure schools to move students through even
  when support is thin. NCES supplies the measure’s definition and data; the
  book asks what formation becomes invisible once the rate becomes the argument.
