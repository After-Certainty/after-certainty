whyThisMatters: >-
  Grice’s “Logic and Conversation” describes cooperative maxims by which listeners
  infer more than is said—until the cost of checking the inference exceeds the
  cost of moving on. When Authority Is Misread places that pragmatics in rooms
  where speech must stay fast enough to keep the day intact. Grice names ordinary
  inferential cooperation; the book asks what misreading becomes normal once
  checking speech is priced as unaffordable.
