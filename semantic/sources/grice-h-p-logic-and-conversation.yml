whyThisMatters: >-
  Grice’s “Logic and Conversation” describes cooperative maxims and conversational
  implicature—how listeners routinely infer more than is literally said under an
  assumption of cooperation. When Authority Is Misread extends that account into
  organizational rooms where speech must stay fast enough to keep the day intact,
  so the cost of checking an inference can be priced higher than the cost of being
  almost understood. Grice names ordinary implicature; the book asks what
  misreading becomes normal once clarification is treated as unaffordable.
