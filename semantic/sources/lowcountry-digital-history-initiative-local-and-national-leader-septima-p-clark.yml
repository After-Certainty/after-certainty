whyThisMatters: >-
  The Lowcountry Digital History Initiative’s Septima Clark exhibit documents
  expansion of Citizenship Schools beyond Johns Island and the SCLC’s assumption
  of the broader program in 1961, carried by Clark, Dorothy Cotton, Andrew
  Young, Bernice Robinson, and local partners. The World We Make Together uses
  that expansion to name a recurring danger: a model born in one community can
  become a program administered to another. The source records institutional
  scale-up; the book asks what is lost when a living window becomes standardized
  curriculum.
