whyThisMatters: >-
  Philip Selznick’s Leadership in Administration treats institutional leadership
  as defining and protecting organizational character beyond technical
  administration and personal virtue. How Serious Systems Learn takes that
  institutional turn: correction must be embedded in how decisions are
  authorized, disagreement handled, reversal legitimized, and learning rewarded
  over image protection. Selznick theorizes institutional leadership; the book
  asks whether system design allows caring to alter trajectory.
