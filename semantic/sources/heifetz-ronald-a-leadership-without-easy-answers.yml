whyThisMatters: >-
  Heifetz’s Leadership Without Easy Answers distinguishes technical problems
  from adaptive work and treats leadership as mobilizing people to face hard
  tradeoffs rather than only issuing answers from authority. When Authority
  Outlives Accountability draws on that frame for how responsibility thins as
  authority spreads across people, roles, and time—harm accumulating through
  defensible steps. Heifetz theorizes adaptive leadership; the book’s inference
  is about moral failure entering through accumulation, not only through
  cruelty.
