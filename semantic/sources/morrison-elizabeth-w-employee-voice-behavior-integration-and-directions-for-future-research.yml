whyThisMatters: >-
  Elizabeth Morrison’s Academy of Management review integrates research on
  employee voice: when workers speak up about problems or ideas depends on
  perceived safety, efficacy, and the changing cost of speaking after decisions
  harden. How Meaning Moves uses that cost structure when a room converts a
  passing comment into a plan and reopening the concern starts to sound like
  undoing work already implemented. Morrison surveys organizational voice
  behavior; the book tracks how a record changes what can still be said.
