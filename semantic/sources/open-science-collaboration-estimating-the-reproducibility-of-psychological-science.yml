whyThisMatters: >-
  The Open Science Collaboration's 2015 Science study attempted large-scale
  replication of psychological findings and reported that many high-profile
  results failed to reproduce at expected rates. When Incentives Become the
  Moral Language reads that pattern as publication pressure rewarding novelty
  and positive results until reliability lags—without treating the collaboration
  as a survey of every field.
