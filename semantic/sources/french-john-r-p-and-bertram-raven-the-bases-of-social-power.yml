whyThisMatters: >-
  French and Raven’s Bases of Social Power classifies how influence
  operates—reward, coercion, legitimacy, expertise, referent power—before a
  listener fully evaluates an argument. How Meaning Moves uses that insight for
  early sorting in conversation: authority changes the weight of a phrase while
  language is still arriving. The source inventories power bases; the book asks
  how meaning moves when rank and history shape interpretation before reasoning
  gets a fair hearing.
