whyThisMatters: >-
  Fisher, Ury, and Patton’s Getting to Yes separates positions from interests
  and treats durable negotiation as work on underlying needs rather than surface
  demands. Trust Beyond Similarity takes that discipline into disagreement that
  cannot be dissolved by similarity: parties may reject each other’s conclusions
  while still taking seriously the fears, red lines, and losses that make
  positions stick. The source offers a method; the book asks whether
  understanding without surrender can keep trust workable when compromise on
  history or legitimacy is unavailable.
