whyThisMatters: >-
  Donella Meadows’s Thinking in Systems explains how delays between action and
  feedback distort learning in complex systems—people keep intervening on
  outdated information while consequences arrive late or elsewhere. Coupling
  uses that delay problem for software and AI acceleration: release speed can
  compress authoring time while the return path from runtime consequence to
  decision stays long or opaque. Meadows supplies the systems vocabulary of
  delayed feedback; the book asks what happens when assisted speed widens that
  gap further.
