whyThisMatters: >-
  Mark Monmonier’s How to Lie with Maps shows that every usable map must
  simplify—selecting, generalizing, and symbolizing so some facts travel while
  others cannot appear at the same scale. When Incentives Become the Moral
  Language extends that necessity to institutional forms and columns: what gets
  a field becomes comparable and defensible, while what lacks one stays
  dependent on memory and discretion. Monmonier’s subject is cartographic
  selection; the book’s question is how blank columns quietly shape moral
  language before anyone announces a value.
