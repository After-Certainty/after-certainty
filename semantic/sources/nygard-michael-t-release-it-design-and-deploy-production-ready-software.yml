whyThisMatters: >-
  Nygard's Release It! shows how integration assumptions—retries, partial
  states, missing fields, edge-case classifications—diverge from production
  behavior under change, and why production-ready systems need stability
  patterns at those boundaries. Coupling extends that diagnosis to schedule
  pressure: a thin adapter that absorbs vendor assumptions into the domain core
  can let an external dependency quietly rewrite the system's own logic.
