whyThisMatters: >-
  Nickerson's 1998 Review of General Psychology survey synthesizes confirmation
  bias—the tendency to seek, notice, and favor evidence that supports existing
  beliefs while discounting what challenges them. How Meaning Moves places that
  selectivity in ordinary meeting pressure: uncertainties stay visible only when
  someone can afford the personal cost of raising them, so alignment can look
  like silence rather than shared judgment.
