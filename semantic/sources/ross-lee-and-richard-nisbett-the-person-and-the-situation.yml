whyThisMatters: >-
  Lee Ross and Richard Nisbett’s The Person and the Situation synthesizes social
  psychology showing that situations shape behavior far more than everyday
  dispositional intuition allows. After Certainty uses that situational frame
  around heroic narratives: once admiration stabilizes a story, revising it
  becomes emotionally expensive and scrutiny can feel like disloyalty. The
  source establishes person–situation attribution science; the book asks how
  care for a hero quietly becomes insulation of the story itself.
