whyThisMatters: >-
  MacIntyre’s After Virtue argues that virtues are intelligible inside social
  practices and narrative traditions that make excellence and shared standards
  possible. How Trust Forms draws that communal recognition into a pre-formal
  leadership pattern: under uncertainty, people repeatedly seek those whose
  actions have proven dependable. The source is a moral-philosophical account of
  practices and virtue; the book asks how trust concentrates attention into
  legitimacy before titles arrive.
