whyThisMatters: >-
  The FAA/NASA Aviation Safety Reporting System invites pilots and controllers
  to report near misses and errors without default punishment, on the premise
  that hidden near misses become public catastrophes. What We Cannot See
  contrasts that voluntary, non-punitive feedback loop with organizational
  failures in which partial sight never becomes memory strong enough to change
  the next launch. The book’s operational question is how industries convert
  distributed, awkward observations into shared learning before schedule and
  plan absorb them.
