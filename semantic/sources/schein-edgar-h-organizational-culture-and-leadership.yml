whyThisMatters: >-
  Edgar H. Schein’s Organizational Culture and Leadership analyzes how shared
  assumptions and norms form and persist in organizations, often outlasting
  particular leaders and formal structures. When Authority Outlives
  Accountability cites that durability: investments in fairness, clarity, and
  mutual accountability can continue after authority fades, even without credit
  to their originators. Schein establishes culture’s persistence; the book
  treats effectiveness as a multiplier of moral posture toward harm, not as a
  moral achievement in itself.
