whyThisMatters: >-
  James Reason's The Human Contribution examines unsafe acts, accidents, and
  near-miss and recovery patterns in complex systems, treating near misses as
  signals that current conditions almost produced harm. The Discipline of
  Uncertainty elevates that signal as institutional conscience—against
  dashboards that replace warnings when conferences and near-miss reporting are
  cut for throughput.
