whyThisMatters: >-
  Honey’s Going Down Jericho Road reconstructs the 1968 Memphis sanitation
  strike, including dangerous conditions, the deaths of Echol Cole and Robert
  Walker, local organizing under T.O. Jones, and King’s entry into a struggle
  workers had already begun. When Others Become Leaders uses that history to
  insist famous leaders often join local grievances after quieter methods are
  exhausted. Honey documents the strike campaign; the book’s claim is about
  leadership circulation, in which King entered a grievance he did not create.
