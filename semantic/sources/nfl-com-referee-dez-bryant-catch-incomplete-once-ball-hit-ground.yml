whyThisMatters: >-
  NFL.com reports the January 2015 NFC Divisional review in which Dez Bryant's
  on-field catch was overturned under the then-applicable going-to-the-ground
  standard once the ball came loose on contact with the ground. The Game We
  Think We Saw uses that widely seen play to show that replay still answers a
  rule's categories applied to a body in motion—the whistle expresses what the
  rules allow sight to mean, not raw visibility alone.
