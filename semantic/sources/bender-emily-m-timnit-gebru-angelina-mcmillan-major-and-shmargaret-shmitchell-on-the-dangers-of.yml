whyThisMatters: >-
  Bender and coauthors warn that scaling language models can raise throughput
  while leaving labor, verification, and accountability misaligned. Coupling
  extends the warning beyond AI: institutions that speed drafting without
  redesigning ownership and review shift consequence downstream.
