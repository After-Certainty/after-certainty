whyThisMatters: >-
  Brooks’s Mythical Man-Month essays describe how large software programs that
  look healthy under phase-gated milestones can still fail when late integration
  exposes conflicting interfaces, mismatched contracts, and decisions that have
  become expensive to reverse. Coupling uses that late-friction pattern as
  evidence that coordination solutions can hide consequence until redesign is
  already hard. The book’s question is structural—when early commitments outrun
  early feedback, what looks like schedule discipline is really deferred
  learning.
