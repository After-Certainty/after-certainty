whyThisMatters: >-
  Forbes’s Women in Modern India documents women’s participation in civil
  disobedience—salt manufacture, picketing, demonstrations, arrest, and public
  leadership—often beyond the roles colonial structures and movement leaders
  first imagined. When Others Become Leaders uses that record for the salt
  campaign: Gandhi encouraged women’s participation, yet women pushed past the
  parts initially assigned to them. Forbes supplies the social history; the book
  asks when circulation of leadership outruns obedience to a preset script.
