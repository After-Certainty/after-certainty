whyThisMatters: >-
  In 1895 Hull-House residents published Hull-House Maps and Papers, a
  collective neighborhood study that mapped nationalities, wages, labor,
  housing, and industrial conditions, with Florence Kelley central alongside
  Jane Addams and other residents. When Others Become Leaders reads that
  collaborative evidence-making as leadership before title: the settlement
  supplied access to problems, collaborators, and rooms where unnamed conditions
  could be seen and acted on. The volume establishes the maps and papers as
  joint research; the book asks how proximity and shared work create credibility
  without bestowing offices.
