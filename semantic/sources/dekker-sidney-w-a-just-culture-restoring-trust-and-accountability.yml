whyThisMatters: >-
  In Just Culture, Dekker argues that organizations restore learning only when
  accountability distinguishes acceptable risk-taking from culpable harm—so
  people can report and correct without automatic punishment. When Others Look
  to You translates that into harm-absorbing leadership: those with decision
  power take on part of the cost, acknowledge error early, and shield people
  closest to avoidable fallout. Dekker’s framework ties trust to fair
  accountability; the book asks how authority stays visible as linked to
  consequence.
