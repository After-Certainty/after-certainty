whyThisMatters: >-
  Weick’s The Social Psychology of Organizing emphasizes enactment, loose
  coupling, and organizing as ongoing sensemaking rather than static structure.
  When Others Look to You uses that adaptive grammar diagnostically: when
  reality pushes back against a plan that has already spread, influence can move
  toward renewal (correction while reach grows) or erosion (insulation as
  coordination hardens).
