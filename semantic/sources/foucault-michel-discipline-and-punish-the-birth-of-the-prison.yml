whyThisMatters: >-
  Foucault’s Discipline and Punish traces how modern power disciplines bodies
  through institutions, surveillance, and normalized routines rather than
  spectacular punishment alone. When Others Look to You invokes that analysis of
  power and harm when leadership treats some people as expendable so a prized
  goal or timeline can stay intact. Foucault maps disciplinary mechanisms; the
  book asks what repeats when cost is passed outward and recurrence is treated
  as overhead instead of a signal to change the plan.
