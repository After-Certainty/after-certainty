whyThisMatters: >-
  Salvador Minuchin’s Families and Family Therapy develops structural family
  therapy: symptomatic patterns are maintained through complementary roles and
  recursive interactions, so “the same fight” is often a system property rather
  than a single person’s fixed intent. How Meaning Moves uses that systemic view
  for intimate archives—each retelling favors some details, drops others, and
  reorganizes what the next round will treat as the event. Minuchin’s clinic is
  family structure; the book’s inference is about how meaning solidifies across
  returns to unfinished talk.
