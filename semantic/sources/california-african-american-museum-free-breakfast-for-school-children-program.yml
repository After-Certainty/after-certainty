whyThisMatters: >-
  The California African American Museum documents the January 20, 1969 opening of the Black Panther Party's Oakland breakfast program at St. Augustine's Episcopal Church, when eleven children received breakfast. The World We Make Together uses the deliberately modest first morning to distinguish a sustained community practice from a memorable symbol of care. The museum establishes the date, place, and first meal; the manuscript's political interpretation is its own.
