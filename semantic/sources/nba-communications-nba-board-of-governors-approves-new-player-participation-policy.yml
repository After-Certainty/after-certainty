whyThisMatters: >-
  NBA Communications’ release announces Board of Governors approval of a Player
  Participation Policy restricting rest of designated star players, emphasizing
  availability for nationally televised and tournament games, with exceptions
  for injury history, age, and career workload. The Game We Think We Saw reads
  the policy as making competing incentives—league product, team playoff clocks,
  athlete longevity, fan expectation—unusually explicit. The release states the
  rule; the book asks how “playing hurt” becomes moral language once several
  calendars claim the same body.
