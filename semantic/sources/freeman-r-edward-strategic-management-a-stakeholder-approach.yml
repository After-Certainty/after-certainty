whyThisMatters: >-
  Freeman’s Strategic Management argues that organizations remain legitimate by
  answering to multiple stakeholder claims, not a single purpose with perfect
  clarity. Trust Beyond Similarity applies that stakeholding to projects that
  stay defensible because they serve many purposes well enough to justify the
  complexity they carry. Freeman reframes value as plural; the book asks how
  trust holds when legitimacy depends on answering competing claims rather than
  minimizing them.
