whyThisMatters: >-
  Hirschman’s Exit, Voice, and Loyalty analyzes how members respond to
  organizational decline through leaving, speaking up, or remaining loyal—and
  how those options interact as feedback. When Authority Outlives Accountability
  uses that repertoire while tracing how leaders shift toward metrics and
  standardization as pressure rises and costs become abstract for those who bear
  them at a distance. Hirschman maps response options; the book asks how voice
  thins when effectiveness becomes the organizing principle and harm grows
  legible mainly as statistics.
