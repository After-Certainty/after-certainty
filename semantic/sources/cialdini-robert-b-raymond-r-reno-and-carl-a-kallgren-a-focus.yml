whyThisMatters: >-
  Cialdini, Reno, and Kallgren's focus theory of normative conduct shows that
  norms guide behavior when they are made salient—people act on what the
  situation brings into focus. When Others Look to You extends that to
  leadership modeling: influence amplifies what you showed—tolerance, silence,
  correction—more than what you meant.
