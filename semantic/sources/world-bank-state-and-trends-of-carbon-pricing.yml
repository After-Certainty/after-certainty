whyThisMatters: >-
  World Bank State and Trends of Carbon Pricing surveys carbon taxes, emissions
  trading, and related instruments that price greenhouse gases across
  jurisdictions. When Incentives Become the Moral Language uses that instrument
  landscape to show how climate moral claims translate into credits, targets,
  and disclosure metrics—so “we met the target” can displace “in my judgment,
  this path is responsible.”
