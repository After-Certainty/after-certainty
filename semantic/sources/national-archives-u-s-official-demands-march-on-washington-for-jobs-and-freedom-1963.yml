whyThisMatters: >-
  National Archives reproductions of the 1963 March on Washington’s official
  demands list concrete program items—civil-rights protections, fair employment,
  adequate wages, desegregated education, and federal action—printed into the
  event’s purpose. When Others Become Leaders contrasts that demand sheet with
  later commemorations that remember a dream more easily than a program. The
  archive preserves the organizers’ stated agenda; the book asks how language
  that gathers a movement can also soften what the gathering required.
