whyThisMatters: >-
  Ioannidis’s 2005 PLoS Medicine essay argues that bias, flexibility, and
  incentive structures in modern research make many published findings unlikely
  to survive scrutiny—rewarding exciting positive results over careful ones.
  When Incentives Become the Moral Language places that claim beside later
  replication debates as evidence that the translation layer between inquiry and
  recognition developed incentives of its own. Ioannidis analyzes research
  design and publication bias; the book asks what portable metrics and novelty
  pressure do to what institutions can see.
