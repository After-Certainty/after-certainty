whyThisMatters: >-
  Reinhart and Rogoff's This Time Is Different surveys eight centuries of
  financial crises and the recurring claim that present conditions make prior
  lessons obsolete. The Economy We Don't Experience reads many economic
  guardrails as memory crystallized into rules after panics revealed
  fragility—protecting the system's survival story without erasing what
  resilience cost people while it held.
