whyThisMatters: >-
  Larsen’s comparative study of social cohesion in the US, UK, Sweden, and
  Denmark examines how trust tracks perceptions of a meritocratic social middle
  versus an untrustworthy bottom, and how those constructions can be built or
  dismantled. Trust Beyond Similarity cites that relational filter when familiar
  colleagues make some realities easy to notice and others hard to hear. The
  source analyzes trust and cohesion across national cases; the book asks what
  familiarity quietly finishes when coordination feels complete.
