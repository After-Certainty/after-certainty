whyThisMatters: >-
  Mashaw’s Bureaucratic Justice studies Social Security disability
  administration as a system that can produce careful, rule-bound outcomes—and
  still distribute hardship—without requiring villains who break the rules. When
  Accountability No Longer Expires cites that pattern for harm produced by
  systems acting as intended, then explained well enough to endure. The source
  is an administrative-law analysis of bureaucratic justice; the book asks what
  happens when legitimacy needs only an explanation, not a reckoning.
