whyThisMatters: >-
  OECD’s PISA 2022 Results reports international learning and equity benchmarks
  that turn formation into comparable scores across systems. When Incentives
  Become the Moral Language reads ranking regimes as moral languages communities
  learn to treat as the measure of a child. PISA publishes the comparative
  apparatus; the book asks what a score cannot hold once competition becomes the
  ethic of schooling.
