whyThisMatters: >-
  Graves’s AP report records Simone Biles’s Tokyo return for women’s balance
  beam after withdrawing from several finals, and her bronze medal on that
  apparatus. The Game We Think We Saw uses that partial return to complicate
  withdrawal narratives: she was neither incapable of all gymnastics nor
  choosing only between total participation and total departure, while
  institutional stakes shaped what private knowledge could authorize.
