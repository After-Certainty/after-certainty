whyThisMatters: >-
  Tetlock and Gardner’s Superforecasting shows how probabilistic, updateable
  judgment outperforms overconfident expertise when forecasts are scored and
  revised. How Serious Systems Learn asks a different question: whether better
  prediction, once converted into tighter commitment and fewer contingencies,
  can increase exposure by suppressing the behaviors needed when models drift.
