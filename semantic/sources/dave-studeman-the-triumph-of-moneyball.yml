whyThisMatters: >-
  Dave Studeman’s “The Triumph of Moneyball” tracks how major-league clubs hired
  analysts and absorbed statistical methods after Oakland’s approach became
  public—changing which skills were undervalued because measurement itself
  changed what the sport paid for. The Game We Think We Saw treats that
  diffusion as the part of the Moneyball story easiest to compress away: the
  lesson was never only that one metric was “correct.” Studeman documents the
  spread; the book asks what happens when a correction becomes the new standard.
