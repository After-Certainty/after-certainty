whyThisMatters: >-
  Addams's first-person account describes establishing Hull-House with Ellen
  Gates Starr and the early settlement's approach to neighborhood life.
  When Others Become Leaders introduces that founding to explore how
  collective influence takes institutional form. The book's questions about
  help, power, and settlement are its reading of the history, not an
  attribution to Addams.
