whyThisMatters: >-
  Anderson shows how shared national narratives create belonging by selecting
  what counts as loyalty and what sounds like disloyalty. Trust Beyond Similarity
  presses the same mechanism into ordinary groups: shared stories reduce
  uncertainty, and they also teach people what not to notice.
