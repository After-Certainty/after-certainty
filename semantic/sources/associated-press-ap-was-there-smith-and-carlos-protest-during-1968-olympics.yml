whyThisMatters: >-
  The AP retrospective documents the 1968 podium protest and the immediate
  institutional response—suspension and removal from the Olympic Village. The
  Game We Think We Saw uses that event record before turning to later honor.
  The source establishes what happened then; the book asks how the same gesture
  becomes a different message once audiences no longer have to respond now.
