whyThisMatters: >-
  Merton’s “The Normative Structure of Science” (1942) describes organized
  skepticism, peer review, and related norms as ways scientific claims stay open
  to revision when evidence changes—trust paired with accountability to reality
  rather than personal authority. When Trust Stops Tracking Reality uses that
  account to argue that durable trust needs ongoing revision mechanisms, not
  loyalty alone. Merton’s claim is about science’s institutional norms; the book
  generalizes the need for feedback that can still overturn settled practice.
