whyThisMatters: >-
  Butler argues that frames of war determine which lives appear grievable and
  which harms register as requiring response. After Certainty presses a related
  operational limit: interpretation can keep earning moral credit—appearing
  careful and open—after it has stopped changing what responsibility requires.
