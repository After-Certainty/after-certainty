whyThisMatters: >-
  Weick’s Sensemaking in Organizations shows how people retrospectively
  construct plausible order from equivocal cues so action can continue. How
  Serious Systems Learn treats coherence as a seduction that can close inquiry:
  tidy explanations restore momentum by converting partial interpretation into
  stable certainty that then organizes attention around preserving itself.
