whyThisMatters: >-
  March and Olsen’s Rediscovering Institutions argues that political life is
  organized by institutions, rules, and logics of appropriateness—not only by
  aggregating individual preferences toward outcomes. When Authority Outlives
  Accountability uses that institutional lens to hold morality, effectiveness,
  and inheritance together as dimensions no single outcome score can replace.
  The source reframes politics as institutional; the book asks why leadership
  that looks similar on the surface diverges so sharply over time.
