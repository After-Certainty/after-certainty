whyThisMatters: >-
  Susan Raine analyzes how NXIVM's self-improvement programs kept members
  participating while experiences that might have challenged the organization
  were absorbed into its reinventive logic. When Trust Stops Tracking Reality
  generalizes that pattern beyond the case: continued activity can begin
  confirming rather than testing, so loyalty starts reading as evidence that
  trust still tracks reality.
