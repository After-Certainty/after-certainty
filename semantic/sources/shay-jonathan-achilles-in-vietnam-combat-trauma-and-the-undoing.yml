whyThisMatters: >-
  Jonathan Shay’s Achilles in Vietnam links Homeric narrative to Vietnam
  veterans’ trauma and develops moral injury: harm from betrayal of what’s right
  by someone who holds legitimate authority. When Authority Outlives
  Accountability cites that account to argue that harm is often produced by
  ordinary people inside systems that authorize, excuse, or conceal damage—not
  by monstrous character alone. Shay establishes moral injury clinically and
  historically; the book reframes leadership morality as posture toward harm
  under pressure rather than as a stable personality trait.
