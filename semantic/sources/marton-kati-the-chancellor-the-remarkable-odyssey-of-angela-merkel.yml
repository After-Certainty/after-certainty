whyThisMatters: >-
  Marton’s The Chancellor narrates Merkel’s East German formation, scientific
  training, advance through committees and coalition arithmetic, and a public
  style wary of theatrical certainty. When Authority Is Misread uses that
  biography against media hunger for decisive spectacle: speech treated as
  extension of reasoning can be misread as weakness. The source is a political
  life of Merkel; the book asks how authority is misread when certainty is
  performed as proof.
