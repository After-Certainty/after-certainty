whyThisMatters: >-
  Wright’s study of Jesus’ kingdom praxis includes the sending of disciples
  outward in pairs into places the teacher has not yet entered. When Others Become
  Leaders takes that mission pattern as influence that does not remain permanently
  gathered at the center. Wright frames kingdom movement historically; the book
  asks how leadership begins when authority is practiced as dispersal rather than
  as a single occupied chair.
