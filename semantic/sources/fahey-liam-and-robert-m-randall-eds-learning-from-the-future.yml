whyThisMatters: >-
  Fahey and Randall’s Learning from the Future develops competitive foresight
  scenarios as a way organizations rehearse alternative futures and notice
  disconfirming signals before they harden into crisis. How Serious Systems
  Learn borrows that orientation toward early detection for corrective loops:
  metrics, retrospectives, and escalation paths can remain visible while the
  cycle that actually alters action erodes. The book’s inference is that a loop
  is not a document—correction fails when information no longer travels quickly,
  clearly, and with enough authority to change ongoing work.
