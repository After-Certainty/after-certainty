whyThisMatters: >-
  Gleeson-White shows how Venetian double-entry bookkeeping made certain
  economic relations newly navigable by deciding what to record and what to
  leave off the page. What We Cannot See takes that ledger logic as a reminder
  that adaptive maps become dangerous when their omissions are forgotten.
