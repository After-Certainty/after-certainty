whyThisMatters: >-
  The 2012 San Francisco Declaration on Research Assessment (DORA) urges
  institutions to stop misusing journal-level metrics such as impact factor for
  hiring, promotion, and funding of individual researchers. When Incentives
  Become the Moral Language cites that reform statement alongside the
  persistence of portable journal rankings that still offer committees
  defensible cross-candidate comparisons. DORA states assessment principles; the
  book asks how incentive language outruns signed commitments when the shelf
  still looks more objective than judgment.
