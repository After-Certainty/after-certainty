whyThisMatters: >-
  Jim Collins’s Good to Great studies how some firms convert breakthrough
  performance into durable operating discipline—codifying what worked until it
  becomes the organization’s standard of seriousness. How Serious Systems Learn
  reads that success path as a trap for methods: preservation hardens into
  compliance, and questioning fit starts to feel like disloyalty. Collins
  documents institutionalization of winning practices; the book asks when the
  method that once enabled learning begins defining what counts as learning in
  advance.
