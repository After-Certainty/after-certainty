whyThisMatters: >-
  King’s 1963 “Letter from Birmingham Jail,” drafted after arrest during the
  Birmingham campaign, answers white clergy who urged delay and answers from
  inside the risk he was asking others to share. When Others Become Leaders
  reads the letter’s occasion as much as its argument: the arrest mattered
  because the case for nonviolent urgency had already entered his life. The
  source is King’s defense of direct action against moderation; the book asks
  how leadership stays credible when the leader’s body, not only the leader’s
  words, must carry the demanded sacrifice.
