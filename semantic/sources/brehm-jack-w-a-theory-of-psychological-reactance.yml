whyThisMatters: >-
  Brehm's reactance theory holds that threatened freedom can trigger opposition
  aimed at restoring agency, including doing the opposite of what one is told.
  When Others Look to You treats that reflex as a leadership fact: being looked
  to is not the same as being obeyed, and influence can remain strong while
  people only partly go along.
