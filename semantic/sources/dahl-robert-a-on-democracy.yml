whyThisMatters: >-
  Robert A. Dahl’s On Democracy argues that democratic institutions organize
  pluralism—keeping disagreement and partial perspectives present rather than
  dissolving them into a single authoritative summary. Trust Beyond Similarity
  takes that institutional inventory (courts, elections, journalism,
  associations, constitutional limits) as imperfect machinery for preventing one
  view of reality from becoming absolute too quickly. Dahl defends democratic
  form; the book asks how trust works when citizens need not be already similar.
