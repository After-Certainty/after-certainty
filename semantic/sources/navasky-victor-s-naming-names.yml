whyThisMatters: >-
  Victor Navasky’s Naming Names documents the 1947 Hollywood HUAC hearings, the
  Hollywood Ten’s refusal and contempt convictions, and the blacklist as a
  system that sorted people by willingness to perform loyalty and name
  associates under threat. When Authority Is Misread cites that history when
  questions that sound informational function as allegiance tests. Navasky’s
  study establishes the hearings and blacklist machinery; the book asks when
  conversation stops being inquiry and becomes compelled affiliation
  performance.
