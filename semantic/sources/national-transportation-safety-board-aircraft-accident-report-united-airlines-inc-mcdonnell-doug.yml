whyThisMatters: >-
  NTSB Aircraft Accident Report AAR-79-7 investigates United Airlines Flight 173
  near Portland on December 28, 1978: a landing-gear indication problem led the
  crew into a holding pattern while fuel exhaustion developed into a crash. The
  World We Make Together uses the event to show how the person in the chair
  decides which warnings to hear and how uncertainty is treated under authority.
  The report establishes the accident’s facts and findings; the book asks how
  structure magnifies what the occupant notices or fails to notice.
