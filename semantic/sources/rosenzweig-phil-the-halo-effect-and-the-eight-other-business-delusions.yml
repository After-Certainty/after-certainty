whyThisMatters: >-
  Phil Rosenzweig’s The Halo Effect shows how overall performance judgments
  contaminate attributions about strategy, culture, leadership, and
  metrics—success creates illusions of knowing why. How Serious Systems Learn
  extends that diagnosis into a validation effect: results under specific
  conditions are often misread as proof the system is robust across changing
  ones. Rosenzweig catalogs managerial delusions; the book treats success as a
  trigger for deeper scrutiny rather than relaxed discipline.
