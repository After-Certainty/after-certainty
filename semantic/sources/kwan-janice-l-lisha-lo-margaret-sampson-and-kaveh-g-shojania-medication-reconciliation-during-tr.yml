whyThisMatters: >-
  Kwan and colleagues’ 2013 Annals of Internal Medicine systematic review
  examines medication reconciliation across transitions of care as a strategy
  for identifying and resolving unintentional medication discrepancies. Why
  Collaboration Is So Hard stages that work in a crowded discharge scene where
  pharmacy comparison of overlapping prescriptions competes with time pressure,
  family concern, and throughput metrics. The source reviews reconciliation as
  patient-safety practice; the book asks why collaboration fails when care’s
  clock and the system’s clock no longer match.
