whyThisMatters: >-
  Nick Smith analyzes what apologies can and cannot do—categorical distinctions
  among expressions that look like repair. When Accountability No Longer Expires
  pairs that analysis with correction that never reaches consequence, so
  apology-shaped speech can feel like virtue while leaving the world unchanged.
  Smith maps apology’s meanings; the book asks when learning without resolution
  makes correction itself the substitute for accountability.
