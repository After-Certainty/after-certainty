whyThisMatters: >-
  Hilary Putnam's Reason, Truth and History argues for a conception of reason
  and objectivity that does not require metaphysical certainty or final closure
  of inquiry. After Certainty extends that refusal of closure into ordinary
  moral life: learning to act—and to refrain—while the account stays open,
  without demanding uncertainty disappear before participation becomes possible.
