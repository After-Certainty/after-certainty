whyThisMatters: >-
  Wu’s The Attention Merchants traces the historical industry of capturing and
  reselling human attention, from early media through digital platforms. Living
  in Sediment extends that scramble into ranking as quiet persuasion: repeated
  top placement teaches importance without requiring manipulation—only the human
  habit of learning from what appears consistently first.
