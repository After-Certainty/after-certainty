whyThisMatters: >-
  Peter Suedfeld, Philip E. Tetlock, and Sally Streufert’s chapter on
  conceptual/integrative complexity defines how fully people differentiate
  multiple perspectives and integrate them in judgment. Trust Beyond Similarity
  uses higher complexity as the discipline of holding more than one real value
  and piece of evidence without collapsing conflict into simple opposition—while
  noting that pressure often punishes that complexity. The source defines and
  operationalizes integrative complexity; the book asks what trust across
  difference requires when conflict rewards simplification.
