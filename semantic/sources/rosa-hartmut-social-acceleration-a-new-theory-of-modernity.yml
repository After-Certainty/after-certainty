whyThisMatters: >-
  Hartmut Rosa’s Social Acceleration theorizes modernity as interlocking
  acceleration of technology, social change, and the pace of life that
  compresses time for deliberation. When Moral Seriousness Scales cites that
  structural pressure—distance, asymmetry, and incentive gradients that reward
  speed over deliberation—as the environment in which ambient moral
  reinforcement thins. Rosa analyzes acceleration as a theory of modernity; the
  book asks how moral seriousness must operate after shared certainty weakens
  under that pressure.
