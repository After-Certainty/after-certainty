whyThisMatters: >-
  NIST’s AI Risk Management Framework (AI RMF 1.0) is a voluntary framework for
  governing, mapping, measuring, and managing risks of AI systems across their
  lifecycle—emphasizing trustworthy characteristics and organizational practice
  rather than a single technical fix. Coupling cites it at the bridge into
  AI-era conditions where generation speed intensifies existing ownership and
  boundary pressures. The framework establishes risk-management vocabulary for
  AI; the book asks what happens when plausible output arrives faster than teams
  can keep responsibility boundaries clear.
