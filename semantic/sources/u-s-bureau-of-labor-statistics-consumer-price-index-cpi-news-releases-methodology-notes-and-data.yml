whyThisMatters: >-
  BLS CPI releases report aggregate price-change rates across a defined basket,
  with methodology, revisions, and category detail that describe the large
  economy’s rate of change. The Economy We Don't Experience sets that chart
  beside the receipt: the notification can be methodologically sound while the
  shopper’s register total remains a different lived object—not confusion, but
  two accurate descriptions of different scales.
