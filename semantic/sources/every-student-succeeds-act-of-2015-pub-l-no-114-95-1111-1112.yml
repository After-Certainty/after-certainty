whyThisMatters: >-
  The Every Student Succeeds Act’s accountability and state report-card
  provisions require districts and states to count proficiency and related
  indicators for school ratings. When Incentives Become the Moral Language uses
  that statutory machinery beside a classroom vignette: a real, documentable
  grade gain enters proficiency bands while temperamental growth—staying with
  hard problems, revising in public—never appears on the rubric. The book’s
  claim is that the score can be true and still capture only a fraction of what
  changed when incentives become the moral language of improvement.
