whyThisMatters: >-
  Galileo’s Dialogue stages Copernican argument in vernacular public form,
  sharpening conflict with institutional authority that preferred negotiated
  containment. When Authority Is Misread reads that rhetorical choice as
  accelerating the moment when persuasion gave way to enforcement. The Dialogue is
  Galileo’s public contest of world systems; the book asks how style and audience
  change when authority can no longer absorb dissent.
