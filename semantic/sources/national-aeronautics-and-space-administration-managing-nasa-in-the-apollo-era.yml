whyThisMatters: >-
  NASA History Division’s Managing NASA in the Apollo Era states that Apollo
  employed roughly 400,000 Americans at its peak and relied on more than 20,000
  companies and universities—an industrial and institutional scale far larger
  than any single spacesuit suggests. The World We Make Together cites those
  figures against the solitary look of the lunar photograph. The source
  establishes workforce scale; the book asks how images compress collective
  achievement into a figure that appears alone.
