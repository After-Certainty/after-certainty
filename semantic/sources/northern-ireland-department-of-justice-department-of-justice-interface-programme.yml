whyThisMatters: >-
  Northern Ireland's Department of Justice Interface Programme documents
  physical barriers at community interfaces, confidence-building work, and
  operational gate schedules that open and close on daily rhythms. The World We
  Make Together treats those ordinary schedules as institutional memory: gates
  that still open preserve a path for disagreement to return without beginning
  from nothing when confidence collapses.
