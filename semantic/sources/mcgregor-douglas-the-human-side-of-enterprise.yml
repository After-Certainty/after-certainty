whyThisMatters: >-
  McGregor’s The Human Side of Enterprise presents Theory X and Theory Y as
  contrasting managerial assumptions about work and motivation, not as fixed
  human types—assumptions that shape the conditions managers design. The World
  We Make Together cites that claim on the factory floor of meaning: management
  does not merely interpret behavior after the fact; it builds the room in which
  contribution becomes possible. The source contrasts managerial theories of the
  person; the book asks how shared purpose is made—or foreclosed—by the
  assumptions leaders bring in.
