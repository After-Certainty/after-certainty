whyThisMatters: >-
  The San Francisco 49ers’ March 3, 2017 release states that Colin Kaepernick
  opted out of his contract and became a free agent. The Game We Think We Saw
  takes that documented opt-out—and his subsequent unsigned status—as the
  factual ground of competing explanations: ordinary football evaluation versus
  institutional cost attached to protest. The club statement establishes the
  employment fact; the book asks how meaning contests attach to career outcomes.
