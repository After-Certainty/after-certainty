whyThisMatters: >-
  Iris Murdoch’s The Sovereignty of Good argues that moral attention requires
  letting reality—especially other persons—disturb selfish or comforting
  pictures of the world rather than polishing a self-serving vision. Trust
  Beyond Similarity invokes that demand when trust’s deeper work begins: each
  person must let another kind of sight unsettle their own. Murdoch’s essays are
  about moral vision and unselfing; the book applies that pressure to
  collaborative trust once similarity can no longer do the job.
