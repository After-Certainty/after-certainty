whyThisMatters: >-
  Steve Wyche’s August 27, 2016 NFL.com report quotes Colin Kaepernick
  explaining that he would not show pride in a flag for a country he said was
  oppressing Black people and people of color, citing racial injustice and
  police violence and acknowledging career risk. The Game We Think We Saw uses
  that attributed explanation to fix what concern the speaker said he was
  placing in public—without settling whether the protest was wise, fair, or
  likely to succeed. The interview establishes Kaepernick’s stated meaning; the
  book separates speaker intent from the contests over meaning that followed.
