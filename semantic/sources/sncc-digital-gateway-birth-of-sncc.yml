whyThisMatters: >-
  The SNCC Digital Gateway documents the April 15–17, 1960 Shaw University
  conference that founded the Student Nonviolent Coordinating Committee,
  including Ella Baker’s role in gathering student activists. The World We Make
  Together reads that founding against a recruitment model: students formed an
  independent coordinating force rather than becoming mere recruits of an
  established organization. The gateway establishes the conference and SNCC’s
  birth; the book asks what kind of leadership preserves local judgment instead
  of absorbing it upward.
