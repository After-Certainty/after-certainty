whyThisMatters: >-
  Clay v. United States (1971) overturned Muhammad Ali’s draft-evasion
  conviction, restoring a legal record after years of sporting and civic
  sanction. The Game We Think We Saw uses that arc—and parallel Olympic protest
  cases—to ask how history learns to keep a portable gesture while the
  contemporaneous reception treated the athlete as disloyal, shrinking meaning
  even when the record stays accurate.
