whyThisMatters: >-
  Martha Minow’s Between Vengeance and Forgiveness examines how societies after
  genocide and mass violence choose among trials, truth processes, reparations,
  and related responses—and how none fully settles the demands of justice,
  memory, and living on. After Certainty draws on that difficulty when arguing
  that hero and villain stories compress participation, systems, and incentives
  into a single address for blame. Minow maps institutional responses to
  atrocity; the book extends the compression problem into everyday moral
  narration that lets ordinary involvement disappear.
