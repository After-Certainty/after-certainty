whyThisMatters: >-
  March and Simon’s Organizations analyzes bounded rationality, routines, and
  how organizational structure shapes attention, search, and decision under
  constraint. When Moral Seriousness Scales cites that organizational tempo when
  deliberation under uneven constraint looks slow beside acceleration that
  displaces cost. The source is a foundational theory of organizational
  decision-making; the book asks why restraint bears more friction than velocity
  when moral seriousness must scale.
