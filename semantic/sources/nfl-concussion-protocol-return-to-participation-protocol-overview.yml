whyThisMatters: >-
  The NFL's Concussion Protocol and Return-to-Participation Protocol, developed
  by a committee that includes independent and league-affiliated physicians and
  advisers to the players' association, stages recovery under medical
  supervision and is described as reviewed annually. The Game We Think We Saw
  treats that staged process as a clinical and moral boundary: the protocol only
  begins when injury is reported, so silence and toughness culture can keep the
  gate from opening.
