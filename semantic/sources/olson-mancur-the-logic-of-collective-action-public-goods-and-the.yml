whyThisMatters: >-
  Olson's Logic of Collective Action argues that large groups systematically
  underprovide public goods because individual incentives favor free-riding
  unless selective pressures organize contribution. When Moral Seriousness
  Scales uses that incentive asymmetry for how friction that once slowed
  escalation can thin: actors who tolerate displacement may accumulate advantage
  while those who absorb cost keep practicing reciprocity alone.
