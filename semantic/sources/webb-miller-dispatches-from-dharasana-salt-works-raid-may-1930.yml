whyThisMatters: >-
  Webb Miller’s May 1930 dispatches from Dharasana described police beating
  unresisting salt-march volunteers and circulated internationally despite
  censorship pressures. When Others Become Leaders treats that witnessing as
  bodies becoming an argument in public view—without treating suffering itself
  as proof of moral correctness—and as leadership capacity that had been
  developing off-center before the center disappeared.
