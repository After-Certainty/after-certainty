whyThisMatters: >-
  Weber’s “Politics as a Vocation” distinguishes an ethic of conviction from an
  ethic of responsibility and treats political action as inevitably entangled
  with force and consequences. When Authority Outlives Accountability uses that
  framing for leadership morality as how leaders handle harm when they can
  choose otherwise—where cost is placed, how it is justified, and whether it is
  treated as unavoidable, regrettable, or useful.
