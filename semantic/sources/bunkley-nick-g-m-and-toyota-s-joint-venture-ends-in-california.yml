whyThisMatters: >-
  Bunkley's April 2010 report records the end of the GM-Toyota NUMMI
  partnership and Fremont manufacturing venture. The World We Make Together
  uses the closure to distinguish workers' authority over local production
  from executives' authority over the enterprise. That power-boundary
  interpretation belongs to the manuscript, not the news report.
