whyThisMatters: >-
  The Congressional Budget Office’s November 2024 report projects how automatic
  stabilizers—unemployment insurance, falling tax collections, Medicaid, and
  nutrition assistance—shift the federal budget from 2024 to 2034 as conditions
  change without new emergency statutes. The Economy We Don't Experience cites
  that fiscal machinery to name protection that works through hidden channels
  until a household needs a story about why a shock did not become collapse. The
  source estimates budgetary effects; the book asks what resilience looks like
  when continuity succeeds mostly out of sight.
