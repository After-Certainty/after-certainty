whyThisMatters: >-
  Lord, Ross, and Lepper’s 1979 JPSP experiment shows biased assimilation:
  people with opposing prior theories evaluate the same mixed evidence as
  supporting their side and can polarize further rather than converge. The
  Discipline of Uncertainty cites that psychology when success narrows
  attention—confirming what worked, dismissing anomalies, and treating dissent
  as disloyalty. The source is a controlled finding about prior theories and
  evidence; the book asks how stable authority becomes moral risk once success
  teaches arrogance.
