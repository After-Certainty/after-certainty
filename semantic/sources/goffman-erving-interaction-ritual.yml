whyThisMatters: >-
  Goffman’s Interaction Ritual analyzes the face-work and ceremonial exchanges
  that keep ordinary encounters stable. How Meaning Moves extends that archive
  into intimate rooms: private symbols, remembered arguments, and small acts of
  care become the shared memory that makes later meaning arrive already
  half-formed.
