whyThisMatters: >-
  The Reuters Institute Digital News Report 2024 surveys global digital news
  habits, trust, and industry pressures as advertising migrates and subscription
  models tighten. When Incentives Become the Moral Language cites that collapse
  of distance between revenue and each story—opens, time on page, subscriptions,
  return visits—as the business setting in which every article is asked to prove
  its worth. The report describes contemporary news-economy conditions; the book
  asks what happens when moral language and attention metrics fuse around
  individual pieces.
