whyThisMatters: >-
  Lowenstein’s biography traces how Buffett’s long record of successful
  investment decisions became a reputation that continued to attract investor
  trust into future commitments. When Trust Stops Tracking Reality uses that
  momentum as one case of trust behaving differently from fresh evidence:
  accumulated confidence makes the next act of trust easier. The source narrates
  reputation built from a track record; the book asks when inherited credibility
  still tracks reality and when it merely extends itself.
