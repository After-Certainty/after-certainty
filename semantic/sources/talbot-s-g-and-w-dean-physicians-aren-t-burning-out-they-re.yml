whyThisMatters: >-
  Talbot and Dean argue in STAT that what clinicians call burnout often tracks
  moral injury: distress from being unable to practice according to ethical
  commitments under institutional constraints. When Incentives Become the Moral
  Language uses that reframing beside the nurse who meets the chart criteria yet
  doubts readiness—to ask what dashboards cannot register when people carry the
  gap between what metrics defend and what the situation seems to require.
