whyThisMatters: >-
  Madison’s Federalist 10 and 51 defend republican scale, representation, and
  separated powers as answers to faction and concentrated authority. Coupling
  uses that design as a bridge from finance to governance: the same protections
  that limit concentrated power can also fragment consequence pathways and slow
  coherent institutional learning. The source argues for constitutional division
  under scale; the book asks what coupling looks like when redesign authority is
  intentionally dispersed.
