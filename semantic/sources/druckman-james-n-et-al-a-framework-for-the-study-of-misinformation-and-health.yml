whyThisMatters: >-
  Druckman and colleagues analyze how shared events during the COVID-19 pandemic
  produced divergent interpretations—different signals, experts, and risks—long
  before participants reached stable conclusions. When Trust Stops Tracking
  Reality uses that finding to show disagreement beginning at the level of
  attention, not only at the level of final belief. The book’s extension is that
  trust helps determine which story feels most available while evidence remains
  incomplete.
