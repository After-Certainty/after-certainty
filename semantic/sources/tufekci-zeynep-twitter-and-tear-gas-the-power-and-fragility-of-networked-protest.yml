whyThisMatters: >-
  Tufekci’s Twitter and Tear Gas analyzes how networked protest gains speed and
  visibility while remaining fragile where organizing capacity and institutional
  redesign lag. Coupling cites that speed–visibility–lag pattern beyond
  journalism: systems can couple tightly to what travels while remaining weakly
  coupled to authority that can redesign what keeps winning operationally.
