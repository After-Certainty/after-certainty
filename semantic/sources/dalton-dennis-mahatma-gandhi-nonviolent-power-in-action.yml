whyThisMatters: >-
  Dennis Dalton’s study of Gandhi’s nonviolent power centers the Salt March: a
  ceremonial violation at Dandi that Gandhi then declared reproducible—anyone
  willing to risk prosecution could manufacture salt and refuse the monopoly.
  When Others Become Leaders uses that documented gesture to distinguish
  singular legitimacy from transferable method. Dalton reconstructs the
  campaign; the book asks how authority that depends on a famous person differs
  from a movement prepared for his absence.
