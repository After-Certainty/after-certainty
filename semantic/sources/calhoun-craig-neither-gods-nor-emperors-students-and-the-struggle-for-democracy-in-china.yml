whyThisMatters: >-
  Calhoun's account studies the student movement, its organization, demands, and
  escalation in Beijing in spring 1989. When Authority Is Misread invokes that
  history before discussing the government's military response. The book's
  question about how reform narratives can displace dissent is its own
  interpretation, not an argument attributed to Calhoun.
