whyThisMatters: >-
  Sidney Fine’s Sit-Down documents the Flint GM occupation of 1936–1937: workers
  held the plants rather than walk out, blocking replacement labor and forcing
  recognition of the UAW amid fights over wages, security, and grievances. The
  World We Make Together uses that episode to show how collaboration’s ordinary
  meaning can reverse—formal ownership of buildings and machines does not settle
  who can make production continue. Fine supplies the labor history; the book
  asks what shared capacity looks like when dependence becomes undeniable.
