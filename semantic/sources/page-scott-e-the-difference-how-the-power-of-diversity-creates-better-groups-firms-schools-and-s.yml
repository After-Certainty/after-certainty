whyThisMatters: >-
  Scott E. Page's The Difference argues that cognitive diversity can improve
  problem-solving when groups can use differing perspectives as information
  rather than noise. Trust Beyond Similarity presses the trust condition Page's
  possibility requires: without it, difference becomes something to manage at
  the edge while the same assumptions stay protected.
