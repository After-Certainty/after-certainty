whyThisMatters: >-
  Daniel J. Simons and Christopher F. Chabris’s “Gorillas in Our Midst”
  experimentally demonstrated sustained inattentional blindness: observers miss
  a salient unexpected event when attention is engaged elsewhere. What We Cannot
  See takes that finding as evidence that attention selects rather than fails
  personally—minds stay usable by not registering everything that arrives. The
  experiment establishes a cognitive limit; the book asks what that limit means
  for ordinary competence and for shared seeing under load.
