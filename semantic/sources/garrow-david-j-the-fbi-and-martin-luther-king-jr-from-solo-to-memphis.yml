whyThisMatters: >-
  Garrow’s The FBI and Martin Luther King, Jr. documents Hoover-era
  surveillance, wiretaps, and smear campaigns meant to discredit King, fracture
  alliances, and feed hostile coverage. When Authority Is Misread cites that
  record as structural constraint continuous with local police violence and
  political delay—not a misunderstanding of rhetoric, but organized resistance
  to the costs King’s demands imposed. Garrow establishes the campaign against
  him; the book asks how authority is misread when hostility tracks threat to
  interests rather than failure to persuade.
