whyThisMatters: >-
  Kahneman’s Thinking, Fast and Slow synthesizes dual-process psychology and the
  biases that follow when easier questions substitute for harder ones, including
  how decisions can look justified after the fact. How Serious Systems Learn
  cites that backward standard—whether a choice was “reasonable given
  information at the time”—as answerable and auditable yet distinct from
  remaining corrigible. Kahneman maps cognitive systems and heuristics; the book
  asks when justified reasonableness replaces the harder demand that learning
  still be able to stop the work.
