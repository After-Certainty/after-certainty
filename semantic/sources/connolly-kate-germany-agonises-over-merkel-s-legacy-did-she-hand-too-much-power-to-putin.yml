whyThisMatters: >-
  Connolly’s 2022 Guardian report gathers the post-invasion German debate over
  whether Merkel-era energy policy and Russia exposure—Nord Stream, gas
  arrangements, industrial habit—traded present stability for later
  vulnerability. When Authority Is Misread uses that contested reassessment to
  separate precision about uncertainty from foresight about structure. The
  article records critics’ arguments; the book does not treat them as proof that
  reassurance would have been better, only as evidence that quiet cost
  allocation can be misread as settled wisdom.
