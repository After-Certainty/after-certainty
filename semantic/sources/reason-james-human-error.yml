whyThisMatters: >-
  James Reason's Human Error develops the Swiss Cheese Model: accidents occur
  when holes in multiple imperfect layers of defense align, allowing a hazard
  through. Trust Beyond Similarity uses that layered-failure logic for why bad
  outcomes rarely reduce to a single mistake—and why systems need trusted
  difference across roles when no one person sees enough.
