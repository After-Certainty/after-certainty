whyThisMatters: >-
  Barbara Ransby's biography of Ella Baker documents her insistence that student
  activists retain autonomy and practice group-centered leadership rather than
  become a youth division of an established organization. The World We Make
  Together takes that autonomy as leadership that works by making itself less
  visibly necessary—gathering people capable of leading from their own
  communities, not only following a few national figures.
