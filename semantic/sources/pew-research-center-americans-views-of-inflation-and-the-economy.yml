whyThisMatters: >-
  Pew Research Center survey reports from 2022–2024 track how Americans view
  inflation and the economy, often diverging from aggregate reassurance. The
  Economy We Don't Experience uses that household-level mismatch for the
  chart-and-receipt problem: when institutions only repeat the aggregate more
  forcefully, disagreement shifts from numbers to whether the speaker
  understands what the statistic leaves out.
