whyThisMatters: >-
  Blackwell traces how Galileo’s observations narrowed the room in which older
  scriptural-interpretive habits could ignore instrumental seeing. When
  Authority Is Misread reads that narrowing as a contest over permission: who
  may claim that new evidence has changed what counts as visible.
