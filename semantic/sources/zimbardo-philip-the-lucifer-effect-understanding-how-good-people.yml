whyThisMatters: >-
  Zimbardo’s The Lucifer Effect synthesizes situational research—including the
  Stanford prison study—on how ordinary people commit harm when systems
  authorize, excuse, or conceal it. When Authority Outlives Accountability pairs
  that situational account with related sources to shift leadership morality
  from character labels toward how leaders handle harm when they have power to
  choose otherwise.
