whyThisMatters: >-
  IFAB’s VAR protocol distinguishes review speeds: slow motion is generally
  reserved for factual matters such as position or point of contact, while
  normal speed is more appropriate for judging intensity or deliberateness. The
  Game We Think We Saw uses that rule to show how footage that seems more
  precise can change the experiential conditions of judgment. IFAB sets
  operational guidance; the book asks what slow motion answers—and what it makes
  harder to see—about events that never occurred at that speed.
