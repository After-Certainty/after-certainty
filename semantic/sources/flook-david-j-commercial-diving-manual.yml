whyThisMatters: >-
  Flook’s Commercial Diving Manual details saturation diving as coordinated
  life-support work: divers, supervisors, technicians, engineers, and medical
  staff each see a different slice of a hazardous environment no single
  viewpoint can cover. Trust Beyond Similarity takes that distributed expertise
  as a model of trust that is not casual warmth or equal confidence about
  everything. The manual describes operational necessity; the book asks how
  trust holds when survival depends on taking others’ partial sight seriously.
