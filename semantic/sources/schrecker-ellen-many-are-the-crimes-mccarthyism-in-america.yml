whyThisMatters: >-
  Ellen Schrecker’s Many Are the Crimes documents the postwar U.S.
  loyalty-security state, congressional investigations including HUAC’s
  Hollywood hearings, and the reorganization of dissent as contamination. When
  Authority Is Misread uses that history for how investigation theater
  reassigned questions into loyalty tests—sorting signals about sides and oaths
  rather than open fact-finding. Schrecker establishes the McCarthy-era record;
  the book asks when the form of inquiry survives while its purpose becomes
  attendance and allegiance.
