whyThisMatters: >-
  François Clemmons’s memoir, written with Tim Madigan, recounts his years as
  Officer Clemmons on Mister Rogers’ Neighborhood, including the 1969
  wading-pool scene with Fred Rogers. When Others Become Leaders reads that
  documented intimacy as leadership that does not defeat procedure but gives it
  something worth serving—shared moral experience rather than mere charm.
  Clemmons’s testimony supplies the episode; the book asks what kind of
  influence recovers a listener’s own moral memory instead of only securing
  compliance.
