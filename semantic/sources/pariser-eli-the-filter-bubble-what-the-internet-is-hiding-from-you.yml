whyThisMatters: >-
  Eli Pariser's The Filter Bubble describes how personalized distribution can
  narrow shared public exposure by ranking what each user is most likely to
  engage. Coupling uses that exposure dynamic—without treating personalization
  as destiny—for the correction problem: updating an article is easy, while
  updating what millions already absorbed is much harder.
