whyThisMatters: >-
  David’s QWERTY essay shows how a keyboard layout that solved mechanical-jam
  constraints can persist after those constraints disappear. Living in Sediment
  uses that case as ordinary sediment: children inherit a map designed for a
  vanished landscape. The source establishes path-dependent persistence; the book
  asks what else in daily life still solves problems that no longer exist.
