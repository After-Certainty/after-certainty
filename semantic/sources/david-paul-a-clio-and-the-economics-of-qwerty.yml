whyThisMatters: >-
  David’s influential QWERTY account relates early typewriter constraints to
  later typing conventions and switching costs that can preserve a keyboard
  layout as machinery changes. Parts of that historical explanation remain
  contested, so Living in Sediment treats the example as an illustration of
  technological inheritance, not proof that QWERTY was an inferior standard.
  The book asks how conventions outlive the conditions in which they formed.
