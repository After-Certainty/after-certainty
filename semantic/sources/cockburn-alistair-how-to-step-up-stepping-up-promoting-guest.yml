whyThisMatters: >-
  Cockburn’s “guest leadership” essay describes how people without formal
  authority can step up—and step back—so collaboration keeps moving when the
  titled leader is not the best actor for the moment. When Others Look to You
  starts from a related observation: leadership begins when others take their
  cues from you, title or not. The book extends Cockburn’s collaboration
  practice into the moral weight of that attention—influence multiplies once
  people keep looking.
