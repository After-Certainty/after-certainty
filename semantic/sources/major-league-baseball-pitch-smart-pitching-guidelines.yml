whyThisMatters: >-
  Major League Baseball’s Pitch Smart guidelines (with USA Baseball) recommend
  age-based pitch counts, rest, and limits on year-round and overlapping
  competitive throwing to reduce injury risk from fatigue and overload. The Game
  We Think We Saw treats the pitch count as an unusually plain protective number
  standing between the athlete and the story the inning wants. The source is
  workload guidance for youth pitching; the book asks what the game narrative
  obscures when protection must interrupt drama.
