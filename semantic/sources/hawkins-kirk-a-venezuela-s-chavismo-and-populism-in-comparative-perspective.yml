whyThisMatters: >-
  Hawkins’s comparative study of Chavismo analyzes populist peoplehood grammar,
  leader embodiment, and loyalty that can outlast coherent program delivery,
  including how moral people-versus-elite framing organizes identification. When
  Interpretation No Longer Matters cites that grammar alongside oil-financed
  missions and continuous media recognition as a case where naming and belonging
  saturate the public sphere. Hawkins maps populist discourse and loyalty; the
  book asks what happens when a name survives every platform while correction
  weakens.
