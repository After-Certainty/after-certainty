whyThisMatters: >-
  Carr argues that historical facts do not speak for themselves—selection and
  present questions shape what counts as the past. Living in Sediment turns that
  practice into archaeological attention to ordinary life: noticing that
  September still means seven reveals layered arrangements that feel like
  nature.
