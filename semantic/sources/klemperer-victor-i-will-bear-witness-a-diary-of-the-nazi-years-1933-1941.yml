whyThisMatters: >-
  Klemperer’s diary of life under Nazi Germany records everyday survival beneath
  a required public surface—watched language, measured greetings, private
  judgments stored where they could not yet become public acts. When
  Interpretation No Longer Matters places that testimony beside the regime’s
  dismantling of an evaluative public sphere: private understanding persisted
  without leverage. The source is a contemporaneous witness to ordinary life
  under repression; the book asks what applause and belonging-speech do when
  interpretation no longer opens repair.
