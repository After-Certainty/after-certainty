whyThisMatters: >-
  In Considerations on Representative Government, John Stuart Mill argues that
  the franchise carries a public duty: voters should weigh the common interest
  rather than treat the ballot as private property for private advantage alone.
  The World We Make Together cites that obligation while noting the secret
  ballot’s limits on enforcing motive. Mill’s claim is normative and
  institutional; the book asks what civic work must precede a mark that
  otherwise chooses among unexamined stories.
