whyThisMatters: >-
  Fricker’s Epistemic Injustice shows how credibility is unevenly distributed
  across relationships and institutions, producing testimonial and hermeneutical
  harms. How Trust Forms ties that unevenness to ordinary interpretation: the
  same words read differently depending on whether the source is trusted or
  doubted. Fricker diagnoses credibility injustice; the book asks how trust
  shapes what people are willing to hear before they evaluate the claim.
