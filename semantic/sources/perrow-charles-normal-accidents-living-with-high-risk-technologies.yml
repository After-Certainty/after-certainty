whyThisMatters: >-
  Charles Perrow's Normal Accidents argues that interactive complexity plus
  tight coupling make some high-risk system failures normal properties of
  design, not merely operator error. How Serious Systems Learn pairs that
  systems diagnosis with a further question about scale: when reversal
  interferes with coordination and authority, "learning" can shrink to refining
  a chosen path rather than remaining able to reverse it.
