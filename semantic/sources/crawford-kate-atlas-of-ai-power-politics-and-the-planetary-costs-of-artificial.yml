whyThisMatters: >-
  Kate Crawford's Atlas of AI traces the labor, resources, governance decisions, and political arrangements concealed when artificial intelligence is framed as neutral computation. Living in Sediment cites the book where organizational responsibility for algorithmic decisions disperses across engineers, managers, regulators, and infrastructures. Crawford's account supports the visibility of power relations; the manuscript's account of sediment and delegated judgment is its own.
