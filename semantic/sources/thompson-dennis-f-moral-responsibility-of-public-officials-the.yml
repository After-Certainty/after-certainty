whyThisMatters: >-
  Thompson’s “problem of many hands” shows how collective action disperses
  causal and moral responsibility so that no single official can be cleanly held
  accountable for outcomes. After Certainty extends the structure to personal
  scale: responsibility can persist after control thins, because participation
  itself remains available even when agreement, reversal, or effectiveness
  cannot be guaranteed.
