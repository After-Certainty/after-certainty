whyThisMatters: >-
  The Pluralism Project’s overview of langar describes the Sikh communal meal
  open to visitors without regard to religion, caste, wealth, or status,
  expressing equality, hospitality, community, and the oneness of humankind
  through seva. The World We Make Together places that arrangement beside
  institutional budgets and waiting rooms to ask whether care is treated as
  central work or as inconvenience someone else absorbs. The source explains a
  living practice; the book’s inference is about how seating and service encode
  whose flourishing counts.
