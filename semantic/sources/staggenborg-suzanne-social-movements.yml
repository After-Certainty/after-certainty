whyThisMatters: >-
  Suzanne Staggenborg’s Social Movements surveys how movements form coalitions,
  manage competing interests, and sustain collective action over time. Trust
  Beyond Similarity uses that coalition literature for how difference creates
  friction before learning—patience sounding like erasure, urgency like
  recklessness, feasibility warnings like betrayal. Staggenborg maps movement
  dynamics; the book asks why the right people and named values still fail when
  trust cannot hold disagreement.
