whyThisMatters: >-
  Cappelli and Tavis document why many employers abandoned annual appraisals
  and forced rankings for frequent, development-focused conversations—and why
  score-based machinery proved sticky. When Incentives Become the Moral Language
  uses that contrast: even as appraisal rituals change, residual ratings and
  calibration can still become the moral language of workforce decisions until
  comparability substitutes for authored judgment.
