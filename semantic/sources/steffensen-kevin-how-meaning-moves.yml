whyThisMatters: >-
  Kevin Steffensen’s How Meaning Moves argues that summaries are compressed
  meaning traveling through groups—budgets, designs, meeting notes, and ordinary
  judgments that select what belongs in the foreground. Trust Beyond Similarity
  cites that account when a summary forgets it is a summary and each party
  treats its compression of the same situation as the whole. The companion book
  theorizes meaning-in-motion; Trust Beyond Similarity asks what trust requires
  when people inhabit different compressions of one shared problem.
