whyThisMatters: >-
  Joseph Smith—History in the Pearl of Great Price narrates the first-vision
  sequence as canonical premise: neighboring Protestant common sense is left
  behind once revelation is received as implication. When Interpretation No Longer
  Matters reads that text as the door that opens only inward—evaluation after the
  premise, not before it. The scripture supplies the revelatory frame; the book
  asks what public interpretation can still do once a community’s starting point
  is no longer shared.
