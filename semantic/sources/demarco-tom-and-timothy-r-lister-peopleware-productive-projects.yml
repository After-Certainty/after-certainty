whyThisMatters: >-
  Tom DeMarco and Timothy Lister’s Peopleware insist that productive teams need
  human conditions—including uncommitted capacity and freedom from constant
  interruption—not only tighter process. How Serious Systems Learn renames that
  margin as slack: the technical condition that makes pause, interruption, and
  reversal possible without collapse. Their management claim is about people and
  environment; the book’s extension is interruptibility as the moral expression
  of that capacity.
