whyThisMatters: >-
  Bauman analyzes how modern organization can distance people from the suffering
  their systems produce. When Accountability No Longer Expires uses that
  distance to explain a quieter failure mode: institutions can look stable while
  harm is allocated to those least able to interrupt it.
