whyThisMatters: >-
  Robert J. Shiller’s Narrative Economics argues that contagious stories help
  drive major economic events alongside conventional variables. The Economy We
  Don't Experience uses that viral-narrative frame for how employment releases
  become headlines and campaign verdicts—detailed maps compressed into flags.
  Shiller theorizes narrative contagion in economies; the book asks how
  institutional incentives strip uncertainty until explanation becomes
  signaling.
