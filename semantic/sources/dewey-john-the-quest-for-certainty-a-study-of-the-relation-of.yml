whyThisMatters: >-
  In The Quest for Certainty, Dewey criticizes the philosophical drive to secure
  knowledge apart from risky action, and argues for experimental intelligence
  open to revision. After Certainty uses that critique to separate truth pursued
  through revision from correctness treated as an identity people possess. The
  book’s question is what changes when the goal stops being to arrive at final
  rightness and starts being to remain revisable.
