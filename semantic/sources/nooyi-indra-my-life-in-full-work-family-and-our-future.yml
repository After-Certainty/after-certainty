whyThisMatters: >-
  Indra Nooyi's memoir recounts her path from Madras through consulting and
  PepsiCo strategy roles to the chief executive office, and how investors,
  analysts, and boards read an immigrant woman leading a global
  food-and-beverage company. When Authority Is Misread uses that lived record
  for how corporate systems count readiness in familiar operator categories—then
  misread when the same operational authority reopens questions those categories
  refused to hold.
