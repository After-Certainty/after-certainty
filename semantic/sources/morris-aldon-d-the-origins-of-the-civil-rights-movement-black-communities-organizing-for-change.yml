whyThisMatters: >-
  Aldon Morris’s The Origins of the Civil Rights Movement reconstructs Black
  community organizing infrastructure—churches, associations, and logistics such
  as the Montgomery Improvement Association’s carpools and weekly gatherings
  that made sustained boycott possible. When Others Become Leaders cites that
  infrastructure to show influence moving through thousands of small decisions
  that never become famous. Morris establishes the organizational history; the
  book asks how leadership makes injury legible as something people can answer
  together.
