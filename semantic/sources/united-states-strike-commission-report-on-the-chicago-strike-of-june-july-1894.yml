whyThisMatters: >-
  The U.S. Strike Commission’s 1895 report on the Pullman/ARU conflict documents
  how a local labor dispute became a national rail interruption when workers
  refused trains carrying Pullman cars. The World We Make Together reads that
  scale shift as interdependence made visible by interruption: shared action
  created leverage no individual worker had, revealing that trains had always
  depended on denied labor.
