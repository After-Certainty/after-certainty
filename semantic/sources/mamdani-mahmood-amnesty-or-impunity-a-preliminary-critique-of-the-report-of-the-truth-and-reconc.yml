whyThisMatters: >-
  Mahmood Mamdani's critique of South Africa's TRC warns that individualized
  perpetrator-victim framing may miss structural oppression and redistribution. When
  Authority Is Misread cites this specific argument while resisting the false
  conclusion that all the commission's work should be dismissed.
