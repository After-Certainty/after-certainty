whyThisMatters: >-
  Horwitz and Seetharaman’s May 2020 Wall Street Journal reporting describes
  Facebook executives shutting down internal efforts to make the site less
  divisive when engagement and growth concerns prevailed. When Incentives Become
  the Moral Language uses that episode for how predicted relevance can
  distribute agitation without anyone claiming to choose anger as a moral end.
  The article reports executive decisions and tradeoffs; the book asks when
  attention becomes both the measurement and the reward.
