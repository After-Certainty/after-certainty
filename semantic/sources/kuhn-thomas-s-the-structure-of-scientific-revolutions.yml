whyThisMatters: >-
  Kuhn’s Structure of Scientific Revolutions describes normal science under
  paradigms and how communities persist with methods and problem-sets even after
  the questions that once justified them have shifted. Learning to See uses that
  persistence as a model for sedimented practice: success is misread as
  permanent warrant, so yesterday’s methods become evidence against tomorrow’s
  questions. The source is about scientific communities and paradigm change; the
  book asks how organizations treat “it worked before” as proof rather than as a
  claim under new conditions.
