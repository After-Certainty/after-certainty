whyThisMatters: >-
  Pettigrew and Tropp's 2006 meta-analysis finds that intergroup contact
  generally reduces prejudice across many studies, while also noting conditions
  and status asymmetries that shape effects for majority- and minority-status
  groups. The World We Make Together refuses contact-as-solvent: people can meet
  and still remain separated by rank, fear, or unequal threat that equal-trust
  rhetoric conceals.
