whyThisMatters: >-
  Kruglanski’s 1990 Psychological Review paper theorizes a need for cognitive
  closure: a motivated urgency to seize and freeze on a definite answer rather
  than remain in ambiguity. How Meaning Moves extends that pressure into
  intimate misreading—the relief of correcting “that is not what I meant” versus
  the cost of living inside someone else’s unfinished account. The source names
  a psychological drive for closure; the book asks what meaning can still do
  when silence postpones repair while consequence accumulates.
