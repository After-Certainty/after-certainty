whyThisMatters: >-
  South African History Online’s “Election Results 1994” reports that
  approximately 19.7 million votes were cast in the April 1994 nonracial
  election and that seven parties gained representation in Parliament. The World
  We Make Together uses those figures for the scale of the first election on a
  common voters’ roll while insisting numbers cannot convey what the ballot felt
  like in the hand. The archive establishes vote totals and party
  representation; the book asks what shared democratic objects can and cannot
  carry.
