whyThisMatters: >-
  In Experience and Education, Dewey argues that experience alone does not
  guarantee learning; people learn when experience stays tied to reflection and
  revision rather than mere repetition. When Trust Stops Tracking Reality
  applies that condition to trust: participation keeps trust healthy only when
  it still exposes beliefs to correction. The book’s inference is that drift
  begins when the same experiences are reinterpreted as reasons to deepen
  commitment instead of revise it.
