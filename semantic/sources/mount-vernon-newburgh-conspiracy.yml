whyThisMatters: >-
  Mount Vernon’s Newburgh Conspiracy article summarizes the officers’ anonymous
  proposals, their subsequent resolutions affirming confidence in Washington and
  civilian government, and Washington’s continued advocacy for compensation
  before Congress. The World We Make Together cites that aftermath to keep the
  scene from collapsing into pure myth of greatness: the immediate threat
  subsided while structural grievances remained. The source documents the
  conspiracy’s sequence; the book asks how authority in the chair can enlarge a
  group’s capacity without pretending the underlying conflict has vanished.
