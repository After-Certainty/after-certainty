whyThisMatters: >-
  Figes’s The Whisperers reconstructs private life under Stalin, including how
  purge-era confession theater, denunciation, and camp expansion shaped what
  people could safely say and know. When Interpretation No Longer Matters cites
  that record for the double curriculum of public ritual: the accused speak
  guilt into the record, and spectators accept the record as the price of
  remaining spectators. The book extends Figes’s social history into an
  operational question—what happens when the official version of truth becomes
  the only available performance.
