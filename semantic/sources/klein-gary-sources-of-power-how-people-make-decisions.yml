whyThisMatters: >-
  Klein’s Sources of Power, drawn from naturalistic studies of experienced
  decision makers, shows how recognition-primed judgment under time pressure
  favors committing to a workable first option rather than slow comparative
  analysis. How Serious Systems Learn cites that decisiveness bias to name a
  structural asymmetry: local systems reward commitments that are easy to defend
  and hard to reverse, while corrigibility looks inefficient in the moment. The
  source explains how experts decide in the field; the book asks why
  interruption and stop-authority lose the local competition even among
  well-intentioned actors.
