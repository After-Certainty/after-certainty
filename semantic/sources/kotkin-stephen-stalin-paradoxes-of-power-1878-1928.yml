whyThisMatters: >-
  Kotkin’s Stalin: Paradoxes of Power reconstructs how, after Lenin’s death in
  1924, Stalin assembled dominance through Party-state offices and institutional
  leverage rather than charismatic fog alone, until opposing the line ceased to
  be a livable public move. When Interpretation No Longer Matters uses that
  hardness of office to show a hall that learns to police itself once safety and
  orthodoxy fuse. The source establishes the architecture of consolidation in
  the 1920s; the book asks what remains of argument when disagreement is no
  longer survivable.
