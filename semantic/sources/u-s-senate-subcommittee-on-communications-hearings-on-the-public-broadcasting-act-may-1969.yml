whyThisMatters: >-
  The May 1969 Senate subcommittee hearings on public broadcasting recorded Fred
  Rogers’s testimony defending federal support in a room organized around
  expenditure justification. When Others Become Leaders treats that appearance
  as a case of leadership that increases others’ capacity to stay present—work
  hard to attribute because it becomes part of the person rather than a résumé
  line.
