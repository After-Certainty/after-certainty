whyThisMatters: >-
  The World Bank’s Porto Alegre report describes participatory budgeting
  assemblies and cites roughly 40,000 participants influencing a substantial
  share of public investment by the late 1990s. The World We Make Together
  treats the case as expertise developing through participation rather than as
  proof that residents suddenly became professional budgeters.
