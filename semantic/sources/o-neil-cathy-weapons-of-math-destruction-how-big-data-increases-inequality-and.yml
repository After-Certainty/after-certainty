whyThisMatters: >-
  Cathy O'Neil argues that opaque, scalable scoring models can amplify
  inequality and punish people at a distance while presenting themselves as
  neutral measurement. Living in Sediment extends that warning into ordinary
  score-following—credit, readiness, follower counts—where useful maps become
  landscapes people monitor and fear, mistaking the number for the life it
  summarizes.
