whyThisMatters: >-
  Løgstrup’s The Ethical Demand argues that trust and interdependence place part
  of another’s life in one’s hands, making ethical claim prior to contractual
  choice. Trust Beyond Similarity draws that interdependence into the claim that
  every perspective is incomplete—we need others not because they see the whole,
  but because they may see what our position misses. The source is a
  philosophical account of trust as fundamental exposure; the book asks how
  partial perspectives become trustworthy without requiring sameness.
