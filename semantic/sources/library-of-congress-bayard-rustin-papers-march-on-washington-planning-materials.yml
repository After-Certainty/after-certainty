whyThisMatters: >-
  The Library of Congress Bayard Rustin papers preserve March on Washington
  planning materials detailed enough to advise marchers what to carry—logistics
  as the condition of public expression. When Others Become Leaders treats
  Rustin’s coordination as leadership work often mislabeled “behind the scenes,”
  including the double bind of indispensable expertise under prejudice. The
  source is archival planning evidence; the book asks how movements depend on
  organizers whose visibility institutions still treat as liability.
