whyThisMatters: >-
  Donald A. Schön’s The Reflective Practitioner describes how professionals
  think in action through reflection-in-action rather than applying fixed
  technical rules regardless of context. How Serious Systems Learn uses that
  contrast when living heuristics freeze into doctrine: method fidelity rises
  while real-world fitness declines because identity displaces adaptation. Schön
  theorizes reflective practice; the book asks what institutional incentives
  freeze methods into myths that preserve identity over fitness.
