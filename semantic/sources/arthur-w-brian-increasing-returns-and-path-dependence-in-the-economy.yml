whyThisMatters: >-
  Arthur shows how increasing returns lock early solutions into place until they
  feel natural rather than contingent. Living in Sediment takes that lock-in
  into ordinary life: weekdays, keyboards, and dialing habits keep solving
  vanished constraints long after the original problem is gone.
