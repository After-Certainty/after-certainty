whyThisMatters: >-
  Laclau’s On Populist Reason theorizes empty or floating signifiers and chains
  of equivalence through which a name can gather heterogeneous demands into a
  “people” without requiring identical concrete wants. When Interpretation No
  Longer Matters invokes that lens lightly for Peronism as an identity-full,
  program-thin container—not as primary archival proof of Argentine events. The
  source is a conceptual account of populist signification; the book asks what
  happens when belonging outruns platform and contradiction no longer reopens
  allegiance.
