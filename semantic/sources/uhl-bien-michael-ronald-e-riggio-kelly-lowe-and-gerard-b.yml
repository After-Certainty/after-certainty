whyThisMatters: >-
  Uhl-Bien, Riggio, Lowe, and Carsten’s followership review reframes leadership
  as co-constructed: followers selectively accept, adjust, or resist rather than
  simply obey. When Others Look to You uses that agenda to separate attention
  from obedience—being looked to does not mean being complied with, and dissent
  or quiet resistance can be part of how influence actually works.
