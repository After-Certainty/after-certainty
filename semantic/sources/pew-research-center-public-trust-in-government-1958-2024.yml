whyThisMatters: >-
  Pew Research Center's Public Trust in Government series tracks U.S. trust
  levels from 1958 through 2024 and documents a long decline across decades and
  parties. When Incentives Become the Moral Language places that trend beside
  metricized politics—without claiming Pew isolates a single cause—and asks when
  public speech begins to orbit countable signals rather than reasons
  institutions are willing to own.
