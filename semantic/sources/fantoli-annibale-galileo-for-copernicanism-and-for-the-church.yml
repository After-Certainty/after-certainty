whyThisMatters: >-
  Fantoli’s Galileo: For Copernicanism and for the Church emphasizes the
  complexity of Church scholarship alongside doctrinal guardianship, resisting a
  cartoon duel between science and religion. When Authority Is Misread follows
  that framing: Galileo forced into the open a contest over who may decide which
  forms of seeing are admissible when new instruments change what counts as
  evidence. The book’s claim concerns interpretive permission under new
  instruments, not a story of solitary genius against uniform ignorance.
