whyThisMatters: >-
  The 2018 Knight Foundation and Gallup report American Views: Trust, Media and
  Democracy surveys how Americans relate trust in news to democratic confidence
  and media performance. When Incentives Become the Moral Language cites that
  trust terrain while arguing that engagement dashboards record clicks and
  shares more readily than the quiet erosion of credibility when headlines
  overpromise. The source measures public attitudes toward media and democracy;
  the book asks what incentive language cannot see when the reader feels trapped
  between performance and evidence.
