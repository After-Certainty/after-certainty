whyThisMatters: >-
  Charles M. Payne's I've Got the Light of Freedom documents the Mississippi
  freedom struggle's organizing tradition, including Ella Baker's connecting Bob
  Moses with Deep South organizers such as Amzie Moore and the turn toward
  sustained voter registration. The World We Make Together treats that network
  as relationship-laden local history—each link carrying counties, risks, and
  memory a visitor could not invent from a list of names.
