whyThisMatters: >-
  Tronto’s Moral Boundaries treats care as political and social life grounded in
  interdependence—humans give and receive care throughout life, not as a private
  exception to independence. The World We Make Together extends that claim
  against the fiction of the self-sufficient person: independence exists only
  because dependence has been hidden, and “uniquely caring” praise can become an
  extraction system.
