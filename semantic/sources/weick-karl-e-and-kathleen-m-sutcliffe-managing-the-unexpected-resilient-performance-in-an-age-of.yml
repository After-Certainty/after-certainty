whyThisMatters: >-
  Weick and Sutcliffe’s Managing the Unexpected develops high-reliability
  practices—preoccupation with failure, deference to expertise, near-miss
  attention—for resilient performance under uncertainty. The Discipline of
  Uncertainty cites that near-miss/drift vocabulary as a frame that once let
  people name discomfort without contempt; when such frames fracture, what is
  lost is orientation that revision is still allowed.
