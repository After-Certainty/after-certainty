whyThisMatters: >-
  Richard Sennett’s Together examines the rituals, skills, and politics of
  cooperation—how people work across difference and what craft cooperation
  requires. Why Collaboration Is So Hard uses the insight that successful
  collaboration often produces an illusion of inevitability: the finished result
  hides the negotiations that made it possible. Sennett analyzes cooperation’s
  craft; the book asks how that smoothness distorts recognition and credit for
  the work that never appears on stage.
