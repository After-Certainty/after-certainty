whyThisMatters: >-
  Andrews, Pritchett, and Woolcock argue that public organizations escape
  capability traps through problem-driven iteration more reliably than through
  large redesigns detached from feedback. Coupling uses that finding to ask when
  simplification preserves ownership and consequence return—and when it only
  removes structure.
