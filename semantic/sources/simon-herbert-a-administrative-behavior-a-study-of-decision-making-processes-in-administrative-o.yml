whyThisMatters: >-
  Herbert A. Simon’s Administrative Behavior establishes bounded rationality and
  how administrative organizations fragment decision-making under complexity.
  Coupling cites that tradition for diffuse accountability: more reporting,
  stakeholders, and review layers without cohesive ownership of redesign. Simon
  theorizes administrative decision processes; the book asks when organizations
  become better at explaining problems than correcting them.
