whyThisMatters: >-
  The Freeh Report on Penn State and Sandusky documents how institutional
  loyalty and identification with senior figures led many supporters to
  experience criticism of the university—and of Joe Paterno—as an attack on the
  community itself. When Trust Stops Tracking Reality takes that finding as a
  mechanism: trust stops being something you hold and becomes something you are,
  so identity can outrun evidence. The report records institutional failure and
  identity defense; the book asks when commitment no longer tracks what is
  actually happening.
