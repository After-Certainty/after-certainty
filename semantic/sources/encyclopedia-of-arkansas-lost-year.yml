whyThisMatters: >-
  The Encyclopedia of Arkansas entry on the “Lost Year” records that after the
  1957–58 Central High crisis, Little Rock’s public high schools were closed for
  1958–59 rather than continue desegregation, displacing roughly 3,700 students
  until a federal court struck down the closing law. The World We Make Together
  treats that episode as structural migration of exclusion: when soldiers could
  no longer block the entrance, officials closed the institution. The book’s
  claim is about how architectures of exclusion survive reform by changing form,
  not about denying the legal or personal stakes of the students involved.
