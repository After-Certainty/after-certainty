whyThisMatters: >-
  Levine reads the Zacchaeus episode and related parables against first-century
  status, wealth, and Roman tax realities rather than later pious flattening. When
  Others Become Leaders uses that historical sharpness for how welcome and
  accountability meet at a table. Levine restores social texture to the story; the
  book asks what kind of leadership begins when relationship makes wealth
  answerable without collapsing into neat moral theater.
