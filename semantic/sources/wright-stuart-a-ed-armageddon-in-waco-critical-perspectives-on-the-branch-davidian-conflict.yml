whyThisMatters: >-
  Wright’s edited volume gathers critical perspectives on Branch Davidian
  history, the 1993 ATF raid, standoff, and fire, documenting competing
  evaluations of the conflict. When Interpretation No Longer Matters uses Waco
  as a dated case of epistemic enclosure: abundant internal interpretation with
  failed permeability, where outside pressure is pre-digested as confirmation
  rather than allowed to correct the story.
