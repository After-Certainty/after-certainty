whyThisMatters: >-
  The Associated Press reports Nike’s September 2018 campaign built around
  Kaepernick as a commercial image of conviction after his protest. The Game We
  Think We Saw uses that translation—from quarterback to protester to brand
  symbol—to ask what a gesture still means once markets restore visibility on
  their own terms. The wire story records the ad’s public debut; the book asks
  whether commercial recovery clarifies or replaces the protest’s original claim.
