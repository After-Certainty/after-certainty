whyThisMatters: >-
  Abate's contemporaneous reporting follows NUMMI workers as the Fremont
  plant closes in 2010. The World We Make Together pairs their final
  goodbyes with the corporate closure to distinguish meaningful workplace
  participation from control over whether the workplace survives. The
  agency argument is the book's interpretation of those reported events.
