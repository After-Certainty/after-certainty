whyThisMatters: >-
  The Institute of Medicine's 2007 review describes constrained emergency-care
  capacity, crowded hospitals, and the difficulty of transferring patients to
  inpatient beds. When Incentives Become the Moral Language cites that system
  pressure where the hospital must coordinate many rooms and decisions at once.
  The source documents capacity and boarding pressures; the book's argument
  about how judgment travels through standardized criteria is its own.
