whyThisMatters: >-
  Tillich’s The Courage to Be frames courage as affirmation of being amid
  anxiety and nonbeing, contrasting authentic commitment with anxiety managed as
  false certainty. The Discipline of Uncertainty uses that contrast when
  certainty fails: discipline refuses irony and cynicism as total verdicts and
  keeps commitment without prophecy—shared seriousness rather than shared fate
  scripts.
