whyThisMatters: >-
  LeDoux’s The Emotional Brain synthesizes neuroscience on how threat and
  affective circuits can shape appraisal before slower, reflective language
  finishes its work. How Meaning Moves places that timing in ordinary
  conversation: hesitation, silence, and tone register as signal while words are
  still arriving. The source maps emotional processing pathways; the book asks
  how meaning moves when rooms hear confidence, rank, and fear before they hear
  propositions.
