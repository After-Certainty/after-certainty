whyThisMatters: >-
  Fitzpatrick’s Everyday Stalinism shows how Stalinist rule remade ordinary
  life—collectivization, classification, requisition, famine, rationing—until
  agreement itself became an administrative atmosphere. When Interpretation No
  Longer Matters cites that social history for how the set of safe moves narrows
  before cognition does: villages and cities learn the regime in emptied barns,
  closed roads, and ration cards. The book uses Fitzpatrick’s account to ask
  what public speech becomes when the apparatus, not persuasion, sets the price
  of dissent.
