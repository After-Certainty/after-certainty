whyThisMatters: >-
  Robert Putnam's Bowling Alone documents declining U.S. civic engagement and
  social capital and links denser patterns of participation and mutual reliance
  to healthier community outcomes over time. How Trust Forms uses that
  cumulative ordinary participation for outcomes no one owns: neighborhoods
  survive less by singular heroes than by reliance that accumulated into
  something durable.
