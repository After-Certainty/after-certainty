whyThisMatters: >-
  The National Park Service’s March History page estimates roughly 250,000
  participants at the August 28, 1963 March on Washington and situates the
  gathering on the National Mall. The World We Make Together cites that
  attendance figure to reopen the photograph’s crowd as logistics—buses, trains,
  churches, unions, and networks—not a single face at a microphone. NPS provides
  the public-history estimate; the book asks what the image cannot show about
  how a shared public action was assembled.
