whyThisMatters: >-
  Naomi Osaka’s 2021 TIME essay explains her refusal of mandatory press
  conferences on mental-health grounds and proposes limited absences from media
  duties without forcing private medical disclosure—while acknowledging tennis’s
  off-court commitments. The Game We Think We Saw treats the case as a dispute
  about the job around the game: what the result demands beyond playing the
  match. Osaka states her reasons and proposal; the book asks how athlete and
  institution each hold legitimate claims when media obligation is part of the
  competitive package.
