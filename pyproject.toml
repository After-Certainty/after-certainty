[project]
name = "after-certainty"
version = "0.0.0"
description = "Manuscript monorepo tooling for After Certainty"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "jsonschema>=4",
  "PyYAML>=6",
  "pytest>=8",
  "ruff>=0.9",
  "pre-commit>=4",
  "python-docx>=1.1",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["tools", "scripts", "tests"]

[tool.ruff.lint]
# Pyflakes + pycodestyle (errors) + pyupgrade + import sorting + common bugbear rules.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "E402",  # many tools insert tools/ on sys.path before local imports; noqa where needed
]

[tool.ruff.format]
quote-style = "preserve"
