[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "after-certainty"
version = "0.0.0"
description = "Manuscript monorepo tooling for After Certainty"
readme = "README.md"
requires-python = ">=3.11"
# Default `uv sync --frozen` installs the full corpus toolchain (CI + local).
# Lightweight subsets live in [dependency-groups] for Vercel / site-oriented builds.
# Prefer groups over editing default dependencies:
#   uv sync --frozen --only-group semantic   # manifest generate (Vercel / site CI)
#   uv sync --frozen --group semantic --group test
#   uv sync --frozen --group dev             # semantic + test + publishing helpers
dependencies = [
  "jinja2>=3.1",
  "jsonschema>=4",
  "PyYAML>=6",
  "pytest>=8",
  "ruff>=0.16.2",
  "pre-commit>=4.6.2",
  "python-docx>=1.1",
  "pip-audit>=2.7",
  "certifi>=2026.7.22",
]

[dependency-groups]
# Manifest generate/validate only — no pandoc, Typst, or python-docx required.
semantic = [
  "jsonschema>=4",
  "PyYAML>=6",
]
test = [
  "pytest>=8",
  "ruff>=0.16.2",
  "pip-audit>=2.7",
  "pre-commit>=4.6.2",
]
# Book export helpers that are Python-side (system pandoc/Typst stay outside uv).
# IngramSpark ebook cover/preflight prefer Pillow when present; ImageMagick is the CI fallback.
publishing = [
  "jinja2>=3.1",
  "python-docx>=1.1",
  "Pillow>=10",
]
dev = [
  { include-group = "semantic" },
  { include-group = "test" },
  { include-group = "publishing" },
]

[project.scripts]
ac-manifest = "after_certainty.semantic.manifest.generate:main"

[tool.uv]
package = true
override-dependencies = [
  "pip>=26.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/after_certainty"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tools", "scripts", "tests"]

[tool.ruff.lint]
# Pyflakes + pycodestyle (errors) + pyupgrade + import sorting + common bugbear rules.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.ruff.format]
quote-style = "preserve"
