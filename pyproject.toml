[tool.ruff]
target-version = "py311"
line-length = 100
src = ["tools", "scripts", "tests"]

[tool.ruff.lint]
# Pyflakes + pycodestyle (errors) + pyupgrade + import sorting + common bugbear rules.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "E402",  # many tools insert tools/ on sys.path before local imports; noqa where needed
]

[tool.ruff.format]
quote-style = "preserve"
