version: 1
publishing:
  enabled: true
book:
  id: before-certainty-arrives
  title: Before Certainty Arrives
  subtitle: How Moral Order Forms, Hardens, and Outlives Its Reasons
  description: How moral order forms, hardens, and outlives its reasons—before certainty feels like the
    only available posture.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: How does certainty form, harden, and outlive the conditions that made it necessary?
    whyItExists: Certainty can be an adaptive response to instability. The book reads history so readers
      can recognize why inherited moral order feels obvious—before it feels excessive—without reducing
      traditions to machinery.
    audience: 'Readers seeking a historical prequel to the series: how moral, religious, legal, and epistemic
      tools stabilize life under constraint, scale, and uncertainty.'
    nonGoals:
    - It is not a comprehensive chronology or a moral ranking of eras.
    - It does not reduce traditions to machinery or claim historical inevitability.
    - Its task is recognition rather than final verdict or prescription for what to believe now.
    selectedConcepts:
    - certainty
    - compression
    - inheritance
    - drift
    - constraint
    - legitimacy
    selectedPatterns:
    - finality-compensates-for-uncertainty
    - meaning-forms-early
    - exceptions-are-forever
    selectedConceptRoles:
    - conceptId: certainty
      roleInWork: >
        Central: adaptive reduction of instability that makes action possible—read historically so it
        can be recognized before it feels excessive.
    - conceptId: compression
      roleInWork: >
        Shows how moral and institutional order travels by shrinking complexity—necessary for survival,
        costly when it hardens.
    - conceptId: inheritance
      roleInWork: >
        Names how stabilized order outlives originating conditions; the book teaches readers to feel
        inherited obviousness as historical.
    - conceptId: drift
      roleInWork: >
        Tracks gradual decoupling of rules and meanings from the pressures that made them adaptive.
    - conceptId: constraint
      roleInWork: >
        Grounds moral orders in scarcity, violence, density—limits that made certainty feel necessary
        rather than arbitrary.
    - conceptId: legitimacy
      roleInWork: >
        Asks when inherited order still reads as justified once conditions change—before critique
        becomes easy hindsight.
    selectedPatternRoles:
    - patternId: finality-compensates-for-uncertainty
      roleInWork: >
        Introduces how hard endings and settled rules relieve instability—adaptive move that later looks
        like excess.
    - patternId: meaning-forms-early
      roleInWork: >
        Applies how early interpretive settlements lock in what later generations inherit as obvious.
    - patternId: exceptions-are-forever
      roleInWork: >
        Shows workarounds becoming the day-to-day order—how provisional certainty turns durable.
    readBefore:
    - curiosity-before-certainty
    readNext:
    - living-in-sediment
    - after-certainty
    relatedWorks:
    - workId: living-in-sediment
      relationship: continues
      reason: From how certainty forms historically into how inherited structures persist as sediment
        in the present.
    - workId: after-certainty
      relationship: prepares_for
      reason: 'Explicit handoff: once certainty thins, how do we live and judge?'
    - workId: learning-to-see
      relationship: companion_to
      reason: Historical formation of certainty pairs with practices that form knowers across traditions.
    - workId: when-incentives-become-the-moral-language
      relationship: deepens
      reason: Inherited moral language includes metrics that harden into coordination tools.
paths:
  manuscript: ./index.md
  output: .
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
