  - sourcePath: parts/part-2-compression-under-scale/chapter-6-writing-as-moral-stabilizer.md
    summary: >
      Ashoka's rock and pillar edicts made dharma encounterable on roadsides and frontiers—
      moral vocabulary inscribed across regions that shared neither kinship nor shrine. Writing
      did not end interpretation; it changed where interpretation happened and which readings
      could claim the authority of the inscribed word. From Hammurabi's stone to imperial
      repetition, writing stabilizes obligation so certainty can outlast the ruler's presence.
    centralQuestion: How does writing change where moral obligation lives when the ruler cannot be present?
