  - sourcePath: parts/part-2-compression-under-scale/chapter-5-shared-conditions-not-shared-revelation.md
    summary: >
      Judaism, Greek philosophy, Confucianism, and Buddhism are often cast as simultaneous
      awakenings; the book keeps a narrower claim. Under similar structural pressures—density,
      estrangement, weakened older certainties—several traditions developed moral tools that
      could travel beyond kinship and shrine. Shared conditions, not shared revelation, help
      explain why portable ethics and critique arose in distant places without collapsing them
      into one progress story.
    centralQuestion: What do similar structural pressures explain—and not explain—about portable moral tools across cultures?
