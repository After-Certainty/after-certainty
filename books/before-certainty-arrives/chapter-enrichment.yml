  - sourcePath: parts/part-3-inherited-certainty/chapter-10-the-moment-before-failure.md
    summary: >
      By late twentieth century, tools of certainty still largely functioned—law, markets, and
      administration still coordinated life—while the fit between map and ground loosened. As
      Katrina approached in 2005, situation reports, conference calls, and charts still named
      responsibilities even as overlapping jurisdictions and the gap between plan and ground
      widened. The threshold is often not when a system stops, but when procedures still signal
      readiness after inheritance has begun to fail its conditions.
    centralQuestion: How do we recognize certainty outliving its fit while procedures still signal that everything is ready?
