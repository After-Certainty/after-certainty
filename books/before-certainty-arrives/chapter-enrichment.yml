  - sourcePath: parts/part-1-constraint-before-choice/chapter-1-life-under-constraint.md
    summary: >
      At Çatalhöyük, dense roof-entry houses, floor burials, and recurring images show
      coordination without granting access to doctrine. Early societies faced hunger, exposure,
      and violence more than abstract moral argument; the primary ethical question was what
      holds a group together long enough to live. Material repetition—who was buried where,
      which rooms connected—makes visible roles and ritual before anyone could ask whether the
      arrangement was just.
    centralQuestion: What holds a group together when survival, not moral theory, organizes daily life?
