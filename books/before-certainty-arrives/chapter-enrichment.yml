  - sourcePath: parts/part-1-constraint-before-choice/chapter-2-order-before-truth.md
    summary: >
      Large Bronze Age societies could not rely on familiarity alone. In Uruk's temple
      economies, clerks pressed barley, labor, and field allotments into clay so spoken
      harvest obligations could be checked after the official was gone. Mesopotamia, Egypt,
      the Indus Valley, and early China faced predictability across time and territory more
      urgently than later questions of moral truth—order as infrastructure before argument
      about the good.
    centralQuestion: How does moral life become predictable when strangers must coordinate across distance?
