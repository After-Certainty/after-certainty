  - sourcePath: parts/part-3-inherited-certainty/chapter-9-industrial-scale-and-institutional-certainty.md
    summary: >
      On November 18, 1883, North American railroads adopted standard time zones so schedules
      and freight contracts could share one hour across hundreds of miles—abstraction felt in
      the body as a missed connection. Factory bells, punch cards, and office hierarchies
      translated moral expectation into procedure so strangers could coordinate without knowing
      one another's names. Institutional certainty at industrial scale made repeatable order
      the everyday face of inheritance.
    centralQuestion: How does industrial coordination turn inherited certainty into procedure strangers can share?
