  - sourcePath: parts/part-2-compression-under-scale/chapter-4-population-growth-and-social-density.md
    summary: >
      At Lachish in 701 BCE, Assyrian siege and later Nineveh reliefs made visible what
      distance otherwise hid: imperial decision and provincial consequence no longer met in
      one place. Iron Age density multiplied strangers and roles while older personal authority
      struggled to span the gap. The moral problem shifted from survival alone to coordination
      when orders traveled on clay and courier and arrived in bodies, emptied granaries, and
      tribute lists.
    centralQuestion: How do moral systems coordinate when action and consequence no longer share a place?
    selectedConcepts:
