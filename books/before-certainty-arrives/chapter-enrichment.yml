  - sourcePath: parts/part-3-inherited-certainty/chapter-7-medieval-re-adaptation.md
    summary: >
      After Roman administration thinned in much of Western Europe, communities faced
      uncertainty at scale—not open-ended moral experiment. Authority splintered; violence
      grew harder to contain; coordination had to be reassembled locally, then tightened again
      under later catastrophes. Framing the millennium as mere regression mistakes survival
      under breakdown for a fall from classical rationality; re-adaptation compressed order
      because inherited maps of obligation still had to hold life together.
    centralQuestion: How does certainty re-tighten after imperial infrastructure fails without becoming mere regression?
