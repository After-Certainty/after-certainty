  - sourcePath: back-matter/conclusion-recognition-without-instruction.md
    summary: >
      Certainty has been treated as coordination equipment under constraint, scale, and
      uncertainty—not as pure truth or mere deception. It is conditional: formed under
      particular pressures, then inherited and protected until asked to do work it was never
      built to sustain. Moral systems rarely fail all at once; they outlive themselves.
      Understanding how certainty arrived does not prescribe how to live once it no longer
      holds—that belongs to the books that follow.
    centralQuestion: What does recognizing certainty as conditional change—without yet telling us how to live after it thins?
