  - sourcePath: parts/part-3-inherited-certainty/bridge.md
    summary: >
      Inherited certainty arrives as what remains when roads fail and collectors stop coming.
      Medieval Europe re-compressed after imperial collapse; Renaissance expansion brought
      peoples and places inherited categories could not fully contain; industrial scale replaced
      the temple wall with factory bell, file, and timetable. Part III follows hardening into
      inheritance—and the moment before failure, when systems still function but the fit has
      begun to thin.
    centralQuestion: What does certainty become once it hardens into inheritance rather than immediate adaptation?
