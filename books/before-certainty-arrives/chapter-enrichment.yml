chapters:
  - sourcePath: front-matter/introduction-the-moment-before-things-feel-obvious.md
    summary: >
      A temple clay tablet waits while the harvest is still being argued—obligation that
      outlasts the official who pressed it. Certainty rarely arrives as discovered truth;
      more often it arrives when instability becomes intolerable and people ask what will
      still hold. The book treats certainty as an adaptive response: moral, religious, legal,
      and epistemic systems as tools that compress choice under constraint, then harden into
      inheritance that can outlive its reasons.
    centralQuestion: Why does certainty arrive as survival equipment before it feels like obvious truth?
    selectedConcepts:
