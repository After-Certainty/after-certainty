  - sourcePath: parts/part-1-constraint-before-choice/bridge.md
    summary: >
      Part I stays with pressure rather than philosophy: Çatalhöyük households sharing walls
      and burying their dead beneath floors; Uruk clerks pressing harvest counts into clay;
      Shang courts holding power and piety in the same ceremony. Cases differ; the question
      rhymes—what will still hold when explanation is too slow and the season will not wait.
      Roles, law, and sacred authority arrive as adaptations before they feel like the shape
      of the good itself.
    centralQuestion: What still holds when explanation is too slow and disagreement too costly?
    selectedConcepts:
