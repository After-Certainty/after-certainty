  - sourcePath: parts/part-2-compression-under-scale/bridge.md
    summary: >
      Part II follows certainty traveling when presence cannot: Assyrian reliefs at Lachish
      making distant conquest visible in stone; exiles and teachers carrying law where shrines
      no longer held; Ashoka's edicts fixing obligation in rock across provinces. Density,
      shared structural pressures, and writing as stabilizer turn what once coordinated a room
      into what coordinates an empire.
    centralQuestion: How does certainty travel when presence cannot follow—across provinces, diaspora, and generations?
