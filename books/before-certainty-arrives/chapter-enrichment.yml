  - sourcePath: parts/part-3-inherited-certainty/chapter-8-renaissance-exploration-and-fracture.md
    summary: >
      At Valladolid, Las Casas and Sepúlveda argued whether conquest and Indigenous peoples
      could be fitted into inherited Aristotelian and Christian categories. The debate did not
      end violence; it made visible inherited moral order meeting peoples and places it had
      not anticipated—and tightening even as it argued. Geographic and intellectual expansion
      introduced novelty faster than frameworks could absorb, producing fracture without clean
      triumph of conscience over empire.
    centralQuestion: What happens when inherited moral categories meet peoples and places they were not built to hold?
