  - sourcePath: parts/part-1-constraint-before-choice/chapter-3-from-power-to-moral-legitimacy.md
    summary: >
      When distance widens between decision and consequence, authority reduces uncertainty—
      but cannot remain stable on force alone. Shang oracle bones made royal questions and
      ancestral answers legible in matter that outlasted any single ruler. Early empires and
      theocratic states wrapped power in sacred and moral language so coordination could
      survive stress, succession, and people who would never meet the decision-maker.
    centralQuestion: How does power become protected as moral legitimacy when personal trust no longer stretches?
