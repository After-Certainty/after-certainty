  work_id: when-others-look-to-you
  edition_relationship: primary
  is_canonical: true
  edition_label: Primary volume
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: How does leadership influence form, renew, and erode when others look to you?
    whyItExists: When Others Look to You is a field guide to renewal and erosion in leadership — how trust
      is practiced, how responsibility drifts, and how influence stays answerable.
    audience: Leaders and people who hold informal influence — including readers arriving from systems,
      trust, or handbook doorways.
    nonGoals:
    - It is not a personality-cult or charisma manual.
    - The companion edition is parallel enrichment, not a replacement for this primary volume.
    selectedConcepts:
    - authority
    - accountability
    - contestability
    - adaptation
    - coherence-maintenance
    selectedPatterns:
    - disagreement-is-suppressed
    - dissent-is-welcomed
    - exceptions-are-forever
    readBefore:
    - how-serious-systems-learn
    - trust-beyond-similarity
    readNext:
    - when-others-look-to-you-v2
    - after-certainty
  publication_date: '2026-03-01'
