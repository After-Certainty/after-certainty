version: 1

publishing:
  enabled: true

book:
  id: when-others-look-to-you-v1
  slug_aliases:
    - when-others-look-to-you
  companion_books:
    - when-others-look-to-you-v2
  title: "When Others Look to You"
  subtitle: "Renewal and Erosion in Leadership"
  description: "A leadership field guide to how influence forms, how trust is renewed, and how erosion begins when responsibility drifts from practice."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: ./BookCover.png
  title_page_newpage_after: true

paths:
  manuscript: "./index.md"
  output: "."

assets:
  diagrams:
    default_width: 1600
    auto_discover: false
    entries:
      - svg: docs/diagrams/pattern-groups.svg
        png: export-assets/diagrams/pattern-groups.png
        width: 1600
      - svg: docs/diagrams/renewal-erosion-map.svg
        png: export-assets/diagrams/renewal-erosion-map.png
        width: 1000

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
