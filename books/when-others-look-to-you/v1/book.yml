  title: When Others Look to You
  subtitle: Renewal and Erosion in Leadership
  description: A leadership field guide to how influence forms, how trust is renewed, and how erosion
    begins when responsibility drifts from practice.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  isbns:
