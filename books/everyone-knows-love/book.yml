book:
  id: everyone-knows-love
  title: Everyone Knows Love
  subtitle: Why Is It So Hard to Explain?
  description: An exploration of love as something everyone recognizes yet struggles to explain—treating
    care as a living mystery rather than a formula.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  isbns:
  - "9798256206949"
  - "9798256206956"
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: Why is love something everyone recognizes yet struggles to explain?
    whyItExists: Everyone Knows Love treats care as a living mystery rather than a formula — a human-scale
      entry into recognition, obligation, and language that arrives too late.
    audience: Readers seeking the most intimate doorway into After Certainty’s concerns with meaning,
      care, and incomplete explanation.
    nonGoals:
    - It does not offer a clinical or theological definition of love.
    - It does not replace the project’s civic and systems volumes.
    selectedConcepts:
    - care
    - connection
    - interpretation
    - reciprocity
    - trust
    - contact
    selectedPatterns:
    - meaning-forms-early
    - contact-keeps-the-read-open
    - gaps-invite-completion
    - attention-restores-contact
    selectedConceptRoles:
    - conceptId: care
      roleInWork: Lived obligation and sustained attentiveness—what people recognize as love before formula arrives; not a moral slogan.
    - conceptId: connection
      roleInWork: Reachability with consequence across romance, family, friendship, and community—relationship that outlasts a single exchange.
    - conceptId: interpretation
      roleInWork: Why recognition precedes explanation; love as something lived and read before it can be defined.
    - conceptId: reciprocity
      roleInWork: Mutual exposure and answerability that deepen when care is practiced over time.
    - conceptId: trust
      roleInWork: Participation that becomes possible under incomplete understanding of another person.
    - conceptId: contact
      roleInWork: Staying close to what was said and done—seeing, staying, repairing—without rushing to closure.
    selectedPatternRoles:
    - patternId: meaning-forms-early
      roleInWork: Recognition settles before language finishes; love is known in the body of the relation before it is explained.
    - patternId: contact-keeps-the-read-open
      roleInWork: Return and repair keep interpretation revisable inside ongoing relationship.
    - patternId: gaps-invite-completion
      roleInWork: The urge to finish the mystery with a definition; the book holds the gap as lived experience.
    - patternId: attention-restores-contact
      roleInWork: Seeing and staying restore particular persons where abstraction would flatten love into claim.
    readNext:
    - how-meaning-moves
    - after-certainty
    relatedWorks:
    - workId: how-meaning-moves
      relationship: companion_to
      reason: Intimate recognition of care pairs with how meaning forms, hardens, and stays revisable in ordinary talk.
    - workId: how-trust-forms
      relationship: companion_to
      reason: Trust that makes participation possible under uncertainty deepens what love practices across difference and time.
    - workId: after-certainty
      relationship: prepares_for
      reason: Care without guarantees opens into judgment and responsibility when understanding is not enough.
    - workId: curiosity-before-certainty
      relationship: companion_to
      reason: Inquiry posture toward incomplete explanation meets love as recognition that resists formula.
    - workId: observer-patterns
      relationship: companion_to
      reason: Pattern-poetry of attention and voluntary inconvenience accompanies the prose inquiry into care.
