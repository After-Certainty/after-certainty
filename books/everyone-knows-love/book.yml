version: 1

publishing:
  enabled: true

book:
  id: everyone-knows-love
  title: "Everyone Knows Love"
  subtitle: "Why Is It So Hard to Explain?"
  description: "An accessible exploration of love as something everyone recognizes yet struggles to explain—investigating artifacts and expressions first, then the conditions beneath them, with care as a living mystery rather than a formula."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

assets:
  diagrams:
    auto_discover: false

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
