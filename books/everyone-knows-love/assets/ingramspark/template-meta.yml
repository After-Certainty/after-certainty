# Observed / derived geometry for the assembled-raster-wrap panels in this folder.
# print.trim in book.yml remains authoritative for manufacturing trim.
# page_count is provisional until the print interior PDF page count is locked;
# regenerate spine.png + this file if the interior length changes.
version: 1
source:
  provider: ingramspark
  template_file: ingram-cover-template.pdf
manufacturing:
  trim_width_inches: 6.0
  trim_height_inches: 9.0
  binding: perfect-bound
  paper: cream
  interior_color_mode: black-and-white
  page_count: 100
geometry:
  media_box_width_points: 900.0
  media_box_height_points: 666.0
  spine_width_points: 17.76
  outside_bleed_points: 9.0
  top_bleed_points: 9.0
  bottom_bleed_points: 9.0
  safe_inset_points: 18.0
raster:
  required_ppi: 300
  full_wrap:
    expected_width_pixels: 3750
    expected_height_pixels: 2775
  components:
    back:
      expected_width_pixels: 1838
      expected_height_pixels: 2775
    spine:
      expected_width_pixels: 74
      expected_height_pixels: 2775
    front:
      expected_width_pixels: 1838
      expected_height_pixels: 2775
barcode_reserve:
  required: true
  panel: back
  # Top-left of the white clear box on back.png (image coordinates).
  # ~1.40" × 0.97" — below Ingram's 1.75" × 1.0" guidance; enlarge before upload.
  x_pixels: 1236
  y_pixels: 2281
  width_pixels: 419
  height_pixels: 292
barcode_supplied: false
spine_text: true
notes: >
  Panels sourced as production RGB PNGs (back/spine/front). Spine width 17.76 pt
  (74 px @ 300 ppi) matches the designed spine art; media box 900×666 pt matches
  the 3750×2775 assembled wrap. Confirm manufacturing.page_count against the
  Cover Template Generator request and measured interior pages before packaging.
