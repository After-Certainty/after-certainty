version: 1

publishing:
  enabled: true

book:
  id: how-meaning-moves
  title: "How Meaning Moves"
  subtitle: "Signal, Compression, Restraint, and the Pace of Understanding"
  description: "A concise tour of how meaning travels through language, systems, and relationships, and why restraint is often the difference between noise and connection."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  purchase_links:
    - retailer: amazon
      url: https://www.amazon.com/gp/product/B0GM8TCB4P
      label: Buy on Amazon
  title_page_cover: BookCover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

assets:
  diagrams:
    default_width: 1600
    auto_discover: false
    entries:
      - svg: docs/diagrams/pattern-groups.svg
        png: export-assets/diagrams/pattern-groups.png
        width: 1600

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
