version: 1
publishing:
  enabled: true
book:
  id: how-meaning-moves
  title: How Meaning Moves
  subtitle: Signal, Compression, Restraint, and the Pace of Understanding
  description: Before people disagree, they interpret. How meaning forms through signal, compression,
    and restraint—long before anyone is obviously wrong, and often while the sentence is still forming.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  title_page_cover_unnumbered: true
  open_graph_image: open-graph.png
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: How does meaning form, harden, and stay revisable before anyone is obviously wrong?
    whyItExists: How Meaning Moves traces Signal, Compression, and Restraint — and Connection as the through-line
      — so readers can see interpretation at work while sentences still feel open.
    audience: Readers interested in communication, interpretation, and the pace of understanding across
      people and institutions.
    nonGoals:
    - It does not reduce disagreement to messaging technique.
    - It does not claim perfect shared meaning is achievable.
    selectedConcepts:
    - connection
    - contact
    - interpretation
    - contestability
    - correction
    selectedPatterns:
    - meaning-drifts-over-time
    - contact-keeps-the-read-open
    - intent-gets-assigned
    selectedConceptRoles:
    - conceptId: connection
      roleInWork: >
        Through-line across Signal, Compression, and Restraint: relationship that persists after
        conversation—reachability with consequence.
    - conceptId: contact
      roleInWork: >
        Keeps interpretation close to what was said, including uncertainty—so meaning can move without
        premature closure.
    - conceptId: interpretation
      roleInWork: >
        Central craft: reconstructing meaning under partial information while sentences still feel open.
    - conceptId: contestability
      roleInWork: >
        Preserves room to challenge a reading before it hardens—restraint as discipline, not indecision.
    - conceptId: correction
      roleInWork: >
        Names revisability when mismatch appears; how meaning stays accountable to reality-contact.
    selectedPatternRoles:
    - patternId: meaning-drifts-over-time
      roleInWork: >
        Introduces slow change in interpretation as memory and repetition accumulate—core motion of the
        book.
    - patternId: contact-keeps-the-read-open
      roleInWork: >
        Applies restraint: more context can sharpen without forcing final resolution too soon.
    - patternId: intent-gets-assigned
      roleInWork: >
        Shows compression under social pressure: motive is inferred before certainty is possible.
    readBefore:
    - curiosity-before-certainty
    readNext:
    - what-we-cannot-see
    - trust-beyond-similarity
  publication_date: '2026-04-01'
  edition_published_at: '2026-04-01'
paths:
  manuscript: ./index.md
  output: .
assets:
  diagrams:
    default_width: 1600
    auto_discover: false
    entries:
    - svg: docs/diagrams/pattern-groups.svg
      png: export-assets/diagrams/pattern-groups.png
      width: 1600
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: back-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
