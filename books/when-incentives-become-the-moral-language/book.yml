version: 1

publishing:
  enabled: true

book:
  id: when-incentives-become-the-moral-language
  title: "When Incentives Become the Moral Language"
  subtitle: "How Systems Decide For Us When Judgment No Longer Scales"
  description: "Essay edition (~11–12k words)—eight institutional domains where metrics and incentives replaced judgment when coordination outran shared meaning. Distinct from When Interpretation No Longer Matters (authority without shared meaning) and The Economy We Don't Experience (lived vs aggregate narrative under compression)."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
