version: 1
publishing:
  enabled: true
book:
  id: curiosity-before-certainty
  title: Curiosity Before Certainty
  subtitle: How Curiosity Helps Us Understand a Complex World
  description: An argument for disciplined curiosity as a leadership and learning posture when easy certainty
    hides complexity and weakens judgment.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  open_graph_image: open-graph.png
  copyright_year: 2026
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: How do we stay curious when easy certainty would feel safer?
    whyItExists: Curiosity Before Certainty is a friendly doorway into the project. It argues for disciplined
      curiosity as a learning and leadership posture when premature certainty hides complexity and weakens
      judgment.
    audience: Readers who want an approachable entry before denser systems or leadership volumes — including
      newcomers to After Certainty.
    nonGoals:
    - It does not offer a complete epistemology or a replacement ideology.
    - It does not treat curiosity as endless delay of decision.
    readNext:
    - what-we-cannot-see
    - after-certainty
  publication_date: '2026-02-10'
paths:
  manuscript: ./index.md
  output: .
assets:
  diagrams:
    auto_discover: false
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
