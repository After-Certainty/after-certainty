  - sourcePath: parts/part-2-what-replaces-interpretation/bridge.md
    summary: >
      Part II follows what takes interpretation's place when shared evaluation no longer
      governs: arguments that sort loyalty, names that outlive platforms, applause that cannot
      end, and stories that metabolize every objection. Replacement is not silence—it is other
      uses of speech.
    centralQuestion: What kinds of speech take over when interpretation no longer revises authority?
    selectedConcepts:
