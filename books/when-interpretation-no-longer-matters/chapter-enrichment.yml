  - sourcePath: parts/part-3-when-correction-cannot-reach/bridge.md
    summary: >
      Part III asks what happens before and after the boundary when questions become
      disloyalty, criticism becomes purification ritual, and judgment still has work that is
      not repair. Correction's tools remain available as language while losing the capacity to
      revise standing.
    centralQuestion: What can still be done when the tools of correction no longer reopen authority?
    selectedConcepts:
