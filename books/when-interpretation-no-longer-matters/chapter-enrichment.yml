  - sourcePath: parts/part-2-what-replaces-interpretation/chapter-5-the-applause-no-one-wants-to-end.md
    summary: >
      Palms are sore and rhythm has gone wrong, yet the ovation continues because stopping
      marks you against a room that has not granted permission to end it. What holds the sound
      open is not belief that the words deserve another minute—it is shared knowledge that the
      first lowered hands will be seen. Performative legitimacy under coercion replaces
      evaluation with watched endurance.
    centralQuestion: What kind of authority is being performed when no one can safely stop applauding?
    selectedConcepts:
