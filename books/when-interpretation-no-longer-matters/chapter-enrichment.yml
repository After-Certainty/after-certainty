  - sourcePath: parts/part-2-what-replaces-interpretation/chapter-6-the-story-that-explains-every-objection.md
    summary: >
      Attack is answered not with evidence first but with a quieter sentence: if this were
      nothing, no one would bother. The move feels like thoughtfulness—thicker accounts of
      motive, tone, and timing—while sealing the belief against interruption. Interpreting
      harder becomes enclosure; every objection confirms the story rather than reopening
      shared evaluation.
    centralQuestion: How can interpreting harder seal a belief against the very objections that should test it?
    selectedConcepts:
