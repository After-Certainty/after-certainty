  - sourcePath: parts/part-3-when-correction-cannot-reach/chapter-9-what-judgment-can-still-do.md
    summary: >
      Someone writes after it is too late—names copied before they thin, testimony for a
      tribunal that may not arrive. The hand is not inventing theory; it is attaching words to
      events that would otherwise remain private weather. Witness is not a rescue program when
      mediating pathways are smashed; it is judgment's remaining social life—record, address,
      and obligation that outlasts the speaker.
    centralQuestion: What can judgment still do when it cannot restore the pathway from recognition to repair?
    selectedConcepts:
