      toNext: >
        From enclosure's structure into kitchens where everyone already knows.

  - sourcePath: parts/part-1-where-interpretation-ends/chapter-2-everyone-already-knows.md
    summary: >
      Across a kitchen table someone warns carefully; the other nods gratefully—*I know*—and
      the conversation ends because recognition was absorbed as agreement. Shared understanding
      arrives quickly and still leaves no path into a world where the warning can matter.
      Knowing together is not yet leverage; displacement begins when recognition substitutes
      for repair.
    centralQuestion: Why can shared recognition feel like progress while leaving danger untouched?
