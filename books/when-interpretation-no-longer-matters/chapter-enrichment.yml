  - sourcePath: parts/part-3-when-correction-cannot-reach/chapter-7-the-question-that-becomes-disloyalty.md
    summary: >
      An ordinary ask for pilot results and verification dates is met with smiles about
      negativity, momentum, and vision—openness language intact while the corridor translation
      reprices the question. Freedom to ask remains; a second and third request start to sound
      like personality. Evidence becomes an attitude problem when constraint has been cast as
      optional drama.
    centralQuestion: How does a request for evidence become coded as disloyalty without anyone forbidding the question?
    selectedConcepts:
