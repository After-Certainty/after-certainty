  - sourcePath: parts/part-2-what-replaces-interpretation/chapter-4-the-name-that-survives-every-platform.md
    summary: >
      A campaign button in a drawer outlives the wage board and foreign policy that once
      justified its slogan. Inherited political labels become household atmosphere—children
      learn the name before the budget. Loyalty can outlive the reasons that once made loyalty
      look like judgment; the name waits for an heir, not a better brief.
    centralQuestion: How does a political name keep organizing belonging after its first platform is gone?
