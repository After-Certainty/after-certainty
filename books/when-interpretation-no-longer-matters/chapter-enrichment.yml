version: 1
chapters:
  - sourcePath: front-matter/introduction-the-question-this-book-asks.md
    summary: >
      A careful concern is raised, restated more cleanly, and met with nods—yet nothing
      redistributes consequence. The room did not lack sentences; it lacked an obligation
      that sentences could enforce. The introduction names the book's question: what kind of
      authority exists when understanding no longer has the power to matter, and how to tell
      that condition apart from mere misunderstanding.
    centralQuestion: What remains of authority when recognition no longer redistributes consequence?
    selectedConcepts:
      - interpretation
      - authority
      - displacement-of-interpretation
      - witness
      - post-interpretive-authority
    selectedPatterns:
      - explanation-replaces-response
      - disagreement-is-suppressed
      - meaning-reinforces-itself
    searchAliases:
      - the question that changes nothing
      - understanding without consequence
      - recognition that does not redistribute
    situations:
      - explanation-displaces-action
      - feedback-stops-changing-decisions
    transition:
      toNext: >
        From the unanswered meeting into Part I—where interpretation ends at the threshold.

  - sourcePath: parts/part-1-where-interpretation-ends/bridge.md
    summary: >
      Part I opens where interpretation stops functioning as a shared path into consequence:
      doors that open only inward, and rooms where everyone already knows. The movement is
      diagnostic rather than accusatory—learning to recognize the boundary before prescribing
      clearer speech.
    centralQuestion: Where does shared understanding stop being able to revise what authority may do?
    selectedConcepts:
