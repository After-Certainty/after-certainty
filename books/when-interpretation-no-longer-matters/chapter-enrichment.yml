      toNext: >
        From the part title into the door that opens only inward.

  - sourcePath: parts/part-1-where-interpretation-ends/chapter-1-the-door-that-opens-only-inward.md
    summary: >
      Some doors open only from inside—the lock works, reasons from the hallway cannot turn the
      bolt. Family rules, workplace customs, and congregational readings can give reasons that
      hold within while sounding circular to outsiders. The threshold chapter names enclosure:
      interpretation still happens inside, but entry is not available to argument from without.
    centralQuestion: How can meaning remain lively inside a room that outsiders cannot argue their way into?
    selectedConcepts:
