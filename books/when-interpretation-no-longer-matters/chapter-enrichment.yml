  - sourcePath: parts/part-3-when-correction-cannot-reach/chapter-8-the-criticism-that-cannot-correct.md
    summary: >
      Retrospectives and self-criticism hours ask for candor on a timer; what follows is
      approved failure—flaws the hierarchy is ready to absorb—rather than discovery that would
      rearrange standing. Notebooks fill with sentences that sound like repair and function as
      ritual proof that criticism occurred. Critique can be commandeered as authority's output,
      not its constraint.
    centralQuestion: When does required criticism stop correcting authority and start reproducing it?
