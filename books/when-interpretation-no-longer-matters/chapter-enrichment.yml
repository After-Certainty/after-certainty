  - sourcePath: parts/part-2-what-replaces-interpretation/chapter-3-the-argument-that-sorts-the-room.md
    summary: >
      A family group chat fills with forwarded posts; the question looks like evidence while
      the work is affiliation. Caution is heard as softness or betrayal; neutrality becomes a
      side. Disagreement no longer clarifies a proposition across a shared evaluative space—it
      sorts who belongs. Interpretation is displaced by sorting.
    centralQuestion: When does an argument about evidence become a machine for sorting loyalty?
    selectedConcepts:
