  - sourcePath: back-matter/conclusion-after-interpretation.md
    summary: >
      The opening shrug—concern understood, decision unchanged—returns harder to treat as mere
      etiquette. The book refuses a single explanation (misunderstanding, refusal, capture,
      evil) for every failure of consequence, keeping a sharper alternative available: not
      everything that fails to matter has been misunderstood. The improvement is modest: which
      questions to keep open long enough for a useful distinction to appear.
    centralQuestion: What distinction remains useful after we stop collapsing every unanswered concern into misunderstanding?
    selectedConcepts:
      - interpretation
      - displacement-of-interpretation
      - post-interpretive-authority
