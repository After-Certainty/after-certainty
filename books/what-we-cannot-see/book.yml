version: 1

publishing:
  enabled: true

book:
  id: what-we-cannot-see
  title: "What We Cannot See"
  subtitle: "Bias, Judgment, and the Limits of Perspective"
  description: "Why every perspective is necessarily partial, how individuals make responsible judgments despite those limitations, and why integration allows groups to construct understanding that exceeds any single person's perspective."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
