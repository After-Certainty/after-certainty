version: 1
publishing:
  enabled: true
book:
  id: what-we-cannot-see
  title: What We Cannot See
  subtitle: Bias, Judgment, and the Limits of Perspective
  description: Why every perspective is necessarily partial, how individuals make responsible judgments
    despite those limitations, and why integration allows groups to construct understanding that exceeds
    any single person's perspective.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: How do we judge responsibly when every perspective is partial?
    whyItExists: What We Cannot See introduces finite perspective, bias, and integration — why no one
      sees the whole, and why groups still need accountable judgment.
    audience: Readers who want a clear map of perspective limits before entering denser systems or leadership
      books.
    nonGoals:
    - It does not treat all viewpoints as equally warranted.
    - It does not dissolve individual responsibility into collective process.
    selectedConcepts:
    - finite-perspective
    - bias
    - integration
    - interpretation
    - answerability
    selectedPatterns:
    - attention-finds-a-signal
    - gaps-invite-completion
    - revisability-preserves-judgment
    selectedConceptRoles:
    - conceptId: finite-perspective
      roleInWork: >
        Opening claim: every view is built from somewhere and never exhaustive—ground for bias,
        judgment, and integration without relativism.
    - conceptId: bias
      roleInWork: >
        Recasts selective attention as the condition that makes finite seeing possible—universal, not
        only bad faith.
    - conceptId: integration
      roleInWork: >
        Names group work of combining partial views into a response none alone could hold—without
        dissolving individual answerability.
    - conceptId: interpretation
      roleInWork: >
        Shows how stories and structures fill what attention cannot hold—partial information
        reconstructed as meaning.
    - conceptId: answerability
      roleInWork: >
        Keeps responsible judgment after limits are admitted: obligation to those affected by decisions
        made from incomplete sight.
    selectedPatternRoles:
    - patternId: attention-finds-a-signal
      roleInWork: >
        Introduces the attention budget: what stands out first shapes what can be noticed next—bias as
        selective availability.
    - patternId: gaps-invite-completion
      roleInWork: >
        Applies how missing perspective rarely stays open—inherited stories and structures rush to fill
        what we cannot see.
    - patternId: revisability-preserves-judgment
      roleInWork: >
        Deepens deciding without certainty: judgment stays responsible only while it can still be
        updated by other eyes.
    readBefore:
    - curiosity-before-certainty
    readNext:
    - trust-beyond-similarity
    - after-certainty
paths:
  manuscript: ./index.md
  output: .
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
