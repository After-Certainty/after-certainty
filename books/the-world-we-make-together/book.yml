version: 1

publishing:
  enabled: true

book:
  id: the-world-we-make-together
  title: "The World We Make Together"
  subtitle: "How Ordinary People, Unequal Power, and Shared Action Shape History"
  description: "History is collective, but responsibility remains uneven. The World We Make Together follows ordinary objects—a switch, a ballot, a fence, a bowl, a scale—into the institutions and relationships through which people shape public life without becoming either solitary heroes or passive products of structure."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: back-matter/about-the-series.md

build:
  formats:
    docx:
      enabled: true
      # Cover/front-matter silent; Arabic from Introduction; no heads on openers; no TOC.
      interior_finish: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
