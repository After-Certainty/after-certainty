  - sourcePath: parts/part-3-what-traditions-carry/chapter-12-integration-without-reduction.md
    summary: >
      Useful parallels—calibration and humility, peer review and discernment—open a door and
      then flatten: confession is not peer review; repentance is not updating a belief.
      Integration without reduction holds what another tradition sees while refusing to
      dissolve its ends into one's own vocabulary.
    centralQuestion: How do we learn across traditions without reducing them to interchangeable mechanisms?
    selectedConcepts:
