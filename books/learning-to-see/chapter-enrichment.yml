  - sourcePath: parts/part-3-what-traditions-carry/chapter-11-archaeology-without-contempt.md
    summary: >
      Explaining why a harmful practice developed can arrive as cushion before consequence is
      established—and distrust of that move can also block needed history. Archaeology without
      contempt keeps understanding and judgment connected: respect adaptive wisdom without
      making survival proof of goodness.
    centralQuestion: How can we excavate inherited practices without romanticizing them or turning history into excuse?
    selectedConcepts:
      - inheritance
      - judgment
      - harm
      - humility
      - responsibility
    selectedPatterns:
