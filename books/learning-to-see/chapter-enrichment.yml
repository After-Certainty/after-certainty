    transition:
      fromPrevious: >
        From communal memory of who may ask into tradition as repeated form.
      toNext: >
        From inherited seeing into confession and repair when being right has not restored
        harm.
  - sourcePath: parts/part-2-practices-for-recurring-human-problems/chapter-8-conflict-confession-and-repair.md
    summary: >
      An earlier concern returns as 'you were right' after the assumption fails—satisfaction
      that cannot undo delay, rework, or absorbed dissent. Confession and repair require more
      than correctness; some realities cannot be reconciled and must be mourned rather than
      processed into a complete moral lesson.
    centralQuestion: What must confession and repair do that being right cannot?
    selectedConcepts:
      - repair
      - responsibility
      - harm
      - humility
      - witness
    selectedPatterns:
      - responsibility-persists-beyond-control
      - explanation-replaces-response
      - revisability-preserves-judgment
    searchAliases:
