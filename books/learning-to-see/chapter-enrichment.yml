    transition:
      fromPrevious: >
        From costly wrongness into communal practices of shared seeing.
      toNext: >
        From how groups learn safety into memory, ritual, and what tradition repeats.
  - sourcePath: parts/part-2-practices-for-recurring-human-problems/chapter-7-memory-ritual-and-tradition.md
    summary: >
      Watching a Eucharistic sequence as a visitor, repetition shapes bodies and weeks before
      full understanding arrives—showing tradition as memory given form. Inherited ritual
      trains attention across generations and can also keep an earlier answer sacred after the
      question has changed.
    centralQuestion: What does ritual carry that explanation alone cannot—and when does inherited memory outlive its question?
    selectedConcepts:
      - inheritance
      - stabilizing-practices
      - attention
      - formation
      - meaning
    selectedPatterns:
