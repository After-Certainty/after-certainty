  - sourcePath: parts/part-4-the-future-of-wisdom/chapter-13-when-intelligence-becomes-cheap.md
    summary: >
      An AI workshop presentation assembles the day's visible artifacts into a coherent story
      while missing the conversations, confusion, and emptied exercises that never entered the
      notes. When intelligence is everywhere, wisdom is knowing what an answer is for, what it
      leaves out, and who we must become to use it well.
    centralQuestion: What does intelligence leave out when it can fluently summarize what was recorded?
    selectedConcepts:
