  - sourcePath: parts/part-4-the-future-of-wisdom/chapter-14-ancient-practices-future-problems.md
    summary: >
      An empty minute disappears into a device before silence becomes experience—showing an
      old human avoidance newly equipped. Ancient practices will not save by antiquity alone;
      the recurring question is what kind of human beings our practices are helping us become
      when pauses and unresolved questions can be filled immediately.
    centralQuestion: What human capacities must still be cultivated when every pause can be filled with answers?
    selectedConcepts:
