        From excavation that preserves difference into contact that does not collapse it.
      toNext: >
        From careful integration into what becomes scarce when fluent answers proliferate.
  - sourcePath: parts/part-3-what-traditions-carry/bridge.md
    summary: >
      Responsible inheritance distinguishes the value a practice protects from the form that
      carried it. Practices forged under scarce information now meet artificial intelligence
      that can summarize a tradition fluently while hiding the differences integration
      requires—raising a new scarcity around attention and formation.
    centralQuestion: What becomes scarce when information and fluent answers are no longer the limiting constraint?
