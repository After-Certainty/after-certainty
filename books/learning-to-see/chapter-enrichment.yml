      - what knows that the first system succeeded
      - shared certainty
    situations:
      - feedback-stops-changing-decisions
    transition:
      fromPrevious: >
        From attention that can threaten the self into the cost of remaining wrong.
      toNext: >
        From individual corrigibility into the promise and danger of seeing together.
  - sourcePath: parts/part-2-practices-for-recurring-human-problems/chapter-6-seeing-together.md
    summary: >
      A design review ends in apparent agreement until a later message names the hardest
      coordination cost the room never faced—showing how collective seeing can manufacture
      alignment while suppressing minority risk. Communities learn whether questions are safe
      by remembering what happened to those who asked them.
    centralQuestion: When does seeing together deepen judgment, and when does it harden shared certainty?
    selectedConcepts:
      - partial-coherence
      - judgment
      - integration
      - contact
      - formation
    selectedPatterns:
