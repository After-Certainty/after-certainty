  - sourcePath: parts/part-2-practices-for-recurring-human-problems/bridge.md
    summary: >
      Part II's practices do not float above history: communities inherit, repeat, and
      reinterpret them until a response to danger becomes virtue and virtue becomes identity.
      Part III turns to sediment, evaluation without contempt, and integration without
      reduction.
    centralQuestion: How do practices that once answered danger become identities difficult to distinguish from morality?
    selectedConcepts:
      - inheritance
      - formation
      - certainty
      - stabilizing-practices
    selectedPatterns:
