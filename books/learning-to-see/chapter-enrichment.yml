version: 1
chapters:
  - sourcePath: front-matter/introduction-learning-to-see.md
    summary: >
      Seeing is learned: families, professions, sciences, and spiritual traditions train
      attention differently, leaving other things at the edge. Traditions that disagree about
      reality still develop practices around distraction, self-deception, and inherited
      assumption—without being secretly the same.
    centralQuestion: Why do traditions that disagree about reality develop practices around similar human difficulties?
    selectedConcepts:
      - attention
      - formation
      - humility
      - uncertainty
      - finite-perspective
    selectedPatterns:
      - attention-finds-a-focus
      - contact-keeps-the-read-open
    searchAliases:
      - learning to see
      - practices of wisdom
      - how seeing is formed
    transition:
      toNext: >
        From why habits of noticing matter into an experiment that returned to a childhood
        claim.
  - sourcePath: parts/part-1-the-formation-of-a-knower/chapter-1-the-experiment-i-had-never-tried.md
    summary: >
      Returning to a Book of Mormon reading-and-prayer promise he had never honestly tested,
      the author finds neither restored belief nor decisive proof—but a clearer view of how
      inherited ways of seeing form the person who judges. Untrained eyes are a fiction;
      practices of noticing can carry unrecognized wisdom.
    centralQuestion: What can returning to an inherited practice reveal about how a knower was formed?
    selectedConcepts:
      - formation
      - inheritance
      - attention
      - humility
      - judgment
    selectedPatterns:
      - attention-finds-a-focus
      - revisability-preserves-judgment
    searchAliases:
      - the experiment i had never tried
      - book of mormon experiment
      - inherited ways of seeing
    transition:
      fromPrevious: >
        From the introduction's comparative question into a personal test of an inherited
        claim.
      toNext: >
        From formation glimpsed in practice into why answers alone cannot remake the knower.
  - sourcePath: parts/part-1-the-formation-of-a-knower/chapter-2-answers-are-not-enough.md
    summary: >
      The scripture experiment changed the person asking more than it settled the question
      asked. Knowing about humility, bias, or self-deception is not the same as having
      practices that keep those capacities available when certainty rises and identity is
      threatened.
    centralQuestion: Why is having answers—even good ones—still insufficient for becoming a better knower?
    selectedConcepts:
      - judgment
      - humility
      - certainty
      - uncertainty
      - bias
    selectedPatterns:
      - revisability-preserves-judgment
      - correctness-hardens-into-identity
    searchAliases:
      - answers are not enough
      - knowing about bias
      - practices when certainty rises
    transition:
      fromPrevious: >
        From an experiment that formed the asker into the limits of transferable answers.
      toNext: >
        From individual limits of knowing into why no one sees enough alone.
  - sourcePath: parts/part-1-the-formation-of-a-knower/chapter-3-the-limits-of-seeing-alone.md
    summary: >
      A carefully prepared design review still depends on questions the author did not think
      to ask—showing that sustained contact with a problem cannot complete a partial view.
      Communities extend sight and also share blind spots; the task is formation without
      becoming unreachable to correction.
    centralQuestion: How do we remain formed by others without surrendering the corrections only we might notice?
    selectedConcepts:
      - finite-perspective
      - partial-coherence
      - formation
      - judgment
      - contact
    selectedPatterns:
      - contact-keeps-the-read-open
      - dissent-is-welcomed
      - gaps-invite-completion
    searchAliases:
      - limits of seeing alone
      - design review question
      - partial together
    situations:
      - same-meeting-different-decisions
    transition:
      fromPrevious: >
        From answers that cannot remake the knower into the insufficiency of solitary
        seeing.
      toNext: >
        From communal limits into the practices communities build around recurring human
        difficulties.
  - sourcePath: parts/part-1-the-formation-of-a-knower/bridge.md
    summary: >
      Part I established that knowers are formed and that no individual perspective is enough.
      The bridge turns toward non-interchangeable practices—prayer, meditation, confession,
      criticism, ritual, lament—built around attention that drifts, confidence that hardens,
      and suffering that resists tidy meaning.
    centralQuestion: What kinds of practices do communities build around limits they cannot escape?
    selectedConcepts:
      - formation
      - attention
      - humility
      - stabilizing-practices
    selectedPatterns:
      - attention-finds-a-focus
      - revisability-preserves-judgment
    searchAliases:
      - practices we build around our limits
      - better relationships with limits
    transition:
      fromPrevious: >
        From the need for community without submission into practices around shared limits.
      toNext: >
        Into six recurring difficulties—beginning with what attention makes visible.
  - sourcePath: parts/part-2-practices-for-recurring-human-problems/chapter-4-what-attention-makes-visible.md
    summary: >
      Breath-focused meditation makes wandering mind visible as returnable habit rather than
      failure—showing how attention opens a field without guaranteeing welcome for what
      appears. The world we see is partly prepared by practices that decide which
      interruptions can reach us.
    centralQuestion: What becomes visible only when a practice changes what attention is willing to notice?
    selectedConcepts:
      - attention
      - contact
      - revisability
      - humility
      - formation
    selectedPatterns:
      - attention-finds-a-focus
      - attention-restores-contact
      - attention-finds-a-signal
    searchAliases:
      - what attention makes visible
      - notice and return
      - wandering was the material
    transition:
      fromPrevious: >
        From the turn toward practices into attention as the first recurring difficulty.
      toNext: >
        From opening the field into remaining present when being wrong becomes personally
        expensive.
  - sourcePath: parts/part-2-practices-for-recurring-human-problems/chapter-5-when-being-wrong-becomes-expensive.md
    summary: >
      In a design review, a precise answer meets a question that refuses the frame already
      explained—tightening identity around being the one who understands. Humility must become
      discernment: whom to trust for correction when the self and the group both cannot see
      themselves completely.
    centralQuestion: How do we stay correctable when being wrong threatens identity and competence?
    selectedConcepts:
      - humility
      - judgment
      - certainty
      - revisability
      - bias
    selectedPatterns:
      - revisability-preserves-judgment
      - correctness-hardens-into-identity
      - dissent-is-welcomed
    searchAliases:
