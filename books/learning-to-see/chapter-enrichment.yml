      - cheap grace
    situations:
      - responsibility-outruns-control
    transition:
      fromPrevious: >
        From tradition that can outlive its question into harm that truth alone does not
        heal.
      toNext: >
        From repair's limits into suffering that resists tidy meaning.
  - sourcePath: parts/part-2-practices-for-recurring-human-problems/chapter-9-suffering-meaning-and-moral-imagination.md
    summary: >
      A blank condolence card makes helpful words feel too complete beside irreversible
      loss—distinguishing meaning discovered by the one who suffers from meaning assigned
      beside them. Traditions carry lament and care that once made pain survivable, and may
      keep teaching fear long after the original wound has changed.
    centralQuestion: How do we accompany suffering without imposing a meaning that betrays it?
    selectedConcepts:
      - meaning
      - witness
      - humility
      - harm
      - moral-posture-toward-harm
    selectedPatterns:
