      - attention-restores-contact
      - contact-keeps-the-read-open
    searchAliases:
      - becoming better knowers
      - more teachable before certainty
      - see partially anyway
    transition:
      fromPrevious: >
        From ancient practices under new conditions into the ongoing work of becoming better
        knowers.
