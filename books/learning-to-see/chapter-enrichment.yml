  - sourcePath: back-matter/epilogue-becoming-better-knowers.md
    summary: >
      Seeing never finishes: we inherit mixed habits of attention, need practices because
      insight fades, and still decide what deserves notice when answers are easier to produce.
      The work is teachability before certainty, responsibility when it arrives, and
      willingness to notice what confidence left outside the frame.
    centralQuestion: How do we keep practicing better knowing when no final way of seeing arrives?
    selectedConcepts:
      - formation
      - attention
      - humility
      - revisability
      - judgment
    selectedPatterns:
