      - virtue becomes identity
    transition:
      fromPrevious: >
        From suffering's inheritance into the historical weight practices accumulate.
      toNext: >
        Into cultural sediment—old solutions still acting after their problems fade from
        view.
  - sourcePath: parts/part-3-what-traditions-carry/chapter-10-cultural-sediment.md
    summary: >
      Old code called technical debt often preserves a vanished failure mode—charging twice, a
      migration path—misread as carelessness. Cultural sediment is the past continuing to act
      through habits that feel like personality; contempt makes poor historians of systems
      still living inside us.
    centralQuestion: How do we judge inherited structures when the problems that produced them have disappeared from view?
    selectedConcepts:
