version: 1
publishing:
  enabled: true
book:
  id: coupling
  title: Coupling
  subtitle: Cohesion, Consequence, and the Architecture of Responsibility
  description: A practical framework for seeing where systems are tightly joined, where they drift apart,
    and how those coupling choices shape accountability over time.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: BookCover.png
  open_graph_image: open-graph.png
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: How do connection and separation in systems shape responsibility over time?
    whyItExists: Coupling offers a practical architecture for seeing where systems are tightly joined,
      where they drift, and how those choices distribute consequence and accountability.
    audience: Systems thinkers, architects, and practitioners who need a concrete lens on cohesion, drift,
      and designed friction.
    nonGoals:
    - It is not a software-only coupling guide, though software examples appear.
    - It does not treat decoupling as always virtuous.
    selectedConcepts:
    - boundary
    - accountability
    - agency
    - attention
    - authority
    selectedPatterns:
    - exceptions-are-forever
    - feedback-drives-change
    - learning-collapses
    selectedConceptRoles:
    - conceptId: boundary
      roleInWork: >
        Architectural hinge: where joining and separation redistribute responsibility and consequence
        across systems.
    - conceptId: accountability
      roleInWork: >
        Follows how tight or loose coupling changes who can see and answer for effects over time.
    - conceptId: agency
      roleInWork: >
        Clarifies practical capacity inside coupled systems—where action can still matter when links
        constrain options.
    - conceptId: attention
      roleInWork: >
        Names what must be watched at seams and interfaces so drift and exception-paths stay visible.
    - conceptId: authority
      roleInWork: >
        Tracks steering rights across coupled units—who may change the join when consequences cross
        boundaries.
    selectedPatternRoles:
    - patternId: exceptions-are-forever
      roleInWork: >
        Applies how coupling workarounds become permanent architecture—provisional joins that never
        uncouple.
    - patternId: feedback-drives-change
      roleInWork: >
        Shows when outcome-signal still reaches the join in time to shift direction—healthy coupling.
    - patternId: learning-collapses
      roleInWork: >
        Marks failure when coupling hides consequences until the group can no longer read what its
        choices are doing.
    readBefore:
    - how-serious-systems-learn
    readNext:
    - after-certainty
    - when-others-look-to-you-v1
paths:
  manuscript: ./index.md
  output: .
assets:
  diagrams:
    auto_discover: false
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
