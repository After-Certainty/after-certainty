version: 1

publishing:
  enabled: true

book:
  id: coupling
  title: "Coupling"
  subtitle: "Cohesion, Consequence, and the Architecture of Responsibility"
  description: "A practical framework for seeing where systems are tightly joined, where they drift apart, and how those coupling choices shape accountability over time."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: BookCover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

assets:
  diagrams:
    auto_discover: false

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
