version: 1

publishing:
  enabled: true

book:
  id: after-certainty
  title: "After Certainty"
  subtitle: "How to Live and Judge When Understanding is not Enough"
  description: "Practice capstone (~13–14k words) for living and judging after understanding stops delivering relief—letting go of overburdened moral supports, practicing judgment without finality, and orienting without closure. Three parts with part bridges, a pattern map, and Appendix A; read after the portfolio's diagnostic volumes."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png

paths:
  manuscript: "./index.md"
  output: "."

assets:
  diagrams:
    default_width: 1600
    auto_discover: false
    entries:
      - svg: docs/diagrams/pattern-map.svg
        png: export-assets/diagrams/pattern-map.png
        width: 1600

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
