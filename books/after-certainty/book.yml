version: 1
publishing:
  enabled: true
book:
  id: after-certainty
  title: After Certainty
  subtitle: How to Live and Judge When Understanding is not Enough
  description: How to live and judge once explanation reaches its limits—judgment, responsibility, and
    participation without replacement frameworks.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: How do we live and judge when understanding is not enough?
    whyItExists: 'After Certainty is the project’s namesake orientation: judgment, responsibility, and
      participation once explanation reaches its limits and replacement frameworks will not save us.'
    audience: Readers ready for the capstone thesis — including those arriving from curiosity, perspective,
      trust, or systems doorways.
    nonGoals:
    - It does not install a new totalizing certainty in place of the old one.
    - It does not claim that abandoning certainty means abandoning standards.
    selectedConcepts:
    - agency
    - accountability
    - authority
    - abstraction
    - coherence-maintenance
    selectedPatterns:
    - explanation-replaces-response
    - blame-compresses-complexity
    - attention-restores-contact
    selectedConceptRoles:
    - conceptId: agency
      roleInWork: >
        Names the practical stake of the capstone: capacity to act and affect outcomes once explanation
        no longer guarantees control—so participation stays possible without a replacement framework.
    - conceptId: accountability
      roleInWork: >
        Anchors judgment after certainty as exposure to consequence rather than correctness theater;
        distinguishes answerability from mastery of the field.
    - conceptId: authority
      roleInWork: >
        Clarifies operational power that still steers action when understanding is incomplete—so
        leadership and legitimacy remain live questions, not solved by better theory alone.
    - conceptId: abstraction
      roleInWork: >
        Marks the drift the book resists: mediation that scales systems while concealing encounter; the
        work keeps returning judgment to contact with effects.
    - conceptId: coherence-maintenance
      roleInWork: >
        Names the ongoing labor of keeping enough governable agreement—who decides, what counts—without
        installing a new totalizing certainty.
    selectedPatternRoles:
    - patternId: explanation-replaces-response
      roleInWork: >
        Introduces the failure mode where more framing reorganizes harm instead of reducing it—central
        to why understanding alone is not enough.
    - patternId: blame-compresses-complexity
      roleInWork: >
        Dramatizes the cheap relief of locating fault when the field is too complex for a single cause;
        the book treats this as a temptation after certainty fails.
    - patternId: attention-restores-contact
      roleInWork: >
        Applies the restorative move: attention reintroduces consequence where abstraction would hide
        it—practice rather than a new doctrine.
    readBefore:
    - curiosity-before-certainty
    - what-we-cannot-see
    readNext:
    - coupling
    - when-others-look-to-you-v1
  publication_date: '2026-01-15'
  edition_published_at: '2026-01-15'
paths:
  manuscript: ./index.md
  output: .
assets:
  diagrams:
    default_width: 1600
    auto_discover: false
    entries:
    - svg: docs/diagrams/pattern-map.svg
      png: export-assets/diagrams/pattern-map.png
      width: 1600
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
