<?xml version="1.0" encoding="UTF-8"?>
<!-- Four drift/counter-discipline pairings plus two unpaired patterns across the field. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 668" role="img" aria-labelledby="ac-title ac-desc">
  <title id="ac-title">After Certainty - pattern map</title>
  <desc id="ac-desc">Four paired rows: stabilizer drift on the left, counter-discipline on the right. Below, two unpaired patterns that shape judgment across the field.</desc>
  <defs>
    <marker id="ac-pair" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#666666"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 700; fill: #111111; text-anchor: middle; }
      .col-head { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #111111; text-anchor: middle; }
      .section-head { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #111111; text-anchor: middle; }
      .shell-drift { fill: #f5f0ec; stroke: #1a1a1a; stroke-width: 1.5; }
      .shell-disc { fill: #eef2f4; stroke: #1a1a1a; stroke-width: 1.5; }
      .shell-env { fill: #f0f0f0; stroke: #555555; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .pat-label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #111111; text-anchor: middle; text-rendering: geometricPrecision; }
      .pair-line { stroke: #888888; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; marker-end: url(#ac-pair); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="668"/>

  <text class="title" x="460" y="48">After Certainty - Pattern Map</text>

  <text class="col-head" x="228" y="92">When stabilizers drift</text>
  <text class="col-head" x="684" y="92">Counter-disciplines</text>

  <rect class="shell-drift" x="48" y="110" width="360" height="84" rx="3"/>
  <text class="pat-label" x="228" y="148">
    <tspan x="228" y="138">Correctness Hardens</tspan>
    <tspan x="228" y="160">Into Identity</tspan>
  </text>
  <line class="pair-line" x1="416" y1="152" x2="496" y2="152"/>
  <rect class="shell-disc" x="504" y="110" width="360" height="84" rx="3"/>
  <text class="pat-label" x="684" y="148">
    <tspan x="684" y="138">Revisability Preserves</tspan>
    <tspan x="684" y="160">Judgment</tspan>
  </text>

  <rect class="shell-drift" x="48" y="210" width="360" height="84" rx="3"/>
  <text class="pat-label" x="228" y="248">
    <tspan x="228" y="238">Explanation Replaces</tspan>
    <tspan x="228" y="260">Response</tspan>
  </text>
  <line class="pair-line" x1="416" y1="252" x2="496" y2="252"/>
  <rect class="shell-disc" x="504" y="210" width="360" height="84" rx="3"/>
  <text class="pat-label" x="684" y="248">
    <tspan x="684" y="238">Responsibility Persists</tspan>
    <tspan x="684" y="260">Beyond Control</tspan>
  </text>

  <rect class="shell-drift" x="48" y="310" width="360" height="84" rx="3"/>
  <text class="pat-label" x="228" y="348">
    <tspan x="228" y="338">Admiration Becomes</tspan>
    <tspan x="228" y="360">Insulation</tspan>
  </text>
  <line class="pair-line" x1="416" y1="352" x2="496" y2="352"/>
  <rect class="shell-disc" x="504" y="310" width="360" height="84" rx="3"/>
  <text class="pat-label" x="684" y="348">
    <tspan x="684" y="338">Scrutiny Preserves</tspan>
    <tspan x="684" y="360">Trust</tspan>
  </text>

  <rect class="shell-drift" x="48" y="410" width="360" height="84" rx="3"/>
  <text class="pat-label" x="228" y="448">
    <tspan x="228" y="438">Blame Compresses</tspan>
    <tspan x="228" y="460">Complexity</tspan>
  </text>
  <line class="pair-line" x1="416" y1="452" x2="496" y2="452"/>
  <rect class="shell-disc" x="504" y="410" width="360" height="84" rx="3"/>
  <text class="pat-label" x="684" y="448">
    <tspan x="684" y="438">Attention Restores</tspan>
    <tspan x="684" y="460">Contact</tspan>
  </text>

  <text class="section-head" x="460" y="524">Patterns across the field</text>

  <rect class="shell-env" x="48" y="538" width="360" height="84" rx="3"/>
  <text class="pat-label" x="228" y="576">
    <tspan x="228" y="566">Speech Escalates Faster</tspan>
    <tspan x="228" y="588">Than Meaning</tspan>
  </text>

  <rect class="shell-env" x="504" y="538" width="360" height="84" rx="3"/>
  <text class="pat-label" x="684" y="576">
    <tspan x="684" y="566">Finality Compensates</tspan>
    <tspan x="684" y="588">for Uncertainty</tspan>
  </text>
</svg>
