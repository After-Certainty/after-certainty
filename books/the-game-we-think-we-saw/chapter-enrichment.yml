    situations:
      - pressure-accelerates-interpretation
    transition:
      fromPrevious: >
        From Part III's demand into the room where pain is translated into readiness.
      toNext: >
        From pressure to play into the athlete who says no.
  - sourcePath: parts/part-3-what-the-result-demands/chapter-6-the-athlete-who-said-no.md
    summary: >
      Simone Biles loses orientation mid-vault and withdraws while teammates continue—making
      visible that only the athlete feels the body's condition entering the air. Refusal is
      not the opposite of commitment; spectators and institutions cannot borrow the knowledge
      inside the movement they demand.
    centralQuestion: Who has authority to refuse when the audience can see the moment but not the body's risk?
    selectedConcepts:
      - athletic-refusal
      - agency
      - responsibility
      - playing-hurt-moral-language
      - judgment
    selectedPatterns:
