      toNext: >
        From gesture afterlife into the emptied arena and what judgment still owes the
        remainder.
  - sourcePath: back-matter/conclusion-after-the-arena-empties.md
    summary: >
      The lit scoreboard deserves confidence about who won while remaining silent about cause,
      disputed authority, sacrificed bodies, and public afterlives. Seeing more of the game
      means holding measure and remainder apart—and leaving room for refusal when consequence
      cannot be evenly shared.
    centralQuestion: What discipline of judgment remains after the official result has earned its confidence?
    selectedConcepts:
      - scoreboard-remainder
      - judgment
