      toNext: >
        From bodily refusal into what public gestures become once they leave the field.
  - sourcePath: parts/part-4-what-the-result-becomes/bridge.md
    summary: >
      After the game, absence, gesture, and explanation keep moving through headlines and
      memory. The athlete's intended meaning enters institutions it cannot control; public
      interpretation is neither limitless nor obedient while the result stays fixed.
    centralQuestion: What happens to a sporting moment once it leaves the field and enters public story?
    selectedConcepts:
      - gesture-afterlife
      - public-interpretation
      - meaning
      - compression
    selectedPatterns:
      - meaning-drifts-over-time
      - meaning-outruns-the-words
    searchAliases:
      - what the result becomes
      - gesture becomes an image
    transition:
      fromPrevious: >
        From refusal on the apparatus into the afterlife of signals beyond the arena.
      toNext: >
        Into a fixed kneel whose meaning keeps changing in every copy.
  - sourcePath: parts/part-4-what-the-result-becomes/chapter-7-when-a-gesture-becomes-another-message.md
    summary: >
      Kaepernick's kneel keeps the same posture in every photograph while patriotism, protest,
      league policy, and career consequence rewrite the message around it. A final image can
      keep generating meanings the speaker neither owns nor can retract—showing result-fixed,
      argument-open public life.
    centralQuestion: How can a final image keep generating new meanings after the moment is fixed?
    selectedConcepts:
      - gesture-afterlife
      - scoreboard-remainder
      - compression
      - legitimacy
      - public-interpretation
    selectedPatterns:
