version: 1

publishing:
  enabled: true

book:
  id: the-economy-we-dont-experience
  title: "The Economy We Don't Experience"
  subtitle: "Leadership, Communication, and the Credibility Crisis in Economics and Politics"
  description: "Expanded edition (~28–32k words) on the gap between aggregate economic speech and lived experience—compression, signaling, and leadership under interpretive stress. Distinct from When Interpretation No Longer Matters (authority without shared meaning) and When Incentives Become the Moral Language (metrics replacing judgment)."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
