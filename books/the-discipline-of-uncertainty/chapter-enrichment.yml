  - sourcePath: parts/part-5-leadership-without-prophecy/bridge.md
    summary: >
      Part V turns to leaders whose speech is heard as orientation while the map is incomplete.
      Boards and markets reward decisive tone; hesitation reads as weakness and revision as
      betrayal. Discipline is not a mood but habits: naming risk without destiny, acting with
      pre-committed revision. Leadership becomes practice under incomplete information.
    centralQuestion: How can leaders orient others without selling prophecy when the map is incomplete?
    selectedConcepts:
