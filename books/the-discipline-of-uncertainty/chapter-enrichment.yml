    summary: >
      Part VI asks what remains for persons after appetite, patterns, probability, institutions,
      and leadership pressure: responsibility and meaning when guarantees are gone. Acting
      without a final map still leaves obligations to revise and proportion harm. Meaning that
      survives uncertainty orients without false closure—avoiding prophecy and cynicism alike.
    centralQuestion: What holds responsibility and meaning when guarantees are no longer available?
