  - sourcePath: parts/part-1-why-we-crave-absolutes/chapter-2-abstraction-and-the-seduction-of-clean-answers.md
    summary: >
      A clinician performance score compresses dozens of behaviors into one number—transparent
      to administrators, a cartoon to clinicians. Abstraction makes action possible and dispute
      inevitable when the map is mistaken for the territory. Institutions scale comfort into
      metrics that travel farther than the lived cases they summarize.
    centralQuestion: How do clean models travel farther than the cases they compress—and at what cost?
