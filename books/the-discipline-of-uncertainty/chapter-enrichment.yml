  - sourcePath: back-matter/appendix-a-bounded-seriousness-not-infinite-possibility.md
    summary: >
      Some readers hear disciplined uncertainty as permission to drift—if absolutes fail,
      anything is possible and nothing must be decided. The appendix refuses that confusion:
      openness without obligation can become moral evasion. Discipline is bounded seriousness—
      act under known stakes while refusing false inevitability.
    centralQuestion: How is disciplined uncertainty different from keeping every option open forever?
    selectedConcepts:
      - responsibility
      - uncertainty
      - judgment
      - revisability
    selectedPatterns:
