      - result-final-meaning-unsettled
    transition:
      toNext: >
        From shared discomfort into Part I—why absolutes remain seductive when they fail.

  - sourcePath: parts/part-1-why-we-crave-absolutes/bridge.md
    summary: >
      Part I asks why absolutes and clean models stay seductive even when they fail—before
      patterns, probability, institutions, and leadership. It is diagnostic: see why clean
      answers sell, who buys them, and what institutions pay when reality returns variance.
      Psychological comfort comes first; abstraction that scales comfort into metrics follows.
    centralQuestion: Why do clean answers keep selling when lived variance keeps returning?
    selectedConcepts:
