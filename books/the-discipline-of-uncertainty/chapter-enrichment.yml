  - sourcePath: parts/part-2-what-patterns-actually-are/chapter-4-when-pattern-recognition-turns-fatalistic.md
    summary: >
      Documented agency failures become "government cannot work, ever"; three missed launches
      become "we are structurally incapable." The leap from tends-to-happen to must-happen is
      fatalism wearing pattern language. Real regularities stay real; fatalism ends agency by
      converting warning into destiny and demoralizing the people who could still revise.
    centralQuestion: When does pattern recognition stop informing action and start ending it?
