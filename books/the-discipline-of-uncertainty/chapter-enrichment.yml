      toNext: >
        From the part frame into the psychological comfort of certainty.

  - sourcePath: parts/part-1-why-we-crave-absolutes/chapter-1-the-psychological-comfort-of-certainty.md
    summary: >
      A resident facing conflicting shortage guidance feels anger at lost orientation; a team
      after reorganization sighs in relief at a crisp incomplete plan. Certainty ends the spike
      of open loops—even wrong certainty can feel safer than nuanced truth under stress. The
      chapter maps why that comfort is so strong and why institutions ignore the load at their
      peril.
    centralQuestion: Why can wrong certainty feel safer than true nuance when orientation collapses?
    selectedConcepts:
