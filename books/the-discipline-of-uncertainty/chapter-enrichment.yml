  - sourcePath: parts/part-3-probabilistic-truth-and-moral-seriousness/chapter-6-probabilistic-reasoning-is-not-moral-relativism.md
    summary: >
      Prosecutors, physicians, parents, city attorneys, and ombuds act before certainty—cases
      filed, treatments started, interim protections set—under standards made explicit and kept
      revisable. Probabilistic seriousness is accountability under partial knowledge, not
      "anything goes." Weighted concern authorizes proportionate action without declaring guilt
      or outcome as destiny.
    centralQuestion: How can we act under partial knowledge without collapsing into either paralysis or prophecy?
    selectedConcepts:
