  - sourcePath: parts/part-4-institutions-authority-and-drift/chapter-7-warning-systems-that-incriminate-their-own-success.md
    summary: >
      A hospital's green infection dashboard thins morbidity conferences until a cluster returns;
      quiet success was read as moral vindication rather than a changed environment. Warning
      systems are strange: they gain authority by limiting the authority they serve, telling
      successful institutions that success is a moral risk. Constitutions, scriptures, and safety
      regimes share that grammar.
    centralQuestion: Why do warning systems erode precisely when their dashboards look like success?
