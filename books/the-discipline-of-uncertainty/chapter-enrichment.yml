  - sourcePath: parts/part-5-leadership-without-prophecy/chapter-9-why-leaders-are-pressured-into-certainty.md
    summary: >
      Earnings guidance, charity galas, and legislative testimony each reward closure; finance
      offers a range while communications wants a repeatable number. Superintendents after
      safety incidents feel the same compression: honesty about distributions may read as failure
      to protect. Certainty scales in markets and rooms; humility does not—because institutions
      buy narratives that behave like verdicts.
    centralQuestion: What incentives push leaders to speak in verdicts even when they know the range?
