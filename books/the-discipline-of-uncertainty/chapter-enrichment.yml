      toNext: >
        From the part frame into patterns as warnings before outcome is known.

  - sourcePath: parts/part-2-what-patterns-actually-are/chapter-3-patterns-as-warnings-not-verdicts.md
    summary: >
      Near-misses on a manufacturing line and boundary slips in a training clinic argue for
      intervention before catastrophe is proven—direction matters before outcome is known. A
      pattern does not license panic shutdown or doom proclamation. It argues for proportionate
      response while refusing the leap from tendency to destiny.
    centralQuestion: What kind of response does a pattern authorize before the ending is known?
