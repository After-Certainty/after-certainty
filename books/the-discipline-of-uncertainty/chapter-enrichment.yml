version: 1
chapters:
  - sourcePath: front-matter/introduction-when-certainty-stops-working.md
    summary: >
      Public and organizational life increasingly disagrees from incompatible certainties—
      the same incident read as system failure and as negligence, metrics improving while
      frontline reports worsen. The introduction refuses an unkind diagnosis of irrationality
      and names a structural shift: certainty fraying as social glue under scale and exposure.
      The book aims to name shared discomfort and practice judgment when absolutes stop working.
    centralQuestion: What changes when certainty stops holding people together without becoming prophecy or cynicism?
