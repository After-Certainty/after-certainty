        From the conclusion into a guardrail against misreading discipline as drift.

  - sourcePath: back-matter/appendix-b-doubt-versus-discipline.md
    summary: >
      Cultural skepticism can be overdue accountability or doubt as lifestyle—permanent
      suspension of commitment that feels virtuous for refusing false certainty. This book does
      not belong on the doubt shelf. Doubt suspends commitment; discipline commits under partial
      knowledge with revision rules.
    centralQuestion: What is the difference between living in doubt and practicing disciplined uncertainty?
    selectedConcepts:
      - uncertainty
