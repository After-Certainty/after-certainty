  - sourcePath: parts/part-4-institutions-authority-and-drift/bridge.md
    summary: >
      Part IV asks what happens when probabilistic judgment must be hosted by systems that
      remember, signal, and punish. Drift often converts warnings into wallpaper—ethics weeks
      without power, quiet dashboards read as vindication. Success teaches that the watch was
      unnecessary; then harm returns and the institution is shocked at its own sleep.
    centralQuestion: How do institutions turn living warnings into wallpaper—and then into absolutes under pressure?
    selectedConcepts:
