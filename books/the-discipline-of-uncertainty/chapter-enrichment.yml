  - sourcePath: parts/part-2-what-patterns-actually-are/bridge.md
    summary: >
      Part II turns from why we crave closure to what we do with patterns when closure fails.
      Patterns are how serious people learn—smoke before fire—not the enemy of discipline.
      The enemy is verdict language that treats a pattern as if it already decided the ending.
      Warnings preserve agency; destiny talk ends it.
    centralQuestion: How do we keep patterns as warnings without letting them harden into verdicts?
    selectedConcepts:
