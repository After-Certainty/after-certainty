  - sourcePath: back-matter/conclusion-uncertainty-as-a-discipline.md
    summary: >
      Certainty stopped functioning as remembered social glue; the response is not performed
      confidence but discipline—reasoning, judging, and acting when absolutes fail. Uncertainty
      is not a failure state; treating it as failure produces prophecy culture that punishes
      revision. The conclusion gathers the book's moves for readers returning to ordinary rooms.
    centralQuestion: What does it mean to treat uncertainty as a discipline rather than a failure state?
    selectedConcepts:
      - uncertainty
      - judgment
