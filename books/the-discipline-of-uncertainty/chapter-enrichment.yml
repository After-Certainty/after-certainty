  - sourcePath: parts/part-6-living-without-guarantees/chapter-12-meaning-that-survives-uncertainty.md
    summary: >
      Rituals promise repetition more than harvest; researchers keep fidelity to method when
      most experiments fail; people marry without knowing the future. Meaning does not require
      certainty—it requires honesty about what is held, why, and what would count against it.
      Institutions that demand guaranteed outputs push prophecy in public and cynicism in private.
    centralQuestion: How can meaning orient us without depending on false closure?
