  - sourcePath: parts/part-4-institutions-authority-and-drift/chapter-8-individuals-structures-and-the-collapse-into-absolutes.md
    summary: >
      One teacher's abuse or one bullying manager produces verdicts of "broken everywhere" or
      "one bad apple"—both offering moral closure that ends the conversation needed for scope,
      reporting paths, and supervision. Harm is vivid; scope is uncertain; institutions sound
      like minimization and publics like total judgment. Neither language alone does the boring
      work that changes probabilities.
    centralQuestion: How do we keep instance and structure in view without collapsing into totalizing absolutes?
    selectedConcepts:
