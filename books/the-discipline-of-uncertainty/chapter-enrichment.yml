  - sourcePath: parts/part-3-probabilistic-truth-and-moral-seriousness/chapter-5-why-the-world-refuses-absolutes.md
    summary: >
      Flood plans, specialty-care centralization, and ethics committees face distributions—
      average gains, tail harms, waste if overprepared. Responsible questions name populations
      and triggers for reconsideration rather than "will it happen?" alone. Entering morality
      with eyes open means naming tradeoffs without pretending a single sentence can end them.
    centralQuestion: What does responsibility look like when the honest map is a distribution of harms?
