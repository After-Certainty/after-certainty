  - sourcePath: parts/part-3-probabilistic-truth-and-moral-seriousness/bridge.md
    summary: >
      Part III explains how judgment survives when closure fails and patterns stay warnings—
      practiced in speech and institutions that do not punish revision as betrayal. It is neither
      a statistics lecture nor moral relativism. Decisions that hurt people—floods, treatments,
      recalls—keep probabilistic seriousness tied to obligation under incomplete maps.
    centralQuestion: How does moral seriousness survive when truth arrives as a distribution rather than a binary?
    selectedConcepts:
