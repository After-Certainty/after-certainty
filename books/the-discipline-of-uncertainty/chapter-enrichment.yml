  - sourcePath: parts/part-6-living-without-guarantees/chapter-11-responsibility-after-certainty.md
    summary: >
      Parents buckle seatbelts without controlling every road; therapists hold seriousness
      without promising healing; council members allocate risk without knowing the decade's
      shocks. Agency without guarantees is maturity—acting where harm is plausible without
      outsourcing moral labor to fate scripts. Demanding guaranteed outcomes pushes leaders
      toward prophecy that breaks later.
    centralQuestion: What does responsibility look like when no clean category assigns it for you?
