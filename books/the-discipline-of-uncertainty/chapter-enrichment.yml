  - sourcePath: parts/part-5-leadership-without-prophecy/chapter-10-the-discipline-of-uncertainty-as-leadership-practice.md
    summary: >
      Wildfire orders with triggers, hospital surge decision rules, and product launches under
      incomplete information need decisiveness and revision without feeling like tricks. Speak
      in models and notification paths; promise process that is legible when outcomes cannot be
      guaranteed. Legibility is a moral good when harm is distributed and trust fractures if
      leaders spoke only in destiny.
    centralQuestion: What habits let leaders act decisively while pre-committing to honest revision?
