version: 1
publishing:
  enabled: true
book:
  id: the-discipline-of-uncertainty
  title: The Discipline of Uncertainty
  subtitle: Judgment, Restraint, and Decision Quality Under Incomplete Information
  description: Field notes on judgment, restraint, and decision quality when information is incomplete.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: handbook
  literary_form: handbook
  overview:
    centralQuestion: How do we keep moral seriousness and decision quality when absolutes fracture and
      certainty stops working as social glue?
    whyItExists: A handbook for discipline under incomplete information — patterns as warnings not verdicts,
      probabilistic seriousness without relativism, and leadership that refuses false prophecy.
    audience: People who must decide, explain, or govern under constraint — clinical leaders, executives,
      regulators, elected officials, journalists — and citizens who refuse prophecy without cynicism.
    nonGoals:
    - It is not permission to abandon truth, nor a personality manual for “embracing ambiguity.”
    - It is not statistical pedantry detached from harm, or an indictment of ordinary intelligence.
    - It does not promise happiness, victory, consensus, or a checklist that replaces judgment.
    selectedConcepts:
    - uncertainty
    - judgment
    - certainty
    - responsibility
    - revisability
    - humility
    selectedPatterns:
    - revisability-preserves-judgment
    - finality-compensates-for-uncertainty
    - correctness-hardens-into-identity
    readBefore:
    - curiosity-before-certainty
    - how-serious-systems-learn
    readNext:
    - learning-to-see
    - after-certainty
    relatedWorks:
    - workId: how-serious-systems-learn
      relationship: companion_to
      reason: Twin handbooks — learning in motion and discipline when certainty stops coordinating.
    - workId: before-certainty-arrives
      relationship: historicizes
      reason: How certainty formed historically pairs with practicing judgment when it fails as glue.
    - workId: learning-to-see
      relationship: applies
      reason: Comparative practices that form knowers meet handbook disciplines for incomplete information.
    - workId: after-certainty
      relationship: prepares_for
      reason: Discipline under uncertainty opens into living and judging when understanding is not enough.
paths:
  manuscript: ./index.md
  output: .
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
