  - sourcePath: manuscript/act-3-the-fragments/chapter-16-the-fixes-nobody-logged.md
    summary: >
      At Ivera — which slow pilots call Cai's world — Lena finally meets Cai, a gate keeper
      who keeps the crossing open with local repairs he never writes down for anyone else.
      The fixes work here; the wider network still cannot learn from them. Then Lio hands her
      a line that stops her cold: Skin first. Gauge late. — and she recognizes her brother's
      winter-skin traveling hand to hand.
    centralQuestion: What fails when every repair is local and none of the repairs can see each other?
