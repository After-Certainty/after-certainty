version: 1
chapters:
  - sourcePath: front-matter/jacket-copy.md
    kind: other
    summary: >
      For seven hundred years, gates have made travel between a thousand worlds ordinary.
      Courier Lena watches the Vesper gate shut without warning, trapping her brother on the
      far side, while more gates fail and frightened people reach for the nearest clear voice.
      She keeps asking where answers come from before certainty fills the silence.
    centralQuestion: >
      What happens when a civilization-sized blind spot can only be seen one perspective at a time?
    selectedConcepts:
      - finite-perspective
      - uncertainty
      - coordination
    selectedPatterns:
      - learning-collapses
      - gaps-invite-completion
    searchAliases:
      - the relay jacket
      - social science fiction novel
    situations:
      - meaning-outruns-shared-understanding
    transition:
      toNext: >
        Into the opening chapter, where a routine crossing goes silent.

  - sourcePath: manuscript/act-1-the-absence/chapter-01-suspended-pending-review.md
    summary: >
      Lena clears freight by reading how crates are really sealed, not by trusting the
      paperwork — until the Vesper gate goes dark under a notice that says only
      "suspended pending review." Her brother Arin is stuck on the far side. With no real
      explanation, she starts hunting for whoever wrote the notice.
    centralQuestion: What does a civilization do when a critical crossing fails without explanation?
    selectedConcepts:
      - uncertainty
      - institutional-memory
      - feedback
    selectedPatterns:
      - learning-collapses
      - gaps-invite-completion
    searchAliases:
      - suspended pending review
      - vesper gate dark
      - suspension bulletin
    situations:
      - feedback-stops-changing-decisions
    transition:
      fromPrevious: From jacket promise into the first concrete failure.
      toNext: Lena goes looking for a reason and finds that no one has one.

  - sourcePath: manuscript/act-1-the-absence/chapter-02-no-one-has-one.md
    summary: >
      Lena asks why the gate is closed and finds clerks, platforms, and rumor feeds full of
      stories forming faster than facts. No office can name a cause. She keeps digging anyway,
      brushing past Jun, who studies how explanations travel.
    centralQuestion: What is more frightening than a broken gate—a room that cannot say why?
    selectedConcepts:
      - uncertainty
      - finite-perspective
      - feedback
