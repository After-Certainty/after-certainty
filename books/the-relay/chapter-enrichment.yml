  - sourcePath: manuscript/act-3-the-fragments/chapter-14-no-one-erased-it.md
    summary: >
      Veya tells Lena the harder truth: no one erased the old practice of observing and
      answering; people simply stopped doing it, so gradually no hole was left to prosecute.
      Closures are a symptom; attention had already left. Lena turns next toward Ivera, a
      busy crossing world the old pages keep pointing through.
    centralQuestion: How does a civilization lose a way of seeing without leaving a deletion to prosecute?
