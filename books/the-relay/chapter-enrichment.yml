  - sourcePath: manuscript/act-2-the-cascade/chapter-10-kind-and-not-enough.md
    summary: >
      On the pilgrim road, Sera holds displaced people with practical care and no finished
      theory. Lena stands between Varik's certainty and Sera's kindness. Out past the dark
      gates, the people who never travel have begun passing scraps of unseasonals: marsh-light
      gone green, cooling-river milky, birds missing from the week they always come. Lena does
      not yet know it, but the forgotten edge of the network has started learning before the
      center has admitted it is blind.
    centralQuestion: What if the kind answer is real and still insufficient for a failing network?
    selectedConcepts:
