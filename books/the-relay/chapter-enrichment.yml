  - sourcePath: manuscript/act-3-the-fragments/chapter-17-holding-is-not-enough.md
    summary: >
      At Merrow, Sera's people care for the stranded and refuse to blame outsiders — then
      their gate goes dark anyway. Kindness is real and still not enough to keep travel
      moving. Lena names the unseasonals aloud for the first time, and carries Arin's note —
      Skin first. Gauge late. — as their failure reports leave asking other places to write
      back.
    centralQuestion: What becomes visible when the best local holding still cannot keep a gate alive?
