    summary: >
      Lena finally understands who has been stitching the unseasonals together: while she
      traveled, Arin stayed put and built a way for local observations to move. She turns
      toward getting travelers and settled people into the same room — not yet with a finished
      method.
    centralQuestion: What becomes possible when moving sight and staying sight finally meet?
