  - sourcePath: manuscript/act-2-the-cascade/chapter-06-stranger-and-larger.md
    summary: >
      Without doors, the network becomes strange again: tethered markets, canyon guides who
      read silence off stone, gate-towns gone quiet where they should be loud. Ahead of Lena,
      the sabotage story is already closing causeways — and the only way north runs back
      through a tidebound arch into the thick of it.
    centralQuestion: What returns to sight when ordinary motion through a vast system becomes impossible?
    selectedConcepts:
