  - sourcePath: manuscript/act-1-the-absence/chapter-05-the-size-of-it.md
    summary: >
      On a slow corridor, Lena meets waystation keeper Pell — a man who keeps one remote
      station running and knows nothing beyond it — and finally feels how huge the gate
      network is. No one is minding the whole of it. The sabotage story would be easier;
      what she sees is a system too big for any single office to explain.
    centralQuestion: How do you orient when the thing you belonged to is larger than anyone can hold?
    selectedConcepts:
