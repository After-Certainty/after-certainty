    summary: >
      On the Vellum Moon, archivist Toma shows Lena records that look scrubbed — institutions
      missing from the books. The conspiracy reading feels satisfying and almost fits. She
      leaves for Lower Vellum seeking someone who can say what the absences mean.
    centralQuestion: When the record shows absence, how do you know whether something was erased?
