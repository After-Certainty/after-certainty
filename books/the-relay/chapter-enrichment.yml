    summary: >
      On the long corridors between worlds, Lena feels the size of what is failing—centuries of
      doors, vast space under them, and no one minding the whole. Act I closes on dread rather
      than diagnosis.
    centralQuestion: How do you orient when the thing you belonged to is larger than anyone can hold?
