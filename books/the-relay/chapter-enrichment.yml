    transition:
      fromPrevious: From unexplained darkness into the search for cause.
      toNext: Sibling bond and the slow way around a dark gate.

  - sourcePath: manuscript/act-1-the-absence/chapter-03-the-slow-way.md
    summary: >
      With the gate shut, Lena books a slow freighter — weeks through ordinary space instead
      of four seconds through a door. She holds peppermint candies and a "next time" tag meant
      for Arin, and commits to reach him the long way around the dark.
    centralQuestion: What does it cost to keep a relationship across a network that no longer connects?
    selectedConcepts:
      - trust
