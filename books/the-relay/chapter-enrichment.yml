  - sourcePath: manuscript/act-2-the-cascade/chapter-08-the-docks.md
    summary: >
      At the Drevin drift markets, the cutters story turns a quiet crowd against traders, and
      Varik's name travels the dock before his body does. Lena gets two children clear while
      pilot Nadi refuses unpaid questions about whose fault the dark is. People still have to
      eat, and moral urgency does not load a barge.
    centralQuestion: What happens when a useful story becomes a reason to hurt the wrong people?
    selectedConcepts:
