  - sourcePath: manuscript/act-2-the-cascade/chapter-09-the-best-man-in-the-room.md
    summary: >
      At Khoury Transfer, a hungry crowd is about to break into sealed relief food. Varik
      talks father Bram down from forcing the freight gate open, and gives station-master
      Oyo a signed form she can finally use to release the food. He turns the crowd into a
      working crew and feeds the children. Lena feels the pull even as she refuses to join
      him yet.
    centralQuestion: Why is premature certainty so hard to refuse when it works today?
