  - sourcePath: manuscript/act-1-the-absence/chapter-01-suspended-pending-review.md
    summary: >
      Lena clears freight by reading seams rather than paperwork, then watches the Vesper gate
      go dark under a notice that explains nothing. A brother waits on the far side; the bulletin
      motif opens with silence instead of cause.
    centralQuestion: What does a civilization do when a critical crossing fails without explanation?
