  - sourcePath: manuscript/act-1-the-absence/chapter-02-no-one-has-one.md
    summary: >
      Lena does what couriers rarely do with a sealed gate—she asks why—and discovers offices,
      platforms, and feeds full of stories forming faster than facts. An early brush with Jun
      shows fascination with how explanations travel.
    centralQuestion: What is more frightening than a broken gate—a room that cannot say why?
