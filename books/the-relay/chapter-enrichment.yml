    transition:
      fromPrevious: From dread of scale into lived vastness.
      toNext: A town is saved by the wrong theory—and Lena sounds like a crank.

  - sourcePath: manuscript/act-2-the-cascade/chapter-07-arguing-with-a-miracle.md
    summary: >
      On Anneth, the crossing bell rang safe and the sea climbed anyway. Now the town kneels
      on the drying flats to thank the dry-bell flood, and Lena has to argue with a miracle
      that may have saved forty lives for the wrong reason. Denied the ebb-stones, she
      barters toward the floodmark arch at Coll, no longer sure that being right is useful.
    centralQuestion: How do you argue with a story that just saved lives?
