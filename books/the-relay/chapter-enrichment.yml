  - sourcePath: manuscript/act-2-the-cascade/chapter-11-the-caveats.md
    summary: >
      Analyst Jun has spent decades measuring how rumor outruns evidence. He watches his hedged
      findings appear on Varik's banners with every caveat stripped away. The caution that would
      not speak in public helps build the certainty he feared.
    centralQuestion: What happens when careful doubt is stripped into a public certainty?
