  - sourcePath: manuscript/act-2-the-cascade/chapter-12-one-answer-today.md
    summary: >
      A route Lena cleared dies mid-crossing; people she put on a boat called the Wren do
      not come back. Exhausted at Borren, she almost accepts Varik's demand for one answer
      today — then says no, and keeps walking toward the warning lists she still cannot
      name.
    centralQuestion: When fear is loudest, what does “one answer, today” cost tomorrow?
