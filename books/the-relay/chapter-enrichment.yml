      toNext: More gates fail and the sabotage rumor takes shape.

  - sourcePath: manuscript/act-1-the-absence/chapter-04-more-gates.md
    summary: >
      On the slow route she finds a second gate failing, then news of a third. Dockside talk
      hardens into a sabotage story that comforts people faster than Lena can outrun it. She
      meets a calm woman offering tea without a finished theory.
    centralQuestion: When failure spreads, what story arrives first to make the chaos feel owned?
    selectedConcepts:
