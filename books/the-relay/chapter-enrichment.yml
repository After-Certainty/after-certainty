  - sourcePath: manuscript/act-3-the-fragments/chapter-15-what-staying-sees.md
    summary: >
      At the Tarn, Arin sees what no instrument has admitted: winter-skin on the black water,
      moths flying low, and the old field note that changes everything — Skin first. Gauge
      late. He stays, listens to chains and mist, and writes down what locals notice. Those
      notes are just habit for now — not yet an organized network.
    centralQuestion: What kind of knowledge can only accumulate by remaining in one place?
