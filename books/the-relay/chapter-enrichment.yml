    summary: >
      Crossing worlds, Lena relearns wonder she had stopped seeing as freight—strange markets,
      unfamiliar navigation—while the sabotage story travels ahead of her. Scale becomes sensory,
      not abstract.
    centralQuestion: What returns to sight when ordinary motion through a vast system becomes impossible?
