    summary: >
      Through peppermint tags and unfinished next-times, Lena holds the Tarn sibling bond in
      memory while committing to reach Arin by ship—the long route around a gate that will not
      simply reopen. Two speeds of travel enter the book.
    centralQuestion: What does it cost to keep a relationship across a network that no longer connects?
