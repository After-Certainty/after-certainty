version: 1
publishing:
  enabled: true
book:
  id: trust-beyond-similarity
  title: Trust Beyond Similarity
  subtitle: How Trust Remains Possible Across Difference
  description: How people learn to trust perspectives they do not share—and why trust becomes more valuable
    when perspectives differ.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: How can trust remain possible across difference and disagreement?
    whyItExists: Trust Beyond Similarity explores why trust becomes more valuable — not less — when perspectives
      diverge, and what makes cooperation across partial views durable.
    audience: Readers concerned with civic life, teams across disagreement, and relationships where sameness
      cannot be the price of trust.
    nonGoals:
    - It does not claim all disagreement is healthy or all difference should be preserved.
    - It does not reduce trust to a single metric or reputation score.
    selectedConcepts:
    - contestability
    - accountability
    - coordination
    - correction
    - feedback
    selectedPatterns:
    - contact-keeps-the-read-open
    - dissent-is-welcomed
    - scrutiny-preserves-trust
    selectedConceptRoles:
    - conceptId: contestability
      roleInWork: >
        Makes trust across difference durable: claims and summaries can be challenged without requiring
        sameness as the price of belonging.
    - conceptId: accountability
      roleInWork: >
        Keeps cooperation answerable when perspectives diverge—trust as exposure to consequence, not
        comfort of agreement.
    - conceptId: coordination
      roleInWork: >
        Names the practical problem similarity seemed to solve: arranging joint action when stories and
        summaries no longer match.
    - conceptId: correction
      roleInWork: >
        Central after the shock of the partial: updating from what another perspective sees that yours
        did not.
    - conceptId: feedback
      roleInWork: >
        Paths by which partial views return as usable signal—epistemic interdependence without surrender
        of judgment.
    selectedPatternRoles:
    - patternId: contact-keeps-the-read-open
      roleInWork: >
        Applies listening without surrender: more perspective sharpens understanding without forcing
        premature agreement.
    - patternId: dissent-is-welcomed
      roleInWork: >
        Deepens collaboration across difference—problems and partial views must arrive early or
        diversity stays ornamental.
    - patternId: scrutiny-preserves-trust
      roleInWork: >
        Shows how trust across disagreement stays legitimate when challenge remains possible without
        casting partners as villains.
    readBefore:
    - curiosity-before-certainty
    readNext:
    - what-we-cannot-see
    - how-trust-forms
  publication_date: '2026-05-20'
paths:
  manuscript: ./index.md
  output: .
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
