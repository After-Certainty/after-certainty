    summary: >
      After scandal, institutions announce policies, training, and oversight while core authority and
      decision rights remain intact—learning that adapts around harm without renewing legitimacy.
    centralQuestion: What happens when an organization adapts around harm instead of renewing the legitimacy that harm put in question?
    selectedConcepts:
      - renewal
      - accountability
      - legitimacy
      - correction
      - adaptability
    selectedPatterns:
      - learning-collapses
      - exceptions-are-forever
