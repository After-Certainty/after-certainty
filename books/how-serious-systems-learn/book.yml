version: 1
publishing:
  enabled: true
book:
  id: how-serious-systems-learn
  title: How Serious Systems Learn
  subtitle: Disciplines for Acting Without Certainty
  description: A handbook for teams and institutions that need to learn in motion, improve under pressure,
    and make better decisions without waiting for perfect information.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: handbook
  overview:
    centralQuestion: How can serious systems improve under pressure without waiting for perfect information?
    whyItExists: This handbook gathers disciplines for learning in motion — for teams and institutions
      that must act, revise, and remain answerable when certainty is unavailable.
    audience: Leaders, engineers, operators, and institutional practitioners who need practical learning
      postures rather than abstract theory alone.
    nonGoals:
    - It is not a project-management methodology cookbook.
    - It does not promise that better process eliminates moral conflict.
    selectedConcepts:
    - adaptation
    - contestability
    - consequence-architecture
    - feedback
    - coordination
    - institutional-memory
    selectedPatterns:
    - feedback-drives-change
    - learning-collapses
    - revisability-preserves-judgment
    - dissent-is-welcomed
    selectedConceptRoles:
    - conceptId: adaptation
      roleInWork: Learning in motion—systems that revise under pressure rather than waiting for perfect prediction.
    - conceptId: contestability
      roleInWork: Correction paths that stay open so authority preserves learning instead of sealing myth.
    - conceptId: consequence-architecture
      roleInWork: How roles, interfaces, and incentives route what failure teaches back into the system.
    - conceptId: feedback
      roleInWork: Signal that must still change decisions; the handbook's core loop for serious learning.
    - conceptId: coordination
      roleInWork: Collective action under incomplete information—disciplines that keep shared movement revisable.
    - conceptId: institutional-memory
      roleInWork: What organizations preserve across incidents and turnover so pain becomes structure without becoming dogma.
    selectedPatternRoles:
    - patternId: feedback-drives-change
      roleInWork: Healthy incident learning—new facts and risk still revise plans after direction is set.
    - patternId: learning-collapses
      roleInWork: Failure mode when ground story never reaches decision; distance and filtered reporting thin correction.
    - patternId: revisability-preserves-judgment
      roleInWork: Discipline of being wrong on purpose—judgment stays attached to reality after action begins.
    - patternId: dissent-is-welcomed
      roleInWork: Authority that preserves correction by making early bad news safe enough to raise.
    readBefore:
    - curiosity-before-certainty
    readNext:
    - coupling
    - when-others-look-to-you-v1
    relatedWorks:
    - workId: curiosity-before-certainty
      relationship: deepens
      reason: Extends personal curiosity posture into institutional disciplines for learning without certainty.
    - workId: the-discipline-of-uncertainty
      relationship: companion_to
      reason: Twin handbooks—learning in motion and judgment discipline when certainty stops coordinating.
    - workId: coupling
      relationship: prepares_for
      reason: Learning disciplines meet architecture of cohesion, consequence, and how systems join.
    - workId: when-others-look-to-you
      relationship: companion_to
      reason: Feedback, dissent, and leadership under pressure share the same correction problems at human scale.
    - workId: after-certainty
      relationship: prepares_for
      reason: Operating commitments for serious systems open into living and judging after frameworks thin.
  literary_form: handbook
paths:
  manuscript: ./index.md
  output: .
assets:
  diagrams:
    auto_discover: false
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
