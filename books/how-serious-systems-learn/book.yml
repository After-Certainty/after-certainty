version: 1

publishing:
  enabled: true

book:
  id: how-serious-systems-learn
  title: "How Serious Systems Learn"
  subtitle: "Disciplines for Acting Without Certainty"
  description: "A handbook for teams and institutions that need to learn in motion, improve under pressure, and make better decisions without waiting for perfect information."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_footer: "Draft manuscript for editorial development."

paths:
  manuscript: "./index.md"
  output: "."

assets:
  diagrams:
    auto_discover: false

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
