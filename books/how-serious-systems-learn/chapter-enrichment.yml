  - sourcePath: parts/part-1-why-knowing-no-longer-governs-outcomes/bridge.md
    summary: >
      Part I diagnoses modern systems that grow more informed while becoming less corrigible.
      As knowledge improves, confidence scales, commitments harden, and corrective loops weaken
      under pressure. The chapters are not against intelligence or data; they show why those
      tools no longer guarantee responsible action when reversal becomes expensive.
    centralQuestion: Why can systems know more while becoming harder to correct?
