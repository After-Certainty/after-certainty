  - sourcePath: parts/part-1-why-knowing-no-longer-governs-outcomes/chapter-1-when-knowing-is-no-longer-enough.md
    summary: >
      For a long time better information was expected to yield better action—narrower error,
      sharper judgment, responsible moves under growing understanding. The chapter unsettles that
      inheritance: knowing can accumulate while the capacity to reverse, interrupt, and learn
      under pressure declines. Information without corrigibility is not yet seriousness.
    centralQuestion: Why does accumulating knowledge no longer guarantee responsible action?
