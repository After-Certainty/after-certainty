  - sourcePath: parts/part-5-after-certainty/chapter-15-what-remains-possible.md
    summary: >
      Two false exits after certainty fails: resignation (nothing responsible can be done) and
      compensation (perform certainty more aggressively and call it leadership). What remains
      possible is neither—responsibility without illusion, action that stays interruptible, and
      authority that does not pretend the map is complete.
    centralQuestion: What remains possible between resignation and performed certainty?
