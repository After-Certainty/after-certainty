  - sourcePath: parts/part-1-why-knowing-no-longer-governs-outcomes/chapter-3-the-collapse-of-corrective-loops.md
    summary: >
      Metrics, retrospectives, risk reports, and escalation paths can still exist formally while
      feedback arrives too late, too weakly, or too diffusely to change decisions. Visible learning
      mechanisms become evidence that learning remains intact—after the loop has already stopped
      governing action. Collapse is often quiet before it is catastrophic.
    centralQuestion: How do corrective loops die while their rituals remain on the calendar?
