  - sourcePath: front-matter/about-the-author.md
    summary: >
      Kevin Steffensen writes about institutional learning and corrigibility—how organizations
      preserve correction under pressure when prediction fails and outcomes remain high-stakes.
      The note situates the handbook's voice in operational seriousness rather than motivational
      certainty.
    centralQuestion: What stance toward institutions does the author bring to high-stakes learning?
