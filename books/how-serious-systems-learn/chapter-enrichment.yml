  - sourcePath: parts/part-4-when-disciplines-fail/chapter-14-success-as-the-most-dangerous-signal.md
    summary: >
      Success can conceal as much as it reveals: early wins stabilize narratives, reward current
      design, and make friction and redundancy look unnecessary. The better results look, the
      harder it becomes to argue for correction capacity that appears unused. Treating success as
      proof of systemic soundness is how serious systems go to sleep.
    centralQuestion: Why is success often the signal that most endangers ongoing corrigibility?
