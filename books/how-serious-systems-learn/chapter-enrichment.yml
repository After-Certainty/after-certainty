  - sourcePath: parts/part-2-disciplines-that-survived-reality/bridge.md
    summary: >
      Part II shifts from diagnosis to operating discipline when certainty cannot be restored
      and correction cannot be assumed. Five durable responses: constraint that preserves
      reversibility, feedback speed over forecast confidence, system-level visibility, structured
      falsification, and high-reliability humility when failure is not an option.
    centralQuestion: What practices still work when prediction fails and pressure rewards closure?
