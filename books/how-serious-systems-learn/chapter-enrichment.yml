  - sourcePath: parts/part-3-what-these-disciplines-share/chapter-11-authority-that-preserves-correction.md
    summary: >
      Leaders who align incentives and accelerate execution can produce extraordinary short-term
      performance—and silence correction, narrow contestability, and turn commitment into
      identity. Authority that preserves correction exercises power so feedback stays alive:
      interruptible decisions, protected dissent, and consequence architecture that does not
      punish the messenger.
    centralQuestion: How must power be exercised if feedback and dissent are to survive success?
