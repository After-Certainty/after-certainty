  - sourcePath: parts/part-5-after-certainty/chapter-16-learning-as-a-way-of-being.md
    summary: >
      A system can install learning rituals and still become incorrigible when pressure rises—
      measuring feedback while preserving authority patterns that make revision politically
      impossible. The final question is existential as well as procedural: whether learning is
      a temporary stage before control, or a way of being that keeps corrigibility alive.
    centralQuestion: What does it mean for learning to be a way of being rather than a stage before control?
