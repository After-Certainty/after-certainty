  - sourcePath: parts/part-1-why-knowing-no-longer-governs-outcomes/chapter-2-confidence-outruns-correction.md
    summary: >
      Confidence is needed for action, but modern systems often reward decisiveness faster than
      interruptibility — dashboards and narrative outrunning review, feedback, and dissent.
      Endless hesitation is drift; uninterruptible confidence is another failure mode. Seriousness
      keeps commitment revisable when pressure buys closure.
    centralQuestion: What happens when confidence scales faster than correction?
