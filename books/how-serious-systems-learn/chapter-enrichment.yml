  - sourcePath: parts/part-2-disciplines-that-survived-reality/chapter-8-when-failure-is-not-an-option.md
    summary: >
      Aviation, intensive care, nuclear operations, and grid control face immediate public
      consequences where “learn by failing” sounds irresponsible. High-reliability humility
      still learns—through near-misses, simulation, redundancy, and voice that can stop the line—
      without treating catastrophe as the tuition. Seriousness here is learning without gambling
      lives on the experiment.
    centralQuestion: How do high-consequence domains keep learning when catastrophic failure cannot be the curriculum?
