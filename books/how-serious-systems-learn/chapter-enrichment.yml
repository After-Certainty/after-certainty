  - sourcePath: parts/part-4-when-disciplines-fail/chapter-13-the-seduction-of-coherence.md
    summary: >
      Coherent accounts align teams and calm stakeholders after uncertainty—relief that often
      closes inquiry before reality finishes speaking. Tidy explanations convert partial
      interpretation into stable certainty, then reorganize attention around preserving that
      certainty. Seduction is not lying; it is premature closure that feels like leadership.
    centralQuestion: How does the relief of a tidy story become an enemy of ongoing correction?
