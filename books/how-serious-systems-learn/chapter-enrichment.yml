  - sourcePath: parts/part-2-disciplines-that-survived-reality/chapter-5-learning-faster-than-prediction.md
    summary: >
      Forecasts and models remain necessary for allocation under incomplete information; the
      mistake is treating prediction as the primary engine of adaptation when conditions shift
      faster than models stay valid. Serious systems privilege feedback speed and update cadence
      over forecast confidence that cannot keep up with the environment.
    centralQuestion: How do systems adapt when conditions change faster than predictions remain valid?
