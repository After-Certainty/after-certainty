  - sourcePath: parts/part-2-disciplines-that-survived-reality/chapter-4-constraint-as-discipline.md
    summary: >
      Serious systems learn by limiting where action is allowed; unconstrained action is often
      mistaken for agility. Constraint that preserves reversibility is not bureaucratic drag—it
      is how institutions keep options open when speed would otherwise burn the map. Discipline
      here is designed friction in service of corrigibility.
    centralQuestion: Why do serious systems treat constraint as a learning instrument rather than as drag?
