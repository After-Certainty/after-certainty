  - sourcePath: parts/part-4-when-disciplines-fail/bridge.md
    summary: >
      Part IV examines how serious practices decay after convergence: methods harden into
      identity, coherence displaces inquiry, and positive outcomes are misread as proof that
      correction is no longer needed. Disciplines fail not only through neglect but through
      success that puts the watch to sleep.
