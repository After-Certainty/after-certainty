  - sourcePath: parts/part-3-what-these-disciplines-share/chapter-9-error-as-a-design-input.md
    summary: >
      The difference between fragile and serious systems is rarely intelligence; it is whether
      error is planned for as an expected input. Serious systems design for being wrong rather
      than assuming being right—buffers, detection, and revision paths built in before pride
      makes mistakes unspeakable.
    centralQuestion: What changes when error is treated as design input rather than as embarrassment?
