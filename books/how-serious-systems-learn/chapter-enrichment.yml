  - sourcePath: parts/part-3-what-these-disciplines-share/chapter-10-action-as-probe-not-solution.md
    summary: >
      Institutions often treat intervention as implementing a known answer—compliance as success,
      disconfirmation as noise threatening momentum. Serious action is a probe into partially
      unknown conditions: framed to learn, interruptible, and judged by what reality returns,
      not only by whether the plan was followed.
    centralQuestion: How do we keep action as an encounter with reality rather than as proof we already knew?
