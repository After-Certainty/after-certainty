  - sourcePath: parts/part-2-disciplines-that-survived-reality/chapter-7-being-wrong-on-purpose.md
    summary: >
      Far fewer systems are designed to survive discovering they were wrong than to confirm they
      were right. Falsification—not confirmation—is the engine of progress under uncertainty.
      Being wrong on purpose means structuring tests, probes, and dissent so disconfirmation can
      arrive before identity and commitment make revision impossible.
    centralQuestion: How do serious systems design for discovering they were wrong before it is too late?
