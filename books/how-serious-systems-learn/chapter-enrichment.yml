  - sourcePath: parts/part-2-disciplines-that-survived-reality/chapter-6-seeing-the-system-you-are-in.md
    summary: >
      Local metrics improve while handovers degrade, risk shifts downstream, and customer burden
      rises—each unit's progress remaining defensible because no one sees the whole transfer.
      Serious learning requires system-level visibility beyond local dashboards, so optimization
      in one place is not misread as institutional health.
    centralQuestion: What do local improvements hide when no one can see the whole transfer of risk?
