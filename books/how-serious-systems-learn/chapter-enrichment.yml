  - sourcePath: parts/part-4-when-disciplines-fail/chapter-12-when-methods-become-myths.md
    summary: >
      Methods are fragile because they work: visible improvement elevates practice into identity
      and generalized doctrine. Over time the method is judged by whether it is followed, not by
      whether it still preserves correction. Myth replaces conditional response—and learning
      collapses into compliance theater.
    centralQuestion: When does a working method stop being judged by corrigibility and start being judged by loyalty?
