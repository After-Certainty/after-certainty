    transition:
      fromPrevious: The spreadsheet person had made dependency visible.
      toNext: From living rituals into dashboards that cannot see what they summarize.

  - sourcePath: parts/chapter-5-what-the-dashboard-cannot-see.md
    summary: >
      A board meeting opens on a green “people served” number that is accurate and incomplete—shorter
      engagements, a coordinator on leave, sites meeting volume while losing experienced volunteers.
      Summaries let distant governors act; they also invite the fantasy that the dashboard is the work.
      Asking what the number cost restores texture without discarding the metric.
    centralQuestion: What does a true summary hide about the cost of hitting the target?
    selectedConcepts:
      - legibility
      - stale-representation
      - abstraction
      - proximity
      - attention
    selectedPatterns:
      - attention-restores-contact
      - meaning-gets-distorted
      - learning-collapses
    searchAliases:
