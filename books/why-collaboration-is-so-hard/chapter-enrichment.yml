      - inherited-rule-outlives-constraint
    transition:
      fromPrevious: Care had been forced to race the clock.
      toNext: The conclusion returns to Friday night—the show that opens while hiding the week that made it.

  - sourcePath: back-matter/conclusion-the-show-opens-anyway.md
    summary: >
      The audience sees a whole; they do not see the doorway moved, the cue adjusted, or the
      spreadsheet kept. Collaboration remains fragile among sincere people because it asks dependence
      amid incomplete understanding—and still matters because some work only holds when people carry,
      revise, and join one another’s unfinished parts before the seats fill.
    centralQuestion: Why does the effort still matter when collaboration never becomes easy?
    selectedConcepts:
      - partial-coherence
      - shared-contribution
      - invisible-labor
      - structural-fragility
      - coordination
    selectedPatterns:
      - responsibility-persists-beyond-control
      - disagreement-is-suppressed
      - attention-restores-contact
    searchAliases:
      - the show opens anyway
      - audience sees a whole
      - unfinished parts joined
    readingTransition: >
      Closes the book where Friday night hides the week—without promising collaboration will stop being hard.
