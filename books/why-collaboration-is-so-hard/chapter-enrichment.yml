      - green number people served
      - what this number cost
    situations:
      - chart-says-receipt-says-otherwise
    transition:
      fromPrevious: Rituals had kept contact with changing conditions.
      toNext: From summaries that miss cost into alignment rooms that mistake nodding for agreement.

  - sourcePath: parts/chapter-6-the-nodding-room.md
    summary: >
      An alignment session covers the wall in green dots beneath priorities broad enough that no one
      objects; tensions are parked on a separate sheet to be managed later. Months afterward,
      ownership meant authority to some and personal accountability to others, and someone who had
      dotted every square green says they never agreed to the same plan. Nodding can suppress
      disagreement until execution makes the split undeniable.
    centralQuestion: When does visible alignment hide that people never agreed to the same plan?
    selectedConcepts:
      - partial-coherence
