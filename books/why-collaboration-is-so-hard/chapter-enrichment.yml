  - sourcePath: parts/chapter-7-faster-than-care-can-move.md
    summary: >
      An ED tracking board makes delay visible—and useful—while pressure still thins the work care
      requires: medication bottles half-read, histories rebuilt at each handoff, social work arriving
      only at discharge. Humane optimization does not romanticize slowness; it moves necessary care
      earlier so the clock no longer forces thinning. Some delays are indefensible; others reveal
      design that placed care at the end of time.
    centralQuestion: What happens when systems optimize speed past the pace care can move?
    selectedConcepts:
      - care
      - acceleration
      - throughput
      - friction
      - coordination-pressure
    selectedPatterns:
      - explanation-replaces-response
      - attention-restores-contact
      - feedback-drives-change
    searchAliases:
