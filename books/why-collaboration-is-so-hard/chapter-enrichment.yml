version: 1
chapters:
  - sourcePath: front-matter/introduction-the-meeting-everyone-remembered-differently.md
    summary: >
      Five people leave a meeting that looked successful carrying five different meetings—engineers
      solving different problems, a designer updating a prototype, notes rewritten afterward. Blame
      often finds a careless person; the introduction considers another possibility: collaboration
      asks people to keep working where no one fully sees, controls, or owns the result.
    centralQuestion: Why can sincere people leave the same room with different meetings in hand?
    selectedConcepts:
      - partial-coherence
      - coordination
      - diffuse-ownership
      - legibility
      - structural-fragility
    selectedPatterns:
      - meaning-outruns-the-words
      - disagreement-is-suppressed
    searchAliases:
      - meeting everyone remembered differently
      - five different meetings
      - collaboration is structurally hard
    situations:
      - same-meeting-different-decisions
    readingTransition: >
      From the remembered-differently meeting into a production that no longer belongs to one director.

  - sourcePath: parts/chapter-1-the-show-that-opens-friday.md
    summary: >
      By tech week a play has become a field of consequences—beams, cues, codes, sickness—beyond any
      director’s private picture. Shared contribution holds the show together while credit compresses
      into a name, and accumulated memory of that erasure can look like resistance to collaboration.
      Some work cannot be done another way even when recognition fails.
    centralQuestion: What happens when shared work exceeds any one person’s sight—and credit still needs a name?
    selectedConcepts:
      - shared-contribution
      - contribution-asymmetry
      - coordination
      - invisible-labor
      - structural-fragility
    selectedPatterns:
      - responsibility-persists-beyond-control
      - gaps-invite-completion
      - intent-gets-assigned
    searchAliases:
      - the show that opens friday
      - tech week consequences
      - collaboration as erasure
    situations:
      - responsibility-outruns-control
    transition:
      fromPrevious: The introduction showed partial understandings leaving the same room.
      toNext: From contribution that no one owns alone into agreements that were never the same thing.

  - sourcePath: parts/chapter-2-we-did-not-agree-to-the-same-thing.md
    summary: >
      Two engineers leave the same meeting carrying incompatible “agreements”—one heard a decision,
      the other heard permission to keep thinking—revealing how collaboration often proceeds from
      partial understanding rather than prior alignment. Visible constraints and translation work
      matter because silence can look like agreement while someone absorbs the gap between plan and
      reality.
    centralQuestion: Why can sincere people leave the same meeting with different decisions?
    selectedConcepts:
      - partial-coherence
      - legibility
      - diffuse-ownership
      - invisible-labor
      - constraints
    selectedPatterns:
      - disagreement-is-suppressed
      - meaning-outruns-the-words
    searchAliases:
      - same meeting different memories
      - thought we already agreed
      - we did not agree to the same thing
    situations:
      - same-meeting-different-decisions
    transition:
      fromPrevious: The show opened as shared contribution beyond one person’s sight.
      toNext: From the opening failure of shared memory into the invisible labor that tries to hold
        collaboration together afterward.

  - sourcePath: parts/chapter-3-the-person-who-keeps-the-spreadsheet.md
    summary: >
      A temporary curriculum spreadsheet becomes the department’s memory, route, and risk surface—
      then gratitude asks the same person to keep carrying it through implementation. Appreciation
      without redistribution apologizes for dependency; deeper recognition asks what she should no
      longer have to carry. When she proposes handing maintenance off, an invisible arrangement
      becomes visible.
    centralQuestion: What does a collaboration owe the person who became everyone’s route?
    selectedConcepts:
      - invisible-labor
      - contribution-asymmetry
      - diffuse-ownership
      - institutional-memory
      - coordination
    selectedPatterns:
      - responsibility-persists-beyond-control
      - exceptions-are-forever
    searchAliases:
      - the person who keeps the spreadsheet
      - temporary spreadsheet forever
      - appreciation without redistribution
    situations:
      - reliable-person-becomes-the-route
      - temporary-fixes-become-permanent
    transition:
      fromPrevious: Partial agreements had left translation work unnamed.
      toNext: From concentrated invisible labor into rituals that make small changes visible before danger.

  - sourcePath: parts/chapter-4-the-ritual-before-the-lift.md
    summary: >
      A construction crew’s morning circle names the route, wind limit, and signal person; a parked
      truck is moved after six minutes because the ritual made a small change speakable before the
      lift. Collaborative practices do not require perfect people—they create moments where limits
      are less likely to become everyone else’s surprise. Rituals die when they can no longer change
      anything.
    centralQuestion: How do ordinary rituals keep human limits from becoming collective surprise?
    selectedConcepts:
      - designed-friction
      - stabilizing-practices
      - coordination
      - feedback
      - corrigibility
    selectedPatterns:
      - feedback-drives-change
      - contact-keeps-the-read-open
      - exceptions-are-forever
    searchAliases:
