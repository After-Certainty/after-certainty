      - explanation-displaces-action
    transition:
      fromPrevious: Nodding had deferred disagreement until mid-year progress walls.
      toNext: From care under the clock into what the next team inherits from rooms that already failed.

  - sourcePath: parts/chapter-8-what-the-next-team-inherits.md
    summary: >
      A consultant’s acronym triggers laughter about an initiative no one discusses; caution about
      governance, pilots, and facilitation arrives as residue from earlier rooms. Collaboration begins
      with people remembering other collaborations. Asking what would make this attempt different—
      changed authority, scope, or repair—beats reassurance; a smaller handoff with a review date is
      more believable than another grand integration promise.
    centralQuestion: How should a new collaboration account for the residue of rooms that already failed?
    selectedConcepts:
      - inheritance
      - residue
      - institutional-memory
      - structural-fragility
      - trust
    selectedPatterns:
      - meaning-drifts-over-time
      - exceptions-are-forever
      - learning-collapses
    searchAliases:
