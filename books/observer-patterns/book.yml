version: 1

publishing:
  enabled: true

book:
  id: observer-patterns
  kind: poetry
  title: "Observer Patterns"
  description: "Poems about what happens when attention becomes decisive—when looking, deciding, and following reshape what is possible."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: false

build:
  typst:
    entry: typst/main.typ
    min_version: "0.14.0"
  formats:
    docx:
      enabled: false
    epub:
      enabled: false
    pdf:
      enabled: true
      pdf_engine: typst

github:
  release: true
  release_tag: "latest"
  artifacts:
    - pdf
