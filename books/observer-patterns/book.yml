version: 1
publishing:
  enabled: true
  targets:
    ingramspark:
      enabled: true
      specification_profile: ingramspark-2026-07
      status: planning
      package:
        github_release: false
        immutable_release: false
      ebook:
        enabled: false
      print:
        enabled: true
        edition: paperback
        # print.isbn omitted until assigned — cover-preview packaging only.
        binding: perfect-bound
        trim:
          width_inches: 6.0
          height_inches: 9.0
        interior:
          color_mode: black-and-white
          paper: cream
          bleed: false
        cover:
          strategy: assembled-raster-wrap
          template_metadata: assets/ingramspark/template-meta.yml
          template_page_count: 32
          barcode_mode: ingram-generated
          assets:
            back: assets/ingramspark/back.png
            spine: assets/ingramspark/spine.png
            front: assets/ingramspark/front.png
book:
  id: observer-patterns
  kind: poetry
  title: Observer Patterns
  description: Poems about what happens when attention becomes decisive—when looking, deciding, and following
    reshape what is possible.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: poetry
  literary_form: poetry_collection
  overview:
    centralQuestion: What takes shape when looking, deciding, and following become decisive?
    whyItExists: A poetry book of observer patterns—attention becoming decisive—readable alone or together
      within the wider corpus, without instructions or argument.
    audience: Readers who want pattern recognition through poems rather than analytical prose, and anyone
      tracing attention, observation, and recurrence across the series.
    nonGoals:
    - It is not instructions.
    - It is not arguments or a prose diagnostic volume.
    selectedConcepts:
    - attention
    - meaning
    - judgment
    - trust
    selectedPatterns:
    - attention-finds-a-focus
    - attention-finds-a-signal
    - attention-restores-contact
    selectedConceptRoles:
    - conceptId: attention
      roleInWork: >
        Lyric hinge of the collection: looking that becomes decisive—when noticing alone reshapes what
        can happen next.
    - conceptId: meaning
      roleInWork: >
        What poems stabilize enough to recognize without arguing—pattern held in image rather than
        thesis.
    - conceptId: judgment
      roleInWork: >
        Figures deciding under incomplete sight; the poems stage assessment as stance, not instruction.
    - conceptId: trust
      roleInWork: >
        Appears as extending action beyond what one poem's speaker can verify—following and being
        followed.
    selectedPatternRoles:
    - patternId: attention-finds-a-focus
      roleInWork: >
        Recurs as poems where looking settles on one figure and reorganizes the field around that gaze.
    - patternId: attention-finds-a-signal
      roleInWork: >
        Stages first salience—what flashes into notice and then trains the next noticing.
    - patternId: attention-restores-contact
      roleInWork: >
        Returns consequence into the lyric frame where abstraction would thin encounter—attention as
        contact, not explanation.
    readBefore:
    - learning-to-see
    readNext:
    - what-we-cannot-see
    relatedWorks:
    - workId: learning-to-see
      relationship: companion_to
      reason: Poems of decisive attention companion practices of becoming a better knower.
    - workId: what-we-cannot-see
      relationship: reframes
      reason: Observation and participation reframe finite perspective through pattern rather than treatise.
paths:
  manuscript: ./index.md
  output: .
frontmatter:
  generate:
    enabled: false
build:
  typst:
    entry: typst/main.typ
    min_version: 0.14.0
  formats:
    docx:
      enabled: false
    epub:
      enabled: false
    pdf:
      enabled: true
      pdf_engine: typst
github:
  release: true
  release_tag: latest
  artifacts:
  - pdf
