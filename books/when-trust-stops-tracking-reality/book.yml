version: 1

publishing:
  enabled: true

book:
  id: when-trust-stops-tracking-reality
  title: "When Trust Stops Tracking Reality"
  subtitle: "Why Good Intentions Sometimes Become Harmful"
  description: "How trust drifts from evidence when good intentions stop learning from feedback—through the fictional arc of Calder Family Health and real institutional patterns."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
