    summary: >
      Three people leave the same meeting carrying nearly identical words with different stress — caution,
      decisiveness, permission — reconstructing unfinished speech under compression and constraint.
    centralQuestion: Why can the same sentence become three usable meanings without anyone inventing or lying?
    selectedConcepts:
      - interpretation
      - compression
      - authority
      - legitimacy
      - meaning
    selectedPatterns:
      - meaning-outruns-the-words
      - intent-gets-assigned
      - gaps-invite-completion
    searchAliases:
