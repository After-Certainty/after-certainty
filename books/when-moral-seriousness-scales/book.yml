version: 1

publishing:
  enabled: true

book:
  id: when-moral-seriousness-scales
  title: "When Moral Seriousness Scales"
  subtitle: "Judgment Under Distance and Pressure"
  description: "An exploration of how moral responsibility changes under scale, speed, and institutional distance, and how to preserve humane judgment anyway."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png

paths:
  manuscript: "./index.md"
  output: "."

assets:
  diagrams:
    auto_discover: false

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
