  - sourcePath: parts/part-3-how-influence-endures/chapter-9-the-bracelet.md
    summary: >
      Friendship bracelets begin at a kitchen table with cheap beads—no stage, no committee.
      Most valuables gain worth by being guarded; the bracelet gains worth by moving through
      hands that share a vocabulary. Culture circulates when people no longer wait for
      instruction from the stage: guest-made objects and jokes become the medium of belonging
      that outlasts any single performer.
    centralQuestion: What kind of cultural object increases in value by circulating rather than by being owned?
    selectedConcepts:
