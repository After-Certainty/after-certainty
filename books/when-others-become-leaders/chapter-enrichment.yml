version: 1
chapters:
  - sourcePath: front-matter/reading-with-the-series.md
    summary: >
      The book stands alone; its closest companion is When Others Look To You, which studies
      influence gathering around someone. This volume asks what that influence leaves behind—
      more capable people and communities, or dependence on the original figure. Both use
      circulation for influence that can move through people and practices, with the caution
      that cruelty circulates too.
    centralQuestion: What does this book ask after influence has already gathered around someone?
    selectedConcepts:
      - circulation
      - agency
      - authority
      - guest-leadership
    selectedPatterns:
      - leadership-coalesces
      - leadership-reproduces-itself
    searchAliases:
      - reading with the series
      - companion to when others look to you
      - circulation caution
    transition:
      toNext: >
        From series placement into the introduction's wrong question about the head of the table.

  - sourcePath: front-matter/introduction-the-wrong-question.md
    summary: >
      Leadership books usually begin with the chair at the head of the table—how the occupant
      thinks, decides, and crosses the room into that place. The introduction reframes: groups
      need people willing to move before agreement is complete, but the lasting question is what
      a leader leaves behind. Influence that only concentrates around one person fails the test
      of circulation—whether agency multiplies when the original figure is absent.
    centralQuestion: What should we ask of leadership besides who occupies the chair?
    selectedConcepts:
      - circulation
      - agency
      - authority
      - guest-leadership
      - moral-posture-toward-harm
    selectedPatterns:
      - leadership-coalesces
      - leadership-reproduces-itself
      - admiration-becomes-insulation
    searchAliases:
