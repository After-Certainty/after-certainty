  - sourcePath: parts/part-2-how-influence-moves/bridge.md
    summary: >
      Part II follows influence that must travel: marches that turn belief into geography, trees
      that ask patience of many hands, signs that reveal when language has become routine. None
      announces a succession program; each tests whether courage and meaning can circulate beyond
      the person who first stood up.
    centralQuestion: How does influence move when it must travel beyond the person who first gathered it?
    selectedConcepts:
