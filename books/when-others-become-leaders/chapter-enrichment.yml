      toNext: >
        From the part frame into the table as the first moral arrangement of belonging.

  - sourcePath: parts/part-1-how-influence-begins/chapter-1-the-table.md
    summary: >
      Chairs face inward and seating becomes moral arrangement: who sits near the host, who
      waits with the children, who finds no place prepared. Tables draw temporary circles of
      belonging at weddings, cafeterias, state dinners, and family holidays. Influence begins
      here as hospitality and exclusion—who may speak and be heard—long before anyone names a
      leader.
    centralQuestion: How do seating and hospitality become the first politics of who belongs?
