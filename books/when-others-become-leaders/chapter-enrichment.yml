      - reliable-person-becomes-the-route
    transition:
      fromPrevious: >
        From series orientation into why studying only the chair is the wrong frame.
      toNext: >
        From the reframed question into Part I—beginnings that do not yet look like leadership.

  - sourcePath: parts/part-1-how-influence-begins/bridge.md
    summary: >
      Part I studies beginnings that do not yet look like leadership: a meal, a grain of salt,
      the strange pause after victory. None announces a program; each shows how influence
      acquires moral shape—who belongs, what a body may refuse, what power is for—before it
      hardens into office or legend.
    centralQuestion: How does influence acquire moral shape before it looks like leadership?
    selectedConcepts:
