        From the table's belonging into salt as circulating, dissolving influence.
      toNext: >
        From seasoning into victory—what power does when the contest ends.

  - sourcePath: parts/part-1-how-influence-begins/chapter-3-victory.md
    summary: >
      After the whistle, handshake rituals ask winners not to gloat and losers not to strike—
      the other side remains a person after the score. Wars and governments end on paper while
      the defeated become neighbors; victory that only humiliates cannot circulate agency. The
      chapter asks what power is for when counting stops: domination that freezes the field, or
      a moral posture that leaves room for shared life afterward.
    centralQuestion: What must victory leave intact if influence is to remain livable afterward?
    selectedConcepts:
