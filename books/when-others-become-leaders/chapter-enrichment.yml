  - sourcePath: parts/part-1-how-influence-begins/chapter-2-salt.md
    summary: >
      Salt makes food taste more fully of itself by disappearing; it preserves, dissolves, and
      returns through sweat and tears. Civilizations built roads and monopolies around something
      no ruler invented. The chapter reads salt as a figure for influence that seasons a group
      without becoming the dish—circulation that strengthens others rather than concentrating
      flavor in one name.
    centralQuestion: What kind of influence works by disappearing into what it strengthens?
    selectedConcepts:
      - circulation
      - guest-leadership
      - agency
      - humility
