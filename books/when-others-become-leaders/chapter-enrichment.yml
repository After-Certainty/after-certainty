  - sourcePath: parts/part-3-how-influence-endures/chapter-8-the-neighborhood.md
    summary: >
      Children notice divided adult attention—the delayed answer, the smile without understanding—
      because their lives depend on people larger than themselves. Sustained listening surrenders
      the prepared argument and the right to decide too quickly what the speaker means. Influence
      endures in neighborhoods when attention is teachable: not charisma on a feed, but practiced
      presence that can be learned and passed along.
    centralQuestion: How does teachable attention keep influence alive when screens and schedules divide it?
    selectedConcepts:
