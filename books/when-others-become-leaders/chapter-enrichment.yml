  - sourcePath: parts/part-2-how-influence-moves/chapter-5-the-tree.md
    summary: >
      A seed disappears before anything shows; watering the same patch looks like failure until
      it does not. Public change is supposed to announce itself in laws and crowds photographed
      from above; growing influence often does not. The tree figures circulation as many hands
      protecting slow work—agency that multiplies across seasons rather than a single spectacle.
    centralQuestion: How does influence circulate when growth stays invisible longer than spectacle allows?
