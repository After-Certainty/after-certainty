  - sourcePath: parts/part-2-how-influence-moves/chapter-4-the-march.md
    summary: >
      Ordinary walking becomes dispute when continuing means contesting who may occupy space
      and whether permission was ever another's to give. Marches matter across struggles because
      they turn belief into geography—bodies advancing together rewrite what the road allows.
      Influence moves here as shared risk and visible claim, not only as speech from a platform.
    centralQuestion: How does walking together turn belief into a claim on shared space?
    selectedConcepts:
