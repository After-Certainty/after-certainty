  - sourcePath: back-matter/epilogue-the-empty-chair.md
    summary: >
      Habit still reaches for the absent person's cup; families leave the chair untouched because
      claiming it can feel like declaring absence complete. Eventually furniture moves—a guest,
      a growing child, a chair by the window—and importance no longer requires preserving the
      room exactly. The epilogue closes the book's test: leadership that circulates lets the
      empty chair remain meaningful without making the living freeze around it.
    centralQuestion: How do we honor an absent leader without turning the room into a museum of their place?
