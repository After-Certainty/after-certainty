  - sourcePath: parts/part-2-how-influence-moves/chapter-6-the-sign.md
    summary: >
      Signs repeat without breath: wash hands, no parking, be kind above a hallway of exclusion,
      values in a lobby that punish literal practice. Displayed words can guide or merely prove
      that the proper language was posted. Influence moves poorly when signs substitute for
      answerable practice—circulation fails when language becomes routine cover rather than
      shared obligation.
    centralQuestion: When do posted words circulate real obligation, and when do they only display it?
    selectedConcepts:
