  - sourcePath: parts/part-3-how-influence-endures/bridge.md
    summary: >
      Part III turns to endurance: what keeps producing agency after the originating leader is
      absent or no longer central. A house if guests become stewards; a neighborhood if attention
      is teachable; a bracelet if culture no longer waits for the stage. Places, relationships,
      and practices carry influence forward without a succession program.
    centralQuestion: What keeps producing agency when the person who first gathered attention is gone?
    selectedConcepts:
