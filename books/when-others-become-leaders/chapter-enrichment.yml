  - sourcePath: parts/part-3-how-influence-endures/chapter-7-the-house.md
    summary: >
      Inside and outside, locks and curtains mark belonging; hospitality changes the threshold
      so a traveler can stop being outside for a while. A house outlasts its founder when guests
      become stewards rather than permanent dependents on the original host. Enduring influence
      here is guest-leadership: temporary crossing that teaches people to keep the room open
      without erasing the door.
    centralQuestion: How does a house keep producing welcome after the founder no longer opens every door?
    selectedConcepts:
      - guest-leadership
