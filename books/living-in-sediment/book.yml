version: 1
publishing:
  enabled: true
book:
  id: living-in-sediment
  title: Living in Sediment
  subtitle: How Structures Outlive Their Reasons
  description: We live inside inherited systems built for constraints that no longer exist. When structures
    survive after their reasons disappear, meaning drifts—and the danger is forgetting the sediment is
    sediment.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: fiction
paths:
  manuscript: ./index.md
  output: .
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
