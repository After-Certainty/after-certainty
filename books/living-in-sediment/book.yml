version: 1
publishing:
  enabled: true
book:
  id: living-in-sediment
  title: Living in Sediment
  subtitle: How Structures Outlive Their Reasons
  description: We live inside inherited systems built for constraints that no longer exist. When structures
    survive after their reasons disappear, meaning drifts—and the danger is forgetting the sediment is
    sediment.
  author:
    name: Kevin Steffensen
    website: https://after-certainty.com
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png
  content_type: nonfiction
  literary_form: monograph
  overview:
    centralQuestion: Why do structures outlive the reasons that created them?
    whyItExists: 'To teach historical perception of present infrastructure fossils—language, time, policy,
      metrics, algorithms—across four movements: fossils we do not notice, fossils shaping power, fossils
      forming now, and living among sediment.'
    audience: Readers of institutions, technology, and everyday coordination who want a habit of seeing
      between permanent skepticism and unquestioning acceptance.
    nonGoals:
    - It is not a catalog of errors waiting to be corrected.
    - It does not treat inherited structures as automatically suspect simply because they are inherited.
    - It is not a policy checklist; seeing does not by itself prescribe what to remake.
    selectedConcepts:
    - inheritance
    - drift
    - structure
    - legitimacy
    - compression
    selectedPatterns:
    - meaning-drifts-over-time
    - exceptions-are-forever
    - examples-accumulate
    readBefore:
    - before-certainty-arrives
    readNext:
    - when-incentives-become-the-moral-language
    - after-certainty
    relatedWorks:
    - workId: before-certainty-arrives
      relationship: historicizes
      reason: Sediment in the present is often certainty that formed under earlier constraints.
    - workId: when-incentives-become-the-moral-language
      relationship: applies
      reason: Metrics that outlive their reasons are a living form of institutional sediment.
    - workId: after-certainty
      relationship: prepares_for
      reason: Living among sediment leads into judgment when inherited frames no longer suffice.
paths:
  manuscript: ./index.md
  output: .
frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md
    about_the_series:
      repo_template: templates/about_the_series.md.j2
      output: front-matter/about-the-series.md
build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true
github:
  release: true
  release_tag: latest
  artifacts:
  - docx
  - epub
  - pdf
