  - sourcePath: parts/part-2-fossils-that-shape-power/chapter-8-the-building-and-the-gathering.md
    summary: >
      Cathedrals, courthouses, and libraries quiet voices before anyone asks—architecture that
      seems to make a request. Early ekklesia named the gathering, not the stone; later the
      building became the container we treat as the institution. Sediment here is how space and
      form inherit authority: the gathering's purpose hardens into walls that still teach
      comportment after the original assembly language has thinned.
    centralQuestion: When does the building replace the gathering as what we think the institution is?
