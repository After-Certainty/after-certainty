  - sourcePath: parts/part-2-fossils-that-shape-power/chapter-6-the-score-that-follows-you.md
    summary: >
      A three-digit number appears in a banking app already carrying authority—few remember
      first encountering it or asking why it should exist. Credit scores feel like facts rather
      than inventions that compress judgment into a portable ranking. Sediment here is
      reputational infrastructure: a measurement that follows people into loans, rentals, and
      jobs long after its originating underwriting problems have been forgotten.
    centralQuestion: How does an invented ranking become ordinary authority over a person's options?
