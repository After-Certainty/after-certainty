  - sourcePath: parts/part-1-fossils-we-dont-notice/chapter-3-the-thirty-year-house.md
    summary: >
      A home gathers habits—creaking stairs, closet height marks, the Christmas-tree spot—
      while closing-day papers fix attention on rates and payments. The thirty-year mortgage
      remembers a crisis response that became the default path to dwelling; sediment here is
      financial form that still steers family life long after the emergency that standardized
      it. The house feels personal; the term is institutional inheritance.
    centralQuestion: How does a crisis-era financing form become the ordinary shape of a home?
