  - sourcePath: parts/part-3-fossils-forming-now/chapter-9-what-the-algorithm-sees.md
    summary: >
      Library shelves once let neighboring books create discovery; blank search boxes return
      ordered millions in a fraction of a second, and most people click the first few. Ranking
      systems are not optional decoration—they are how an unnavigable warehouse becomes usable.
      Sediment forming now is attention ordered before we ask why those results appeared first,
      compressing judgment into infrastructure still settling.
    centralQuestion: What does ranking infrastructure decide about attention before we decide what deserves it?
