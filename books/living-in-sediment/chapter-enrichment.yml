  - sourcePath: parts/part-2-fossils-that-shape-power/chapter-5-the-small-states-and-the-senate.md
    summary: >
      From thirty thousand feet Wyoming and California look equally certain on the map while
      one holds nearly seventy times the population of the other. The Senate's equal state voice
      remembers a negotiation room, not a finished principle descending intact. Constitutions
      are acts of compromise that become sediment: representation rules that still shape power
      centuries after the delegates left.
    centralQuestion: How does a founding compromise keep allocating political voice after its bargaining room is gone?
