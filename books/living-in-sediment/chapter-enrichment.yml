  - sourcePath: parts/part-4-living-among-sediment/chapter-13-when-justification-fades.md
    summary: >
      An old river bend looks permanent until you remember it began as water finding an easier
      path that deepened itself year after year. Structures likewise keep their shape after the
      justification that cut the channel has faded. The chapter practices seeing path-dependence
      without demanding that every bend be straightened—recognition that form can outlast reason
      while still carrying water.
    centralQuestion: What should we do with structures that still function after their original justification has faded?
