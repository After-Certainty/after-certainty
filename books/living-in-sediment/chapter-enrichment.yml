  - sourcePath: parts/part-3-fossils-forming-now/chapter-11-delegated-judgment.md
    summary: >
      Bankers, hiring managers, physicians, and teachers once carried judgment and explanation
      together—someone who could be questioned. Delegation to systems and scores often keeps
      the decision while thinning the answerable person. Sediment forming now is authority that
      still steers loans, hires, and care after the conversational face of judgment has been
      replaced by procedure that does not hesitate in the margins.
    centralQuestion: What is lost when decisions keep traveling after the person who could explain them no longer stands there?
