  - sourcePath: parts/part-4-living-among-sediment/chapter-15-archaeology-of-the-present.md
    summary: >
      Archaeologists brush dirt from fragments before deciding what to think—restraint before
      interpretation. The same patience applies to weekdays, keyboards, mortgages, Senate shape,
      quarterly cadence, search rankings, and data shadows still underfoot. Archaeology of the
      present is a practice of noticing layers in living infrastructure: ask what this is and
      what it remembers before asking only what should replace it.
    centralQuestion: What does it mean to practice archaeology on structures we still inhabit?
