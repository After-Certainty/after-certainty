  - sourcePath: parts/part-3-fossils-forming-now/bridge.md
    summary: >
      Looking backward, compromises and measurements look clear once urgency has stripped away;
      the present offers no such luxury. People living through printing presses or early railroads
      rarely knew they were settling tomorrow's sediment. Part III watches structures forming
      now—ranking, subscription, delegated judgment, data doubles—before time has finished the
      interpretive work.
    centralQuestion: How do we notice sediment while it is still settling rather than only after it hardens?
