  - sourcePath: parts/part-2-fossils-that-shape-power/bridge.md
    summary: >
      Weekday gods and keyboard QWERTY are gentle inheritances; the same pattern settles into
      institutions. Part II turns from fossils we can smile at to fossils that still allocate
      voice, credit, moral tempo, and gathering space. History hiding in a government asks more
      of the reader than history hiding in Thursday—without abandoning the same perception skill.
    centralQuestion: What changes when the fossil we notice sits inside power rather than a weekday?
