      - october means eight
      - calendar name fossils
    situations:
      - inherited-rule-outlives-constraint
    transition:
      toNext: >
        From month-name fossils into Part I's gentler companions—days, seconds, mortgages, gold.

  - sourcePath: parts/part-1-fossils-we-dont-notice/bridge.md
    summary: >
      Part I begins with ordinary companions that still carry history: day names, time
      measurement, keyboard shape, mortgage form, the lingering intuition of gold. These
      inheritances organize life without demanding a political position; the pleasure is
      noticing that something familiar has been quietly historical all along. The movement
      trains perception before the book turns to fossils that shape power.
    centralQuestion: What can unnoticed everyday forms teach before we look at institutions?
