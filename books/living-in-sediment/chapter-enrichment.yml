  - sourcePath: parts/part-4-living-among-sediment/bridge.md
    summary: >
      Weekdays, mortgages, Senate compromise, rankings, and datasets rhyme: a response that
      worked well enough settles while the original problem fades. Seeing sediment everywhere
      can tip into permanent distrust—history as a catalogue of mistakes awaiting dismantling.
      Part IV refuses that reflex: the task is living among inheritance with perception, not
      treating every layer as obsolete on sight.
    centralQuestion: How do we keep seeing sediment without concluding that everything inherited is only waiting to be torn down?
