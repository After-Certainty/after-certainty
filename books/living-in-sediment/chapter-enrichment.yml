  - sourcePath: parts/part-1-fossils-we-dont-notice/chapter-1-the-gods-in-the-week.md
    summary: >
      Thursday still carries Thor’s day — ancient cosmologies keeping appointments after the story that
      named them has disappeared — showing how institutional sediment hides in ordinary language.
      The hammer is gone; the name still organizes meetings, grocery lists, and schoolwork without
      asking to be noticed. Sediment here is not a conspiracy; it is coordination that outlived its
      cosmology.
    centralQuestion: What inherited structures still organize us after their original reasons have faded?
