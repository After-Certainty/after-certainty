  - sourcePath: front-matter/prologue-september-is-not-seven.md
    summary: >
      September still carries seven inside its name though it is the ninth month—a quiet lie
      made possible by centuries of repetition after the calendar shifted and the labels did
      not. Children sometimes notice first; adults treat the sequence as architecture rather
      than inheritance. The prologue opens the book's habit: ordinary timekeeping as evidence
      that structures outlive the reasons that named them.
    centralQuestion: What does a familiar calendar label still carry after its original count no longer fits?
    selectedConcepts:
      - inheritance
      - drift
      - structure
      - compression
    selectedPatterns:
