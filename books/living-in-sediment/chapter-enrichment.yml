  - sourcePath: parts/part-3-fossils-forming-now/chapter-12-the-data-double.md
    summary: >
      Credit applications, recommendations, insurance estimates, and résumé screens already know
      fragments before a human learns a name. Location pings, purchases, pauses, and routes
      accumulate into something that begins to resemble someone. Sediment forming now is the
      statistical shadow that introduces people to institutions—an inherited-looking profile
      assembled from traces rather than from self-presentation.
    centralQuestion: Who meets institutions first—the person, or the double assembled from their traces?
