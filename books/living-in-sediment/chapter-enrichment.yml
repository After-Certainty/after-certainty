  - sourcePath: parts/part-1-fossils-we-dont-notice/chapter-4-gold-in-the-mind.md
    summary: >
      A child turns a coin and expects a reason; adults answer with governments, markets,
      trust, or history. For long stretches value seemed tangible in metal you could hold—an
      explanation that did not require invisible banking systems. Even after convertibility
      faded, gold persists as intuition and metaphor: sediment in how minds still reach for
      solidity when money has become abstract coordination.
    centralQuestion: Why does gold still feel like an explanation after money has become abstract?
