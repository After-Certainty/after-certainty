  - sourcePath: back-matter/epilogue-two-months-off.md
    summary: >
      October still means eight; December still carries ten—nothing on the wall has changed, yet
      the calendar acquires a second dimension once the mismatch is known. Meetings and school
      years continue; the names become evidence rather than mere labels. The epilogue closes the
      perception habit the book trained: sediment remains ordinary, and ordinary becomes readable
      as history we still live inside.
    centralQuestion: What changes when familiar labels become evidence without the world itself rearranging?
