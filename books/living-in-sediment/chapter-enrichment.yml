  - sourcePath: parts/part-2-fossils-that-shape-power/chapter-7-ninety-day-morality.md
    summary: >
      Lives remember years as stories; conference rooms every three months compare revenue to
      guidance in a practiced rhythm. For millions, the year becomes four successive evaluations
      rather than one continuous passage. Quarterly reporting is sediment that sets moral tempo—
      what counts as responsible, urgent, or deferred—long after the accounting convenience that
      installed the cadence.
    centralQuestion: How does a reporting cadence become the moral weather of organizations and careers?
