  - sourcePath: parts/part-4-living-among-sediment/chapter-14-stability-and-corrosion.md
    summary: >
      Fossils in this book are often still alive: the seven-day week, shared calendars, and old
      metaphors continue coordinating strangers. Inheritance is generous—civilizations remember
      more than any individual could—yet noticing layers can breed suspicion of everything that
      endured. Stability and corrosion arrive together: sediment preserves coordination and can
      also hide misfit; the work is telling them apart without a single purge.
    centralQuestion: How do we honor sediment that still coordinates without ignoring the corrosion it can hide?
