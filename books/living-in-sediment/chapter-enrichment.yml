  - sourcePath: parts/part-1-fossils-we-dont-notice/chapter-2-sixty-seconds.md
    summary: >
      Microwaves, traffic lights, and tooth-brushing timers arrive already assembled around
      sixty—yet that rhythm is a way of describing the universe, not a property of it. Seconds
      and minutes feel natural because repetition hid the construction. The chapter treats time
      measurement as sediment: a coordinating inheritance so familiar it no longer invites
      curiosity about who chose the counts.
    centralQuestion: Why does a constructed measure of time feel like a property of the universe?
