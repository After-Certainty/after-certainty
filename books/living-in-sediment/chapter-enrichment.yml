  - sourcePath: parts/part-3-fossils-forming-now/chapter-10-subscription-lives.md
    summary: >
      Buying a book once ended the seller relationship; dust, lending, and grandchildren could
      follow without another transaction. Subscription turns access into ongoing permission—
      software, media, even features of cars—so possession becomes a renewable lease. Sediment
      forming here is life organized by continuous payment and revocable access rather than
      concluded ownership.
    centralQuestion: What changes when ordinary goods stop concluding in ownership and become renewable access?
