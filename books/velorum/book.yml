version: 1

publishing:
  enabled: true

book:
  id: velorum
  title: "Velorum"
  subtitle: "A Tragic Mythic Fantasy Novel"
  description: "A mythic fantasy about loyalty, sacrifice, and power, where personal vows and political fate collide at tragic scale."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book_cover.png
  title_page_footer: |
    Author-facing planning and voice rules live under [`docs/`](../docs/); this page is for **exports** only.

paths:
  manuscript: "./index.md"
  output: "."

assets:
  diagrams:
    auto_discover: false

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: true
    epub:
      enabled: true
    pdf:
      enabled: true

github:
  release: true
  release_tag: "latest"
  artifacts:
    - docx
    - epub
    - pdf
