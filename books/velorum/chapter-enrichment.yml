  - sourcePath: manuscript/act-1-the-choice/chapter-05-velorum.md
    summary: >
      On the warm rings Cael still has Riven's wrist and will not let go. They lay rope in an old pilgrim groove and lean as if on a dock line. The rope draws taut without either of them pulling harder. Something watches from the empty center, and when they both say they are in, the stone hums and one shared inhale fills two chests. They try to pull free and cannot. They leave the center still holding each other's wrists.
    centralQuestion: What happens the moment a vow stops being optional and becomes shared breath?
