  - sourcePath: manuscript/act-2-the-gift/chapter-07-shared-load.md
    summary: >
      On the east road they fight bandits with dangerous sync — both hands on the same mule
      line until knuckles crack. A boy asks if they are brothers. Caravan escort names them
      oath-bound toward Kestrel Gate: exhilaration and bodily intrusion traveling in the same
      body.
    centralQuestion: When shared strain wins a fight, how do you tell gift from invasion?
