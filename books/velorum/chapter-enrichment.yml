  - sourcePath: manuscript/act-1-the-choice/chapter-04-ashfen.md
    summary: >
      On the ice ribbon into Ashfen they pass a dead mule with its pack strap cut clean from
      below — timed ambush, not accident. Rock-boxed hollows, metallic seep, and lagging steps
      press wrongness into their bodies before they reach the pale Ashring bowl. Trust frays
      just as the outer rings warm underfoot.
    centralQuestion: What does it mean when the land itself starts to feel timed against you?
