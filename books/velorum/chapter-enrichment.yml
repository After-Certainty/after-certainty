  - sourcePath: manuscript/act-2-the-gift/chapter-08-the-road-to-kestrel-gate.md
    summary: >
      Mile by mile, people press abandoned watch posts onto them and hand over a ballad scrap —
      THEY CARRIED IT TOGETHER AND THE ROAD HELD. They fight at a mile marker, haul wagons over a
      flooded causeway, and take a summons from Magistrate Halverin with the wax still soft. Cael
      feels purpose arrive with the praise. They enter Kestrel Gate under the pasted slogan and take
      bunks on the barracks row reserved for heroes — logged as the pair.
    centralQuestion: What does a city do when it needs a story more than it needs the people inside it?
    selectedConcepts:
