  - sourcePath: manuscript/act-1-the-choice/chapter-03-leaving-greyhaven.md
    summary: >
      They leave Greyhaven through the north gate with oatcakes and settled names — gone north.
      On Kettle Lane a goat stares from a second-floor window while they argue whether goats
      climb stairs. First-day tension about Cael treating Riven like luggage settles into an
      uneasy shared pace toward the fork and the hollow campsite.
    centralQuestion: How do two people start a journey when one is already carrying the other's certainty?
