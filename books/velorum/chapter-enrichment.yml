  - sourcePath: manuscript/act-2-the-gift/chapter-09-the-magistrate.md
    summary: >
      In a council room stacked with maps and a woodcut of joined hands, Lord Magistrate
      Halverin frames the bond as load-sharing for a failing city. Cael reassigns Squad Twelve
      with Merrow's chalk; Riven recoils at broadsides that say TRUST THE SWORN PAIR. A darker
      duty line waits underneath: REPORT BOND INSTABILITY IMMEDIATELY.
    centralQuestion: When does useful power become someone else's narrative leash?
