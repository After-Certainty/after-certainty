  - sourcePath: manuscript/act-2-the-gift/chapter-12-the-attack-on-kestrel-gate.md
    summary: >
      A blast hits the grain quarter before any demonstration. Cael pulls Riven into the fight, but a
      half-beat of shared shame at the riverside stairs lets a raider cut a dockworker's throat. They
      still hold the berm — too late for the people on the stairs. Merrow's slate later lists Thom,
      fish table. Halverin calls noticing the mistake progress. Riven warns Cael not to let him use
      the dead.
    centralQuestion: How do you claim a win when the people you meant to carry are already on the slate?
