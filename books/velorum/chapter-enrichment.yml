  - sourcePath: manuscript/act-4-the-truth/chapter-21-no-answers-left.md
    summary: >
      In a rainy council room Cael refuses Halverin's unsigned blame sheet. Halverin admits he cannot manage the bond and points them back north — to Velorum, the source they already touched. Cael crosses out Don't pull apart and writes Stop pretending. Merrow stamps a gate pass. Riven stands on the half-dismantled platform, spits Good riddance, and they leave Kestrel Gate at first dark.
    centralQuestion: When civic authority has nothing left worth obeying, where do you take the bond next?
