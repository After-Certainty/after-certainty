  - sourcePath: manuscript/act-3-the-break/chapter-17-the-demonstration.md
    summary: >
      Cael and Riven run Halverin's signals and lift the mock breach frame while a north-wall echo
      returns the horn late. The crowd surges and breaks their count. They abandon the magistrate's
      rhythm for their own — then that rhythm tears and they go down with the frame. The square
      starts arguing why before Halverin admits the show is over.
    centralQuestion: What happens when a public proof of control becomes the pressure that breaks it?
