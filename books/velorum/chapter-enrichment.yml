  - sourcePath: manuscript/act-1-the-choice/chapter-03-leaving-greyhaven.md
    summary: >
      They buy oatcakes and fresh bread, settle with Mara, and watch her chalk "gone north" on the boarding board. Through the north gate they leave Greyhaven. On the road Cael walks like he already belongs there and Riven snaps at him for it, then they take the steeper fork and camp in the hollow Cael marked. Riven half-hears a market bell that is not there.
    centralQuestion: How do two people start a journey when one is already carrying the other's certainty?
