  - sourcePath: manuscript/act-1-the-choice/chapter-06-the-curse.md
    summary: >
      Down the switchbacks, thoughts and slips sync before either man asks for it. Cael thinks
      cabbage as a test; Riven snorts Why cabbage? before anyone speaks. The bond is a boundary
      violation, not a telepathy demo — and they still accept We hold, turning east instead of
      home.
    centralQuestion: Can you consent to a bond after you learn it invades the room you kept for yourself?
