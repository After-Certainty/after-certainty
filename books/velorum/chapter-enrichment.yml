  - sourcePath: manuscript/act-2-the-gift/chapter-13-aftermath.md
    summary: >
      Riven shovels wet ash and hears the dead named at the identification desk, feeling pain twice —
      his and Cael's. Lyra makes him eat and tells him they are breaking. Before Halverin finishes
      his square speech, paste crews hang PUBLIC DEMONSTRATION over missing-person sheets. Cael wants
      the dead to mean something; Riven will not agree.
    centralQuestion: After bodies are named, what does a city ask of the survivors who failed them?
