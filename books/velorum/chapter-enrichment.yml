  - sourcePath: manuscript/act-5-the-legend/chapter-28-the-threat-to-greyhaven.md
    summary: >
      The north berm fails into the mill channel. Cael and Riven drive posts at the breach and the
      cooper's yard, refuse to split apart, and hold channel and market together. A warehouse owner
      snaps that heroes do not pay timber bills; Riven answers, Call us labor. Three buildings fall.
      Cael finally has purpose that is work, not Halverin's story — and they keep working toward
      Heartbridge if the tear moves.
    centralQuestion: What does purpose look like when the town needs labor more than heroes?
