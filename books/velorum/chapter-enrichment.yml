  - sourcePath: manuscript/act-3-the-break/chapter-14-the-explanation.md
    summary: >
      Halverin tells Cael the stairs failed because they resisted the bond, not because they were weak. Cael signs for both, walks the cordon, and writes Carry the weight. Don't pull apart. — hand shaking on the last word. Riven leaves for Lyra's annex and refuses that story. Paste crews hang joined-hand woodcuts that look nothing like the men who failed on the stairs.
    centralQuestion: When does an explanation become a substitute for facing what the bond actually did?
