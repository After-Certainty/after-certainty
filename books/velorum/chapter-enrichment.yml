  - sourcePath: manuscript/act-4-the-truth/chapter-25-losing-the-line.md
    summary: >
      Riven tries once more to keep fear in his own skull and fails by noon. He belts their wrists
      with his old Greyhaven leather; they still fall down the scree together — one scream from two
      mouths. The Seeker hauls them up. The belt comes off; the bond does not. At the rim they refuse
      the last chance to turn around before the rings.
    centralQuestion: What remains when even a physical line cannot keep one person's fear from the other?
