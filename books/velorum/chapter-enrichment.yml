    summary: >
      On a knife ridge above cloud they tether wrists with Riven's old Greyhaven belt and
      still fall linked — one scream from two mouths, groove marks ringing both wrists pink.
      Fear overlaps before thoughts finish; the belt line fails to restore a private self.
      They camp at the Ashring rim for tomorrow's truth.
    centralQuestion: What remains when even a physical line cannot keep one person's fear from the other?
