  - sourcePath: manuscript/act-4-the-truth/chapter-26-velorum-again.md
    summary: >
      They enter an older Ashring with cracked seams and learn what they came for: there is no cure —
      only a way to carry what crosses between them when neither can keep a thought to himself. The
      Seeker finally speaks — walk back to the story you tell strangers, or forward to the story they
      tell about you — then adds neither was yours, and vanishes. They choose forward and take the
      eastern cut toward home.
    centralQuestion: What do you choose when the only options are the story you tell or the story told about you?
    selectedConcepts:
      - responsibility
      - legitimacy
      - renewal
