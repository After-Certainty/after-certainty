  - sourcePath: manuscript/act-2-the-gift/chapter-08-the-road-to-kestrel-gate.md
    summary: >
      Mile stones and a flooded causeway carry paste strips that read THE ROAD HOLDS. A ballad
      sheet ends THEY CARRIED IT TOGETHER AND THE ROAD HELD — the same slogan waiting on the
      walls. Halverin's summons arrives; they enter Kestrel Gate as the pair and take bunks on
      hero row.
    centralQuestion: What does a city do when it needs a story more than it needs the people inside it?
