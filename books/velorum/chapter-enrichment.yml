  - sourcePath: manuscript/act-3-the-break/chapter-19-the-silence-after.md
    summary: >
      Cael refuses Halverin's explanations on the magistrate steps and will not testify against the
      crowd. Copyists sell THEY HELD / THEY FAILED in two columns while Merrow suspends the public
      demonstration. The plan Cael trusted is gone. He learns Lyra leaves tomorrow night — and has
      nothing left to put in her place.
    centralQuestion: After the show fails, which story fills the silence — and who gets to sell it?
