    transition:
      toNext: From the hill legend into a chalked decision to leave.

  - sourcePath: manuscript/act-1-the-choice/chapter-02-the-decision.md
    summary: >
      Behind Mara's inn, Cael chalks a north-road plan onto yard stones and commits to Ashfen.
      Riven agrees to go because Cael is going — not because the legend feels true. Mast lanterns
      mark the harbor while the loft still holds an old fever winter Mara never scrubbed away
      until spring.
    centralQuestion: Is loyalty enough reason to walk toward a story you do not yet believe?
    selectedConcepts:
