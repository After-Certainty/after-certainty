  - sourcePath: manuscript/act-3-the-break/chapter-18-collapse-in-public.md
    summary: >
      Pain and panic ricochet between them until a pigeon freezes mid-wing and lurches half a beat
      late. They stop fighting to keep any feeling private. Merrow seizes the square; Halverin's
      cracked horn ends on the stair. In the south tent Riven says what Lyra already warned: "loss,
      not getting better." The city's proof of control fails in public.
    centralQuestion: What remains of authority when the body it used as proof fails in front of everyone?
