  - sourcePath: manuscript/act-2-the-gift/chapter-09-the-magistrate.md
    summary: >
      Halverin's clerk fetches them to a council room of maps and a woodcut of joined hands. Cael
      reassigns overlapping squads with Merrow's chalk and sides with Halverin's plan for the city;
      Riven refuses to sign a TRUST THE SWORN PAIR broadside. Under the duty sheet a darker line
      waits: REPORT BOND INSTABILITY IMMEDIATELY.
    centralQuestion: When does useful power become someone else's narrative leash?
