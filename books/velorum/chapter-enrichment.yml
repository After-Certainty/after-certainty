  - sourcePath: manuscript/act-3-the-break/chapter-18-collapse-in-public.md
    summary: >
      Riven and Cael catch pain and panic ricocheting between them until a pigeon freezes mid-wing
      and lurches half a beat late. They stop fighting to keep any share of the strain private.
      Merrow seizes the square; Halverin's cracked horn ends on the stair. In the south tent Riven
      calls it what it is: loss, not refinement.
    centralQuestion: What remains of authority when the body it used as proof fails in front of everyone?
