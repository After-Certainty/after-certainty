  - sourcePath: manuscript/act-4-the-truth/chapter-23-following.md
    summary: >
      Cael stops demanding reasons and follows the Seeker left across tilting slabs and a bent-tree
      valley. Boot prints face the wrong way; hail the size of knuckles bruises both of them through
      the bond. From a crest they see a distant standing-stone ring and commit: we are not going
      back.
    centralQuestion: Is following a choice when the land ahead is already writing your route?
