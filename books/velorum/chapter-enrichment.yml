    transition:
      fromPrevious: Wrist-linked rings become a vow they cannot fully reverse.
      toNext: They learn the bond invades — and still choose to hold.

  - sourcePath: manuscript/act-1-the-choice/chapter-06-the-curse.md
    summary: >
      On the outer stone Cael and Riven discover thoughts crossing between them unasked — nail, dock,
      Mara — before either speaks. Cael thinks cabbage as a private test; Riven hears it and snorts
      before Cael opens his mouth. They argue whether the cost was worth it, then take up "We hold" at
      a pine camp and turn east instead of home.
    centralQuestion: Can you consent to a bond after you learn it invades the room you kept for yourself?
    selectedConcepts:
