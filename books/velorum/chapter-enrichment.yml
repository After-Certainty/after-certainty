  - sourcePath: manuscript/act-5-the-legend/chapter-27-the-choice.md
    summary: >
      They come home to Greyhaven. Bran hides them in the cooper's loft while Merrow's warning
      reaches them: a tear in the land is moving; if the north berm fails, Heartbridge is next.
      Overnight Riven argues for one closed-off thought against the town's need. At second bell they
      brace the berm posts. He stops holding back, pulls laborer Henn free while Cael holds weight,
      and tears a wet broadside — THE PAIR HELD — for the timber stack, not for themselves.
    centralQuestion: When the town needs load more than legend, what does choosing each other actually cost?
