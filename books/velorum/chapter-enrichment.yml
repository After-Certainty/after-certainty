  - sourcePath: manuscript/act-5-the-legend/chapter-29-surrender.md
    summary: >
      On Heartbridge hill the ridge tear hangs over the northern fields. Riven stops keeping anything
      back — necessity, not belief — and grips forearms with Cael on the monument stone. The tear
      eases; the market stays dry. A hairline crack opens in the old carving. When Merrow's runner
      asks fill or leave, Cael says leave it. Let it show. They remain two people, permanently
      sharing the burden.
    centralQuestion: What does surrender mean when the only way to hold the town is to stop keeping a self sealed off?
