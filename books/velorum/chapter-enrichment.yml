  - sourcePath: manuscript/act-5-the-legend/chapter-29-surrender.md
    summary: >
      On Heartbridge hill a ridge tear hangs over northern fields while Merrow chalks a ground
      line and the rope crew rings them. Riven surrenders every private partition — necessity,
      not belief. The tear eases; Greyhaven stands; they remain distinct but permanently
      burden-bound. A hairline crack opens in the old carving. Leave it, Cael says. Let it show.
    centralQuestion: What does surrender mean when the only way to hold the town is to stop keeping a self sealed off?
