  - sourcePath: manuscript/act-2-the-gift/chapter-10-lyra.md
    summary: >
      Lyra stitches Riven's split forearm in the infirmary, puts him to work holding basin and
      screen, and calls the bond a boundary problem people turned into a legend. Outside, Cael feels
      the laugh and conversation land in his own chest before Riven can shut anything down. Jealousy
      crosses with it; Riven wants a room that is only his.
    centralQuestion: What happens when one person sees the bond clearly and the other still needs it to mean purpose?
