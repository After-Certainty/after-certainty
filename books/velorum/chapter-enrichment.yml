  - sourcePath: manuscript/act-2-the-gift/chapter-07-shared-load.md
    summary: >
      Riven and Cael fight ditch bandits in unsought sync, both grabbing the same mule line until
      their knuckles crack. They bind the attackers, walk point for a caravan, and haul a child from
      marsh mud. A boy asks if they are brothers. By Split Mile the ledgers already list them as
      oath-bound on the road to Kestrel Gate.
    centralQuestion: When shared strain wins a fight, how do you tell gift from invasion?
    selectedConcepts:
