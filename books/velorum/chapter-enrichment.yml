  - sourcePath: manuscript/act-3-the-break/chapter-20-lyra-leaves.md
    summary: >
      Lyra bandages Riven's knuckles at the annex prep table and says she is leaving for Greyhaven's outer clinics before she starts lying to them both. The bond has already made her a wedge. He does not chase the supply wagon. From the east wall he watches her go, then returns to work that still exists — quieter, and worse.
    centralQuestion: What does love do when staying would mean becoming part of the lie?
