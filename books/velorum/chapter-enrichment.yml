chapters:
  - sourcePath: manuscript/act-1-the-choice/chapter-01-heartbridge.md
    summary: >
      Riven hauls herring on Greyhaven's lower dock, argues the boss into the right count, then
      climbs the hill above town to Heartbridge — the worn stone monument of two figures bound by a
      carved rope. He reaches for it and stops short. Cael finds him there and proposes they go to
      Ashfen, to see whether the old bond legend is more than market talk. Riven hears him — and will
      not say yes before he sleeps on it.
    centralQuestion: What do you do with a hunger to be remembered when the monument already looks like a warning?
    selectedConcepts:
      - responsibility
      - legitimacy
      - erosion
    selectedPatterns:
      - admiration-becomes-insulation
      - responsibility-persists-beyond-control
    searchAliases:
      - heartbridge
      - greyhaven docks
      - heroes never forgotten
      - bond pamphlet
    situations:
      - admiration-insulates-from-scrutiny
      - meaning-forms-before-anyone-checks-it
    transition:
      toNext: Cael chalks the road; Riven decides whether loyalty is enough.

  - sourcePath: manuscript/act-1-the-choice/chapter-02-the-decision.md
    summary: >
      Cael sweeps Mara's yard, chalks a north-road map onto her stones, and commits to Ashfen. Mara
      charges them extra for bread and warns she will erase them from her boarding board if they do
      not come back. Riven agrees to walk because Cael is going — not because the pamphlet feels true.
      They take the loft; neither sleeps easily before the morning bell.
    centralQuestion: Is loyalty enough reason to walk toward a story you do not yet believe?
    selectedConcepts:
      - responsibility
      - trust
      - legitimacy
    selectedPatterns:
