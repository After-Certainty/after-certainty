  - sourcePath: manuscript/act-2-the-gift/chapter-07-shared-load.md
    summary: >
      On the east road they put the bond to work. Riven and Cael fight ditch bandits without meaning
      to move as one, both grabbing the same mule line until their knuckles crack. They bind the
      attackers, walk point for a caravan, and haul a child from marsh mud. Riven feels the win and
      the invasion in the same breath. A boy asks if they are brothers. By Split Mile the ledgers
      already list them as oath-bound on the road to Kestrel Gate.
    centralQuestion: When shared strain wins a fight, how do you tell gift from invasion?
