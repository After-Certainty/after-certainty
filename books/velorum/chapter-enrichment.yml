  - sourcePath: manuscript/act-5-the-legend/chapter-30-velorum-holds.md
    summary: >
      Lyra returns in late autumn to a new granite monument carved VELORUM HOLDS — hero faces smoothed
      over the cost she already knew. She wraps needles in a tinker woodcut of the statue, then
      throws the picture in a ditch: the only honest edit she can make. In the market she finds Riven
      and Cael still alive, still bound, still working. She treats ordinary clinic injuries, refuses
      to tend the shrine, and keeps the ledger of timber and cost instead of songs.
    centralQuestion: How do you witness a living bond after the town has already carved it into legend?
