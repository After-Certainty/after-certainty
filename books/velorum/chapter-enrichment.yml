      toNext: Ashfen's climb starts answering before they reach the rings.

  - sourcePath: manuscript/act-1-the-choice/chapter-04-ashfen.md
    summary: >
      Cael leads the climb into Ashfen — across a groaning ice ribbon, past a dead mule whose pack strap was cut clean from below, then to a rock seep where they refill. The water tastes faintly metallic. Both of them say something is off. At the pale rings of the Ashring they take each other's wrists and step inward. Heat climbs through their boots. Neither lets go as they move toward the empty center.
    centralQuestion: What does it mean when the land itself starts to feel timed against you?
