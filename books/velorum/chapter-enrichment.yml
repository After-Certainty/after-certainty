    transition:
      fromPrevious: Ashfen leaves the hill and becomes a plan on Mara's stones.
      toNext: They buy supplies, settle the board, and walk the north road.

  - sourcePath: manuscript/act-1-the-choice/chapter-03-leaving-greyhaven.md
    summary: >
      They buy oatcakes and fresh bread, settle accounts with Mara, and watch her chalk "gone north"
      on the boarding board. At the north gate they leave Greyhaven, argue over pack straps and
      whether Cael treats Riven like luggage, then take the steeper fork and camp in the hollow Cael
      marked. Greyhaven drops behind the hills; Riven half-hears a market bell that is not there.
    centralQuestion: How do two people start a journey when one is already carrying the other's certainty?
    selectedConcepts:
