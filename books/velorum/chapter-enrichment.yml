  - sourcePath: manuscript/act-3-the-break/chapter-14-the-explanation.md
    summary: >
      Halverin tells Cael the stairs failed because they resisted the bond, not because they were
      weak. Cael signs for both, walks the cordon, and writes Accept load. Do not split. — hand
      shaking on the last word. Riven leaves for Lyra's annex and refuses that leash of a story while
      paste crews hang joined-hand woodcuts that look nothing like them.
    centralQuestion: When does an explanation become a substitute for facing what the bond actually did?
