  - sourcePath: manuscript/act-2-the-gift/chapter-10-lyra.md
    summary: >
      Lyra stitches Riven's forearm in the infirmary and names the bond a boundary problem
      people turned into a legend — back of the line or drink from the bucket. Cael feels the
      laugh and conversation instantly; jealousy rides the bleed before Riven can close the
      door.
    centralQuestion: What happens when one person sees the bond clearly and the other still needs it to mean purpose?
