  - sourcePath: manuscript/act-2-the-gift/chapter-10-lyra.md
    summary: >
      Riven arrives at the infirmary with a split forearm. Lyra stitches him, puts him to work
      holding basin and screen, and says they are getting into each other's heads — and people turned that into a
      legend — not teamwork, not destiny. Outside, Cael feels the laugh and conversation land in
      his own chest before Riven can shut anything down. Jealousy crosses with it. For the first
      time Riven wants a thought the bond cannot reach.
    centralQuestion: What happens when one person sees the bond clearly and the other still needs it to mean purpose?
