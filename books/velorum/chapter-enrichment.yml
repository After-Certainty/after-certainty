  - sourcePath: manuscript/act-4-the-truth/chapter-26-velorum-again.md
    summary: >
      In an older Ashring bowl with cracked seams, the Seeker finally speaks: Walk back or
      walk forward — back to the story you tell strangers, forward to the story they tell
      about you. Then Neither was yours — and vanishes. There is no cure, only carrying when
      partition fails. They choose forward.
    centralQuestion: What do you choose when the only options are the story you tell or the story told about you?
