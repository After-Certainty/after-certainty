  - sourcePath: manuscript/act-1-the-choice/chapter-01-heartbridge.md
    summary: >
      Riven climbs Heartbridge above Greyhaven's herring docks, past pilgrims and a worn
      pamphlet that promises heroes never forgotten. The carved pair with the rope between
      them looks honest only because the stone is cracked. He wants a name that lasts — and
      still flinches before he touches the monument. Cael finds him there and proposes Ashfen:
      go see whether the bond legend is more than paper.
    centralQuestion: What do you do with a hunger to be remembered when the monument already looks like a warning?
    selectedConcepts:
      - responsibility
      - legitimacy
      - erosion
    selectedPatterns:
      - admiration-becomes-insulation
      - responsibility-persists-beyond-control
