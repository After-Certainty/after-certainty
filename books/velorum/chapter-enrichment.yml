  - sourcePath: manuscript/act-1-the-choice/chapter-06-the-curse.md
    summary: >
      Outside the rings, thoughts cross between them unasked — nail, dock, Mara — before either speaks. Cael thinks cabbage as a private test; Riven hears it and snorts before Cael opens his mouth. The bond is not a gift. They argue whether the cost was worth the walk, then take up "We hold" at a pine camp and turn east instead of home — into whatever the road will make of them.
    centralQuestion: Can you consent to a bond after you learn it invades the room you kept for yourself?
