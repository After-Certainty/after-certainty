  - sourcePath: manuscript/act-1-the-choice/chapter-05-velorum.md
    summary: >
      On the warm Ashring rings, hand-shaped hollows and a pilgrim rope groove wait like
      furniture left for whoever arrives. Presence without form presses in; the rope draws taut
      without either of them pulling harder. They say I'm in — one shared inhale in two chests —
      and discover they cannot fully let go.
    centralQuestion: What happens the moment a vow stops being optional and becomes shared breath?
