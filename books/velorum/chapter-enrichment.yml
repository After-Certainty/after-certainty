  - sourcePath: manuscript/act-4-the-truth/chapter-24-fractured-lands.md
    summary: >
      The land presses harder on the bond. Dreams of falling and feelings about Lyra's absence spill
      until Riven tells Cael he sounds like Halverin. They lift an old wooden support from a
      standing-water basin; gravel skitters uphill when it tears free. For a moment the square and
      the basin feel like the same place. They camp outside the Ashring rim — private suffering will
      not stay private.
    centralQuestion: What happens when the land forces your worst private rooms into the shared circuit?
