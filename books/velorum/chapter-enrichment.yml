  - sourcePath: manuscript/act-2-the-gift/chapter-09-the-magistrate.md
    summary: >
      Halverin's clerk fetches them to a council room of maps and a woodcut of joined hands. The
      magistrate offers a plan: put the bond to work for a failing city. Cael reassigns overlapping
      squads with Merrow's chalk and sides with him at once. Riven refuses to sign a TRUST THE SWORN
      PAIR broadside. Under the duty sheet a darker line already waits: REPORT BOND INSTABILITY
      IMMEDIATELY.
    centralQuestion: When does useful power become someone else's narrative leash?
