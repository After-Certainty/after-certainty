    transition:
      toNext: The hill proposal becomes a chalked plan and a hard yes.

  - sourcePath: manuscript/act-1-the-choice/chapter-02-the-decision.md
    summary: >
      Behind Mara's inn, Cael chalks the north road onto her yard stones and commits to Ashfen. Mara charges them extra for bread and warns she will erase them from her boarding board if they do not come back. Riven still does not believe the pamphlet — he agrees to walk because Cael is going. They take the loft. Neither sleeps easily before the morning bell.
    centralQuestion: Is loyalty enough reason to walk toward a story you do not yet believe?
