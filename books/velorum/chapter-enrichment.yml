  - sourcePath: manuscript/act-2-the-gift/chapter-11-no-privacy.md
    summary: >
      On the east watchtower, Riven tries to keep one thought private — the winter canal where
      he nearly drowned. Cael finds it anyway: I forgot that happened. The canal. Bleed becomes
      physical instability in both bodies while Halverin schedules a demonstration that will
      make their bond a civic show.
    centralQuestion: What is left of a self when even a near-drowning memory will not stay yours?
