    transition:
      fromPrevious: The loft vow becomes packs, bread, and a gate behind them.
      toNext: The climb into Ashfen starts answering back.

  - sourcePath: manuscript/act-1-the-choice/chapter-04-ashfen.md
    summary: >
      Cael leads the climb into Ashfen across an ice ribbon and past a dead mule whose pack strap was
      cut clean from below. They refill at a metallic seep, admit something is wrong, and step onto
      the pale concentric rings of the Ashring while holding each other's wrists. Heat climbs through
      their boots; neither lets go as they move toward the empty center.
    centralQuestion: What does it mean when the land itself starts to feel timed against you?
    selectedConcepts:
