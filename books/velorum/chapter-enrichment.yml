  - sourcePath: manuscript/act-3-the-break/chapter-16-lyras-warning.md
    summary: >
      In the infirmary annex Lyra tells Riven plain: "this is loss, not getting better" — your palms will
      split before the crowd stops clapping. Outside, Tam watches the staging with an empty basket
      for his missing brother. Riven hears her. He still crosses the east chalk line and takes his
      place beside Cael as Halverin raises the horn.
    centralQuestion: What do you do when the clearest witness tells you the performance will cost flesh?
