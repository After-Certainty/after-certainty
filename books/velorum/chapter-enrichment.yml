      toNext: They cross the center and the rope will not loosen.

  - sourcePath: manuscript/act-1-the-choice/chapter-05-velorum.md
    summary: >
      Riven and Cael descend the warm Ashring rings still wrist-linked, lay rope in an old groove cut
      for pilgrims, and lean as if on a dock line. The rope draws taut without either of them pulling
      harder. They say they are in — one shared inhale in two chests — and find they cannot fully
      pull free. They leave the center still linked.
    centralQuestion: What happens the moment a vow stops being optional and becomes shared breath?
    selectedConcepts:
