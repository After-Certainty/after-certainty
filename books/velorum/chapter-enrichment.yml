  - sourcePath: manuscript/act-5-the-legend/chapter-29-surrender.md
    summary: >
      On Heartbridge hill Riven gives up every private room he has left — necessity, not belief —
      and grips forearms with Cael on the monument stone. The ridge tear eases; the market stays dry.
      A hairline crack opens in the old carving. When Merrow's runner asks fill or leave, Cael says
      leave it. Let it show. They remain two people, permanently sharing the burden.
    centralQuestion: What does surrender mean when the only way to hold the town is to stop keeping a self sealed off?
