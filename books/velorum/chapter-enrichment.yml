  - sourcePath: manuscript/act-4-the-truth/chapter-22-the-seeker.md
    summary: >
      On a road where sound arrives late, Riven and Cael find a dry well and a still-water slip where
      pebbles sink too slowly. A silent walker — the Seeker — drops stones that refuse ordinary time,
      answers almost nothing, then stands and walks. They follow. Later a warm wet pebble appears in
      Riven's coat pocket.
    centralQuestion: What do you follow when explanation has failed and only motion remains?
