  - sourcePath: manuscript/act-2-the-gift/chapter-11-no-privacy.md
    summary: >
      Riven climbs the east watchtower to keep one thought private — the winter canal where he nearly
      drowned as a boy. Cael finds him anyway and says he forgot that happened. The canal. Both of them
      start shaking as the bond spills into their bodies. Halverin will not wait: his aide copies a
      public demonstration date despite their refusal. The city means to prove them in the square.
    centralQuestion: What is left of a self when even a near-drowning memory will not stay yours?
