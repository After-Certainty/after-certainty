  - sourcePath: manuscript/act-4-the-truth/chapter-26-velorum-again.md
    summary: >
      They enter an older Ashring with cracked seams and learn there is no cure — only a way to carry
      the strain when neither of them can keep a private room. The Seeker finally speaks — walk back
      to the story you tell strangers, or forward to the story they tell about you — then adds
      neither was yours, and vanishes. They choose forward and take the eastern cut home.
    centralQuestion: What do you choose when the only options are the story you tell or the story told about you?
