  - sourcePath: manuscript/act-1-the-choice/chapter-01-heartbridge.md
    summary: >
      Riven hauls herring on Greyhaven's lower dock, argues the boss into the right count, then climbs the hill to Heartbridge — the worn stone monument of two figures bound by a carved rope. The pamphlet in his pocket promises heroes never forgotten; he reaches for the stone and stops short. Cael finds him there and proposes they walk to Ashfen, where the bond legend is said to live, and learn whether it is more than market talk. Riven hears him — and will not say yes before he sleeps on it.
    centralQuestion: What do you do with a hunger to be remembered when the monument already looks like a warning?
    selectedConcepts:
      - responsibility
      - legitimacy
      - erosion
    selectedPatterns:
