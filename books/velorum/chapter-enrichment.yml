  - sourcePath: manuscript/act-5-the-legend/chapter-30-velorum-holds.md
    summary: >
      Lyra returns in late autumn to a new granite monument carved VELORUM HOLDS — faces
      smoothed into heroism, the old crumbling Heartbridge behind it. She wraps needles in a
      tinker woodcut of the statue, then throws the picture in a ditch: the only honest edit.
      Cael and Riven still live as two people with no locked room. She keeps clinic truth and
      refuses shrine duty.
    centralQuestion: How do you witness a living bond after the town has already carved it into legend?
