# Temporary branch-only renderer-backed audit; remove before merge.
name: Reader passage Phase 12 audit (temporary)
on:
  push:
    branches:
      - feat/reader-passage-phase12-editorial-review
    paths:
      - .github/workflows/reader-passage-phase12-audit.yml
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'After-Certainty/after-certainty'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: "python uv"
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          uv sync --frozen
          npm ci --no-audit --no-fund --ignore-scripts
      - name: Ruff and complete reader passage regression suites
        run: |
          set -euo pipefail
          uv run ruff check tools/reader_passage_links.py tests/test_reader_passage_phase12.py
          uv run ruff format --check tools/reader_passage_links.py tests/test_reader_passage_phase12.py
          uv run pytest tests/test_reader_passage_links.py tests/test_reader_passage_phase10.py tests/test_reader_passage_phase11.py tests/test_reader_passage_phase12.py -q
      - name: Full HTML-validated corpus audit and Phase 12 guardrails
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path
          from tools.reader_passage_links import run_audit, write_audit_reports
          repo=Path('.').resolve()
          report=run_audit(repo, check_fragments=True)
          by_slug={s.slug:s for s in report.sources}
          direct=[
              "argyris-chris-overcoming-organizational-defenses",
              "arthur-w-brian-increasing-returns-and-path-dependence-in-the-economy",
              "church-committee-final-report-of-the-select-committee-to-study-governmental-operations-with-resp",
              "desai-ashwin-and-goolam-vahed-the-south-african-gandhi-stretcher-bearer-of-empire",
              "international-olympic-committee-simone-biles-all-titles-records-and-medals-complete-list",
              "nfl-concussion-protocol-return-to-participation-protocol-overview",
              "weick-karl-e-the-social-psychology-of-organizing",
              "will-graves-biles-returns-to-olympic-competition-wins-bronze-on-beam",
          ]
          shared=[
              "american-college-of-emergency-physicians-boarding",
              "hood-christopher-and-ruth-dixon-a-government-that-worked-better-and-cost-less",
              "lowcountry-digital-history-initiative-local-and-national-leader-septima-p-clark",
              "mandela-nelson-statement-from-the-dock-rivonia-trial-20-april-1964",
              "sncc-digital-gateway-birth-of-sncc",
          ]
          for slug in direct:
              s=by_slug[slug]
              print("Direct citation:",slug,s.evidence_level,s.status,s.reader_passage_path)
              assert s.status=="verified_link_tied_citation", slug
              assert s.evidence_level=="A",slug
          for slug in shared:
              s=by_slug[slug]
              print("Genuinely shared:",slug,s.evidence_level,s.status,s.reader_passage_path)
              assert s.status=="path_valid_shared_or_ambiguous_citation",slug
              assert s.evidence_level=="B",slug
          totals=report.totals["sources"]
          assert totals["invalidPassageLinks"]==0, "Invalid source fragments"
          assert totals["unverifiedFragmentLinks"]==0, "Unverified source fragments"
          print("Full corpus source totals:",totals)
          dest=repo/"reports/reader-passage-links"
          write_audit_reports(report,md_out=dest/"audit.md",json_out=dest/"audit.summary.json")
          PY
      - name: Commit renderer-verified reports to review branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- reports/reader-passage-links/audit.md reports/reader-passage-links/audit.summary.json
          if git diff --cached --quiet; then
            echo "Reports unchanged"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sources): refresh Phase 12 source-link audit from renderer"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/feat/reader-passage-phase12-editorial-review
