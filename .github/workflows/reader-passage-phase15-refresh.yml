# Temporary branch-only audit workflow. Remove before opening the final PR.
name: Phase 15 reader passage large batch audit (temporary)

on:
  push:
    branches:
      - feat/reader-passage-phase15-large-editorial-batch
    paths:
      - .github/workflows/reader-passage-phase15-refresh.yml

permissions:
  contents: read

jobs:
  regenerate:
    if: github.repository == 'After-Certainty/after-certainty'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: "python uv"

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          uv sync --frozen
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Format and validate all Phase 10–15 reader-passage regressions
        run: |
          set -euo pipefail
          uv run ruff format tests/test_reader_passage_phase15.py
          uv run ruff check tests/test_reader_passage_phase15.py
          uv run ruff format --check tests/test_reader_passage_phase15.py
          uv run pytest tests/test_reader_passage_links.py tests/test_reader_passage_phase10.py tests/test_reader_passage_phase11.py tests/test_reader_passage_phase12.py tests/test_reader_passage_phase13.py tests/test_reader_passage_phase14.py tests/test_reader_passage_phase15.py -q

      - name: Full corpus reader HTML fragment validation
        run: |
          set -euo pipefail
          uv run python tools/audit_reader_passage_links.py --repo .

      - name: Verify all 27 new reader links are sole-work ties
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json,runpy
          from pathlib import Path
          j=json.loads(Path("reports/reader-passage-links/audit.summary.json").read_text())
          totals=j["totals"]["sources"]
          expected={s for s,_,_ in runpy.run_path("tests/test_reader_passage_phase15.py")["CASES"]}
          tied={x["slug"] for x in j["tiedCitationExamples"]}
          missing=sorted(expected-tied)
          print("Phase 15 27-work tied status:",missing)
          print("Full source totals:",json.dumps(totals,sort_keys=True))
          assert len(expected)==27
          assert not missing, "One or more Phase 15 citations are not mechanically tied"
          assert totals["invalidPassageLinks"]==0, "Invalid reader paths"
          assert totals["unverifiedFragmentLinks"]==0, "Unverified reader fragments"
          assert totals["pathNeedsEditorialReview"]==0, "Path with ambiguous source citation"
          assert totals["withReaderPassagePath"]==449, "Unexpected source link count"
          assert totals["verifiedLinkTiedCitation"]==449, "Unexpected sole-work count"
          PY

      - name: Commit formatted test and regenerated report snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- tests/test_reader_passage_phase15.py reports/reader-passage-links/audit.md reports/reader-passage-links/audit.summary.json
          if git diff --cached --quiet; then
            echo "Test and reports already current"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sources): sync validated Phase 15 27-work audit and tests"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/feat/reader-passage-phase15-large-editorial-batch
