name: Phase 16 joint-statement scorer diagnostics (temporary)
on:
  push:
    branches:
      - feat/reader-passage-phase16-expanded-editorial-coverage
    paths:
      - .github/workflows/phase16-score-diagnostics.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: "python uv"
      - name: Print every source matching banking statement
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run python - <<'PY'
          from pathlib import Path
          import yaml
          from tools.reader_passage_links import score_footnote_vs_source, creator_author_tokens, normalize_match_text
          repo=Path('.')
          chapter=repo/'books/the-economy-we-dont-experience/parts/part-4-what-holds/chapter-8-the-guardrails-we-notice-only-when-they-fail.md'
          definition=next(s.split(': ',1)[1] for s in chapter.read_text().splitlines() if s.startswith('[^c8-banks-2023]:'))
          print('DEFINITION:',definition)
          for path in (repo/'semantic/sources').glob('*.yml'):
              source=yaml.safe_load(path.read_text())
              if 'the-economy-we-dont-experience' not in source.get('relatedBooks',[]):
                  continue
              score,method=score_footnote_vs_source(definition,source)
              if score>=60:
                  print('MATCH',source.get('slug'),score,method,'TITLE',source.get('title'),'CREATORS',sorted(creator_author_tokens(source)))
          PY
