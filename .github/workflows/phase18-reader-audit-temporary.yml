name: Phase 18 reader audit (temporary)
# Includes manuscript-level source-specific citations for shared notes.
# Reviewed candidate selection uses the current source audit, not historical candidates.
# Every audit-log timestamp uses datetime.UTC (Python 3.12 lint).
# Source-specific matches resolve by longest key for nested report names.

on:
  push:
    branches: [feat/reader-passage-phase18-close-cited-backlog]
    paths:
      - ".github/workflows/phase18-reader-audit-temporary.yml"

env:
  PYTHONPATH: src

permissions:
  contents: write

jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Phase 18
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install audit dependencies
        run: |
          python -m pip install PyYAML jsonschema ruff
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Format guarded editorial tool
        run: |
          python -m ruff check --fix tools/apply_reader_passage_phase18.py
          python -m ruff format tools/apply_reader_passage_phase18.py
          python -m ruff check tools/apply_reader_passage_phase18.py

      - name: Apply individually reviewed Phase 18 evidence
        run: python tools/apply_reader_passage_phase18.py --repo .

      - name: Audit source linkage against rendered reader
        run: python tools/audit_reader_passage_links.py --repo .

      - name: Assert full Phase 18 attribution and fragment coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/reader-passage-links/audit.summary.json")
          s = json.loads(p.read_text())["totals"]["sources"]
          print(s)
          unresolved = [x for x in json.loads(p.read_text())["rankedOpportunities"] if x["status"] != "strong_candidate"]
          print("unresolved attribution records:", unresolved)
          assert s["total"] == 714
          assert s["verifiedLinkTiedCitation"] >= 631
          assert s["invalidPassageLinks"] == 0
          assert s["unverifiedFragmentLinks"] == 0
          assert s["pathNeedsEditorialReview"] <= 3
          assert s["whyThisMattersOk"] == s["validPassageLinks"]
          assert s["missingPathWithFootnote"] <= 7
          PY

      - name: Commit reviewed source paths and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/ tools/apply_reader_passage_phase18.py semantic/sources reports/reader-passage-links/audit.md reports/reader-passage-links/audit.summary.json reports/reader-passage-links/review-log.json reports/reader-passage-links/editorial-batch-phase-18.md
          git diff --cached --stat
          git commit -m "feat(sources): link Phase 18 footnote evidence and refresh rendered audit"
          git push
