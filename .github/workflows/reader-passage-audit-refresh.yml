# Temporary, branch-scoped regeneration job for the Phase 10 report-sync PR.
# Remove this workflow from the PR once the generated reports are committed.
name: Reader passage audit refresh (temporary)

on:
  push:
    branches:
      - chore/reader-passage-audit-sync-phase10
    paths:
      - .github/workflows/reader-passage-audit-refresh.yml

permissions:
  contents: read

jobs:
  regenerate:
    if: github.repository == 'After-Certainty/after-certainty'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: "python uv"

      - name: Install frozen dependencies for real renderer checks
        run: |
          set -euo pipefail
          uv sync --frozen
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Run Phase 10 regression tests
        run: |
          set -euo pipefail
          uv run pytest tests/test_reader_passage_phase10.py -q

      - name: Regenerate full reader-passage audit with rendered HTML
        run: |
          set -euo pipefail
          uv run python tools/audit_reader_passage_links.py --repo .

      - name: Verify all eight Phase 10 source paths and report integrity
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/reader-passage-links/audit.summary.json').read_text())
          sources = report['totals']['sources']
          expected = {
              'calhoun-craig-neither-gods-nor-emperors-students-and-the-struggle-for-democracy-in-china',
              'lim-louisa-the-people-s-republic-of-amnesia-tiananmen-revisited',
              'bunkley-nick-g-m-and-toyota-s-joint-venture-ends-in-california',
              'abate-tom-nummi-workers-say-their-final-good-byes',
              'addams-jane-twenty-years-at-hull-house',
              'branch-taylor-parting-the-waters-america-in-the-king-years-1954-63',
              'branch-taylor-pillar-of-fire-america-in-the-king-years-1963-65',
              'branch-taylor-at-canaan-s-edge-america-in-the-king-years-1965-68',
          }
          tied = {item['slug'] for item in report.get('tiedCitationExamples', [])}
          missing = sorted(expected - tied)
          print('Full renderer-backed source totals:', json.dumps(sources, sort_keys=True))
          print('Phase 10 paths not mechanically tied:', missing)
          assert sources['invalidPassageLinks'] == 0, 'Invalid published passage links'
          assert sources['unverifiedFragmentLinks'] == 0, 'Unverified fragment links'
          assert not missing, 'Phase 10 paths need editorial or renderer repair'
          PY

      - name: Commit generated audit snapshots to this branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- reports/reader-passage-links/audit.md reports/reader-passage-links/audit.summary.json
          if git diff --cached --quiet; then
            echo "Report snapshots already up to date"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sources): refresh renderer-validated reader passage audit"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/chore/reader-passage-audit-sync-phase10
