# Stage B: generate semantic-manifest from this checkout and compare to the
# public GitHub release asset. The site runtime consumes the installed same-checkout
# manifest; this job validates local generator parity with the published release.

name: Manifest parity

on:
  pull_request:
    paths:
      - "books/**"
      - "semantic/**"
      - "schema/**"
      - "upcoming/**"
      - "tools/generate_semantic_manifest.py"
      - "tools/discovery_manifest.py"
      - "tools/manifest_*.py"
      - "tools/book_specs.py"
      - "tools/manuscript_structure.py"
      - "tools/pattern_yaml.py"
      - "tools/validate_book_specs.py"
      - "tools/validate_semantic_manifest.py"
      - "tools/verify_semantic_yaml.py"
      - "tools/compare_manifest_parity.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/manifest-parity.yml"
  push:
    branches: [main]
    paths:
      - "books/**"
      - "semantic/**"
      - "schema/**"
      - "upcoming/**"
      - "tools/generate_semantic_manifest.py"
      - "tools/discovery_manifest.py"
      - "tools/manifest_*.py"
      - "tools/book_specs.py"
      - "tools/manuscript_structure.py"
      - "tools/pattern_yaml.py"
      - "tools/validate_book_specs.py"
      - "tools/validate_semantic_manifest.py"
      - "tools/verify_semantic_yaml.py"
      - "tools/compare_manifest_parity.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/manifest-parity.yml"
  workflow_dispatch:

concurrency:
  group: manifest-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.3"
  UV_VERSION: "0.11.29"
  UV_SHA256: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"
  GITHUB_REPOSITORY: ksteffe/after-certainty

jobs:
  parity:
    name: Local vs release manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Generate local semantic manifest
        run: |
          set -euo pipefail
          # Python-only job: skip Sharp covers when node_modules are absent.
          ALLOW_MISSING_WEB_COVERS=1 make generate-semantic-manifest

      - name: Compare to public release
        run: |
          set -euo pipefail
          make compare-manifest-parity

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-parity
          path: |
            reports/manifest-parity.json
            reports/manifest-parity.md
            build/semantic-manifest.json
          if-no-files-found: warn
