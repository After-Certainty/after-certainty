# Stage B: generate semantic-manifest from this checkout and compare to the
# public GitHub release asset. The site runtime consumes the installed same-checkout
# manifest; this job validates local generator parity with the published release.
#
# Toolchain: Python + uv from mise.toml / mise.lock via jdx/mise-action.
# Task steps stay direct (npm / corpus scripts) — not `mise run`.

name: Manifest parity

on:
  pull_request:
    paths:
      - "books/**"
      - "semantic/**"
      - "schema/**"
      - "upcoming/**"
      - "tools/generate_semantic_manifest.py"
      - "tools/discovery_manifest.py"
      - "tools/manifest_*.py"
      - "tools/book_specs.py"
      - "tools/manuscript_structure.py"
      - "tools/pattern_yaml.py"
      - "tools/validate_book_specs.py"
      - "tools/validate_semantic_manifest.py"
      - "tools/verify_semantic_yaml.py"
      - "tools/compare_manifest_parity.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/manifest-parity.yml"
  push:
    branches: [main]
    paths:
      - "books/**"
      - "semantic/**"
      - "schema/**"
      - "upcoming/**"
      - "tools/generate_semantic_manifest.py"
      - "tools/discovery_manifest.py"
      - "tools/manifest_*.py"
      - "tools/book_specs.py"
      - "tools/manuscript_structure.py"
      - "tools/pattern_yaml.py"
      - "tools/validate_book_specs.py"
      - "tools/validate_semantic_manifest.py"
      - "tools/verify_semantic_yaml.py"
      - "tools/compare_manifest_parity.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/manifest-parity.yml"
  workflow_dispatch:

concurrency:
  group: manifest-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITHUB_REPOSITORY: After-Certainty/after-certainty

jobs:
  parity:
    name: Local vs release manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "python uv"

      - name: Sync Python deps (frozen)
        run: |
          set -euo pipefail
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate local semantic manifest
        run: |
          set -euo pipefail
          # Python-only job: skip Sharp covers when node_modules are absent.
          ALLOW_MISSING_WEB_COVERS=1 npm run corpus:build-manifest

      - name: Compare to public release
        run: |
          set -euo pipefail
          # Direct workspace script (same as former Make shim); avoids Turbo re-running build-manifest.
          npm run parity -w @after-certainty/corpus-tasks

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-parity
          path: |
            reports/manifest-parity.json
            reports/manifest-parity.md
            build/semantic-manifest.json
          if-no-files-found: warn
