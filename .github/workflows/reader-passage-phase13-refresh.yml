# Temporary one-shot branch-scoped audit; deleted before this PR is opened.
name: Reader passage Phase 13 audit refresh (temporary)

on:
  push:
    branches:
      - feat/reader-passage-phase13-resolve-shared-citations
    paths:
      - .github/workflows/reader-passage-phase13-refresh.yml

permissions:
  contents: read

jobs:
  regenerate:
    if: github.repository == 'After-Certainty/after-certainty'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: "python uv"

      - name: Install frozen dependencies for the actual reader renderer
        run: |
          set -euo pipefail
          uv sync --frozen
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Ruff and complete Phase 10–13 regression suites
        run: |
          set -euo pipefail
          uv run ruff check tests/test_reader_passage_phase13.py
          uv run ruff format --check tests/test_reader_passage_phase13.py
          uv run pytest tests/test_reader_passage_phase10.py tests/test_reader_passage_phase11.py tests/test_reader_passage_phase12.py tests/test_reader_passage_phase13.py tests/test_reader_passage_links.py -q

      - name: Renderer-backed source link audit
        run: |
          set -euo pipefail
          uv run python tools/audit_reader_passage_links.py --repo .

      - name: Verify Phase 13 new and narrowed attribution
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/reader-passage-links/audit.summary.json').read_text())
          actual={row['slug'] for row in report['tiedCitationExamples']}
          expected={
              'american-college-of-emergency-physicians-boarding',
              'institute-of-medicine-hospital-based-emergency-care-at-the-breaking-point',
              'lowcountry-digital-history-initiative-local-and-national-leader-septima-p-clark',
              'mandela-nelson-statement-from-the-dock-rivonia-trial-20-april-1964',
              'sncc-digital-gateway-birth-of-sncc',
          }
          missing=sorted(expected-actual)
          sources=report['totals']['sources']
          print('Source audit:',json.dumps(sources,sort_keys=True))
          print('Five new or refined links absent from sole-work A list:',missing)
          assert not missing, 'A source-specific link is still ambiguous'
          assert sources['invalidPassageLinks']==0, 'Invalid source links'
          assert sources['unverifiedFragmentLinks']==0, 'Unverified source links'
          assert sources['pathNeedsEditorialReview']<=0, 'Unexpected remaining linked-source ambiguity'
          PY

      - name: Commit both generated report snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- reports/reader-passage-links/audit.md reports/reader-passage-links/audit.summary.json
          if git diff --cached --quiet; then
            echo "Snapshots already current"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sources): sync Phase 13 renderer-verified reader passage audit"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/feat/reader-passage-phase13-resolve-shared-citations
