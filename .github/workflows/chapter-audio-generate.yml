# Phase 4: manual chapter-audio generation (workflow_dispatch only).
# Dry-run by default. Real generate mounts ELEVENLABS_API_KEY only on the generate step.
# Ordinary CI (python-tests / site-ci) never receives TTS secrets.
#
# After a real generate, opens a review PR with LFS-tracked MP3s under books/*/audio/.
# Merging that PR makes those units available to the site Listen control.

name: Chapter audio generate

on:
  workflow_dispatch:
    inputs:
      units:
        description: >-
          Unit id(s), comma or newline separated. Default is the full Observer Patterns
          exported set (29 units). Already-current units are skipped unless force=true.
        required: true
        type: string
        default: |
          chapter-observer-patterns-front-matter-introduction
          chapter-observer-patterns-parts-part-i-what-begins-bridge
          chapter-observer-patterns-parts-part-i-what-begins-what-love-teaches
          chapter-observer-patterns-parts-part-i-what-begins-when-trust-builds
          chapter-observer-patterns-parts-part-i-what-begins-how-belief-forms
          chapter-observer-patterns-parts-part-i-what-begins-why-diversity-matters
          chapter-observer-patterns-parts-part-i-what-begins-why-collaboration-is-hard
          chapter-observer-patterns-parts-part-ii-what-forms-together-bridge
          chapter-observer-patterns-parts-part-ii-what-forms-together-what-love-teaches-when-trust-builds-how-belief-forms
          chapter-observer-patterns-parts-part-ii-what-forms-together-why-collaboration-is-hard-when-trust-builds-and-why-diversity-matters
          chapter-observer-patterns-parts-part-iii-what-takes-shape-bridge
          chapter-observer-patterns-parts-part-iii-what-takes-shape-when-others-look-to-you
          chapter-observer-patterns-parts-part-iii-what-takes-shape-how-meaning-moves
          chapter-observer-patterns-parts-part-iv-what-moves-together-bridge
          chapter-observer-patterns-parts-part-iv-what-moves-together-how-meaning-moves-when-others-look-to-you
          chapter-observer-patterns-parts-part-iv-what-moves-together-why-diversity-matters-in-how-meaning-moves
          chapter-observer-patterns-parts-part-iv-what-moves-together-why-diversity-matters-when-others-look-to-you
          chapter-observer-patterns-parts-part-v-where-they-meet-bridge
          chapter-observer-patterns-parts-part-v-where-they-meet-what-love-teaches-when-others-look-to-you
          chapter-observer-patterns-parts-part-v-where-they-meet-how-trust-builds-when-others-look-to-you
          chapter-observer-patterns-parts-part-v-where-they-meet-how-belief-forms-when-others-look-to-you
          chapter-observer-patterns-parts-part-v-where-they-meet-why-collaboration-is-hard-when-others-look-to-you
          chapter-observer-patterns-parts-part-vi-what-holds-bridge
          chapter-observer-patterns-parts-part-vi-what-holds-when-trust-builds-how-meaning-moves-and-belief-forms
          chapter-observer-patterns-parts-part-vi-what-holds-why-collaboration-is-hard-when-trust-builds-how-meaning-moves
          chapter-observer-patterns-parts-part-vi-what-holds-why-diversity-matters-when-trust-builds-and-others-look-to-you
          chapter-observer-patterns-parts-part-vi-what-holds-why-collaboration-is-hard-when-trust-builds-how-meaning-moves-when-others-look-to-you
          chapter-observer-patterns-parts-part-vii-what-remains-bridge
          chapter-observer-patterns-parts-part-vii-what-remains-closing
      dry_run:
        description: "Plan + budgets only (no API call, no writes). Keep true until ready."
        required: false
        type: boolean
        default: true
      force:
        description: "Regenerate even when current artifacts match"
        required: false
        type: boolean
        default: false
      open_pr:
        description: "After a real generate, commit LFS audio and open a review PR"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: chapter-audio-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.3"
  UV_VERSION: "0.11.29"
  UV_SHA256: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

jobs:
  generate:
    name: Generate chapter audio
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # persist-credentials required for git push of chapter-audio/* branch.

      - name: Ensure Git LFS is available
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Parse unit ids
        id: units
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          raw = """${{ inputs.units }}"""
          units = [u for u in re.split(r"[\s,]+", raw.strip()) if u]
          if not units:
              raise SystemExit("no unit ids provided")
          for u in units:
              if ".." in u or "/" in u or "\\" in u or not re.fullmatch(r"[A-Za-z0-9._-]+", u):
                  raise SystemExit(f"invalid unit id: {u!r}")
          path = os.environ["GITHUB_OUTPUT"]
          with open(path, "a", encoding="utf-8") as fh:
              fh.write(f"count={len(units)}\n")
              fh.write("list<<EOF\n")
              fh.write("\n".join(units) + "\n")
              fh.write("EOF\n")
          print(f"units ({len(units)}):")
          for u in units:
              print(f"  {u}")
          PY

      - name: Dry-run plan (no secrets)
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS= read -r unit; do
            [ -n "$unit" ] || continue
            echo "::group::dry-run $unit"
            python3 tools/generate_chapter_audio.py --repo . --unit "$unit" --dry-run --format text
            echo "::endgroup::"
          done <<< "${{ steps.units.outputs.list }}"

      - name: Real generate (ElevenLabs secret on this step only)
        if: ${{ !inputs.dry_run }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "ELEVENLABS_API_KEY secret is not set" >&2
            exit 1
          fi
          force_flag=()
          if [ "${{ inputs.force }}" = "true" ]; then
            force_flag=(--force)
          fi
          while IFS= read -r unit; do
            [ -n "$unit" ] || continue
            echo "::group::generate $unit"
            python3 tools/generate_chapter_audio.py --repo . --unit "$unit" --real \
              "${force_flag[@]}" --format text
            echo "::endgroup::"
          done <<< "${{ steps.units.outputs.list }}"

      - name: Validate artifacts (secret-free)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          ELEVENLABS_API_KEY: ""
        run: |
          set -euo pipefail
          make validate-chapter-audio
          make verify-chapter-audio

      - name: Upload generated audio artifacts
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chapter-audio-${{ github.run_id }}
          path: books/*/audio/*
          if-no-files-found: warn

      - name: Commit LFS audio and open review PR
        if: ${{ !inputs.dry_run && inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unit_args=()
          while IFS= read -r unit; do
            [ -n "$unit" ] || continue
            unit_args+=(--unit "$unit")
          done <<< "${{ steps.units.outputs.list }}"
          python3 tools/run_chapter_audio_ci.py --repo . \
            --base-branch "${{ github.event.repository.default_branch }}" \
            "${unit_args[@]}"
