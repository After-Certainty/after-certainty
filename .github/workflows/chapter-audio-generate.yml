# Phase 4+: manual chapter-audio generation (workflow_dispatch only).
# Dry-run by default. Real generate mounts ELEVENLABS_API_KEY only on the generate step.
# Ordinary CI (python-tests / site-ci) never receives TTS secrets.
#
# By default the workflow reconciles the corpus: it discovers units that are
# audio-enabled (book.yml narration + chapter-enrichment.yml) but not current
# (missing / stale / invalid artifacts) and generates only those. Optional
# `units` / `edition` inputs narrow the set. Merging the review PR makes those
# units available to the site Listen control.

name: Chapter audio generate

on:
  workflow_dispatch:
    inputs:
      units:
        description: >-
          Optional explicit unit id(s), comma or newline separated. Leave empty
          to auto-discover enabled units that need generation across the corpus.
        required: false
        type: string
        default: ""
      edition:
        description: >-
          Optional edition slug filter (e.g. observer-patterns). Empty = all books
          with audio-enabled units.
        required: false
        type: string
        default: ""
      dry_run:
        description: "Plan + budgets only (no API call, no writes). Keep true until ready."
        required: false
        type: boolean
        default: true
      force:
        description: "Include enabled units that are already current (regenerate)"
        required: false
        type: boolean
        default: false
      open_pr:
        description: "After a real generate, commit LFS audio and open a review PR"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: chapter-audio-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.3"
  UV_VERSION: "0.11.29"
  UV_SHA256: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

jobs:
  generate:
    name: Generate chapter audio
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # persist-credentials required for git push of chapter-audio/* branch.

      - name: Ensure Git LFS is available
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Discover units to generate
        id: units
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          args=(--repo . --format ids)
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          edition="${{ inputs.edition }}"
          if [ -n "${edition// /}" ]; then
            args+=(--edition "$edition")
          fi
          # Optional explicit unit allow-list (otherwise reconcile all needing generate).
          python3 - <<'PY' > /tmp/chapter-audio-unit-args.txt
          import os
          import re
          raw = """${{ inputs.units }}"""
          units = [u for u in re.split(r"[\s,]+", raw.strip()) if u]
          for u in units:
              if ".." in u or "/" in u or "\\" in u or not re.fullmatch(r"[A-Za-z0-9._-]+", u):
                  raise SystemExit(f"invalid unit id: {u!r}")
              print(f"--unit\n{u}")
          PY
          if [ -s /tmp/chapter-audio-unit-args.txt ]; then
            mapfile -t unit_flags < /tmp/chapter-audio-unit-args.txt
            args+=("${unit_flags[@]}")
          fi
          mapfile -t discovered < <(python3 tools/discover_chapter_audio.py "${args[@]}")
          count="${#discovered[@]}"
          {
            echo "count=${count}"
            echo "list<<EOF"
            printf '%s\n' "${discovered[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "units needing generate (${count}):"
          if [ "$count" -eq 0 ]; then
            echo "  (none — nothing to reconcile)"
          else
            printf '  %s\n' "${discovered[@]}"
          fi

      - name: Dry-run plan (no secrets)
        if: ${{ inputs.dry_run && steps.units.outputs.count != '0' }}
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS= read -r unit; do
            [ -n "$unit" ] || continue
            echo "::group::dry-run $unit"
            python3 tools/generate_chapter_audio.py --repo . --unit "$unit" --dry-run --format text
            echo "::endgroup::"
          done <<< "${{ steps.units.outputs.list }}"

      - name: Nothing to generate
        if: ${{ steps.units.outputs.count == '0' }}
        run: echo "No enabled units need generation (already current or none enabled)."

      - name: Real generate (ElevenLabs secret on this step only)
        if: ${{ !inputs.dry_run && steps.units.outputs.count != '0' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "ELEVENLABS_API_KEY secret is not set" >&2
            exit 1
          fi
          force_flag=()
          if [ "${{ inputs.force }}" = "true" ]; then
            force_flag=(--force)
          fi
          while IFS= read -r unit; do
            [ -n "$unit" ] || continue
            echo "::group::generate $unit"
            python3 tools/generate_chapter_audio.py --repo . --unit "$unit" --real \
              "${force_flag[@]}" --format text
            echo "::endgroup::"
          done <<< "${{ steps.units.outputs.list }}"

      - name: Validate artifacts (secret-free)
        if: ${{ !inputs.dry_run && steps.units.outputs.count != '0' }}
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          ELEVENLABS_API_KEY: ""
        run: |
          set -euo pipefail
          make validate-chapter-audio
          make verify-chapter-audio

      - name: Upload generated audio artifacts
        if: ${{ !inputs.dry_run && steps.units.outputs.count != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chapter-audio-${{ github.run_id }}
          path: books/*/audio/*
          if-no-files-found: warn

      - name: Commit LFS audio and open review PR
        if: ${{ !inputs.dry_run && inputs.open_pr && steps.units.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unit_args=()
          while IFS= read -r unit; do
            [ -n "$unit" ] || continue
            unit_args+=(--unit "$unit")
          done <<< "${{ steps.units.outputs.list }}"
          python3 tools/run_chapter_audio_ci.py --repo . \
            --base-branch "${{ github.event.repository.default_branch }}" \
            "${unit_args[@]}"
