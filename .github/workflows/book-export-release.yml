# Monorepo: each folder that contains index.md is a book. Only books touched by a
# change set (plus Makefile/tools/workflows changes) are rebuilt. Shared parents with
# multiple editions (e.g. books/when-others-look-to-you/v1 and v2) fan out when a change
# is under the parent but not inside one edition path.
#
# Security model:
# - Preparation jobs (read-only) run all repository Python and produce a scanned
#   release-staging artifact with SHA256SUMS.
# - Publication jobs (contents: write) only download that artifact and run short
#   audited shell scripts — no general-purpose tools/*.py execution.
# - Cache revalidation uses a hardcoded allowlisted HTTPS URL only.

name: Book export (DOCX + EPUB + PDF)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: book-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.3"

jobs:
  semantic-yaml:
    name: Semantic YAML & book specs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml jsonschema

      - name: Validate book.yml specs
        run: |
          set -euo pipefail
          make validate-book-specs

      - name: Verify semantic/*.yml
        run: |
          set -euo pipefail
          python3 tools/verify_semantic_yaml.py --repo . --strict-prose

  detect:
    needs: semantic-yaml
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      empty: ${{ steps.set.outputs.empty }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve affected books
        id: set
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml jsonschema
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python3 tools/ci_affected_books.py --repo . --all > /tmp/books.json
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            export GIT_BEFORE="${{ github.event.pull_request.base.sha }}"
            export GIT_AFTER="${{ github.event.pull_request.head.sha }}"
            python3 tools/ci_affected_books.py --repo . > /tmp/books.json
          else
            export GIT_BEFORE="${{ github.event.before }}"
            export GIT_AFTER="${{ github.event.after }}"
            python3 tools/ci_affected_books.py --repo . > /tmp/books.json
          fi
          jq -e . /tmp/books.json
          {
            echo "matrix<<BOOK_MATRIX_JSON"
            jq -c '.include' /tmp/books.json
            echo "BOOK_MATRIX_JSON"
            echo "empty=$(jq -r '.empty' /tmp/books.json)"
            echo "count=$(jq -r '.count' /tmp/books.json)"
          } >> "$GITHUB_OUTPUT"

  export:
    name: ${{ matrix.dir }}
    needs: detect
    if: needs.detect.outputs.empty != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Pandoc, Python helpers, diagram rasterization
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin imagemagick texlive-xetex
          python3 -m pip install --user jinja2 pyyaml jsonschema python-docx

      - name: Install Typst
        if: matrix.needs_typst == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          TYPST_INSTALL_DIR="$HOME/.local" bash scripts/install_typst.sh

      - name: Build configured artifacts via scripts/build.py
        run: |
          set -euo pipefail
          mkdir -p upload
          formats=()
          if [ "${{ matrix.has_docx }}" = "true" ]; then
            formats+=("--format" "docx")
          fi
          if [ "${{ matrix.has_epub }}" = "true" ]; then
            formats+=("--format" "epub")
          fi
          if [ "${{ matrix.has_pdf }}" = "true" ]; then
            formats+=("--format" "pdf")
          fi
          python3 scripts/build.py \
            --repo . \
            --book-dir "${{ matrix.dir }}" \
            --out-dir "upload" \
            "${formats[@]}"
          if [ "${{ matrix.has_pdf }}" = "true" ]; then
            if ! compgen -G "upload/*.pdf" > /dev/null; then
              echo "Expected a PDF artifact for ${{ matrix.dir }}, but none was produced."
              ls -la upload || true
              exit 1
            fi
          fi

      - name: Scan book upload for secrets
        run: |
          set -euo pipefail
          python3 tools/scan_generated_secrets.py upload

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: book-${{ matrix.slug }}
          path: upload/*
          if-no-files-found: error

  prepare-release:
    name: Prepare release staging
    needs: [detect, export]
    if: >
      always() &&
      needs.detect.outputs.empty != 'true' &&
      needs.export.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: book-*
          path: built
          merge-multiple: true

      - name: Fetch existing rolling release assets (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p prior
          # contents:read token — cannot create/alter/delete releases.
          gh release download latest \
            --pattern '*.docx' --pattern '*.epub' --pattern '*.pdf' \
            --pattern '*.manifest.json' --pattern 'books-manifest.json' \
            --pattern 'semantic-manifest.json' --pattern 'SHA256SUMS' \
            --dir prior || true

      - name: Install Python deps and prepare staging
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREPARE_MODE: books
          PRIOR_DIR: prior
          BUILT_DIR: built
          OUT_DIR: upload
          # Explicitly unset write-capable tokens for Python preparation.
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml jsonschema
          bash scripts/prepare_release_staging.sh

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-staging
          path: upload/
          if-no-files-found: error

  publish-release:
    name: Publish latest release
    needs: [detect, prepare-release]
    if: >
      always() &&
      needs.detect.outputs.empty != 'true' &&
      needs.prepare-release.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-staging
          path: staging

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/publish_latest_release.sh staging \
            "Automated exports. This push built ${{ needs.detect.outputs.count }} book(s) at commit ${{ github.sha }}."

      - name: Revalidate www.after-certainty.com caches
        env:
          CACHE_REVALIDATE_SECRET: ${{ secrets.CACHE_REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/revalidate_site_cache.sh

  prepare-semantic-release:
    name: Prepare semantic-only staging
    needs: [detect, export]
    if: >
      always() &&
      needs.detect.outputs.empty == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch existing rolling release assets (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh release download latest \
            --pattern '*.docx' --pattern '*.epub' --pattern '*.pdf' \
            --pattern '*.manifest.json' --pattern 'books-manifest.json' \
            --pattern 'semantic-manifest.json' --pattern 'SHA256SUMS' \
            --dir prior || true

      - name: Install Python deps and prepare staging
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREPARE_MODE: semantic-only
          PRIOR_DIR: prior
          OUT_DIR: upload
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml jsonschema
          bash scripts/prepare_release_staging.sh

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-staging-semantic
          path: upload/
          if-no-files-found: error

  publish-semantic-release:
    name: Publish semantic-only release
    needs: [detect, prepare-semantic-release]
    if: >
      always() &&
      needs.detect.outputs.empty == 'true' &&
      needs.prepare-semantic-release.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-staging-semantic
          path: staging

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/publish_latest_release.sh staging \
            "Automated exports. Semantic manifest rebuilt at commit ${{ github.sha }}."

      - name: Revalidate www.after-certainty.com caches
        env:
          CACHE_REVALIDATE_SECRET: ${{ secrets.CACHE_REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/revalidate_site_cache.sh
