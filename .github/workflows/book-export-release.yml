# Monorepo: each folder that contains index.md is a book. Only books touched by a
# change set (plus Makefile/tools/workflows changes) are rebuilt. Shared parents with
# multiple editions (e.g. books/when-others-look-to-you/v1 and v2) fan out when a change
# is under the parent but not inside one edition path.
#
# Security model:
# - Preparation jobs (read-only) run repository Python plus Node (sharp) for web
#   cover derivatives, then produce a scanned release-staging artifact with SHA256SUMS.
# - Publication jobs (contents: write) only download that artifact and run short
#   audited shell scripts — no general-purpose tools/*.py execution.
# - Cache revalidation uses a hardcoded allowlisted HTTPS URL only.

name: Book export (DOCX + EPUB + PDF)

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/site/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/site-ci.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "apps/site/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/site-ci.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

concurrency:
  group: book-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.3"
  UV_VERSION: "0.11.29"
  UV_SHA256: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

jobs:
  semantic-yaml:
    name: Semantic YAML & book specs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Validate book.yml specs
        run: |
          set -euo pipefail
          make validate-book-specs

      - name: Verify semantic/*.yml
        run: |
          set -euo pipefail
          python3 tools/verify_semantic_yaml.py --repo . --strict-prose

  detect:
    needs: semantic-yaml
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      empty: ${{ steps.set.outputs.empty }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Resolve affected books
        id: set
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python3 tools/ci_affected_books.py --repo . --all > /tmp/books.json
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            export GIT_BEFORE="${{ github.event.pull_request.base.sha }}"
            export GIT_AFTER="${{ github.event.pull_request.head.sha }}"
            python3 tools/ci_affected_books.py --repo . > /tmp/books.json
          else
            export GIT_BEFORE="${{ github.event.before }}"
            export GIT_AFTER="${{ github.event.after }}"
            python3 tools/ci_affected_books.py --repo . > /tmp/books.json
          fi
          jq -e . /tmp/books.json
          {
            echo "matrix<<BOOK_MATRIX_JSON"
            jq -c '.include' /tmp/books.json
            echo "BOOK_MATRIX_JSON"
            echo "empty=$(jq -r '.empty' /tmp/books.json)"
            echo "count=$(jq -r '.count' /tmp/books.json)"
          } >> "$GITHUB_OUTPUT"

  export:
    name: ${{ matrix.dir }}
    needs: detect
    if: needs.detect.outputs.empty != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Pandoc and diagram rasterization
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin imagemagick texlive-xetex

      - name: Install Python dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Install Typst
        if: matrix.needs_typst == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          TYPST_INSTALL_DIR="$HOME/.local" bash scripts/install_typst.sh

      - name: Build configured artifacts via scripts/build.py
        run: |
          set -euo pipefail
          mkdir -p upload
          formats=()
          if [ "${{ matrix.has_docx }}" = "true" ]; then
            formats+=("--format" "docx")
          fi
          if [ "${{ matrix.has_epub }}" = "true" ]; then
            formats+=("--format" "epub")
          fi
          if [ "${{ matrix.has_pdf }}" = "true" ]; then
            formats+=("--format" "pdf")
          fi
          python3 scripts/build.py \
            --repo . \
            --book-dir "${{ matrix.dir }}" \
            --out-dir "upload" \
            "${formats[@]}"
          if [ "${{ matrix.has_pdf }}" = "true" ]; then
            if ! compgen -G "upload/*.pdf" > /dev/null; then
              echo "Expected a PDF artifact for ${{ matrix.dir }}, but none was produced."
              ls -la upload || true
              exit 1
            fi
          fi

      - name: Install IngramSpark packaging tools
        if: matrix.package_ingramspark == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils qpdf default-jre-headless
          if [ "${{ matrix.ingramspark_print }}" = "true" ]; then
            sudo apt-get install -y texlive-xetex texlive-fonts-recommended
          fi
          bash scripts/install_epubcheck.sh

      - name: Package IngramSpark submission kit
        if: matrix.package_ingramspark == 'true'
        env:
          BOOK_DIR: ${{ matrix.dir }}
          INGRAM_EBOOK: ${{ matrix.ingramspark_ebook }}
          INGRAM_PRINT: ${{ matrix.ingramspark_print }}
          INGRAM_GITHUB_RELEASE: ${{ matrix.ingramspark_github_release }}
        run: |
          set -euo pipefail
          mkdir -p upload ingramspark-out
          pkg_flags=()
          if [ "$INGRAM_EBOOK" = "true" ] && [ "$INGRAM_PRINT" != "true" ]; then
            pkg_flags+=(--ebook-only)
          elif [ "$INGRAM_PRINT" = "true" ] && [ "$INGRAM_EBOOK" != "true" ]; then
            pkg_flags+=(--print-only)
          fi
          python3 scripts/package_ingramspark.py \
            --repo . \
            --book-dir "$BOOK_DIR" \
            "${pkg_flags[@]}"
          zip_path="$(
            BOOK_DIR="$BOOK_DIR" python3 - <<'PY'
          from pathlib import Path
          import os
          import sys
          sys.path.insert(0, "tools")
          from book_specs import ingramspark_artifact_name, load_spec_for_book_dir
          spec = load_spec_for_book_dir(Path(os.environ["BOOK_DIR"]))
          book_id = spec["book"]["id"]
          print(Path("build/ingramspark") / book_id / ingramspark_artifact_name(book_id))
          PY
          )"
          test -f "$zip_path"
          cp -f "$zip_path" ingramspark-out/
          report="$(dirname "$zip_path")/preflight-report.txt"
          if [ -f "$report" ]; then
            cp -f "$report" ingramspark-out/
          fi
          # Attach to rolling latest only when package.github_release is true.
          if [ "$INGRAM_GITHUB_RELEASE" = "true" ]; then
            cp -f "$zip_path" upload/
          fi

      - name: Scan book upload for secrets
        run: |
          set -euo pipefail
          python3 tools/scan_generated_secrets.py upload
          if [ -d ingramspark-out ]; then
            python3 tools/scan_generated_secrets.py ingramspark-out
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-${{ matrix.slug }}
          path: upload/*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.package_ingramspark == 'true'
        with:
          name: ingramspark-${{ matrix.slug }}
          path: ingramspark-out/*
          if-no-files-found: error

  prepare-release:
    name: Prepare release staging
    needs: [detect, export]
    if: >
      always() &&
      needs.detect.outputs.empty != 'true' &&
      needs.export.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: book-*
          path: built
          merge-multiple: true

      - name: Fetch existing rolling release assets (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p prior
          # contents:read token — cannot create/alter/delete releases.
          gh release download latest \
            --pattern '*.docx' --pattern '*.epub' --pattern '*.pdf' \
            --pattern '*.manifest.json' --pattern '*-ingramspark.zip' \
            --pattern 'books-manifest.json' \
            --pattern 'semantic-manifest.json' --pattern 'SHA256SUMS' \
            --dir prior || true

      - name: Install Python dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      # Cover pipeline (PR #350): prepare_release_staging.sh runs
      # generate-book-cover-assets.mjs, which requires sharp via npm workspaces.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare release staging
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREPARE_MODE: books
          PRIOR_DIR: prior
          BUILT_DIR: built
          OUT_DIR: upload
          # Explicitly unset write-capable tokens for Python preparation.
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          bash scripts/prepare_release_staging.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-staging
          path: upload/
          if-no-files-found: error

  publish-release:
    name: Publish latest release
    needs: [detect, prepare-release]
    if: >
      always() &&
      needs.detect.outputs.empty != 'true' &&
      needs.prepare-release.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-staging
          path: staging

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/publish_latest_release.sh staging \
            "Automated exports. This push built ${{ needs.detect.outputs.count }} book(s) at commit ${{ github.sha }}."

      - name: Publish immutable IngramSpark production tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/publish_ingramspark_immutable_releases.sh staging

      - name: Revalidate www.after-certainty.com caches
        env:
          CACHE_REVALIDATE_SECRET: ${{ secrets.CACHE_REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/revalidate_site_cache.sh

  prepare-semantic-release:
    name: Prepare semantic-only staging
    needs: [detect, export]
    if: >
      always() &&
      needs.detect.outputs.empty == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch existing rolling release assets (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh release download latest \
            --pattern '*.docx' --pattern '*.epub' --pattern '*.pdf' \
            --pattern '*.manifest.json' --pattern '*-ingramspark.zip' \
            --pattern 'books-manifest.json' \
            --pattern 'semantic-manifest.json' --pattern 'SHA256SUMS' \
            --dir prior || true

      - name: Install Python dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      # Same as prepare-release: semantic-only staging still regenerates covers +
      # packs semantic-cover-assets.tar.gz beside semantic-manifest.json.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare semantic-only staging
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREPARE_MODE: semantic-only
          PRIOR_DIR: prior
          OUT_DIR: upload
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          bash scripts/prepare_release_staging.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-staging-semantic
          path: upload/
          if-no-files-found: error

  publish-semantic-release:
    name: Publish semantic-only release
    needs: [detect, prepare-semantic-release]
    if: >
      always() &&
      needs.detect.outputs.empty == 'true' &&
      needs.prepare-semantic-release.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-staging-semantic
          path: staging

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/publish_latest_release.sh staging \
            "Automated exports. Semantic manifest rebuilt at commit ${{ github.sha }}."

      - name: Publish immutable IngramSpark production tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/publish_ingramspark_immutable_releases.sh staging

      - name: Revalidate www.after-certainty.com caches
        env:
          CACHE_REVALIDATE_SECRET: ${{ secrets.CACHE_REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          set +x
          bash scripts/revalidate_site_cache.sh
