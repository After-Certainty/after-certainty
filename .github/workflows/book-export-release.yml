# Monorepo: each folder that contains index.md is a book. Only books touched by a
# change set (plus Makefile/tools/workflows changes) are rebuilt. Shared parents with
# multiple editions (e.g. books/when-others-look-to-you/v1 and v2) fan out when a change
# is under the parent but not inside one edition path.
#
# Runs on pushes to main, pull requests targeting main (verify exports before merge),
# and workflow_dispatch (full rebuild). Only pushes to main update the rolling release.

name: Book export (DOCX + EPUB + PDF)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: book-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dedicated job so PR checks show "Semantic YAML & book specs" instead of bundling
  # verify_semantic_yaml into the detect/matrix step.
  semantic-yaml:
    name: Semantic YAML & book specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml jsonschema

      - name: Validate book.yml specs
        run: |
          set -euo pipefail
          make validate-book-specs

      - name: Verify semantic/*.yml
        run: |
          set -euo pipefail
          python3 tools/verify_semantic_yaml.py --repo . --strict-prose

  detect:
    needs: semantic-yaml
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      empty: ${{ steps.set.outputs.empty }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve affected books
        id: set
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml jsonschema
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python3 tools/ci_affected_books.py --repo . --all > /tmp/books.json
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            export GIT_BEFORE="${{ github.event.pull_request.base.sha }}"
            export GIT_AFTER="${{ github.event.pull_request.head.sha }}"
            python3 tools/ci_affected_books.py --repo . > /tmp/books.json
          else
            export GIT_BEFORE="${{ github.event.before }}"
            export GIT_AFTER="${{ github.event.after }}"
            python3 tools/ci_affected_books.py --repo . > /tmp/books.json
          fi
          jq -e . /tmp/books.json
          {
            echo "matrix<<BOOK_MATRIX_JSON"
            jq -c '.include' /tmp/books.json
            echo "BOOK_MATRIX_JSON"
            echo "empty=$(jq -r '.empty' /tmp/books.json)"
            echo "count=$(jq -r '.count' /tmp/books.json)"
          } >> "$GITHUB_OUTPUT"

  export:
    name: ${{ matrix.dir }}
    needs: detect
    if: needs.detect.outputs.empty != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Pandoc, Python helpers, diagram rasterization
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin imagemagick texlive-xetex
          python3 -m pip install --user jinja2 pyyaml jsonschema

      - name: Install Typst
        if: matrix.needs_typst == 'true'
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          TYPST_INSTALL_DIR="$HOME/.local" bash scripts/install_typst.sh

      - name: Build configured artifacts via scripts/build.py
        run: |
          set -euo pipefail
          mkdir -p upload
          formats=()
          if [ "${{ matrix.has_docx }}" = "true" ]; then
            formats+=("--format" "docx")
          fi
          if [ "${{ matrix.has_epub }}" = "true" ]; then
            formats+=("--format" "epub")
          fi
          if [ "${{ matrix.has_pdf }}" = "true" ]; then
            formats+=("--format" "pdf")
          fi
          python3 scripts/build.py \
            --repo . \
            --book-dir "${{ matrix.dir }}" \
            --out-dir "upload" \
            "${formats[@]}"
          if [ "${{ matrix.has_pdf }}" = "true" ]; then
            if ! compgen -G "upload/*.pdf" > /dev/null; then
              echo "Expected a PDF artifact for ${{ matrix.dir }}, but none was produced."
              ls -la upload || true
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: book-${{ matrix.slug }}
          path: upload/*
          if-no-files-found: error

  release:
    needs: [detect, export]
    if: >
      always() &&
      needs.detect.outputs.empty != 'true' &&
      needs.export.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: book-*
          path: built
          merge-multiple: true

      - name: Fetch existing rolling release assets
        continue-on-error: true
        run: |
          mkdir -p prior
          gh release download latest --pattern '*.docx' --pattern '*.epub' --pattern '*.pdf' --pattern '*.manifest.json' --pattern 'books-manifest.json' --pattern 'semantic-manifest.json' --dir prior || true

      - name: Merge prior assets with new builds
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          for f in prior/*.docx prior/*.epub prior/*.pdf prior/*.manifest.json prior/books-manifest.json prior/semantic-manifest.json; do
            [ -e "$f" ] || continue
            cp -f "$f" "upload/$(basename "$f")"
          done
          find built -type f \( -name '*.docx' -o -name '*.epub' -o -name '*.pdf' -o -name '*.manifest.json' -o -name 'books-manifest.json' -o -name 'semantic-manifest.json' \) -exec cp -f {} upload/ \;
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No files to release."
            exit 1
          fi
          ls -la upload

      - name: Build aggregate books manifest
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml jsonschema
          python3 tools/verify_semantic_yaml.py --repo . --strict-prose
          python3 tools/generate_books_manifest.py \
            --repo . \
            --out upload/books-manifest.json \
            --github-repository "${{ github.repository }}" \
            --github-ref "main" \
            --release-tag "latest"
          python3 tools/validate_books_manifest.py --repo . --manifest upload/books-manifest.json
          python3 tools/generate_semantic_manifest.py \
            --repo . \
            --out upload/semantic-manifest.json \
            --github-repository "${{ github.repository }}" \
            --github-ref "main" \
            --release-tag "latest"
          python3 tools/validate_semantic_manifest.py --repo . --manifest upload/semantic-manifest.json

      - name: Update latest release
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Latest book exports" \
            --notes "Automated exports. This push built ${{ needs.detect.outputs.count }} book(s) at commit ${{ github.sha }}." \
            upload/*

      # Refresh www.after-certainty.com caches (podcast RSS, semantic graph, books catalog).
      - name: Revalidate www.after-certainty.com caches
        env:
          CACHE_REVALIDATE_SECRET: ${{ secrets.CACHE_REVALIDATE_SECRET }}
          SITE_REVALIDATE_URL: ${{ vars.SITE_REVALIDATE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CACHE_REVALIDATE_SECRET:-}" ]; then
            echo "CACHE_REVALIDATE_SECRET not set; skipping site revalidate."
            exit 0
          fi
          url="${SITE_REVALIDATE_URL:-https://www.after-certainty.com/api/cache/revalidate}"
          code=$(curl -sS -o /tmp/site-revalidate.json -w "%{http_code}" \
            -X POST "$url" \
            -H "Authorization: Bearer ${CACHE_REVALIDATE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"targets":["podcast","semantic","books"]}')
          cat /tmp/site-revalidate.json
          echo ""
          if [ "$code" != "200" ]; then
            echo "Site revalidate failed (HTTP ${code}). Deploy after-certainty-site with /api/cache/revalidate and matching CACHE_REVALIDATE_SECRET on Vercel."
            exit 1
          fi
          echo "Revalidated www.after-certainty.com: podcast RSS, semantic-manifest.json, books-manifest.json"
