# Site lint/test/build/e2e + Vercel prebuilt deploy for apps/site.
#
# Generates a same-checkout semantic manifest, installs it into
# apps/site/data/local-*.json, validates, then builds with `vercel build`
# (install/build via apps/site/vercel.json → scripts/vercel_*.sh) so the
# artifact under test is the one deployed with `vercel deploy --prebuilt`.
#
# Requires repository secret VERCEL_TOKEN and variables VERCEL_ORG_ID /
# VERCEL_PROJECT_ID for Vercel build + deploy. Fork PRs never receive the
# token: they fall back to `npm run site:build` and skip deploy.
# Job-level `if` cannot reference `secrets` (Actions context rules).

name: Site CI

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "books/**"
      - "semantic/**"
      - "schema/**"
      - "upcoming/**"
      - "tools/generate_semantic_manifest.py"
      - "tools/discovery_manifest.py"
      - "tools/manifest_*.py"
      - "tools/book_specs.py"
      - "tools/manuscript_structure.py"
      - "tools/pattern_yaml.py"
      - "tools/validate_book_specs.py"
      - "tools/verify_semantic_yaml.py"
      - "scripts/install_local_manifest_for_site.py"
      - "scripts/vercel_install.sh"
      - "scripts/vercel_build.sh"
      - "scripts/vercel_ignore_build.sh"
      - "packages/corpus-tasks/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".npmrc"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/site-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/site/**"
      - "books/**"
      - "semantic/**"
      - "schema/**"
      - "upcoming/**"
      - "tools/generate_semantic_manifest.py"
      - "tools/discovery_manifest.py"
      - "tools/manifest_*.py"
      - "tools/book_specs.py"
      - "tools/manuscript_structure.py"
      - "tools/pattern_yaml.py"
      - "tools/validate_book_specs.py"
      - "tools/verify_semantic_yaml.py"
      - "scripts/install_local_manifest_for_site.py"
      - "scripts/vercel_install.sh"
      - "scripts/vercel_build.sh"
      - "scripts/vercel_ignore_build.sh"
      - "packages/corpus-tasks/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".npmrc"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/site-ci.yml"

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.3"
  UV_VERSION: "0.11.29"
  UV_SHA256: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"
  GITHUB_REPOSITORY: ksteffe/after-certainty
  SEMANTIC_MANIFEST_OFFLINE: "1"
  SEMANTIC_MANIFEST_USE_LOCAL: "1"
  VERCEL_CLI_VERSION: "59.3.0"

jobs:
  build-and-deploy:
    name: Lint, test, vercel build, e2e, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Trusted same-repo PRs and main pushes may deploy; forks always run CI
    # but never take the Vercel credential path (token empty + not same-repo).
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      # Used by scripts/ensure_git_lfs_audio.sh during vercel_build.sh
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Generate + install local semantic manifest
        run: |
          set -euo pipefail
          make generate-semantic-manifest
          make install-local-manifest-for-site

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run site:lint

      - name: Test
        run: npm run site:test

      - name: Validate offline/local manifest
        run: npm run site:validate:fallback

      - name: Validate public corpus integrity
        run: npm run site:validate:public-corpus

      - name: Decide Vercel build/deploy path
        id: vercel_path
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          same_repo=false
          if [[ "${EVENT_NAME}" == "push" ]]; then
            same_repo=true
          elif [[ -n "${PR_HEAD_REPO}" && "${PR_HEAD_REPO}" == "${REPO}" ]]; then
            same_repo=true
          fi
          if [[ "${same_repo}" == "true" && -n "${VERCEL_TOKEN}" && -n "${VERCEL_ORG_ID}" && -n "${VERCEL_PROJECT_ID}" ]]; then
            echo "use_vercel=true" >> "${GITHUB_OUTPUT}"
            echo "Using vercel build + deploy --prebuilt"
          else
            echo "use_vercel=false" >> "${GITHUB_OUTPUT}"
            echo "Falling back to npm run site:build (no deploy): same_repo=${same_repo} token_set=$([ -n "${VERCEL_TOKEN}" ] && echo yes || echo no)"
          fi

      - name: Install Vercel CLI (pinned)
        if: steps.vercel_path.outputs.use_vercel == 'true'
        run: |
          set -euo pipefail
          npm install --global "vercel@${VERCEL_CLI_VERSION}"
          vercel --version

      # Run Vercel CLI from the repo root. The project Root Directory is already
      # `apps/site`; working-directory apps/site doubles that path and breaks
      # `vercel deploy --prebuilt` (…/apps/site/apps/site).
      # Env VERCEL_ORG_ID / VERCEL_PROJECT_ID alone can leave the CLI unable to load
      # project settings; write the link file explicitly (same shape as `vercel link`).
      - name: Link Vercel project
        if: steps.vercel_path.outputs.use_vercel == 'true'
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '%s\n' "{\"projectId\":\"${VERCEL_PROJECT_ID}\",\"orgId\":\"${VERCEL_ORG_ID}\"}" > .vercel/project.json
          if ! vercel whoami --token="${VERCEL_TOKEN}"; then
            echo "::error::VERCEL_TOKEN is invalid or not tied to a Vercel user (CLI: User not found). Recreate the token under the team that owns this project and update the GitHub Actions secret."
            exit 1
          fi

      - name: Pull Vercel environment (preview)
        if: steps.vercel_path.outputs.use_vercel == 'true' && github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Pull Vercel environment (production)
        if: steps.vercel_path.outputs.use_vercel == 'true' && github.event_name == 'push'
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      # vercel build loads .vercel/.env.*.local from pull; a missing/invalid
      # NEXT_PUBLIC_SITE_URL there breaks next metadataBase (Invalid URL).
      - name: Ensure NEXT_PUBLIC_SITE_URL in pulled Vercel env
        if: steps.vercel_path.outputs.use_vercel == 'true'
        env:
          SITE_URL: https://www.after-certainty.com
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            env_file=".vercel/.env.preview.local"
          else
            env_file=".vercel/.env.production.local"
          fi
          mkdir -p .vercel
          if [[ -f "${env_file}" ]]; then
            grep -v '^NEXT_PUBLIC_SITE_URL=' "${env_file}" > "${env_file}.tmp" || true
            mv "${env_file}.tmp" "${env_file}"
          fi
          printf 'NEXT_PUBLIC_SITE_URL=%s\n' "${SITE_URL}" >> "${env_file}"

      - name: Vercel build (preview)
        if: steps.vercel_path.outputs.use_vercel == 'true' && github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SITE_URL: https://www.after-certainty.com
        run: vercel build --token="${VERCEL_TOKEN}"

      - name: Vercel build (production)
        if: steps.vercel_path.outputs.use_vercel == 'true' && github.event_name == 'push'
        env:
          NEXT_PUBLIC_SITE_URL: https://www.after-certainty.com
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Build (fork / no Vercel credentials)
        if: steps.vercel_path.outputs.use_vercel != 'true'
        run: npm run site:build

      - name: Install Playwright browsers
        run: npm exec -w after-certainty-site -- playwright install --with-deps chromium

      - name: E2E tests
        run: npm run site:test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Deploy prebuilt (preview)
        if: steps.vercel_path.outputs.use_vercel == 'true' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --token="${VERCEL_TOKEN}")"
          {
            echo "## Vercel preview deployment"
            echo ""
            echo "- URL: ${url}"
            echo "- Commit: \`${VERCEL_GIT_COMMIT_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy prebuilt (production)
        if: steps.vercel_path.outputs.use_vercel == 'true' && github.event_name == 'push'
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")"
          {
            echo "## Vercel production deployment"
            echo ""
            echo "- URL: ${url}"
            echo "- Commit: \`${VERCEL_GIT_COMMIT_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
