# Site lint/test/build/e2e for apps/site (npm workspaces).
#
# Generates a same-checkout semantic manifest, installs it into
# apps/site/data/local-*.json, and builds/tests with
# SEMANTIC_MANIFEST_USE_LOCAL=1 + SEMANTIC_MANIFEST_OFFLINE=1.
#
# After build-and-test succeeds, deploy builds with `vercel build` and
# uploads via `vercel deploy --prebuilt` (preview on PR, production on main).
# Requires repository secret VERCEL_TOKEN and variables VERCEL_ORG_ID /
# VERCEL_PROJECT_ID. Fork PRs never receive the token; deploy is skipped.

name: Site CI

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "books/**"
      - "semantic/**"
      - "schema/**"
      - "upcoming/**"
      - "tools/generate_semantic_manifest.py"
      - "tools/discovery_manifest.py"
      - "tools/manifest_*.py"
      - "tools/book_specs.py"
      - "tools/manuscript_structure.py"
      - "tools/pattern_yaml.py"
      - "tools/validate_book_specs.py"
      - "tools/verify_semantic_yaml.py"
      - "scripts/install_local_manifest_for_site.py"
      - "scripts/vercel_install.sh"
      - "scripts/vercel_build.sh"
      - "scripts/vercel_ignore_build.sh"
      - "packages/corpus-tasks/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".npmrc"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/site-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/site/**"
      - "books/**"
      - "semantic/**"
      - "schema/**"
      - "upcoming/**"
      - "tools/generate_semantic_manifest.py"
      - "tools/discovery_manifest.py"
      - "tools/manifest_*.py"
      - "tools/book_specs.py"
      - "tools/manuscript_structure.py"
      - "tools/pattern_yaml.py"
      - "tools/validate_book_specs.py"
      - "tools/verify_semantic_yaml.py"
      - "scripts/install_local_manifest_for_site.py"
      - "scripts/vercel_install.sh"
      - "scripts/vercel_build.sh"
      - "scripts/vercel_ignore_build.sh"
      - "packages/corpus-tasks/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".npmrc"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/site-ci.yml"

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.3"
  UV_VERSION: "0.11.29"
  UV_SHA256: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"
  GITHUB_REPOSITORY: ksteffe/after-certainty
  SEMANTIC_MANIFEST_OFFLINE: "1"
  SEMANTIC_MANIFEST_USE_LOCAL: "1"

jobs:
  build-and-test:
    name: Lint, test, build, e2e (local manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Generate + install local semantic manifest
        run: |
          set -euo pipefail
          make generate-semantic-manifest
          make install-local-manifest-for-site

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run site:lint

      - name: Test
        run: npm run site:test

      - name: Validate offline/local manifest
        run: npm run site:validate:fallback

      - name: Validate public corpus integrity
        run: npm run site:validate:public-corpus

      - name: Build
        run: npm run site:build

      - name: Install Playwright browsers
        run: npm exec -w after-certainty-site -- playwright install --with-deps chromium

      - name: E2E tests
        run: npm run site:test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

  # Temporary duplicate build (PR 1): build-and-test still runs `site:build`;
  # this job runs a full `vercel build` for the prebuilt artifact. Collapsed in PR 2.
  # Note: job-level `if` cannot reference `secrets` (Actions context rules); credential
  # presence is checked in a step. Fork PRs never enter this job.
  deploy:
    name: Deploy to Vercel (prebuilt)
    needs: build-and-test
    if: >
      needs.build-and-test.result == 'success'
      && (
        github.event_name == 'push'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/site
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      # Used by scripts/ensure_git_lfs_audio.sh during vercel_build.sh
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERCEL_CLI_VERSION: "59.3.0"

    steps:
      - name: Check Vercel credentials
        id: vercel_creds
        working-directory: .
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" || -z "${VERCEL_ORG_ID}" || -z "${VERCEL_PROJECT_ID}" ]]; then
            echo "Skipping deploy: configure secret VERCEL_TOKEN and variables VERCEL_ORG_ID / VERCEL_PROJECT_ID"
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.vercel_creds.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.vercel_creds.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI (pinned)
        if: steps.vercel_creds.outputs.configured == 'true'
        # Install at repo root so working-directory does not matter for global bin.
        working-directory: .
        run: |
          set -euo pipefail
          npm install --global "vercel@${VERCEL_CLI_VERSION}"
          vercel --version

      - name: Pull Vercel environment (preview)
        if: steps.vercel_creds.outputs.configured == 'true' && github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Pull Vercel environment (production)
        if: steps.vercel_creds.outputs.configured == 'true' && github.event_name == 'push'
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build project artifacts (preview)
        if: steps.vercel_creds.outputs.configured == 'true' && github.event_name == 'pull_request'
        run: vercel build --token="${VERCEL_TOKEN}"

      - name: Build project artifacts (production)
        if: steps.vercel_creds.outputs.configured == 'true' && github.event_name == 'push'
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy prebuilt (preview)
        if: steps.vercel_creds.outputs.configured == 'true' && github.event_name == 'pull_request'
        id: deploy_preview
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --token="${VERCEL_TOKEN}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Vercel preview deployment"
            echo ""
            echo "- URL: ${url}"
            echo "- Commit: \`${VERCEL_GIT_COMMIT_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy prebuilt (production)
        if: steps.vercel_creds.outputs.configured == 'true' && github.event_name == 'push'
        id: deploy_production
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Vercel production deployment"
            echo ""
            echo "- URL: ${url}"
            echo "- Commit: \`${VERCEL_GIT_COMMIT_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
