# Issue #116 Phase 3: dispatch semantic enrichment agent runs that open review PRs.
# Does not auto-merge or promote into canonical semantic/.
#
# Prefer: workflow pushes a semantic-agent/* branch and prints a compare URL for a
# human to open the PR. Optional: allow Actions to create PRs (not approve them).
# Do not enable "create and approve pull requests" as a blanket requirement.

name: Semantic enrichment agent

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "book.id from book.yml (e.g. coupling, how-meaning-moves)"
        required: true
        type: string
      agent_type:
        description: "Agent type"
        required: true
        type: choice
        options:
          - recognition-signals
          - trajectories
          - manifestations
          - counterbalances
          - questions
          - ontology-lint
          - discovery
      all_entities:
        description: "Scaffold all book-scoped entities (not only missing fields)"
        required: false
        type: boolean
        default: true
      overwrite:
        description: "Replace existing draft files under enrichment/"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: semantic-enrichment-${{ inputs.book_id }}-${{ inputs.agent_type }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.3"
  UV_VERSION: "0.11.29"
  UV_SHA256: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

jobs:
  open-enrichment-pr:
    name: Open enrichment PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials required for git push of semantic-agent/* branch.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Verify ontology before agent run
        run: |
          set -euo pipefail
          make verify-semantic-ontology

      - name: Scaffold drafts (no publication token)
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          # Ensure write token is not available while running repository Python.
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          # book_id / agent_type are workflow_dispatch inputs (choice enum for agent_type).
          # Validate book_id as a single path segment before use.
          book_id='${{ inputs.book_id }}'
          case "$book_id" in
            '' | *..* | */* | *\\* ) echo "Invalid book_id" >&2; exit 2 ;;
          esac
          args=(
            --repo .
            --book-id "$book_id"
            --agent-type "${{ inputs.agent_type }}"
            --base-branch "${{ github.event.repository.default_branch }}"
            --scaffold-only
          )
          if [ "${{ inputs.all_entities }}" = "true" ]; then
            args+=(--all-entities)
          fi
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            args+=(--overwrite)
          fi
          python3 tools/run_semantic_enrichment_ci.py "${args[@]}"

      - name: Commit, push, and open review PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          book_id='${{ inputs.book_id }}'
          case "$book_id" in
            '' | *..* | */* | *\\* ) echo "Invalid book_id" >&2; exit 2 ;;
          esac
          python3 tools/run_semantic_enrichment_ci.py \
            --repo . \
            --book-id "$book_id" \
            --agent-type "${{ inputs.agent_type }}" \
            --base-branch "${{ github.event.repository.default_branch }}" \
            --publish-only
