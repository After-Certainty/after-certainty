# Temporary one-shot Phase 16 renderer-backed audit and report refresh.
name: Reader passage Phase 16 audit (temporary)

on:
  push:
    branches:
      - feat/reader-passage-phase16-expanded-editorial-coverage
    paths:
      - .github/workflows/reader-passage-phase16-refresh.yml

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'After-Certainty/after-certainty'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: "python uv"

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          uv sync --frozen
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Ruff plus updated Phase 10 through 16 regressions
        run: |
          set -euo pipefail
          uv run ruff format tests/test_reader_passage_phase16.py
          uv run ruff check tests/test_reader_passage_phase16.py
          uv run ruff format --check tests/test_reader_passage_phase16.py
          uv run pytest tests/test_reader_passage_links.py tests/test_reader_passage_phase10.py tests/test_reader_passage_phase11.py tests/test_reader_passage_phase12.py tests/test_reader_passage_phase13.py tests/test_reader_passage_phase14.py tests/test_reader_passage_phase15.py tests/test_reader_passage_phase16.py -q

      - name: Revalidate all rendered citation fragments
        run: |
          set -euo pipefail
          uv run python tools/audit_reader_passage_links.py --repo .

      - name: Verify forty-seven author- and title-specific rendered citations
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("reports/reader-passage-links/audit.summary.json").read_text())
          slugs=[]
          for letter in "abc":
              m=json.loads(Path(f"reports/reader-passage-links/phase16-work-{letter}.json").read_text())
              slugs.extend(row[0] for d in m["docs"] for row in d["sources"])
          assert len(slugs)==len(set(slugs))==47
          tied={x["slug"] for x in j["tiedCitationExamples"]}
          missing=sorted(set(slugs)-tied)
          totals=j["totals"]["sources"]
          print("47-work gaps:",missing)
          print("Source totals:",json.dumps(totals,sort_keys=True))
          assert not missing, "Expected sole-work citations not tied"
          assert totals["invalidPassageLinks"]==0
          assert totals["unverifiedFragmentLinks"]==0
          assert totals["pathNeedsEditorialReview"]==0
          assert totals["withReaderPassagePath"]==496
          assert totals["verifiedLinkTiedCitation"]==496
          PY

      - name: Commit formatted tests and full audit reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- tests/test_reader_passage_phase16.py reports/reader-passage-links/audit.md reports/reader-passage-links/audit.summary.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sources): sync 47-source renderer-backed audit and tests"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/feat/reader-passage-phase16-expanded-editorial-coverage
