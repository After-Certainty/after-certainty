# Ruff (lint + format), pytest, secret scan, dependency audit, and clean-tree check
# for tools/, scripts/, and tests/.
#
# Toolchain: Python + uv come from mise.toml / mise.lock via jdx/mise-action.
# Site CI still uses setup-python + scripts/ci_uv_sync.sh. Task steps stay
# direct (ruff/pytest/make/pip-audit) — not `mise run`.

name: Python lint & tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/site/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/site-ci.yml"
      - ".github/dependabot.yml"
  # Required merge checks must report even for site-only and Dependabot PRs.
  pull_request:
    branches: [main]

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Install only what this workflow needs; mise.lock → action adds --locked.
          install_args: "python uv"

      - name: Sync Python deps (frozen)
        run: |
          set -euo pipefail
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          python --version
          uv --version

      - name: Ruff lint and format check
        run: |
          set -euo pipefail
          ruff check tools scripts tests
          ruff format --check tools scripts tests

  ontology:
    name: Semantic ontology
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "python uv"

      - name: Sync Python deps (frozen)
        run: |
          set -euo pipefail
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify semantic ontology (issue #116 Phase 1)
        run: |
          set -euo pipefail
          # Skip Sharp covers when node_modules are absent (runner Node still OK for npm).
          ALLOW_MISSING_WEB_COVERS=1 make verify-semantic-ontology

  test:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Chapter MP3s under books/*/audio are Git LFS; validate/verify need real objects.
          lfs: true
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "python uv"

      - name: Sync Python deps (frozen)
        run: |
          set -euo pipefail
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run pytest
        run: |
          set -euo pipefail
          # --durations surfaces slow tests for CI speed work (plan MR-1).
          pytest tests/ -q --tb=short --durations=25 --durations-min=2.0

      - name: Validate chapter audio (secret-free)
        run: |
          set -euo pipefail
          make validate-chapter-audio
          make verify-chapter-audio

      - name: Clean-tree check after tests
        run: |
          set -euo pipefail
          bash scripts/check_clean_tree.sh

  secret-scan:
    name: Gitleaks (read-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 4 "$url" -o "/tmp/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan worktree and history
        run: |
          set -euo pipefail
          # Current tree must be clean (catches reintroduction of secrets).
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-git
          # Full history: only the documented prior-leak commits are allowlisted
          # in .gitleaks.toml (portfolio-audit manifests; since removed/gitignored).
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  dependency-audit:
    name: pip-audit (locked)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "python uv"

      - name: Sync Python deps (frozen)
        run: |
          set -euo pipefail
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          pip-audit
