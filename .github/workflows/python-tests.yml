# Ruff (lint + format) and pytest for tools/, scripts/, and tests/ (manifest + pipeline helpers).
# Split into two jobs so PR checks list "lint" and "test" separately.

name: Python lint & tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --user -r requirements.txt

      - name: Ruff lint and format check
        run: |
          set -euo pipefail
          python3 -m ruff check tools scripts tests
          python3 -m ruff format --check tools scripts tests

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --user -r requirements.txt

      - name: Run pytest
        run: |
          set -euo pipefail
          python3 -m pytest tests/ -q --tb=short
