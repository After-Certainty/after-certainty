# Ruff (lint + format), pytest, secret scan, dependency audit, and clean-tree check
# for tools/, scripts/, and tests/.

name: Python lint & tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/site/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/site-ci.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "apps/site/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".npmrc"
      - ".github/workflows/site-ci.yml"
      - ".github/dependabot.yml"

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.3"
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
  UV_VERSION: "0.11.29"
  UV_SHA256: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Ruff lint and format check
        run: |
          set -euo pipefail
          ruff check tools scripts tests
          ruff format --check tools scripts tests

  ontology:
    name: Semantic ontology
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Verify semantic ontology (issue #116 Phase 1)
        run: |
          set -euo pipefail
          # Python-only job: skip Sharp covers when node_modules are absent.
          ALLOW_MISSING_WEB_COVERS=1 make verify-semantic-ontology

  test:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (frozen lock)
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Run pytest
        run: |
          set -euo pipefail
          pytest tests/ -q --tb=short

      - name: Validate chapter audio (secret-free)
        run: |
          set -euo pipefail
          make validate-chapter-audio
          make verify-chapter-audio

      - name: Clean-tree check after tests
        run: |
          set -euo pipefail
          bash scripts/check_clean_tree.sh

  secret-scan:
    name: Gitleaks (read-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 4 "$url" -o "/tmp/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan worktree and history
        run: |
          set -euo pipefail
          # Current tree must be clean (catches reintroduction of secrets).
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-git
          # Full history: only the documented prior-leak commits are allowlisted
          # in .gitleaks.toml (portfolio-audit manifests; since removed/gitignored).
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  dependency-audit:
    name: pip-audit (locked)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv and sync frozen
        run: |
          set -euo pipefail
          bash scripts/ci_uv_sync.sh

      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          pip-audit
