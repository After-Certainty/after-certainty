# Temporary branch-only audit regeneration; removed before merge.
name: Reader passage Phase 11 audit refresh (temporary)

on:
  push:
    branches:
      - feat/reader-passage-phase11-editorial-disambiguation
    paths:
      - .github/workflows/reader-passage-phase11-refresh.yml

permissions:
  contents: read

jobs:
  regenerate:
    if: github.repository == 'After-Certainty/after-certainty'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: "python uv"

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          uv sync --frozen
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Ruff check and Phase 10/11 regression tests
        run: |
          set -euo pipefail
          uv run ruff check tests/test_reader_passage_phase11.py
          uv run ruff format --check tests/test_reader_passage_phase11.py
          uv run pytest tests/test_reader_passage_phase10.py tests/test_reader_passage_phase11.py tests/test_reader_passage_links.py -q

      - name: Run full renderer-backed reader passage audit
        run: |
          set -euo pipefail
          uv run python tools/audit_reader_passage_links.py --repo .

      - name: Check Phase 11 paths and audit integrity
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/reader-passage-links/audit.summary.json').read_text())
          sources = report['totals']['sources']
          required = {
              'nfl-com-nfl-owners-approve-national-anthem-policy-for-2018',
              'nfl-com-nfl-anthem-policy-on-hold-under-standstill-agreement',
              'associated-press-bob-knight-s-chair-college-basketball-s-classic-furniture',
              'los-angeles-times-knight-suspended-for-a-game-by-big-ten-for-throwing-chair',
              'indiana-university-athletics-coach-bob-knight-passes-away-at-83',
          }
          tied = {x['slug'] for x in report['tiedCitationExamples']}
          missing = sorted(required - tied)
          print('Renderer-audited source totals:', json.dumps(sources, sort_keys=True))
          print('New source links not mechanically tied:', missing)
          assert sources['invalidPassageLinks'] == 0, 'Invalid reader paths found'
          assert sources['unverifiedFragmentLinks'] == 0, 'Unverified reader fragments found'
          assert not missing, 'Phase 11 path(s) lack verified footnote ties'
          PY

      - name: Commit regenerated report snapshots (no auto-merge)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- reports/reader-passage-links/audit.md reports/reader-passage-links/audit.summary.json
          if git diff --cached --quiet; then
            echo "Reports already current"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sources): sync Phase 11 renderer-validated audit snapshots"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/feat/reader-passage-phase11-editorial-disambiguation
