# Mechanical checks for How Meaning Moves (styled blocks, Pattern Block fences).
# Same logic as `tools/how_meaning_moves_typography_check.py` / `make typography-check-how-meaning-moves`.

name: How Meaning Moves typography

on:
  pull_request:
    branches: [main]
    paths:
      - "books/how-meaning-moves/**"
      - "tools/how_meaning_moves_typography_check.py"
      - ".github/workflows/how-meaning-moves-typography.yml"
  push:
    branches: [main]
    paths:
      - "books/how-meaning-moves/**"
      - "tools/how_meaning_moves_typography_check.py"
      - ".github/workflows/how-meaning-moves-typography.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typography:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Typography check (styled blocks + Pattern Block fences)
        run: python3 tools/how_meaning_moves_typography_check.py
