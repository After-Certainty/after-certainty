# Agent-side bindings for a Cursor Cloud Agent (or local Consumer).
# Point endpoint + audience at your Cloud Run broker URL.
# The agent VM must NOT hold App keys, service account JSON, Vercel tokens, or
# other durable credentials. Material is injected only for `pade exec` children.
#
# Copy and replace YOUR-BROKER-URL (same value as oidc.audience on the broker),
# or run: make print-agent-bindings
version: "0.1"

capabilities:
  github.repo.read:
    provider: broker
    broker:
      endpoint: "https://pade-broker-754719312452.us-central1.run.app"
      audience: "https://pade-broker-754719312452.us-central1.run.app"

  google-analytics.read:
    provider: broker
    broker:
      endpoint: "https://pade-broker-754719312452.us-central1.run.app"
      audience: "https://pade-broker-754719312452.us-central1.run.app"

  # Milestone L: ordinary Vercel CLI receives VERCEL_TOKEN Material from the broker.
  vercel.diagnostics:
    provider: broker
    broker:
      endpoint: "https://pade-broker-754719312452.us-central1.run.app"
      audience: "https://pade-broker-754719312452.us-central1.run.app"
