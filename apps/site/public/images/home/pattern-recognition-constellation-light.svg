  <circle cx="214" cy="162" r="10" fill="#f0e2b8"/>
  <circle cx="214" cy="162" r="22" fill="url(#nodeGlow)"/>

  <!-- Network edges: warm charcoal -->
  <g stroke="#2c261c" stroke-width="1.15" stroke-linecap="round" opacity="0.88">
    <line x1="96" y1="92" x2="168" y2="128"/>
    <line x1="168" y1="128" x2="214" y2="162"/>
    <line x1="214" y1="162" x2="286" y2="118"/>
    <line x1="286" y1="118" x2="338" y2="86"/>
    <line x1="214" y1="162" x2="268" y2="210"/>
    <line x1="268" y1="210" x2="318" y2="248"/>
    <line x1="214" y1="162" x2="152" y2="220"/>
    <line x1="152" y1="220" x2="108" y2="268"/>
    <line x1="168" y1="128" x2="152" y2="220"/>
    <line x1="286" y1="118" x2="268" y2="210"/>
    <line x1="96" y1="92" x2="152" y2="220"/>
    <line x1="338" y1="86" x2="268" y2="210"/>
    <line x1="72" y1="178" x2="152" y2="220"/>
    <line x1="72" y1="178" x2="168" y2="128"/>
    <line x1="348" y1="188" x2="268" y2="210"/>
    <line x1="348" y1="188" x2="286" y2="118"/>
  </g>

  <!-- Gold nodes -->
  <g>
    <circle cx="96" cy="92" r="7" fill="#8a6f2d"/>
    <circle cx="96" cy="92" r="14" fill="url(#nodeGlow)" opacity="0.7"/>
    <circle cx="168" cy="128" r="5.5" fill="#a3843a"/>
    <circle cx="286" cy="118" r="6" fill="#8a6f2d"/>
    <circle cx="286" cy="118" r="12" fill="url(#nodeGlow)" opacity="0.65"/>
    <circle cx="338" cy="86" r="5" fill="#a3843a"/>
    <circle cx="268" cy="210" r="6.5" fill="#8a6f2d"/>
    <circle cx="268" cy="210" r="13" fill="url(#nodeGlow)" opacity="0.7"/>
    <circle cx="318" cy="248" r="4.5" fill="#a3843a"/>
    <circle cx="152" cy="220" r="6" fill="#8a6f2d"/>
    <circle cx="152" cy="220" r="12" fill="url(#nodeGlow)" opacity="0.65"/>
    <circle cx="108" cy="268" r="4.5" fill="#a3843a"/>
    <circle cx="72" cy="178" r="5" fill="#8a6f2d"/>
    <circle cx="348" cy="188" r="5" fill="#8a6f2d"/>
