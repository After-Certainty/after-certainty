<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 343" fill="none" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#8a6f2d" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#2a2418" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a2418" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a962" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#8a6f2d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a6f2d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- Soft ink core (no rectangular plate) -->
  <ellipse cx="210" cy="168" rx="118" ry="96" fill="url(#coreGlow)"/>
  <path d="M168 150c12-28 38-46 62-44 28 2 48 22 54 48 4 18-2 38-18 52-22 20-54 22-78 8-20-12-30-36-20-64z"
