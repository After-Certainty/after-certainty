apiVersion: pade.local/v1alpha1
kind: DevelopmentSession
metadata:
  name: after-certainty
spec:
  capabilities:
    github.repo.read:
      access: use
    google-analytics.read:
      access: read
    vercel.diagnostics:
      access: read
    # Read-only Vercel Web Analytics query API (same VERCEL_TOKEN Material as diagnostics).
    # Broker policy may lag; reader-analytics-test.sh falls back to vercel.diagnostics.
    vercel.analytics.read:
      access: read
