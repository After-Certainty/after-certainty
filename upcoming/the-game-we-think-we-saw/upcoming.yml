version: 1

upcoming:
  status: in_progress

book:
  id: the-game-we-think-we-saw
  title: "The Game We Think We Saw"
  subtitle: "What Sports Reveals About Winning, Judgment, and the Stories Results Cannot Settle"
  description: "Sports gives us some of the clearest outcomes in public life. A score becomes final, a ruling takes effect, and one side advances. But the result cannot fully explain what produced it, why it should count, what it is allowed to justify, who carried its cost, or what the event will eventually mean. The Game We Think We Saw follows those unsettled questions from the scoreboard into the systems, bodies, judgments, and stories surrounding the game."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md

paths:
  manuscript: "./index.md"
  output: "."

build:
  formats:
    docx:
      enabled: true
      interior_finish: true
    epub:
      enabled: false
    pdf:
      enabled: false
