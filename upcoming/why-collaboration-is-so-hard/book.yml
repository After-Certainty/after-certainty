version: 1

upcoming:
  status: in_progress

book:
  id: why-collaboration-is-so-hard
  title: "Why Collaboration Is So Hard"
  subtitle: "And why the effort still matters"
  description: "An examination of coordination failure, misaligned incentives, and fragile trust."
  author:
    name: "Kevin Steffensen"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: false
    epub:
      enabled: false
    pdf:
      enabled: false
