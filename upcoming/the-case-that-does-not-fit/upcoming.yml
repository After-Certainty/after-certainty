version: 1

upcoming:
  status: in_progress

book:
  id: the-case-that-does-not-fit
  title: "The Case That Does Not Fit"
  subtitle: "Present-Day Cases, Historical Patterns, and Institutions Capable of Reconsideration"
  description: "Rules make shared life possible, but every rule is a compression. The Case That Does Not Fit examines what happens when the ignored detail becomes the morally decisive one—and how institutions can preserve both protection from arbitrary judgment and protection from rules that have mistaken a person for someone else."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png
  open_graph_image: open-graph.png

paths:
  manuscript: "./index.md"
  output: "."

build:
  formats:
    docx:
      enabled: true
      interior_finish: true
    epub:
      enabled: false
    pdf:
      enabled: false

