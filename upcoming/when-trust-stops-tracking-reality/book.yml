version: 1

upcoming:
  status: draft

book:
  id: when-trust-stops-tracking-reality
  title: "When Trust Stops Tracking Reality"
  subtitle: "Why Trust Persists After Its Evidence Disappears"
  description: "Why trust sometimes persists after its original evidence disappears—compression, identity, narrative, and returning trust to reality."
  author:
    name: "Kevin Steffensen"
  language: en
  copyright_year: 2026

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: false
    epub:
      enabled: false
    pdf:
      enabled: false
