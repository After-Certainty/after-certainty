version: 1

upcoming:
  status: in_progress

book:
  id: when-interpretation-no-longer-matters
  title: "When Interpretation No Longer Matters"
  subtitle: "Authority After Understanding Collapses"
  description: "When explanation, evidence, and repair fail—and what kinds of authority remain when public understanding collapses."
  author:
    name: "Kevin Steffensen"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: false
    epub:
      enabled: false
    pdf:
      enabled: false
