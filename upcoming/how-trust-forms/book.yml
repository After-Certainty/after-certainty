version: 1

upcoming:
  status: draft

book:
  id: how-trust-forms
  title: "How Trust Forms"
  subtitle: "Why People Become Willing to Participate"
  description: "How people become willing to participate with one another under uncertainty—beliefs, actions, outcomes, and the trust cycle."
  author:
    name: "Kevin Steffensen"
  language: en
  copyright_year: 2026

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: false
    epub:
      enabled: false
    pdf:
      enabled: false
