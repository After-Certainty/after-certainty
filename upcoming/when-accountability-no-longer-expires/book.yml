version: 1

upcoming:
  status: in_progress

book:
  id: when-accountability-no-longer-expires
  title: "When Accountability No Longer Expires"
  subtitle: "How Legitimate Authority Learns to Survive Harm"
  description: "Why legitimate authority can persist after harm—and how institutions learn to survive scandal without resolving it."
  author:
    name: "Kevin Steffensen"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: false
    epub:
      enabled: false
    pdf:
      enabled: false
