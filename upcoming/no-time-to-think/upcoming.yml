book:
  id: no-time-to-think
  title: "No Time to Think"
  subtitle: "Present-Day Acceleration, Historical Precedents, and the Design of Responsible Speed"
  description: "Speed is not inherently careless, but judgment depends on conditions: time, attention, consequence contact, and stop authority. No Time to Think examines what happens when production accelerates faster than a system's capacity to understand, verify, integrate, maintain, and care for what it produces—and how institutions can design responsible speed."
  author:
    name: "Kevin Steffensen"
    website: "https://after-certainty.com"
  language: en
  copyright_year: 2026

