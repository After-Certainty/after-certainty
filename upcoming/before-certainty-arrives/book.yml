version: 1

upcoming:
  status: in_progress

book:
  id: before-certainty-arrives
  title: "Before Certainty Arrives"
  subtitle: "How Moral Order Forms, Hardens, and Outlives Its Reasons"
  description: "Essays on the cultural preconditions that made brittle certainty feel normal and what it costs when it breaks."
  author:
    name: "Kevin Steffensen"
  language: en
  copyright_year: 2026
  title_page_cover: book-cover.png

paths:
  manuscript: "./index.md"
  output: "."

frontmatter:
  generate:
    enabled: true
    title_page:
      repo_template: templates/title_page.md.j2
      output: front-matter/title-page.md
    copyright:
      repo_template: templates/copyright.md.j2
      output: front-matter/copyright.md

build:
  formats:
    docx:
      enabled: false
    epub:
      enabled: false
    pdf:
      enabled: false
